<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учебник ЕГЭ-100</title>
<style>
:root{
  --bg:#f6f7f9;--sidebar:#ffffff;--paper:#ffffff;--paper2:#f1f4f8;--line:#dde3ec;--text:#18202c;--dim:#546274;
  --a:#0f766e;--a-soft:#e6f4f1;--a-bd:#99d6cd;
  --b:#2563eb;--b-soft:#eff6ff;--gold:#b45309;--gold-soft:#fef7e6;--bad:#be123c;--bad-soft:#fff1f2;--good:#15803d;--good-soft:#eefbf3;
  --radius:16px;--shadow:0 4px 20px rgba(15,23,42,.06);
  --svg-bg:#f8fafc;--svg-surface:#ffffff;--svg-surface2:#eef3f9;--svg-ink:#18202c;--svg-dim:#546274;--svg-line:#cbd5e1;
  --svg-acc:#0f766e;--svg-gold:#b45309;--svg-bad:#dc2626;--svg-good:#15803d;--svg-blue:#2563eb;
}
:root[data-subject="biology"]{--a:#15803d;--a-soft:#ecfdf3;--a-bd:#9ce2b8;--svg-acc:#15803d}
:root[data-subject="russian"]{--a:#7c3aed;--a-soft:#f5f3ff;--a-bd:#c4b5fd;--svg-acc:#7c3aed}

@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0b121c;--sidebar:#0f1824;--paper:#131f2e;--paper2:#182739;--line:#263950;--text:#e6eef7;--dim:#96abc2;
    --a:#2dd4bf;--a-soft:#102f33;--a-bd:#1e5d61;
    --b:#60a5fa;--b-soft:#15253f;--gold:#f5c469;--gold-soft:#2b2316;--bad:#fb7185;--bad-soft:#2e181f;--good:#4ade80;--good-soft:#132b1e;
    --shadow:0 12px 36px rgba(2,6,16,.45);
    --svg-bg:#0d1723;--svg-surface:#162436;--svg-surface2:#1e3047;--svg-ink:#e6eef7;--svg-dim:#96abc2;--svg-line:#2c425c;
    --svg-acc:#2dd4bf;--svg-gold:#f5c469;--svg-bad:#fb7185;--svg-good:#4ade80;--svg-blue:#60a5fa;
  }
  :root[data-subject="biology"]:not([data-theme]){--a:#4ade80;--a-soft:#132d1f;--a-bd:#225c3c;--svg-acc:#4ade80}
  :root[data-subject="russian"]:not([data-theme]){--a:#a78bfa;--a-soft:#21193b;--a-bd:#4a3880;--svg-acc:#a78bfa}
}
:root[data-theme="dark"]{
  --bg:#0b121c;--sidebar:#0f1824;--paper:#131f2e;--paper2:#182739;--line:#263950;--text:#e6eef7;--dim:#96abc2;
  --a:#2dd4bf;--a-soft:#102f33;--a-bd:#1e5d61;
  --b:#60a5fa;--b-soft:#15253f;--gold:#f5c469;--gold-soft:#2b2316;--bad:#fb7185;--bad-soft:#2e181f;--good:#4ade80;--good-soft:#132b1e;
  --shadow:0 12px 36px rgba(2,6,16,.45);
  --svg-bg:#0d1723;--svg-surface:#162436;--svg-surface2:#1e3047;--svg-ink:#e6eef7;--svg-dim:#96abc2;--svg-line:#2c425c;
  --svg-acc:#2dd4bf;--svg-gold:#f5c469;--svg-bad:#fb7185;--svg-good:#4ade80;--svg-blue:#60a5fa;
}
:root[data-theme="dark"][data-subject="biology"]{--a:#4ade80;--a-soft:#132d1f;--a-bd:#225c3c;--svg-acc:#4ade80}
:root[data-theme="dark"][data-subject="russian"]{--a:#a78bfa;--a-soft:#21193b;--a-bd:#4a3880;--svg-acc:#a78bfa}
:root[data-theme="paper"]{
  --bg:#eae1cf;--sidebar:#f1e8d6;--paper:#f6efe1;--paper2:#ece2ce;--line:#d6c8b0;--text:#2a231b;--dim:#625648;
  --a:#0f6b63;--a-soft:#e0ebe4;--a-bd:#9cc2b7;
  --b:#24529a;--b-soft:#e3e9f0;--gold:#9c4a08;--gold-soft:#f3e5cb;--bad:#a82039;--bad-soft:#f3dfdf;--good:#1f6d3d;--good-soft:#e1ece2;
  --shadow:0 4px 18px rgba(58,42,22,.07);
  --svg-bg:#f1e8d7;--svg-surface:#f8f2e6;--svg-surface2:#e9dfc9;--svg-ink:#2a231b;--svg-dim:#625648;--svg-line:#cabaa0;
  --svg-acc:#0f6b63;--svg-gold:#9c4a08;--svg-bad:#a82039;--svg-good:#1f6d3d;--svg-blue:#24529a;
}
:root[data-theme="paper"][data-subject="biology"]{--a:#1f6d3d;--a-soft:#e1ece2;--a-bd:#9ec3a6;--svg-acc:#1f6d3d}
:root[data-theme="paper"][data-subject="russian"]{--a:#6b3fa0;--a-soft:#e9e1ee;--a-bd:#bda6d6;--svg-acc:#6b3fa0}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:32px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
a{color:var(--a)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.layout{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--sidebar);border-right:1px solid var(--line);padding:18px 14px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--line);font-weight:800}
.atom{display:grid;place-items:center;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);width:40px;height:40px;border-radius:12px;font-size:22px;flex:none}
.brand-meta{min-width:0;line-height:1.25}
.brand-meta small{display:block;font-weight:500;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-tools{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);color:var(--text);text-decoration:none;font-size:12.5px;font-weight:600;flex:1 1 auto}
.sbtn:hover{border-color:var(--a);color:var(--a)}
.sbtn.pri{background:var(--a-soft);border-color:var(--a-bd);color:var(--a)}
.navtag{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin:16px 10px 4px;font-weight:700}
.nav{display:block;padding:7px 10px;border-radius:9px;color:var(--dim);text-decoration:none;font-size:13.5px;line-height:1.38}
.nav:hover,.nav.active{color:var(--text);background:var(--a-soft)}
.nav.active{font-weight:700;color:var(--a)}

main{min-width:0;max-width:1060px;width:100%;margin:0 auto;padding:24px clamp(16px,3.6vw,52px) 110px}
.mobileNav{display:none}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,46px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-wm{position:absolute;right:18px;bottom:-22px;font-size:160px;line-height:1;opacity:.05;pointer-events:none;user-select:none}
h1{font-size:clamp(28px,4.2vw,46px);line-height:1.15;letter-spacing:-.03em;margin:.2em 0 .35em;max-width:860px}
h2{font-size:clamp(22px,2.8vw,31px);line-height:1.25;letter-spacing:-.02em;margin:0 0 12px}
h3{font-size:19.5px;line-height:1.32;margin:26px 0 10px}
h4{font-size:16px;margin:18px 0 8px}
p{margin:10px 0 14px}
.sub{color:var(--dim);font-size:clamp(15.5px,1.55vw,18px);max-width:780px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--a)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-block;background:var(--a-soft);color:var(--a);border:1px solid var(--a-bd);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.btn,.ghost{border:1px solid var(--a);border-radius:11px;padding:9px 15px;background:var(--a);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.06)}
.ghost{background:var(--paper2);color:var(--text);border-color:var(--line)}
.ghost:hover{border-color:var(--a);color:var(--a)}

.lesson{margin-top:44px;border-top:1px solid var(--line);padding-top:34px}
.sectionlead{font-size:17px;color:var(--dim);max-width:850px}
.small{font-size:13.5px;color:var(--dim)}
.muted{color:var(--dim)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px 20px;margin:16px 0;min-width:0;box-shadow:var(--shadow)}
.two>.panel,.three>.panel{margin:0}
.panel h3:first-child,.panel h4:first-child{margin-top:0}
.hint{background:var(--a-soft);border-left:4px solid var(--a)}
.warn{background:var(--bad-soft);border-left:4px solid var(--bad)}
.note{background:var(--b-soft);border-left:4px solid var(--b)}
.key{background:var(--gold-soft);border-left:4px solid var(--gold)}
.eq{font-family:Cambria,"Times New Roman",serif;font-size:clamp(18px,2vw,23px);line-height:1.6;background:var(--paper2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 16px;overflow-x:auto;white-space:nowrap;margin:13px 0}
.eq.sm{font-size:18px}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

.step{display:grid;grid-template-columns:34px 1fr;gap:12px;margin:14px 0}
.stepnum{display:grid;place-items:center;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);font-size:13.5px;font-weight:800;border-radius:10px;width:34px;height:34px;align-self:start}
.step p{margin:0 0 6px}
.list{padding-left:22px}.list li{margin:7px 0}

details{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:11px 0}
summary{padding:12px 16px;cursor:pointer;color:var(--a);font-weight:700}
details>div{padding:0 18px 15px}

.mapflow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:16px 0}
.flowbox{flex:1 1 150px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.flowbox strong{display:block;line-height:1.3}
.flowbox small{display:block;color:var(--dim);margin-top:3px}
.arrow{align-self:center;color:var(--a);font-size:18px;font-weight:700}

.tablewrap{width:100%;overflow:auto;border-radius:12px;border:1px solid var(--line);margin:14px 0;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:500px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--paper2);color:var(--text);font-weight:750}
tr:last-child td{border-bottom:0}

.svgwrap{padding:14px;border-radius:16px;background:var(--svg-bg);border:1px solid var(--line);margin:16px 0}
.svgwrap svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}

/* Новые блоки: bridge, compare, tree, essay */
.bridge{background:var(--paper);border:1px solid var(--a-bd);border-radius:var(--radius);padding:16px 20px;margin:18px 0;box-shadow:var(--shadow)}
.bridge-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bridge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.bridge-cell{background:var(--paper2);border-radius:11px;padding:11px 13px;font-size:14.5px}
.bridge-cell b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px}

.cmp-wrap{margin:16px 0}
.cmp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cmp-card h4{margin:0 0 8px;color:var(--a)}

.treebox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow)}
.tree-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tree-step{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.tree-q{font-weight:700;margin-bottom:8px}
.tree-ans{border-left:4px solid var(--good);background:var(--good-soft);border-radius:10px;padding:11px 14px;margin-top:8px}
.tree-static ul{margin:6px 0 6px 18px;padding:0}
.tree-static li{margin:4px 0}

.essaybox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.essay-text{background:var(--paper2);border-left:3px solid var(--a);padding:12px 15px;border-radius:10px;margin:10px 0;font-size:15px}

/* Русская разметка */
.ru-stress{color:var(--bad);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ru-ortho{background:var(--gold-soft);border:1px solid var(--gold);border-radius:5px;padding:0 3px;font-weight:700}
.ru-pos{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);font-size:12px;font-weight:800;vertical-align:baseline;margin:0 2px}
.ru-m{padding:0 2px;border-radius:3px}
.ru-p{border-top:2px solid var(--b);border-right:2px solid var(--b);padding-right:3px}
.ru-k{border-top:2px solid var(--a);border-radius:6px 6px 0 0;padding-top:1px}
.ru-s{background:linear-gradient(135deg,transparent 48%,var(--gold) 49%,var(--gold) 51%,transparent 52%) top/100% 6px no-repeat;padding-top:5px}
.ru-o{border:1.5px solid var(--dim);border-radius:4px;padding:0 3px}
.ru-syn{text-decoration:underline;text-underline-offset:4px}
.ru-podl{text-decoration-color:var(--b)}
.ru-skaz{text-decoration-style:double;text-decoration-color:var(--bad)}
.ru-opr{text-decoration-style:wavy;text-decoration-color:var(--a)}
.ru-obst{text-decoration-style:dotted;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.ru-vvod{background:var(--b-soft);border-radius:5px;padding:0 4px}

/* Рисунки и метки */
.figbox{margin:16px 0;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.figbox figcaption{margin-bottom:10px}
.figimg{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.figimg img{max-width:100%;max-height:70vh;width:auto;height:auto;display:block}
.pinwrap{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:25px;height:25px;padding:0 6px;border-radius:13px;background:#0f766e;color:#fff;border:2px solid #fff;font:700 12.5px/21px system-ui,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.figlegend{margin:10px 0 0;padding:0;list-style:none;columns:2 260px;font-size:14px}
.figlegend li{break-inside:avoid;margin:4px 0}
.figlegend b{display:inline-block;min-width:22px;color:var(--a)}
.figempty{padding:18px;border:2px dashed var(--line);border-radius:12px;color:var(--dim);text-align:center}

/* Словарь и поповер */
.glink{background:none;border:0;border-bottom:1.5px dashed var(--a);color:inherit;padding:0;font:inherit;cursor:pointer}
.glink:hover{color:var(--a)}
#gPopover{position:fixed;z-index:80;max-width:min(360px,92vw);background:var(--paper);border:1px solid var(--a-bd);border-radius:14px;padding:13px 15px;box-shadow:0 16px 40px rgba(0,0,0,.22);display:none}
#gPopover h4{margin:0 0 6px;color:var(--a);font-size:16px}
#gPopover p{margin:0 0 6px;font-size:14px}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.term{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.term strong{display:block;color:var(--a);font-size:16.5px}
.term p{margin:4px 0;font-size:14.5px}
.term small{color:var(--dim)}

.statbar{height:8px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.statbar span{height:100%;background:var(--a);display:block;width:0}
.banchor{display:block;height:0;scroll-margin-top:80px}
.bflash{outline:3px solid var(--gold);outline-offset:5px;border-radius:8px;transition:outline-color 1.4s}
.bflash.fade{outline-color:transparent}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.timeline .panel{margin:0;text-align:center}
.timeline strong{font-size:21px;color:var(--gold)}
footer{color:var(--dim);text-align:center;margin:56px 0 0;font-size:13px}

dialog#imgZoom{max-width:95vw;max-height:94vh;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--paper);color:var(--text)}
dialog#imgZoom::backdrop{background:rgba(0,0,0,.68)}
dialog#imgZoom img{max-width:90vw;max-height:82vh;display:block;background:#fff;border-radius:8px}

@media(max-width:1000px){
  .layout{display:block}
  .side{display:none}
  .mobileNav{display:flex;position:sticky;top:0;z-index:30;background:var(--sidebar);border-bottom:1px solid var(--line);padding:8px 12px;align-items:center;gap:8px}
  .mobileNav select{flex:1;min-width:0;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--paper2)}
  .mbtn{border:1px solid var(--line);background:var(--paper2);border-radius:9px;padding:6px 10px;text-decoration:none;font-size:13px;font-weight:700}
  main{padding-top:18px}
}
@media(max-width:670px){
  .two,.three,.gloss,.cmp-cards{grid-template-columns:1fr}
  .timeline{grid-template-columns:repeat(2,1fr)}
  .arrow{display:none}
  .flowbox{flex-basis:100%}
  .figlegend{columns:1}
  table{font-size:13px}
}
@media print{
  body{background:#fff;color:#111}
  .side,.mobileNav,.actions,#gPopover,.tree-interactive{display:none!important}
  .tree-static{display:block!important}
  main{max-width:none;padding:0}
  .panel,.bridge,.figbox,.essaybox,details,.eq{box-shadow:none;background:#fff;border-color:#999}
  details>div{display:block!important}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="application/json" id="topic-data">{"id": "skorost-ravnovesie", "subject": "Химия", "subjectSlug": "chemistry", "short": "№ 17–18, 22–23 · Скорость и равновесие", "version": "26.11.2026", "icon": "⚖", "title": "Классификация реакций, скорость и равновесие (№17, 18, 22, 23)", "sub": "Полный разбор общей кинетики и термодинамики ЕГЭ по химии: от 6 признаков реакций до принципа Ле Шателье в ионных растворах и безошибочной таблицы расчётов №23.", "chips": ["ЕГЭ-2027", "Коды 1.5, 1.6, 1.8", "№ 17, 18, 22, 23", "С нуля до 100"], "scope": ["1.5", "1.6", "1.8"], "status": "Сверено с утверждённым комплектом ФИПИ ЕГЭ-2027 (коды 1.5, 1.6, 1.8; задания № 17, 18, 22, 23 КИМ).", "mode": "from_scratch", "goals": [["01–03 · Классификация (№ 17)", "Безошибочно определять тип любой неорганической и органической реакции сразу по двум и более признакам, не попадаясь на исключения по тепловому эффекту, фазам и обратимости."], ["04–05 · Скорость реакции (№ 18)", "Понимать механизм активных столкновений, сравнивать скорость разных реакций по природе веществ и точно отличать рабочие факторы скорости от «пустых» воздействий."], ["06–07 · Химическое равновесие (№ 22)", "Применять принцип Ле Шателье для газовых, гетерогенных и ионных равновесий, распознавать скрытое связывание ионов и отличать твёрдую растворимую соль от твёрдого участника равновесия."], ["08 · Расчёты равновесия (№ 23)", "За 2 минуты решать любой тип задачи №23 через таблицу «Исходно – Изменение – Равновесно», включая объём реактора V ≠ 1 л и ненулевую исходную концентрацию продуктов."]], "audit": {"title": "Исходные материалы и границы охвата", "intro": "Учебник создан с нуля по утверждённому комплекту ФИПИ ЕГЭ-2027 (кодификатор, спецификация, демоверсия 2027 и методические рекомендации ФИПИ 2026) с опорой на углублённые учебники ФПУ (В. В. Ерёмин и др., И. И. Новошинский).", "b": [{"more": "Опора и экзаменационные акценты ЕГЭ-2027", "open": true, "b": ["Охвачены все четыре линии КИМ блока (суммарно 6 первичных баллов): № 17 (1 балл, соответствие с двойным фильтром признаков), № 18 (1 балл, выбор всех ускоряющих/замедляющих факторов или более быстрых реакций), № 22 (2 балла, смещение равновесия, включая ионные системы в растворе) и № 23 (2 балла, расчёт равновесных и исходных концентраций).", "Отдельный акцент сделан на задании № 17, где по отчёту ФИПИ средний процент выполнения упал до 38,2 % из-за необходимости проверять два критерия одновременно и знания органических и неорганических исключений."]}]}, "summary": [{"p": "Вся тема держится на трёх простых вопросах о любой химической реакции: **что с ней происходит** (классификация, №17), **как быстро она идёт** (кинетика, №18) и **куда сдвигается, если ей помешать** (равновесие и расчёт, №22–23). Как только ты перестаёшь смешивать скорость с равновесием и всегда проверяешь агрегатные состояния веществ, все 6 первичных баллов этого блока становятся гарантированными."}], "limits": "Количественные расчёты теплового эффекта по термохимическим уравнениям (код 1.7, № 27 КИМ), электролиз (№ 20), гидролиз и pH растворов как отдельная линия (№ 21), а также расчёты массовой доли, примесей и выхода (№ 26, 28) подробно разбираются в соседних темах маршрута.", "modules": [{"id": "01", "group": "Классификация реакций (№17)", "nav": "Реакция и 6 осей классификации", "codes": ["1.5"], "eyebrow": "01 · Код 1.5 · Задание 17", "title": "Химическая реакция и базовые типы по составу и степеням окисления", "lead": "Почему реакция меди с разбавленной азотной кислотой — это не «замещение», хотя простое вещество реагирует со сложным? И почему одну и ту же реакцию на ЕГЭ называют сразу тремя разными словами?", "b": [{"key": "Любая химическая реакция — это перестройка химических связей с сохранением каждого атома и его массы. Описывать реакцию можно по шести независимым осям (состав, степени окисления, теплота, фазы, катализатор, обратимость), поэтому одно уравнение всегда носит сразу несколько ярлыков.", "t": "Главная мысль."}, {"more": "Что нужно знать заранее", "open": true, "b": ["**Простое вещество** состоит из атомов одного химического элемента (`Fe`, `Cl2`, `O2`), **сложное вещество** — из атомов двух и более элементов (`H2O`, `Na2O`, `CuSO4`).", "**Степень окисления** — условный заряд атома в соединении (знак пишем перед цифрой: `Fe^{+3}`, `O^{−2}`, `N^{+5}`). У любого простого вещества степень окисления равна `0`.", "**Электролит** — вещество, которое в водном растворе или расплаве распадается на ионы (заряд иона пишем цифрой перед знаком: `Cu^{2+}`, `SO4^{2−}`, `OH^{−}`)."]}, {"h": "1. Что происходит в реакции и закон сохранения массы"}, {"p": "Когда ты поджигаешь железную стружку в колбе с хлором, твёрдый металл и жёлто-зелёный газ исчезают, а на стенках оседает бурый порошок хлорида железа(III). Новые атомы не возникли из пустоты и старые не пропали — разорвались прежние связи (`Fe–Fe` и `Cl–Cl`) и образовались новые (`Fe–Cl`)."}, {"eq": "2Fe + 3Cl2 —t°→ 2FeCl3"}, {"p": "В этом и состоит **[[закон сохранения массы веществ]]** (М. В. Ломоносов, А. Лавуазье): общая масса всех веществ, вступивших в реакцию, строго равна общей массе всех образовавшихся продуктов. Именно поэтому в каждом уравнении число атомов каждого элемента слева и справа обязано совпадать — коэффициенты мы ставим не «для красоты», а чтобы соблюсти баланс атомов."}, {"p": "Как отличить химическую реакцию от физического явления (таяния льда, растворения сахара, кипения воды)? При физическом явлении состав молекул остаётся прежним. При химической реакции появляются новые вещества, и часто это видно по **признакам реакции**: изменению цвета, выпадению или растворению осадка, выделению газа, появлению запаха, выделению или поглощению теплоты и света."}, {"h": "2. Шесть независимых осей классификации"}, {"p": "В задании № 17 ЕГЭ по химии ошибка чаще всего возникает не из-за незнания формул, а из-за путаницы между разными признаками. Представь, что ты описываешь автомобиль: он одновременно «красный» (цвет), «седан» (кузов) и «бензиновый» (двигатель). Эти признаки не спорят друг с другом. Точно так же у каждой химической реакции есть шесть независимых осей."}, {"svg": "<svg viewBox='0 0 460 225' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='225' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-ink,#e6eef7)'>6 независимых осей одной реакции<\/text><rect x='184' y='90' width='92' height='44' rx='10' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)' stroke-width='2'/><text x='230' y='109' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-acc,#14b8a6)'>Реакция<\/text><text x='230' y='125' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>1 ур-е<\/text><line x1='184' y1='98' x2='164' y2='62' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><rect x='12' y='40' width='152' height='38' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='88' y='56' text-anchor='middle' font-size='12' font-weight='600' fill='var(--svg-ink,#e6eef7)'>1. Состав<\/text><text x='88' y='71' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>соед/разл/зам/обм<\/text><line x1='184' y1='112' x2='164' y2='112' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><rect x='12' y='93' width='152' height='38' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.5'/><text x='88' y='109' text-anchor='middle' font-size='12' font-weight='600' fill='var(--svg-ink,#e6eef7)'>2. Степени окисл.<\/text><text x='88' y='124' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>ОВР / не-ОВР<\/text><line x1='184' y1='126' x2='164' y2='162' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><rect x='12' y='146' width='152' height='38' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='1.5'/><text x='88' y='162' text-anchor='middle' font-size='12' font-weight='600' fill='var(--svg-ink,#e6eef7)'>3. Теплота<\/text><text x='88' y='177' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>экзо / эндо<\/text><line x1='276' y1='98' x2='296' y2='62' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><rect x='296' y='40' width='152' height='38' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><text x='372' y='56' text-anchor='middle' font-size='12' font-weight='600' fill='var(--svg-ink,#e6eef7)'>4. Фазы реагентов<\/text><text x='372' y='71' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>гомо / гетеро<\/text><line x1='276' y1='112' x2='296' y2='112' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><rect x='296' y='93' width='152' height='38' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-acc,#14b8a6)' stroke-width='1.5'/><text x='372' y='109' text-anchor='middle' font-size='12' font-weight='600' fill='var(--svg-ink,#e6eef7)'>5. Катализатор<\/text><text x='372' y='124' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>кат. / некат.<\/text><line x1='276' y1='126' x2='296' y2='162' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><rect x='296' y='146' width='152' height='38' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='372' y='162' text-anchor='middle' font-size='12' font-weight='600' fill='var(--svg-ink,#e6eef7)'>6. Направление<\/text><text x='372' y='177' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>обрат. / необрат.<\/text><text x='230' y='208' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Признаки проверяются раздельно и не спорят<\/text><\/svg>"}, {"h": "3. Ось 1: число и состав реагентов и продуктов (неорганика)"}, {"p": "В школьной неорганике выделяют четыре классических типа по числу и составу веществ. Смотри не только на количество формул слева и справа, но и на то, **простые** они или **сложные**."}, {"table": [["Тип реакции", "Схема", "Пример", "Почему относится именно сюда"], ["**Соединение**", "`A + B → AB` (из двух или более — одно)", "`Na2O + H2O → 2NaOH`", "Реагентов два, продукт строго один. В реагентах могут быть и простые, и сложные вещества (включая `2FeCl2 + Cl2 → 2FeCl3`)."], ["**Разложение**", "`AB → A + B` (из одного — два или более)", "`CaCO3 —t°→ CaO + CO2↑`", "Реагент строго один, продуктов два или больше."], ["**Замещение**", "`простое + сложное → новое простое + новое сложное`", "`Fe + CuSO4 → FeSO4 + Cu↓`", "Атомы простого вещества замещают атомы одного из элементов в сложном веществе, вытесняя другое простое вещество."], ["**Обмен**", "`AB + CD → AD + CB` (два сложных → два новых сложных)", "`CuO + H2SO4(разб.) → CuSO4 + H2O`", "Два сложных вещества обмениваются составными частями без изменения степеней окисления."]]}, {"warn": "Не каждая неорганическая реакция укладывается в четвёрку «соединение / разложение / замещение / обмен»! Посмотри на реакцию меди с разбавленной азотной кислотой: `3Cu + 8HNO3(разб.) → 3Cu(NO3)2 + 2NO↑ + 4H2O`. Слева простое + сложное, но справа **три сложных вещества** и ни одного простого! Это **не замещение**. Точно так же реакции горения сложных веществ (`2H2S + 3O2 → 2SO2 + 2H2O`) или сложные ОВР с перманганатом калия **не относятся ни к одному из четырёх типов по составу**.", "t": "Ловушка №17: «ни к одному из 4 типов»"}, {"p": "Ещё одна частая ловушка — **полный необратимый гидролиз бинарных соединений** (сульфидов, карбидов, нитридов, фосфидов, галогенидов неметаллов). Например, в ДЕМО-2027 встречается гидролиз сульфида алюминия:"}, {"eq": "Al2S3 + 6H2O → 2Al(OH)3↓ + 3H2S↑"}, {"p": "Здесь два сложных вещества (`Al2S3` и `H2O`) обменялись частями (`Al^{3+}` соединился с `OH^{−}`, а `S^{2−}` — с `H^{+}`) без изменения степеней окисления. Поэтому гидролиз бинарных соединений — это **реакция обмена**, а из-за одновременного выпадения осадка и выделения газа — **необратимая**."}, {"h": "4. Ось 2: изменение степеней окисления (ОВР и не-ОВР)"}, {"p": "В **[[окислительно-восстановительная реакция|окислительно-восстановительной реакции (ОВР)]]** хотя бы один элемент меняет степень окисления — значит, происходит перенос электронов (`e^{−}`). В **не-ОВР** степени окисления всех элементов слева и справа одинаковы."}, {"hint": "Если в реакции участвует (или образуется) хотя бы одно **простое вещество** (`O2`, `Cl2`, `H2`, `Fe`, `Cu`, `C`), эта реакция в школьном курсе **всегда ОВР** (кроме аллотропных переходов вроде `3O2 ⇄ 2O3`, где степень окисления остаётся `0`). Почему? У простого вещества степень окисления `0`, а в составе сложного соединения она неизбежно отлична от нуля.", "t": "Быстрый маркер ОВР"}, {"p": "А как связаны ось «состав» и ось «ОВР»? Проверь все четыре типа — эта связь экономит секунды на экзамене:"}, {"list": ["**Замещение** — **всегда ОВР** (есть и исходное, и новое простое вещество).", "**Обмен** — **всегда не-ОВР** (составные части просто меняются партнёрами, электроны между атомами не переходят).", "**Соединение** — **может быть ОВР** (`2Fe + 3Cl2 → 2FeCl3`) и **может быть не-ОВР** (`Na2O + H2O → 2NaOH`, `NH3 + HCl → NH4Cl`).", "**Разложение** — **может быть ОВР** (`2KMnO4 —t°→ K2MnO4 + MnO2 + O2↑`, `NH4NO3 —t°→ N2O↑ + 2H2O`) и **может быть не-ОВР** (`CaCO3 —t°→ CaO + CO2↑`, `NH4Cl —t°→ NH3↑ + HCl↑`)."]}, {"h": "5. Разбор вслух: проверяем три реакции по двум осям"}, {"steps": ["**Реакция 1: `Na2O + H2O → 2NaOH`.** Два вещества дают одно — это **соединение**. Проверяем степени окисления: `Na^{+1}`, `O^{−2}`, `H^{+1}` одинаковы слева и справа — значит, **не-ОВР**.", "**Реакция 2: `Al2S3 + 6H2O → 2Al(OH)3↓ + 3H2S↑`.** Два сложных вещества дают два новых сложных — это **обмен**. Проверяем степени окисления: `Al^{+3}`, `S^{−2}`, `H^{+1}`, `O^{−2}` не изменились — **не-ОВР**.", "**Реакция 3: `NH4NO3 —t°→ N2O↑ + 2H2O`.** Одно вещество распадается на два — это **разложение**. Проверяем степени окисления азота: в катионе `NH4^{+}` азот `N^{−3}`, в анионе `NO3^{−}` азот `N^{+5}`, а в продукте `N2O` оба атома имеют `N^{+1}`. Степени окисления изменились — это **ОВР** (внутримолекулярное сопропорционирование)."]}, {"bridge": {"kim": "№ 17 КИМ (1 балл)", "ask": "Определить тип реакции по составу и/или по изменению степеней окисления (часто в паре со вторым признаком из модуля 02).", "watch": "Реакции `простое + сложное → 3 сложных` (например, `Cu + HNO3(разб.)`) НЕ являются замещением; реакции `NH3 + HCl` и `Na2O + H2O` — соединения, но НЕ ОВР; разложение нитрата аммония — ОВР, хотя простых веществ нет.", "tip": "Сначала запиши уравнение с формулами, проверь наличие простых веществ (мгновенный сигнал ОВР) и только затем считай число и тип (простое/сложное) веществ слева и справа."}}], "short": [{"list": ["Закон сохранения массы: число атомов каждого элемента и суммарная масса до и после реакции всегда равны.", "Каждую реакцию классифицируют по 6 независимым осям: состав, ОВР, тепловой эффект, фазы реагентов, катализатор и обратимость.", "Реакция замещения всегда имеет вид «простое + сложное → новое простое + новое сложное» и всегда является ОВР.", "Реакция обмена (включая гидролиз солей и бинарных соединений вроде `Al2S3`) всегда не-ОВР.", "Сложные ОВР и горение сложных веществ не попадают ни в один из четырёх школьных типов по составу.", "Реакции соединения и разложения бывают как ОВР, так и не-ОВР — проверяй степени окисления каждого элемента."]}]}, {"id": "02", "group": "Классификация реакций (№17)", "nav": "Теплота, фазы, катализ и обратимость", "codes": ["1.5"], "eyebrow": "02 · Код 1.5 · Задание 17", "title": "Тепловой эффект, гомогенность, катализ и обратимость", "lead": "Почему реакция азота с кислородом — редкое исключение среди реакций соединения, а разложение пероксида водорода с пузырьками кислорода считается гомогенным процессом?", "b": [{"key": "Четыре «физико-химические» оси классификации — тепловой эффект, фазы, катализатор и обратимость — дают большинство ловушек в КИМ № 17. Запомни главное: фазы оценивают строго по реагентам, а правила для экзо/эндо имеют короткий и чёткий список исключений.", "t": "Главная мысль."}, {"h": "1. Ось 3: тепловой эффект (экзо- и эндотермические реакции)"}, {"p": "Чтобы началась реакция, старые химические связи нужно разорвать (на это **тратится** энергия), а при образовании новых связей энергия **выделяется**. Разница между этими величинами и даёт **[[тепловой эффект реакции]]** `Q`."}, {"list": ["**Экзотермическая реакция (`+Q`, или `ΔH < 0`):** при образовании новых связей выделилось *больше* энергии, чем пошло на разрыв старых. Излишек выходит наружу в виде тепла (реакционная смесь нагревается).", "**Эндотермическая реакция (`−Q`, или `ΔH > 0`):** на разрыв старых связей потребовалось *больше* энергии, чем вернулось при создании новых. Реакция забирает тепло извне (смесь охлаждается или требует постоянного подвода тепла)."]}, {"svg": "<svg viewBox='0 0 460 205' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='205' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='115' y='24' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-good,#34c77b)'>Экзотермическая (+Q)<\/text><text x='345' y='24' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-bad,#ef6b6b)'>Эндотермическая (−Q)<\/text><line x1='30' y1='172' x2='205' y2='172' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><line x1='30' y1='172' x2='30' y2='42' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><text x='20' y='52' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>E<\/text><path d='M 40 95 L 72 95 Q 108 32 142 142 L 195 142' fill='none' stroke='var(--svg-good,#34c77b)' stroke-width='2.5'/><line x1='72' y1='95' x2='170' y2='95' stroke='var(--svg-dim,#94a8c0)' stroke-dasharray='4 3' stroke-width='1'/><line x1='158' y1='97' x2='158' y2='140' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='176' y='123' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-gold,#e5a93c)'>+Q<\/text><text x='56' y='88' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>Реаг.<\/text><text x='174' y='160' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>Прод.<\/text><line x1='255' y1='172' x2='435' y2='172' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><line x1='255' y1='172' x2='255' y2='42' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><text x='245' y='52' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>E<\/text><path d='M 265 142 L 298 142 Q 338 35 372 95 L 425 95' fill='none' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2.5'/><line x1='298' y1='142' x2='405' y2='142' stroke='var(--svg-dim,#94a8c0)' stroke-dasharray='4 3' stroke-width='1'/><line x1='392' y1='140' x2='392' y2='97' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='412' y='123' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-gold,#e5a93c)'>−Q<\/text><text x='282' y='160' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>Реаг.<\/text><text x='402' y='88' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>Прод.<\/text><text x='230' y='194' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>+Q эквивалентно ΔH &lt; 0 (выделение), −Q — ΔH &gt; 0<\/text><\/svg>"}, {"p": "В школьной химии и на ЕГЭ действует удобная базовая закономерность, но к ней обязательно нужно знать экзаменационные исключения:"}, {"table": [["Категория реакций", "Базовое правило ЕГЭ", "Обязательные исключения для 95–100 баллов"], ["**Реакции соединения**", "Почти все **экзотермические** (`+Q`): горение, гашение извести `CaO + H2O`, `Na2O + H2O`, `2Fe + 3Cl2`, синтез `NH3` и `SO3`.", "**Эндотермические соединения (`−Q`):**\n`N2(г) + O2(г) ⇄ 2NO(г) − Q` (очень прочная тройная связь `N≡N`)\n`H2(г) + I2(т) ⇄ 2HI(г) − Q` (именно с твёрдым иодом!)\n`CO2(г) + C(т) ⇄ 2CO(г) − Q`"], ["**Реакции разложения**", "Почти все **эндотермические** (`−Q`): разложение карбонатов (`CaCO3`), гидроксидов (`Cu(OH)2`), нитратов металлов, термический крекинг.", "**Экзотермические разложения (`+Q`):**\n`2H2O2(р-р) —MnO2→ 2H2O(ж) + O2(г) + Q`\n`NH4NO3(т) —t°→ N2O(г) + 2H2O(г) + Q`\n`(NH4)2Cr2O7(т) —t°→ N2(г) + Cr2O3(т) + 4H2O(г) + Q` («химический вулкан»)"], ["**Горение, нейтрализация, активный металл + кислота/вода**", "**Всегда экзотермические (`+Q`)** — исключений в рамках ЕГЭ нет (даже если для поджигания нужна искра или спичка, сам процесс выделяет много тепла).", "Не путай: `N2 + O2` — это **не горение**, а высокотемпературное окисление (эндотермическое)."], ["**Реакции ионного обмена (кроме нейтрализации)**", "Тепловой эффект обычно мал; нейтрализация сильной кислоты и щёлочи — чётко **экзотермическая (`+Q`)**.", "В № 17 по тепловому эффекту обычно спрашивают яркие экзо- (горение, нейтрализация, гашение оксидов, `Fe + Cl2`) и яркие эндо- (`N2 + O2`, разложение `CaCO3`, `Cu(OH)2`, `C + H2O(пар)`)."]]}, {"warn": "Не путай **нагревание для запуска** с эндотермичностью! Чтобы зажечь уголь, серу или порошок железа в хлоре (`2Fe + 3Cl2 —t°→ 2FeCl3`), их нужно нагреть для преодоления энергетического барьера. Но как только реакция пошла, она выделяет огромное количество тепла — это **экзотермическая** реакция.", "t": "Ловушка №17: «над стрелкой t° — значит эндотермическая?» Нет!"}, {"h": "2. Ось 4: гомогенные и гетерогенные реакции"}, {"p": "Эта ось проверяет, находятся ли **исходные вещества (реагенты)** в одной фазе или между ними есть видимая граница раздела."}, {"compare": {"t": "Гомогенная vs гетерогенная реакция (смотрим строго на реагенты!)", "left": {"title": "Гомогенная (одна фаза)", "items": ["**Газ + газ:** `N2(г) + 3H2(г) ⇄ 2NH3(г)`, `2SO2(г) + O2(г) ⇄ 2SO3(г)`, `2CO(г) + O2(г) → 2CO2(г)`.", "**Раствор + раствор** (смешивающиеся жидкости): `NaOH(р-р) + HCl(р-р) → NaCl(р-р) + H2O(ж)`, `BaCl2(р-р) + Na2SO4(р-р) → BaSO4↓ + 2NaCl(р-р)`.", "**Один раствор или один газ** при разложении: `2H2O2(р-р) → 2H2O(ж) + O2(г)` (без твёрдого катализатора)."]}, "right": {"title": "Гетерогенная (есть граница раздела фаз)", "items": ["**Твёрдое + газ:** `2Fe(т) + 3Cl2(г) → 2FeCl3(т)`, `C(т) + O2(г) → CO2(г)`.", "**Твёрдое + жидкость/раствор:** `Na2O(т) + H2O(ж) → 2NaOH(р-р)`, `Zn(т) + 2HCl(р-р) → ZnCl2(р-р) + H2(г)`, `CaCO3(т) + 2HCl(р-р)`.", "**Твёрдое + твёрдое:** `Fe(т) + S(т) —t°→ FeS(т)` (два разных кристаллических порошка имеют границу раздела).", "**Две несмешивающиеся жидкости:** например, жидкий бензол и вода."]}}}, {"warn": "Агрегатное состояние **продуктов** для этой классификации в общем случае **не имеет значения**! В реакции `BaCl2(р-р) + Na2SO4(р-р) → BaSO4↓ + 2NaCl(р-р)` выпадает твёрдый осадок, но реагировали два водных раствора — реакция **гомогенная**. А в реакции `Zn(т) + 2HCl(р-р)` реагируют металл и раствор — она **гетерогенная**. Две важные оговорки ЕГЭ: (1) **термическое разложение твёрдого вещества с выделением газа** (`CaCO3(т) —t°→ CaO(т) + CO2(г)`) относится к **гетерогенным** реакциям (реакция идёт на границе раздела твёрдых и газовой фаз); (2) если в условии явно указан твёрдый катализатор (`MnO2` для `H2O2`, `Fe` для `N2 + 3H2`), процесс называют гетерогенным катализом (если катализатор не упомянут, оценивай строго фазы реагентов).", "t": "Главный капкан по фазам"}, {"h": "3. Ось 5: каталитические и некаталитические реакции"}, {"p": "**[[Катализатор]]** — вещество, которое ускоряет химическую реакцию, снижая её энергетический барьер, но в итоге не расходуется и в состав конечных продуктов не входит. В задании № 17 нужно помнить «золотой список» школьных **каталитических** реакций:"}, {"list": ["**Неорганика:** синтез аммиака `N2 + 3H2 ⇄ 2NH3` (`Fe`), окисление аммиака до `NO` (`4NH3 + 5O2 —Pt→ 4NO + 6H2O`), окисление `SO2` до `SO3` (`2SO2 + O2 ⇄ 2SO3`, `V2O5`), разложение пероксида водорода (`MnO2`) и бертолетовой соли `2KClO3 —MnO2, t°→ 2KCl + 3O2↑`.", "**Органика:** гидрирование и дегидрирование (`Ni`, `Pt`, `Pd`), гидратация алкенов/алкинов (`H3PO4` / `H2SO4`, соли `Hg^{2+}`), галогенирование бензола в кольцо (`FeCl3`, `FeBr3`, `AlCl3`), изомеризация алканов (`AlCl3`), этерификация (`H2SO4(конц.)`), тримеризация ацетилена (`C(акт.)`)."]}, {"p": "Напротив, **некаталитическими** на ЕГЭ считаются реакции ионного обмена в растворах (`NaOH + HCl`, `AgNO3 + NaCl`), обычное горение (`CH4 + 2O2`, `C + O2`, `4NH3 + 3O2 → 2N2 + 6H2O`), взаимодействие активных металлов с водой и кислотами, галогенирование алканов на свету (`hν` — это свет, а не вещество-катализатор!)."}, {"h": "4. Ось 6: обратимые и необратимые реакции"}, {"p": "**[[Обратимая реакция]]** при одних и тех же условиях протекает одновременно в двух противоположных направлениях — прямом и обратном (`⇄`). **Необратимая реакция** идёт практически до конца в одном направлении (`→`)."}, {"p": "Когда реакция **необратима**? В ЕГЭ действуют три чётких критерия необратимости:"}, {"ol": ["**Все реакции горения** (включая горение аммиака, сероводорода, углеводородов, угля, серы).", "**Реакции ионного обмена с уходом ионов из раствора:** выпадение осадка (`BaSO4↓`, `AgCl↓`), выделение газа (`CO2↑`, `H2S↑`, `NH3↑`), образование малодиссоциирующего вещества (воды `H2O` при нейтрализации), а также **полный необратимый гидролиз** (`Al2S3 + 6H2O`, совместный гидролиз `AlCl3` и `Na2CO3` в растворе).", "**Разложение веществ в открытом сосуде**, когда газообразный продукт улетает, а также сильные ОВР с выделением газа или большого количества тепла (`2KMnO4 —t°→ ...`, `Zn + 2HCl → ZnCl2 + H2↑`)."]}, {"p": "Главные **обратимые реакции** школьного курса, которые постоянно встречаются в № 17 и № 22: `N2 + 3H2 ⇄ 2NH3`, `2SO2 + O2 ⇄ 2SO3`, `H2 + I2 ⇄ 2HI`, `N2 + O2 ⇄ 2NO`, `CO + H2O(г) ⇄ CO2 + H2`, `CO2 + H2O ⇄ H2CO3`, **гидролиз обычных солей** (`Na2CO3`, `FeCl3`, `NH4Cl`), **диссоциация слабых электролитов** (`CH3COOH ⇄ CH3COO^{−} + H^{+}`), **этерификация** (`CH3COOH + C2H5OH ⇄ CH3COOC2H5 + H2O`) и **гидрирование/дегидрирование** в замкнутой системе."}, {"h": "5. Сквозной пример: полная карточка по всем 6 осям"}, {"steps": ["**`N2(г) + 3H2(г) ⇄ 2NH3(г) + Q` (синтез аммиака):** (1) **соединение** (два вещества → одно); (2) **ОВР** (`N^{0} → N^{−3}`, `H^{0} → H^{+1}`); (3) **экзотермическая** (`+Q`); (4) **гомогенная** по фазам реагентов (`г + г`, при упоминании твёрдого катализатора `Fe` — гетерогенный катализ); (5) **каталитическая** (`Fe`); (6) **обратимая**.", "**`Al2S3(т) + 6H2O(ж) → 2Al(OH)3↓ + 3H2S↑` (гидролиз сульфида алюминия):** (1) **обмен**; (2) **не-ОВР**; (3) **экзотермическая**; (4) **гетерогенная** (`т + ж`); (5) **некаталитическая**; (6) **необратимая** (осадок + газ)."]}, {"bridge": {"kim": "№ 17 КИМ (1 балл)", "ask": "Выбрать реакции по тепловому эффекту, гомогенности, каталитичности или обратимости — часто сразу два признака в одном пункте.", "watch": "Исключения по теплоте (`N2 + O2`, `H2 + I2`, `CO2 + C` — эндо; `H2O2`, `NH4NO3`, `(NH4)2Cr2O7` — экзо); горение аммиака (необратимо и некаталитично без Pt) vs каталитическое окисление аммиака до NO; фазы смотрят только у реагентов.", "tip": "Если в условии дана пара признаков, проверяй сначала более «жёсткий» (например, состав или фазы реагентов) — это сразу отсекает 2–3 неверных варианта."}}], "short": [{"list": ["Экзотермические реакции (`+Q`, `ΔH < 0`) выделяют тепло; эндотермические (`−Q`, `ΔH > 0`) поглощают его. Нагревание для запуска не делает горение эндотермическим.", "Запомни исключения: эндотермические соединения — `N2 + O2`, `H2 + I2`, `CO2 + C`; экзотермические разложения — `H2O2`, `NH4NO3`, `(NH4)2Cr2O7`.", "Гомогенность и гетерогенность определяются строго по агрегатному состоянию исходных веществ (реагентов), а не продуктов.", "Свет (`hν`) — это излучение, а не катализатор; реакции ионного обмена и обычное горение — некаталитические.", "Все реакции горения, нейтрализации, выпадения осадка и полного гидролиза бинарных соединений (`Al2S3`) — необратимы."]}]}, {"id": "03", "group": "Классификация реакций (№17)", "nav": "Органика и двойной фильтр №17", "codes": ["1.5"], "eyebrow": "03 · Код 1.5 · Задание 17", "title": "Классификация органических реакций и алгоритм КИМ №17", "lead": "Почему реакция бензола с хлором в одном случае — замещение, а в другом — присоединение? И как безошибочно решать обновлённый формат №17, где нужно совместить два признака сразу?", "b": [{"key": "В органической химии классификация строится вокруг того, что происходит с углеродным скелетом и кратными связями: разрыв кратной связи даёт присоединение, замена атома на группу — замещение, образование кратной связи — отщепление (элиминирование), а перестройка скелета без изменения формулы — изомеризацию.", "t": "Главная мысль."}, {"h": "1. Главные типы реакций в органической химии"}, {"p": "В неорганике мы делили реакции на соединение, разложение, замещение и обмен. В органике эти понятия частично сохраняются, но появляются более точные механизмы. Самая частая ошибка — спутать **присоединение** с **замещением** или забыть про **отщепление (элиминирование)**."}, {"table": [["Органический тип", "Что происходит с молекулой", "Типовые примеры ЕГЭ", "Связь с неорганическими терминами"], ["**Присоединение** (гидрирование, галогенирование алкенов/алкинов, гидратация, гидрогалогенирование, полимеризация)", "Разрывается π-связь (двойная, тройная или малый цикл), и атомы второго реагента «сажаются» на углероды.", "`C2H4 + H2 —t°, Ni→ C2H6`\n`C2H4 + H2O —H3PO4→ C2H5OH`\n`C6H6 + 3Cl2 —hν→ C6H6Cl6`", "По числу веществ это почти всегда **соединение** (из двух или многих молекул — одна)."], ["**Замещение** (галогенирование алканов и бензола в кольцо, нитрование, сульфирование)", "Один атом (чаще `H`) или группа заменяется на другой атом/группу, при этом выделяется побочная малая молекула (`HCl`, `HBr`, `H2O`).", "`CH4 + Cl2 —hν→ CH3Cl + HCl`\n`C6H6 + Cl2 —FeCl3→ C6H5Cl + HCl`", "В органике замещение может идти между **двумя сложными** веществами (например, бензол + `HNO3`), в отличие от школьной неорганики!"], ["**Отщепление (элиминирование)** (дегидрирование, дегидратация, дегидрогалогенирование, дегалогенирование)", "От одной молекулы отрываются два атома/группы (уходит `H2`, `H2O`, `HBr`), и внутри молекулы образуется кратная связь (или цикл).", "`C2H6 —t°, Ni→ C2H4 + H2`\n`C2H5OH —t° > 140 °C, H2SO4(конц.)→ C2H4 + H2O`", "Если отщепление идёт под действием температуры или катализатора (без второго реагента в уравнении) — это **разложение**."], ["**Изомеризация**", "Атомы внутри молекулы перестраиваются, меняется строение скелета, но молекулярная формула остаётся прежней.", "`н-бутан —t°, AlCl3→ изобутан` (`C4H10 → C4H10`)", "Не относится ни к соединению, ни к разложению, ни к замещению, ни к обмену; **не-ОВР**."], ["**Этерификация и гидролиз эфиров**", "Кислота + спирт ⇄ сложный эфир + вода.", "`CH3COOH + C2H5OH ⇄ CH3COOC2H5 + H2O`", "Обратимая, каталитическая (`H2SO4(конц.)`), гомогенная, **не-ОВР**; в неорганических терминах часто относят к реакциям **обмена**."]]}, {"warn": "Классическая пара-ловушка КИМ № 17 — **бензол + хлор**:\n• с катализатором (`FeCl3`, `AlCl3`): `C6H6 + Cl2 —FeCl3→ C6H5Cl + HCl` — это **замещение**, каталитическая, ОВР;\n• на свету (`hν`): `C6H6 + 3Cl2 —hν→ C6H6Cl6` (гексахлорциклогексан) — это **присоединение** (соединение), некаталитическая, ОВР.\nЕщё одна пара: **полимеризация** (мономеры с кратными связями соединяются *без* выделения побочных веществ — тип «присоединение / соединение») против **поликонденсации** (выделяется побочная молекула `H2O` — это *не* соединение!).", "t": "Главные органические ловушки №17"}, {"h": "2. ОВР или не-ОВР в органике: быстрая проверка"}, {"p": "В органических реакциях не обязательно считать степени окисления каждого атома углерода в длинной цепи — достаточно посмотреть на второй реагент и изменение числа связей `C–H` и `C–O`:"}, {"list": ["**Всегда ОВР:** горение, гидрирование (`+H2`), дегидрирование (`−H2`), галогенирование (`+Cl2`, `+Br2`), окисление (`KMnO4`, `K2Cr2O7`, `CuO`, `[Ag(NH3)2]OH`, `Cu(OH)2` при нагревании).", "**Всегда не-ОВР (в школьной модели ЕГЭ — по средней степени окисления атомов углерода и отсутствию внешнего окислителя/восстановителя):** гидратация (`+H2O`), дегидратация (`−H2O`), гидрогалогенирование (`+HCl`, `+HBr`), нитрование и сульфирование аренов (`+HNO3`, `+H2SO4`), реакции галогеналканов с `KOH(водн.)` (замещение) и `KOH(спирт.)` (отщепление, но не разложение!), этерификация и гидролиз сложных эфиров, кислотно-основные реакции карбоновых кислот и фенолов со щелочами, изомеризация и полимеризация алкенов."]}, {"h": "3. Интерактивный алгоритм двойного фильтра для КИМ №17"}, {"p": "По статистике ФИПИ средний процент выполнения задания № 17 снизился до 38,2 %, потому что в актуальном формате (ДЕМО-2027) нужно установить соответствие между тремя реакциями (А, Б, В) и четырьмя **парами признаков** (1–4), причём цифры могут повторяться. Если подходит только один признак из пары — ответ неверный!"}, {"tree": {"t": "Двойной фильтр КИМ №17: как выбрать пару признаков", "root": {"q": "Записал(а) точное уравнение реакции с агрегатными состояниями реагентов?", "yes": {"q": "Первый признак из предложенного варианта (состав: соед./разл./зам./обм.) точно совпадает с уравнением?", "yes": {"q": "Второй признак из этого же варианта (фазы реагентов, ОВР, теплота или обратимость) тоже совпадает?", "yes": {"a": "Вариант подходит — фиксируй цифру!", "why": "Оба независимых критерия подтверждены. Помни: в № 17 цифры для разных букв А, Б, В могут повторяться."}, "no": {"a": "Отбрасывай этот вариант полностью.", "why": "Частичное совпадение (1 из 2) — главная ловушка № 17. Ищи другой вариант с тем же первым признаком, но верным вторым."}}, "no": {"a": "Отбрасывай вариант сразу и проверяй следующий.", "why": "Несоответствие по числу и составу веществ невозможно компенсировать вторым признаком."}}, "no": {"a": "Сначала выпиши формулы и фазы реагентов на черновике.", "why": "По словесному названию легко пропустить твёрдую фазу («порошок железа», «оксид натрия») или количество продуктов."}}}}, {"h": "4. Полный разбор реального задания №17 из Демоверсии ЕГЭ-2027"}, {"p": "Условие ДЕМО-2027: установите соответствие между химической реакцией (А — взаимодействие оксида натрия с водой; Б — гидролиз сульфида алюминия; В — взаимодействие хлора с порошком железа) и типами реакции: `1)` замещения, гетерогенная; `2)` соединения, гомогенная; `3)` обмена, необратимая; `4)` соединения, экзотермическая."}, {"steps": ["**А) Оксид натрия + вода:** `Na2O(т) + H2O(ж) → 2NaOH(р-р) + Q`. Два вещества дают одно — это **соединение** (подходят варианты `2` и `4`). Проверяем второй признак: `Na2O` — твёрдое вещество, `H2O` — жидкость, значит реакция **гетерогенная** (вариант `2` «гомогенная» отпадает!). Растворение основного оксида активного металла в воде идёт с сильным разогревом — реакция **экзотермическая** → **А = 4**.", "**Б) Гидролиз сульфида алюминия:** `Al2S3(т) + 6H2O(ж) → 2Al(OH)3↓ + 3H2S↑`. Два сложных вещества обмениваются составными частями без изменения степеней окисления — это **обмен**. Из-за одновременного образования осадка и газа реакция идёт до конца — **необратимая** → **Б = 3**.", "**В) Хлор + порошок железа:** `2Fe(т) + 3Cl2(г) —t°→ 2FeCl3(т) + Q`. Два простых вещества дают одно сложное — это **соединение** (снова выбор между `2` и `4`). По фазам реагентов (газ + твёрдый порошок) реакция **гетерогенная** (`2` отпадает). Взаимодействие активного неметалла хлора с железом идёт с выделением тепла — **экзотермическая** → **В = 4**.", "**Проверка ответа:** `434`. Цифра `4` повторилась дважды — в № 17 повторение цифр разрешено и встречается регулярно."]}, {"bridge": {"kim": "№ 17 КИМ (1 балл, порядок цифр важен)", "ask": "Соотнести 3 реакции с парами признаков (цифры могут повторяться) ИЛИ выбрать все реакции из списка, отвечающие заданной комбинации признаков.", "watch": "В ДЕМО-2027 специально рядом поставили варианты «соединения, гомогенная» (2) и «соединения, экзотермическая» (4), чтобы поймать тех, кто не проверил твёрдое состояние `Na2O` и порошка `Fe`.", "tip": "Для каждой буквы выписывай уравнение с индексами `(т)`, `(ж)`, `(г)`, `(р-р)` у реагентов — это страхует от 90 % ошибок по фазам."}}], "short": [{"list": ["В органике выделяют присоединение (разрыв кратной связи), замещение (выделяется побочная молекула), отщепление/элиминирование (образование кратной связи) и изомеризацию (перестройка скелета).", "Бензол + `Cl2` с `FeCl3` — замещение (каталитическая); бензол + `Cl2` на свету (`hν`) — присоединение (некаталитическая).", "Полимеризация относится к присоединению/соединению; поликонденсация выделяет малую молекулу и соединением не является.", "Гидрирование, дегидрирование, галогенирование и горение в органике — всегда ОВР; гидратация, дегидратация, этерификация и изомеризация — не-ОВР.", "В КИМ № 17 проверяй оба признака в варианте ответа отдельно; в формате соответствия цифры могут повторяться."]}]}, {"id": "04", "group": "Скорость реакции (№18)", "nav": "Скорость, столкновения и природа веществ", "codes": ["1.6"], "eyebrow": "04 · Код 1.6 · Задание 18", "title": "Что такое скорость реакции, энергия активации и природа реагентов", "lead": "Почему магний в соляной кислоте шипит бурно, в уксусной той же концентрации — спокойно, а щёлочь с уксусной кислотой реагирует вообще мгновенно?", "b": [{"key": "Реакция идёт только тогда, когда частицы реагентов сталкиваются с энергией не ниже барьера — энергии активации E_a. Чем прочнее исходные связи и выше этот барьер, тем медленнее реакция; ионные реакции в растворе почти не имеют барьера и протекают практически мгновенно.", "t": "Главная мысль."}, {"h": "1. Как измеряют скорость химической реакции"}, {"p": "В повседневной жизни скорость — это путь за единицу времени. В химии вместо пути считают, **на сколько изменилась концентрация** (или количество вещества) за единицу времени — секунду, минуту или час."}, {"p": "Поскольку **гомогенные** реакции идут сразу во всём объёме (газа или раствора), а **гетерогенные** — только на поверхности раздела фаз (например, на поверхности кусочка цинка), формулы средней скорости для них слегка различаются:"}, {"grid": [{"t": "Гомогенная реакция", "tag": "во всём объёме V", "eq": "v_{гомо} = ± Δc / Δt = ± Δn / (V · Δt)", "x": "Изменение молярной концентрации любого реагента или продукта за время `Δt`. Единица: `моль/(л·с)`.", "x2": "Знак `−` ставят для реагента (его концентрация убывает, `Δc < 0`), знак `+` — для продукта (`Δc > 0`), чтобы скорость всегда была положительным числом."}, {"t": "Гетерогенная реакция", "tag": "на поверхности S", "eq": "v_{гетеро} = ± Δn / (S · Δt)", "x": "Изменение количества вещества на единице площади поверхности раздела фаз за время `Δt`. Единица: `моль/(м²·с)`.", "x2": "Именно поэтому измельчение твёрдого реагента резко ускоряет гетерогенный процесс: площадь `S` растёт в десятки раз."}], "cols": 2}, {"h": "2. Теория активных столкновений и энергия активации"}, {"p": "Почему смесь водорода и кислорода при комнатной температуре может годами лежать в баллоне без реакции, хотя образование воды — сильно экзотермический процесс? Молекулы `H2` и `O2` сталкиваются миллиарды раз в секунду, но почти все эти удары — «холостые»: молекулы отскакивают, как бильярдные шары, не разрывая прочные связи `H–H` и `O=O`."}, {"p": "Чтобы столкновение стало **активным** (привело к реакции), частицы должны обладать запасом энергии не меньше **[[энергия активации|энергии активации]]** `E_a` — минимального энергетического барьера, нужного для ослабления старых связей. Чем *выше* `E_a`, тем *меньше* доля активных столкновений и тем *медленнее* реакция."}, {"p": "Отсюда сразу понятна роль **катализатора**: он не «разгоняет» молекулы и не меняет начальный и конечный уровни энергии (тепловой эффект `Q` остаётся строго прежним!), а прокладывает обходной путь реакции с гораздо более низким барьером `E_a'`."}, {"svg": "<svg viewBox='0 0 460 220' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='220' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Как катализатор ускоряет реакцию<\/text><line x1='42' y1='186' x2='435' y2='186' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><line x1='42' y1='186' x2='42' y2='42' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><text x='28' y='52' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>E<\/text><text x='392' y='204' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Ход реакции<\/text><path d='M 55 112 L 110 112 Q 210 18 310 156 L 420 156' fill='none' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2.5'/><path d='M 110 112 Q 210 66 310 156' fill='none' stroke='var(--svg-good,#34c77b)' stroke-width='2.5' stroke-dasharray='7 4'/><line x1='110' y1='112' x2='380' y2='112' stroke='var(--svg-dim,#94a8c0)' stroke-dasharray='3 3' stroke-width='1'/><line x1='196' y1='112' x2='196' y2='49' stroke='var(--svg-bad,#ef6b6b)' stroke-width='1.8'/><text x='158' y='62' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-bad,#ef6b6b)'>E_a (без кат.)<\/text><line x1='224' y1='112' x2='224' y2='83' stroke='var(--svg-good,#34c77b)' stroke-width='1.8'/><text x='286' y='92' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-good,#34c77b)'>E_a' (с кат.)<\/text><line x1='355' y1='114' x2='355' y2='154' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='392' y='138' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-gold,#e5a93c)'>Q = const<\/text><text x='82' y='105' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>Реагенты<\/text><text x='385' y='174' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>Продукты<\/text><\/svg>"}, {"h": "3. Фактор №1: природа реагирующих веществ (тренд ДЕМО-2027)"}, {"p": "В заданиях № 18 последних лет (и в утверждённой Демоверсии ЕГЭ-2027) особенно любят проверять **природу реагирующих веществ**: тебе дают эталонную реакцию и просят выбрать все реакции, которые при *одинаковых* температуре и концентрации идут **быстрее** (или **медленнее**)."}, {"p": "Чтобы не гадать, запомни четыре чётких правила сравнения скоростей по природе веществ:"}, {"table": [["Что сравниваем", "Кто реагирует быстрее", "Почему так происходит"], ["**Ионные реакции в растворе** vs **молекулярные / гетерогенные**", "Реакции между ионами в растворе (нейтрализация `H^{+} + OH^{−} → H2O`, осаждение `Ba^{2+} + SO4^{2−}`) идут **практически мгновенно** — быстрее гетерогенных реакций металлов с кислотами.", "Ионы уже свободны в растворе, прочные ковалентные связи разрывать не нужно — энергия активации близка к нулю."], ["**Активность металла** (по ряду напряжений)", "Чем **левее** металл в электрохимическом ряду напряжений (`K, Na, Ca > Mg > Al > Zn > Fe > Pb`), тем быстрее он реагирует с водой или одинаковой кислотой.", "Более активный металл легче отдаёт электроны (`e^{−}`) катионам `H^{+}`."], ["**Сила кислоты** (при равной молярной концентрации)", "**Сильная кислота** (`HCl`, `HBr`, `HI`, `H2SO4(разб.)`) реагирует с металлом или карбонатом заметно **быстрее**, чем **слабая** (`CH3COOH`, `H3PO4`, `HF`, `HCOOH`).", "В растворе сильной кислоты распад на ионы полный — фактическая концентрация ионов `H^{+}` в десятки раз выше! А двухосновная `H2SO4` при той же молярной концентрации даёт ещё больше `H^{+}`, чем одноосновная `HCl`."], ["**Активность неметалла**", "В группе сверху вниз активность галогенов падает: `F2 > Cl2 > Br2 > I2`. Фтор реагирует с водородом со взрывом в темноте, хлор — на свету, иод — медленно и обратимо при нагревании.", "У более электроотрицательного неметалла выше окислительная способность и ниже барьер реакции."]]}, {"warn": "Осторожно с **пассивацией** и **нерастворимой плёнкой**! В реальной химии и на ЕГЭ `Fe`, `Al`, `Cr` на холоду **пассивируются** концентрированными `HNO3` и `H2SO4`, а свинец `Pb` в серной и соляной кислотах покрывается нерастворимой плёнкой `PbSO4` / `PbCl2`, которая резко тормозит реакцию.", "t": "Граница правила активности металлов"}, {"h": "4. Полный разбор реального задания №18 из Демоверсии ЕГЭ-2027"}, {"p": "Условие ДЕМО-2027: *«Из предложенного перечня выберите все реакции, которые при одинаковых температуре и концентрации кислот протекают с бо́льшей скоростью, чем взаимодействие магния с раствором уксусной кислоты»*:\n1) железо + раствор уксусной кислоты;\n2) магний + соляная кислота;\n3) магний + серная кислота;\n4) раствор гидроксида калия + раствор уксусной кислоты;\n5) свинец + раствор уксусной кислоты."}, {"steps": ["**Опорная реакция:** `Mg(т) + 2CH3COOH(р-р) → (CH3COO)2Mg(р-р) + H2↑`. Это гетерогенная реакция активного металла (`Mg`) со **слабой** кислотой (`CH3COOH`, низкая концентрация `H^{+}`).", "**Вариант 1 (`Fe + CH3COOH`):** кислота та же, но `Fe` стоит **правее** `Mg` в ряду активности металлов — реакция идёт **медленнее**. Не подходит.", "**Вариант 2 (`Mg + HCl`):** металл тот же (`Mg`), но соляная кислота — **сильный** электролит (`[H^{+}]` намного выше, чем в уксусной той же концентрации) → идёт **быстрее**. Подходит (`2`).", "**Вариант 3 (`Mg + H2SO4(разб.)`):** металл тот же (`Mg`), серная кислота — **сильная** двухосновная кислота (`[H^{+}]` ещё выше!) → идёт **быстрее**. Подходит (`3`).", "**Вариант 4 (`KOH(р-р) + CH3COOH(р-р)`):** гомогенная ионная реакция нейтрализации в растворе — протекает **практически мгновенно**, намного быстрее гетерогенного растворения металла в слабой кислоте → идёт **быстрее**. Подходит (`4`).", "**Вариант 5 (`Pb + CH3COOH`):** `Pb` стоит сильно **правее** `Mg` в ряду активности → идёт **медленнее**. Не подходит.", "**Итоговый ответ:** `234` (в № 18 порядок цифр не имеет значения, но количество правильных ответов не фиксировано — здесь их три!)."]}, {"bridge": {"kim": "№ 18 КИМ (1 балл, «выберите все...», порядок цифр не важен)", "ask": "Сравнить скорость нескольких реакций при равных температуре и концентрации кислот/растворов.", "watch": "В № 18 может быть 2, 3 или 4 правильных ответа (никогда не останавливайся ровно на двух!). Главная ловушка — забыть про мгновенную скорость ионной нейтрализации в растворе или спутать силу кислот (`HCl`/`H2SO4` против `CH3COOH`).", "tip": "Если сравнивают металлы с кислотами, сразу проверяй три оси: (1) ионная в растворе быстрее гетерогенной; (2) сильная кислота быстрее слабой; (3) более активный металл быстрее менее активного."}}], "short": [{"list": ["Средняя скорость гомогенной реакции — изменение концентрации в единицу времени (`v = ±Δc/Δt`), гетерогенной — изменение количества вещества на единице площади поверхности (`v = ±Δn/(S·Δt)`).", "Реакция идёт только при активных столкновениях частиц с энергией не ниже энергии активации `E_a`.", "Катализатор снижает `E_a`, ускоряя реакцию, но не изменяет тепловой эффект `Q`.", "При равных `T` и `c` ионные реакции в растворе идут быстрее гетерогенных; сильные кислоты (`HCl`, `H2SO4`) реагируют быстрее слабых (`CH3COOH`); более активный металл — быстрее менее активного."]}]}, {"id": "05", "group": "Скорость реакции (№18)", "nav": "6 факторов скорости и ловушки №18", "codes": ["1.6"], "eyebrow": "05 · Код 1.6 · Задание 18", "title": "Все факторы скорости реакции, правило Вант-Гоффа и «пустые» воздействия", "lead": "Почему добавление воды в соляную кислоту замедляет реакцию с цинком, доливание ещё одной порции той же 10 %-ной кислоты — не ускоряет, а повышение давления вообще ничего не меняет?", "b": [{"key": "Чтобы ускорить реакцию, нужно либо увеличить частоту столкновений реагирующих частиц (концентрация, давление газов, площадь поверхности твёрдого), либо увеличить долю активных столкновений (температура, катализатор). Всё, что не меняет ни частоту столкновений реагентов, ни барьер E_a, на скорость НЕ влияет.", "t": "Главная мысль."}, {"h": "1. Пять внешних факторов скорости (плюс природа веществ)"}, {"p": "Природу веществ мы разобрали в модуле 04. Теперь посмотрим на пять **внешних воздействий**, которыми можно управлять скоростью уже выбранной реакции."}, {"table": [["Фактор", "Для каких реакций работает", "Как влияет на скорость", "Почему (механизм столкновений)"], ["**1. Температура (`T`)**", "Для **АБСОЛЮТНО ВСЕХ** реакций (гомо-, гетеро-, экзо-, эндо-).", "Повышение `T` **всегда ускоряет** реакцию; охлаждение **всегда замедляет**.", "Растёт кинетическая энергия молекул — резко увеличивается доля частиц, способных перепрыгнуть барьер `E_a` (правило Вант-Гоффа)."], ["**2. Концентрация реагентов (`c`)**", "Для **газов** и **растворённых веществ** (только реагентов!).", "Увеличение `c` реагента **ускоряет**; разбавление водой **замедляет**.", "Больше частиц реагента в единице объёма → чаще происходят столкновения. Концентрация твёрдых веществ постоянна и в закон скорости не входит."], ["**3. Давление (`P`) / сжатие сосуда**", "**ТОЛЬКО** если среди **исходных веществ** есть хотя бы один **газ**.", "Повышение `P` (уменьшение объёма сосуда) **ускоряет**; понижение `P` **замедляет**.", "Газы сжимаемы: повышение давления сближает молекулы газа, то есть увеличивает их концентрацию. Жидкости и твёрдые тела практически несжимаемы."], ["**4. Площадь поверхности (`S`) и перемешивание**", "**ТОЛЬКО** для **гетерогенных** реакций с участием твёрдого реагента (или несмешивающихся жидкостей).", "Измельчение (кусок → порошок / стружка) и **перемешивание** смеси **ускоряют**; прессование в слиток **замедляет**.", "Реакция идёт на границе фаз: дробление открывает новые слои атомов, а перемешивание постоянно подводит свежий реагент к поверхности."], ["**5. Катализатор / ингибитор**", "Для каталитических реакций (специфичен для каждой реакции).", "**Катализатор** ускоряет; **ингибитор** замедляет.", "Катализатор снижает энергию активации `E_a`; ингибитор блокирует активные центры или обрывает цепь."]]}, {"svg": "<svg viewBox='0 0 460 175' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='175' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Гетерогенная реакция: почему порошок быстрее куска<\/text><rect x='45' y='46' width='120' height='80' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><rect x='82' y='64' width='46' height='46' rx='4' fill='var(--svg-blue,#60a5fa)' fill-opacity='0.35' stroke='var(--svg-blue,#60a5fa)' stroke-width='2'/><text x='105' y='145' text-anchor='middle' font-size='12' font-weight='600' fill='var(--svg-ink,#e6eef7)'>1 крупный кусок<\/text><text x='105' y='162' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>малая площадь S<\/text><path d='M 185 86 L 245 86' stroke='var(--svg-acc,#14b8a6)' stroke-width='2.5'/><polygon points='245,81 255,86 245,91' fill='var(--svg-acc,#14b8a6)'/><text x='218' y='76' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-acc,#14b8a6)'>измельчили<\/text><rect x='275' y='46' width='140' height='80' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><rect x='290' y='58' width='18' height='18' rx='3' fill='var(--svg-good,#34c77b)' fill-opacity='0.35' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><rect x='316' y='58' width='18' height='18' rx='3' fill='var(--svg-good,#34c77b)' fill-opacity='0.35' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><rect x='342' y='58' width='18' height='18' rx='3' fill='var(--svg-good,#34c77b)' fill-opacity='0.35' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><rect x='368' y='58' width='18' height='18' rx='3' fill='var(--svg-good,#34c77b)' fill-opacity='0.35' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><rect x='290' y='88' width='18' height='18' rx='3' fill='var(--svg-good,#34c77b)' fill-opacity='0.35' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><rect x='316' y='88' width='18' height='18' rx='3' fill='var(--svg-good,#34c77b)' fill-opacity='0.35' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><rect x='342' y='88' width='18' height='18' rx='3' fill='var(--svg-good,#34c77b)' fill-opacity='0.35' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><rect x='368' y='88' width='18' height='18' rx='3' fill='var(--svg-good,#34c77b)' fill-opacity='0.35' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><text x='345' y='145' text-anchor='middle' font-size='12' font-weight='600' fill='var(--svg-good,#34c77b)'>Порошок (та же масса)<\/text><text x='345' y='162' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>огромная площадь S → v ↑<\/text><\/svg>"}, {"h": "2. Правило Вант-Гоффа (температурный коэффициент)"}, {"p": "Насколько сильно растёт скорость при нагревании? Для большинства реакций в растворе и газе при умеренных температурах работает **[[правило Вант-Гоффа]]**: при повышении температуры на каждые `10 °C` скорость реакции возрастает в `γ` раз (температурный коэффициент обычно лежит в пределах `γ = 2…4`):"}, {"eq": "v2 / v1 = γ^{(T2 − T1) / 10}"}, {"p": "Пример: если `γ = 2`, а температуру подняли с `20 °C` до `50 °C` (`ΔT = 30 °C`, то есть `3` шага по `10 °C`), скорость вырастет в `2³ = 8` раз. При охлаждении с `50 °C` до `20 °C` скорость ровно во столько же (`8` раз) уменьшится."}, {"warn": "Самая коварная путаница между № 18 и № 22 — **температура для экзотермической реакции**! В задании № 18 нагревание **ВСЕГДА ускоряет** реакцию — даже если в уравнении стоит `+Q`! Почему? Потому что нагревание ускоряет *обе* реакции (и прямую, и обратную), просто эндотермическую ускоряет сильнее — именно поэтому *равновесие* (№ 22) сдвигается к эндотермической, но *скорость* (№ 18) всё равно растёт.", "t": "Не путай скорость (№18) и равновесие (№22)!"}, {"h": "3. Чёрный список «пустых» воздействий (на скорость НЕ влияют)"}, {"p": "Составители КИМ № 18 обожают подкладывать воздействия, которые звучат «по-химически», но вообще не ускоряют заданную прямую реакцию:"}, {"list": ["**Изменение концентрации продуктов реакции:** на скорость *прямой* реакции (`A + B → C + D`) концентрация `C` и `D` не влияет — сталкиваются частицы `A` и `B`, а не продукты!", "**Изменение давления, если среди исходных веществ нет газов:** например, в `Zn(т) + 2HCl(р-р) → ZnCl2(р-р) + H2(г)` водород — это *продукт*, а среди реагентов газов нет → давление на скорость прямой реакции не влияет.", "**Измельчение в гомогенной реакции** (газ + газ или раствор + раствор): газы и растворы уже перемешаны на молекулярном уровне.", "**Добавление новой порции раствора той же концентрации** (просто долили такой же 10 %-ной `HCl` в стакан с цинком): число частиц `H^{+}` в одном литре не изменилось → скорость на единице поверхности осталась прежней.", "**Добавление ионов-зрителей:** например, добавление раствора `NaCl` к `Zn + 2HCl` увеличивает концентрацию `Cl^{−}`, но в сокращённом ионном уравнении `Zn + 2H^{+} → Zn^{2+} + H2↑` хлорид-ионы не участвуют — скорость не растёт (а при добавлении *водного раствора* `NaCl` концентрация `H^{+}` даже разбавится, и скорость слегка упадёт!).", "**Повышение давления за счёт добавления инертного газа (`He`, `Ne`, `Ar`) при постоянном объёме (`V = const`):** общее давление в сосуде выросло, но число молекул реагирующих газов в каждом литре не изменилось — скорость **не меняется**.", "**Увеличение «концентрации» или массы твёрдого реагента без измельчения:** удельная скорость гетерогенной реакции `v_{гетеро} = Δn/(S·Δt)` и концентрация твёрдой фазы постоянны, поэтому в КИМ № 18 «увеличение количества твёрдого вещества» не считают фактором ускорения.", "**Осторожно с косвенными химическими добавками в растворе:** если добавить вещество, которое **связывает** реагент (например, `NaOH` в `Zn + 2HCl` связывает `H^{+}` в воду), скорость **упадёт**; а если добавить другую сильную кислоту (например, `H2SO4(разб.)`), концентрация `H^{+}` вырастет, и скорость **увеличится**."]}, {"h": "4. Интерактивное дерево проверки фактора в КИМ №18"}, {"tree": {"t": "Ускорит ли предложенное воздействие прямую реакцию (№18)?", "root": {"q": "Воздействие — это повышение температуры или добавление подходящего катализатора?", "yes": {"a": "ДА, скорость растёт.", "why": "Температура ускоряет абсолютно любую реакцию; катализатор снижает E_a данной каталитической реакции."}, "no": {"q": "Воздействие меняет давление (объём сосуда)?", "yes": {"q": "Есть ли среди ИСХОДНЫХ веществ (слева от стрелки) хотя бы один газ?", "yes": {"a": "Повышение давления (сжатие) — ускоряет; понижение — замедляет.", "why": "Сжатие увеличивает концентрацию газообразного реагента."}, "no": {"a": "НЕ ВЛИЯЕТ.", "why": "Газ только в продуктах или полное отсутствие газов — твёрдые и жидкие реагенты несжимаемы."}}, "no": {"q": "Воздействие — измельчение твёрдого реагента или увеличение концентрации газообразного/растворённого реагента?", "yes": {"a": "ДА, скорость растёт (при условии, что вещество — именно РЕАГЕНТ!).", "why": "Растёт либо площадь контакта S (для твёрдого реагента), либо число частиц реагента в единице объёма."}, "no": {"a": "НЕ УСКОРЯЕТ (проверь на разбавление водой, продукт, ион-зритель или ингибитор).", "why": "Концентрация продуктов, ионы-зрители и доливание раствора той же концентрации не увеличивают частоту активных столкновений реагентов."}}}}}}, {"h": "5. Разбор вслух: две классические задачи КИМ №18"}, {"steps": ["**Задача А (гетерогенная): `Zn(т) + 2HCl(р-р) → ZnCl2(р-р) + H2↑`.** Что **ускорит** реакцию? Повышение температуры (да, всегда), увеличение концентрации `HCl` (да, растворённый реагент), измельчение цинка в порошок (да, гетерогенная реакция с твёрдым реагентом). Что **НЕ ускорит**? Повышение давления (газов слева нет!), удаление `H2` или добавление `ZnCl2` (это продукты), разбавление водой (уменьшает концентрацию `HCl` — замедляет!).", "**Задача Б (гомогенная газовая): `2SO2(г) + O2(г) ⇄ 2SO3(г) + Q`.** Что **ускорит** прямую реакцию? Повышение температуры (да, несмотря на `+Q`!), повышение давления / уменьшение объёма сосуда (да, слева есть газы), добавление `O2` или `SO2` (да, рост концентрации реагентов), добавление катализатора `V2O5` (да). Что **НЕ ускорит**? Повышение концентрации `SO3` (продукт ускорит только *обратную* реакцию) и «измельчение» (газы измельчить нельзя)."]}, {"bridge": {"kim": "№ 18 КИМ (1 балл, порядок цифр не важен)", "ask": "Выбрать все воздействия, которые увеличивают (или уменьшают!) скорость указанной химической реакции.", "watch": "Читай внимательно слово **«увеличивают»** или **«уменьшают»**! Проверяй агрегатные состояния строго в **левой** части уравнения (реагенты). Помни: разбавление водой *снижает* концентрацию растворённого реагента, а нагревание *увеличивает* скорость даже экзотермической реакции.", "tip": "Перед выбором цифр подпиши под формулами слева `(т)`, `(р-р)` или `(г)` — сразу станет видно, работают ли давление и измельчение."}}], "short": [{"list": ["Повышение температуры ускоряет абсолютно любую реакцию (правило Вант-Гоффа: `v2 / v1 = γ^{(T2 − T1)/10}`), даже экзотермическую.", "Давление влияет на скорость прямой реакции только при наличии газа среди исходных веществ.", "Площадь поверхности (измельчение) работает только для твёрдого реагента в гетерогенной реакции.", "Концентрация продуктов, ионы-зрители, доливание раствора той же концентрации и отсутствие газа слева при изменении давления на скорость прямой реакции не влияют.", "Катализатор ускоряет реакцию, ингибитор — замедляет."]}]}, {"id": "06", "group": "Химическое равновесие (№22)", "nav": "Равновесие и принцип Ле Шателье", "codes": ["1.8"], "eyebrow": "06 · Код 1.8 · Задание 22", "title": "Динамическое равновесие и принцип Ле Шателье", "lead": "Почему в состоянии химического равновесия реакция вовсе не остановилась, а концентрации реагентов и продуктов почти никогда не равны друг другу?", "b": [{"key": "Химическое равновесие — это динамическое состояние обратимой реакции, при котором скорость прямой реакции равна скорости обратной (v_пр = v_обр > 0), а концентрации всех веществ перестают меняться. При внешнем воздействии равновесие смещается так, чтобы ослабить это воздействие (принцип Ле Шателье).", "t": "Главная мысль."}, {"h": "1. Что происходит в закрытом сосуде до и после равновесия"}, {"p": "Поместим в закрытый реактор азот и водород: `N2(г) + 3H2(г) ⇄ 2NH3(г) + Q`. В первую секунду в сосуде есть только реагенты (`N2`, `H2`), поэтому скорость прямой реакции максимальна, а скорость обратной равна нулю (аммиака ещё нет)."}, {"p": "Дальше реагенты расходуются — их концентрации падают, и скорость прямой реакции `v_пр` постепенно снижается. Одновременно накапливается `NH3` — и начинает разгоняться обратная реакция (`v_обр` растёт). В некоторый момент `t_равн` обе скорости сравниваются: сколько молекул `NH3` образуется за секунду, ровно столько же за ту же секунду распадается обратно на `N2` и `H2`."}, {"svg": "<svg viewBox='0 0 460 205' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='205' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='115' y='24' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Скорости v(t)<\/text><text x='345' y='24' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Концентрации c(t)<\/text><line x1='32' y1='168' x2='208' y2='168' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><line x1='32' y1='168' x2='32' y2='42' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><text x='20' y='52' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>v<\/text><text x='202' y='184' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>t<\/text><path d='M 35 55 Q 78 102 125 110 L 200 110' fill='none' stroke='var(--svg-blue,#60a5fa)' stroke-width='2.5'/><path d='M 35 166 Q 78 118 125 110 L 200 110' fill='none' stroke='var(--svg-gold,#e5a93c)' stroke-width='2.5'/><line x1='125' y1='45' x2='125' y2='168' stroke='var(--svg-acc,#14b8a6)' stroke-dasharray='4 3' stroke-width='1.3'/><text x='125' y='184' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-acc,#14b8a6)'>t_равн<\/text><text x='64' y='66' text-anchor='middle' font-size='12' fill='var(--svg-blue,#60a5fa)'>v_пр<\/text><text x='64' y='154' text-anchor='middle' font-size='12' fill='var(--svg-g
