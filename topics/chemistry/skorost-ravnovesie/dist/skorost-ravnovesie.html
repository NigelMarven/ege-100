old,#e5a93c)'>v_обр<\/text><text x='166' y='100' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-acc,#14b8a6)'>v_пр = v_обр<\/text><line x1='262' y1='168' x2='440' y2='168' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><line x1='262' y1='168' x2='262' y2='42' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><text x='250' y='52' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>c<\/text><text x='432' y='184' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>t<\/text><path d='M 265 56 Q 312 86 355 92 L 432 92' fill='none' stroke='var(--svg-blue,#60a5fa)' stroke-width='2.5'/><path d='M 265 166 Q 312 132 355 126 L 432 126' fill='none' stroke='var(--svg-good,#34c77b)' stroke-width='2.5'/><line x1='355' y1='45' x2='355' y2='168' stroke='var(--svg-acc,#14b8a6)' stroke-dasharray='4 3' stroke-width='1.3'/><text x='355' y='184' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-acc,#14b8a6)'>t_равн<\/text><text x='398' y='84' text-anchor='middle' font-size='12' fill='var(--svg-blue,#60a5fa)'>c_реаг = const<\/text><text x='398' y='144' text-anchor='middle' font-size='12' fill='var(--svg-good,#34c77b)'>c_прод = const<\/text><\/svg>"}, {"warn": "Две главные иллюзии о равновесии: (1) при равновесии реакции **не останавливаются** (`v_пр = v_обр > 0`, оно *динамическое*); (2) равновесные концентрации реагентов и продуктов **почти никогда не равны друг другу** (`c_реаг ≠ c_прод`) — они просто становятся **постоянными во времени** (выходят на горизонтальные полки).", "t": "Не путай равенство скоростей с равенством концентраций"}, {"h": "2. Принцип Ле Шателье: как система «сопротивляется»"}, {"p": "**[[Принцип Ле Шателье]]** звучит предельно просто: *если на систему в состоянии равновесия оказать внешнее воздействие (изменить концентрацию, температуру или давление), равновесие смещается в ту сторону, которая ослабляет оказанное воздействие.* Система ведёт себя как упрямые весы: куда ты надавил, оттуда она «убегает»."}, {"table": [["Воздействие", "Куда смещается равновесие", "Почему (логика Ле Шателье)", "Главная оговорка ЕГЭ"], ["**Добавили вещество** (увеличили `c` газа или растворённого иона/молекулы)", "В сторону, где это вещество **расходуется** (добавили реагент → вправо, к продуктам; добавили продукт → влево, к реагентам).", "Система стремится «съесть» избыток добавленного вещества.", "Добавление/удаление **твёрдого участника** гетерогенного равновесия (`CaCO3(т)`, `Fe(т)`, `C(т)`) равновесие **не смещает**!"], ["**Удалили вещество** (уменьшили `c`)", "В сторону, где это вещество **образуется** (убрали продукт → вправо; убрали реагент → влево).", "Система пытается восполнить потерю.", "Твёрдое вещество в осадке или чистый твёрдый участник — не в счёт."], ["**Повысили температуру (`T↑`)**", "В сторону **эндотермической** реакции (туда, где `−Q` / поглощается тепло).", "Система пытается «поглотить» лишнее тепло. При `T↑` ускоряются обе реакции, но эндотермическая — сильнее.", "Знак `+Q` в конце уравнения относится к **прямой** реакции! Значит, обратная имеет `−Q`."], ["**Понизили температуру (`T↓`)**", "В сторону **экзотермической** реакции (туда, где `+Q` / выделяется тепло).", "Система пытается «согреться».", "Если в уравнении дано `ΔH < 0` — это то же самое, что `+Q` (экзо); `ΔH > 0` — то же, что `−Q` (эндо)."], ["**Повысили давление (`P↑`) / уменьшили объём сосуда (`V↓`)**", "В сторону **меньшего** числа молей **газов** (`n_газ` меньше).", "Сжатие повышает давление; чтобы его сбросить, система переводит больше молекул газа в меньшее их число.", "Считай коэффициенты **ТОЛЬКО перед газами `(г)`**! Если `n_газ(слева) = n_газ(справа)` или газов нет вообще → равновесие **не смещается**."], ["**Понизили давление (`P↓`) / увеличили объём сосуда (`V↑`)**", "В сторону **большего** числа молей **газов** (`n_газ` больше).", "Система стремится «заполнить» увеличившийся объём.", "Твёрдые `(т)`, жидкие `(ж)` и растворённые `(р-р)` в подсчёт молей газов не входят."], ["**Добавили катализатор (или ингибитор)**", "**НЕ СМЕЩАЕТСЯ** (практически не смещается).", "Катализатор снижает `E_a` одинаково для прямой и обратной реакций — обе ускоряются в равное число раз.", "Катализатор лишь помогает *быстрее прийти* к равновесию, но состав равновесной смеси не меняет."]]}, {"h": "3. Словарь формулировок направлений в КИМ №22"}, {"p": "В бланке № 22 направления смещения называют по-разному. Держи в голове жёсткое соответствие:"}, {"list": ["**Вправо (`→`)** = «в сторону прямой реакции» = «в сторону образования продуктов».", "**Влево (`←`)** = «в сторону обратной реакции» = «в сторону исходных веществ».", "**Не смещается** = «практически не смещается» (именно так пишут в официальных бланках ФИПИ, поскольку слабые вторичные эффекты в школьной модели не учитываются)."]}, {"h": "4. Разбор вслух: гетерогенное равновесие с обманчивым давлением"}, {"p": "Рассмотрим классическое уравнение ЕГЭ: `3Fe(т) + 4H2O(г) ⇄ Fe3O4(т) + 4H2(г) + Q`. Как поведут себя весы равновесия при четырёх воздействиях?"}, {"steps": ["**А) Повышение давления.** Мысленно вычёркиваем твёрдые вещества (`3Fe(т)` и `Fe3O4(т)`). Считаем только газы: слева `4` моль `H2O(г)`, справа `4` моль `H2(г)`. Объёмы газов равны (`4 = 4`), значит равновесие **практически не смещается**.", "**Б) Добавление порошка железа `Fe(т)`.** Железо — твёрдый участник гетерогенного равновесия (его концентрация постоянна). Значит равновесие **практически не смещается** (хотя измельчение ускорило бы подход к равновесию).", "**В) Нагревание (`T↑`).** Прямая реакция имеет `+Q` (экзотермическая), значит обратная — эндотермическая (`−Q`). При нагревании равновесие смещается к эндотермической реакции — **влево (в сторону обратной реакции)**.", "**Г) Увеличение концентрации водяного пара `H2O(г)`.** Водяной пар — газообразный реагент (стоит слева). Система стремится израсходовать его избыток → равновесие смещается **вправо (в сторону прямой реакции)**."]}, {"h4": "Второй быстрый разбор: синтез аммиака `N2(г) + 3H2(г) ⇄ 2NH3(г) + Q`"}, {"steps": ["**Повышение давления (`P↑`):** слева `1 + 3 = 4` моль газа, справа `2` моль газа → сдвиг в сторону меньшего числа молей газов (**вправо**, к `NH3`).", "**Повышение температуры (`T↑`):** прямая реакция экзотермическая (`+Q`), обратная — эндотермическая (`−Q`) → сдвиг к эндотермической (**влево**, к разложению `NH3`).", "**Отвод (удаление) аммиака из реактора:** уменьшаем концентрацию продукта → система восполняет потерю (**вправо**).", "**Добавление железного катализатора (`Fe`):** ускоряет и прямую, и обратную реакции в равное число раз → равновесие **практически не смещается**."]}, {"bridge": {"kim": "№ 22 КИМ (2 балла, порядок цифр важен, цифры могут повторяться)", "ask": "Установить соответствие между четырьмя воздействиями (А–Г) и направлением смещения равновесия (1 — прямая, 2 — обратная, 3 — практически не смещается).", "watch": "Подсчёт твёрдых веществ в сумме газов при давлении; путаница `+Q` и `−Q` (нагревание всегда идёт туда, где `−Q`); попытка сместить равновесие катализатором или твёрдым участником (`CaCO3(т)`, `Fe(т)`, `C(т)`).", "tip": "Перед решением № 22 обведи в уравнении кружком только формулы с индексом `(г)` и сразу подпиши над стрелкой: `→ (+Q)` и `← (−Q)` (или наоборот)."}}], "short": [{"list": ["При химическом равновесии `v_пр = v_обр > 0`, а концентрации всех веществ постоянны (но не обязаны быть равными).", "По принципу Ле Шателье равновесие смещается так, чтобы ослабить внешнее воздействие.", "Нагревание всегда смещает равновесие в сторону эндотермической реакции (`−Q` / `ΔH > 0`), охлаждение — в сторону экзотермической (`+Q` / `ΔH < 0`).", "Повышение давления (сжатие объёма) смещает равновесие в сторону меньшего числа молей газов; твёрдые и жидкие вещества в расчёт `Δn_газ` не входят.", "Катализатор и изменение количества твёрдого участника гетерогенного равновесия положение равновесия не смещают."]}]}, {"id": "07", "group": "Химическое равновесие (№22)", "nav": "Ионные равновесия и скрытые ловушки №22", "codes": ["1.8"], "eyebrow": "07 · Код 1.8 · Задание 22", "title": "Ионные равновесия в растворе, скрытые воздействия и разбор ДЕМО-2027", "lead": "Почему добавление твёрдого карбоната кальция равновесие не смещает, а добавление твёрдого хлорида цинка в ДЕМО-2027 смещает его вправо? И что делает с равновесием обычная вода?", "b": [{"key": "В водных растворах воздействия часто «замаскированы»: добавленная соль распадается на ионы (увеличивая концентрацию одного из участников), а кислота или щёлочь связывает ионы равновесия в воду, осадок или газ (уменьшая их концентрацию). Всегда переводи добавку на язык ионов!", "t": "Главная мысль."}, {"h": "1. Главная ловушка №22: «твёрдый участник» vs «твёрдая растворимая соль»"}, {"p": "Ученики часто зубрят упрощённую фразу «твёрдое вещество не влияет на равновесие» — и теряют 1–2 балла на заданиях вроде ДЕМО-2027! Раздели два совершенно разных случая:"}, {"compare": {"t": "Когда твёрдое вещество НЕ смещает равновесие, а когда СМЕЩАЕТ", "left": {"title": "Твёрдый участник гетерогенного равновесия → НЕ смещает", "items": ["Примеры: `CaCO3(т) ⇄ CaO(т) + CO2(г)`, `3Fe(т) + 4H2O(г) ⇄ Fe3O4(т) + 4H2(г)`, `C(т) + CO2(г) ⇄ 2CO(г)`.", "Если добавили кусок `CaCO3(т)` или `Fe(т)` — он остаётся отдельной твёрдой фазой. Его концентрация не меняется.", "Вывод: равновесие **практически не смещается**."]}, "right": {"title": "Твёрдая РАСТВОРИМАЯ соль/щёлочь в водный раствор → СМЕЩАЕТ!", "items": ["Примеры: добавили твёрдый `ZnCl2`, твёрдый `NaOH`, твёрдый `Na2CO3` или `CH3COONa` в водный раствор.", "В воде эта соль немедленно **растворяется и диссоциирует** на ионы (`ZnCl2 → Zn^{2+} + 2Cl^{−}`), реально увеличивая концентрацию ионов в растворе!", "Вывод: равновесие **смещается** по общему правилу концентрации (либо из-за связывания ионов в осадок/воду/газ)."]}}}, {"h": "2. Карта скрытых воздействий в водных растворах"}, {"p": "В задании № 22 редко пишут прямо «уменьшили концентрацию ионов `OH^{−}`». Вместо этого пишут: «добавили `HClO4`» или «добавили `Na2CO3`». Вот таблица главных химических «масок»:"}, {"table": [["Что добавили в раствор", "Какие ионы появились", "Как это бьёт по равновесию", "Пример"], ["**Сильная кислота** (`HCl`, `HNO3`, `H2SO4`, `HClO4`)", "Много `H^{+}`", "Увеличивает `[H^{+}]` И **связывает `OH^{−}`** в воду (`H^{+} + OH^{−} → H2O`) или слабую кислоту (`H^{+} + CH3COO^{−} → CH3COOH`).", "В равновесии `2CrO4^{2−} + 2H^{+} ⇄ Cr2O7^{2−} + H2O` добавление кислоты смещает вправо (раствор становится оранжевым)."], ["**Щёлочь** (`NaOH`, `KOH`, `Ba(OH)2`)", "Много `OH^{−}`", "Увеличивает `[OH^{−}]` И **связывает `H^{+}`** в воду, а катионы металлов (`Fe^{3+}`, `Cu^{2+}`, `Mg^{2+}`) — в нерастворимые гидроксиды.", "В диссоциации `CH3COOH ⇄ CH3COO^{−} + H^{+}` добавление `NaOH` связывает `H^{+}` → равновесие смещается **вправо**."], ["**Растворимая соль с общим ионом**", "Общий катион или анион", "Увеличивает концентрацию этого иона → сдвиг в сторону, где он **расходуется**.", "В `Fe^{3+} + 3SCN^{−} ⇄ Fe(SCN)3` добавление `FeCl3` или `KSCN` сдвигает вправо (усиление кроваво-красного цвета)."], ["**Соль, дающая осадок с участником**", "Например, `AgNO3`, `BaCl2`, `Na2CO3`", "**Выводит** участника равновесия в осадок → сдвиг в сторону образования этого иона.", "Добавление `Na2CO3` к равновесию с `Ca^{2+}` связывает `Ca^{2+}` в осадок `CaCO3↓`."], ["**Соль аммония** (`NH4Cl`, `(NH4)2SO4`)", "`NH4^{+}`", "**Связывает `OH^{−}`** в слабое основание (`NH4^{+} + OH^{−} ⇄ NH3·H2O`), снижая `[OH^{−}]`!", "В гидролизе `CO3^{2−} + H2O ⇄ HCO3^{−} + OH^{−}` добавление твёрдого `NH4Cl` связывает `OH^{−}` → сдвиг **вправо**."], ["**Нейтральная соль без общих ионов** (`NaCl`, `KNO3` в растворе без `Na^{+}`, `Cl^{−}`, `K^{+}`, `NO3^{−}`)", "Только ионы-зрители", "Не вступает в реакцию с участниками и не даёт общих ионов.", "В школьной модели ЕГЭ равновесие **практически не смещается**."]]}, {"h": "3. Особые случаи: разбавление водой, гидролиз и инертный газ"}, {"list": ["**Добавление воды (разбавление раствора):** разбавление всегда смещает равновесие в сторону **большего числа растворённых частиц**. В диссоциации `CH3COOH(р-р) ⇄ CH3COO^{−}(р-р) + H^{+}(р-р)` (1 → 2 частицы) и гидролизе `CO3^{2−}(р-р) + H2O(ж) ⇄ HCO3^{−}(р-р) + OH^{−}(р-р)` (1 → 2 иона + `H2O` слева) равновесие смещается **вправо**. А вот в комплексообразовании `Zn^{2+}(р-р) + 4OH^{−}(р-р) ⇄ [Zn(OH)4]^{2−}(р-р)` (слева 5 частиц, справа 1) или `Fe^{3+} + 3SCN^{−} ⇄ Fe(SCN)3` (слева 4, справа 1) разбавление водой смещает равновесие **влево**!", "**Нагревание при гидролизе солей:** обратимый гидролиз соли (`CO3^{2−}(р-р) + H2O(ж) ⇄ HCO3^{−}(р-р) + OH^{−}(р-р) − Q`) — процесс, обратный экзотермической нейтрализации, поэтому он **эндотермический (`−Q`)**. При **нагревании** гидролиз всегда **усиливается** (равновесие смещается вправо)!", "**Добавление инертного газа (He, Ne, Ar):** на ЕГЭ по умолчанию реактор имеет **постоянный объём (`V = const`)**. Если в закрытый сосуд постоянного объёма закачать инертный газ, парциальные концентрации реагентов и продуктов не изменятся → равновесие **практически не смещается**. *(За рамками базового ЕГЭ: если бы газ добавляли при постоянном давлении `P = const`, сосуд расширился бы, концентрации упали, и равновесие сместилось бы в сторону большего числа молей газов.)*"]}, {"h": "4. Интерактивное дерево анализа воздействий в растворе (№22)"}, {"tree": {"t": "Как разобрать добавку вещества в ионном равновесии (КИМ №22)", "root": {"q": "Вещество растворимо в воде (проверь по таблице растворимости ФИПИ)?", "yes": {"q": "Есть ли среди его ионов общий ион с уравнением равновесия?", "yes": {"a": "Растёт концентрация этого иона → сдвиг в сторону, где он расходуется.", "why": "Например, твёрдый ZnCl2 в воде даёт Zn^{2+} и смещает равновесие в сторону расхода Zn^{2+}."}, "no": {"q": "Вступает ли один из его ионов в реакцию с участником равновесия (вода, осадок, газ, слабая кислота или слабое основание NH3·H2O)?", "yes": {"a": "Концентрация связанного участника ПАДАЕТ → сдвиг в сторону его образования.", "why": "Например, HClO4 даёт H^{+}, который связывает OH^{−} в воду H2O — концентрация OH^{−} падает."}, "no": {"a": "Равновесие практически не смещается.", "why": "Ионы добавки являются зрителями (исключение — если добавили большой объём воды, см. разбавление)."}}}, "no": {"a": "Нерастворимое твёрдое вещество (или твёрдый участник) равновесие не смещает.", "why": "Оно не переходит в раствор в заметном количестве (если только не реагирует с кислотой/щёлочью из равновесия)."}}}}, {"h": "5. Полный разбор реального задания №22 из Демоверсии ЕГЭ-2027"}, {"p": "Условие ДЕМО-2027: установите соответствие между способом воздействия на равновесную систему:"}, {"eq": "Zn^{2+}(р-р) + 4OH^{−}(р-р) ⇄ [Zn(OH)4]^{2−}(р-р) + Q"}, {"p": "и смещением равновесия (`1` — в сторону прямой реакции, `2` — в сторону обратной реакции, `3` — практически не смещается):\nА) добавление твёрдого `ZnCl2`; Б) повышение давления; В) понижение температуры; Г) добавление `HClO4`."}, {"steps": ["**А) Добавление твёрдого `ZnCl2`.** Не попадайся на слово «твёрдого»! По таблице растворимости `ZnCl2` — **растворимая** соль (`Р`). Попадая в раствор, она полностью диссоциирует: `ZnCl2 → Zn^{2+} + 2Cl^{−}`. Концентрация реагента `Zn^{2+}` **растёт** → равновесие смещается **в сторону прямой реакции** → **А = 1**.", "**Б) Повышение давления.** Смотрим фазы в уравнении: `(р-р)`, `(р-р)`, `(р-р)`. **Газов нет вообще!** Давление на растворы не влияет → **практически не смещается** → **Б = 3**.", "**В) Понижение температуры.** В правой части стоит `+Q`, значит прямая реакция экзотермическая. При охлаждении система «греется» — смещается в сторону экзотермической (**прямой**) реакции → **В = 1**.", "**Г) Добавление `HClO4`.** Хлорная кислота `HClO4` — **сильная** кислота (`HClO4 → H^{+} + ClO4^{−}`). Ионы `H^{+}` мгновенно связывают реагент `OH^{−}` в воду (`H^{+} + OH^{−} → H2O`). Концентрация `OH^{−}` слева **падает** → система пытается восполнить потерю и смещается **в сторону обратной реакции** → **Г = 2**.", "**Проверка ответа:** `1312` — полностью совпадает с эталоном ФИПИ!"]}, {"bridge": {"kim": "№ 22 КИМ (2 балла; 1 ошибка = 1 балл, 2 ошибки = 0 баллов)", "ask": "Определить смещение равновесия в ионном уравнении раствора при добавлении твёрдых солей, сильных кислот/щелочей, воды, изменении T и P.", "watch": "Слова «добавление твёрдого `ZnCl2` / `NaOH` / `Na2CO3`» — это НЕ инертный твёрдый участник, а источник ионов в растворе! Хлорная кислота `HClO4` — сильная кислота, связывающая `OH^{−}`. В ионных реакциях без газов давление никогда не смещает равновесие.", "tip": "Для каждой химической добавки в № 22 распиши её диссоциацию на ионы и спроси: «этот ион уже есть в уравнении или он с кем-то из уравнения реагирует?»."}}], "short": [{"list": ["Твёрдый участник гетерогенного равновесия (`CaCO3(т)`, `Fe(т)`) равновесие не смещает; твёрдая растворимая соль/щёлочь (`ZnCl2`, `NaOH`) в водном растворе диссоциирует и смещает равновесие.", "Сильные кислоты (`HCl`, `HNO3`, `H2SO4`, `HClO4`) увеличивают `[H^{+}]` и связывают `OH^{−}` в воду; щёлочи увеличивают `[OH^{−}]` и связывают `H^{+}`.", "Разбавление водой смещает равновесие в сторону большего числа растворённых частиц: в диссоциации и гидролизе — вправо, а в `Zn^{2+} + 4OH^{−} ⇄ [Zn(OH)4]^{2−}` (5 → 1) — влево.", "Обратимый гидролиз солей — эндотермический процесс (`−Q`), поэтому при нагревании он усиливается.", "Добавление инертного газа при постоянном объёме сосуда (`V = const`) равновесие не смещает."]}]}, {"id": "08", "group": "Расчёты равновесия (№23)", "nav": "Таблица И–И–Р и все типы КИМ №23", "codes": ["1.8"], "eyebrow": "08 · Код 1.8 (+ 5.1, 5.7) · Задание 23", "title": "Расчётная таблица И–И–Р и безошибочное решение КИМ №23", "lead": "Как за две минуты без путаницы в знаках найти неизвестные исходные и равновесные концентрации — даже если объём реактора равен 5 литров, а продукт уже был в сосуде с самого старта?", "b": [{"key": "Любую задачу № 23 решает одна таблица из трёх строк: Исходно — Изменение (Δc) — Равновесно (И–И–Р). Строка Δc строго пропорциональна стехиометрическим коэффициентам уравнения: у реагентов Δc вычитается, у продуктов (при прямой реакции) — прибавляется.", "t": "Главная мысль."}, {"h": "1. Единственная формула, которая нужна до таблицы"}, {"p": "В реакторе **постоянного объёма (`V = const`)** количество вещества `n` (моль) и **[[молярная концентрация]]** `c` (моль/л) связаны простой формулой:"}, {"eq": "c = n / V    ⇔    n = c · V"}, {"p": "Почему таблица работает прямо с концентрациями? Потому что при неизменном объёме `V` изменения концентраций `Δc = Δn / V` относятся друг к другу **точно так же**, как изменения количеств вещества `Δn` — то есть строго по **[[стехиометрические коэффициенты|стехиометрическим коэффициентам]]** уравнения реакции!"}, {"svg": "<svg viewBox='0 0 460 220' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='220' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Логика таблицы И–И–Р для реакции aA + bB ⇄ dD<\/text><rect x='20' y='40' width='125' height='40' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='82' y='57' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-blue,#60a5fa)'>a · A (реагент)<\/text><text x='82' y='73' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Δc = −a · x<\/text><rect x='167' y='40' width='125' height='40' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='230' y='57' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-blue,#60a5fa)'>b · B (реагент)<\/text><text x='230' y='73' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Δc = −b · x<\/text><rect x='315' y='40' width='125' height='40' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><text x='377' y='57' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-good,#34c77b)'>d · D (продукт)<\/text><text x='377' y='73' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Δc = +d · x<\/text><line x1='82' y1='80' x2='82' y2='106' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><line x1='230' y1='80' x2='230' y2='106' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><line x1='377' y1='80' x2='377' y2='106' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><rect x='20' y='108' width='255' height='62' rx='8' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='1.5'/><text x='147' y='126' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Реагенты расходуются<\/text><text x='147' y='144' text-anchor='middle' font-size='12' fill='var(--svg-gold,#e5a93c)'>c_равн = c_исх − |Δc|<\/text><text x='147' y='162' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>c_исх = c_равн + |Δc|<\/text><rect x='290' y='108' width='150' height='62' rx='8' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><text x='365' y='126' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Продукты растут<\/text><text x='365' y='148' text-anchor='middle' font-size='12' fill='var(--svg-good,#34c77b)'>c_равн = c_исх + |Δc|<\/text><text x='230' y='198' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Один шаг x связывает ВСЕ столбцы таблицы<\/text><\/svg>"}, {"h": "2. Пошаговый алгоритм И–И–Р (4 действия)"}, {"ol": ["**Проверь единицы:** если даны концентрации (`моль/л`) — сразу пиши их в таблицу. Если даны **количества вещества (`моль`)** и **объём реактора `V ≠ 1 л`** — сначала раздели каждое `n` на `V` (`c = n / V`), либо веди всю таблицу в молях, а в самом конце раздели на `V` (если ищут концентрацию).", "**Заполни стартовые нули:** если в условии сказано «в реактор поместили A и B» и про продукт D ничего не сказано, значит `c_исх(D) = 0`.", "**Найди «якорный» столбец** (вещество, у которого известны и `c_исх`, и `c_равн`) и вычисли его изменение `Δc` и «один шаг» `x = |Δc| / коэффициент`.", "**Заполни всю строку Δc через коэффициенты** (реагентам — знак `−`, продуктам — знак `+`, если реакция пошла вправо) и вычисли `X` и `Y` по столбцам."]}, {"h": "3. Разбор реального задания №23 из Демоверсии ЕГЭ-2027"}, {"p": "Условие ДЕМО-2027: в реактор постоянного объёма поместили оксид углерода(II) и водород (концентрация `H2` составляла `1,2 моль/л`). Установилось равновесие:"}, {"eq": "2CO(г) + 4H2(г) ⇄ CH3OCH3(г) + H2O(г)"}, {"p": "Равновесные концентрации `CO` и диметилового эфира `CH3OCH3` составили по `0,2 моль/л`. Найдите **исходную концентрацию `CO` (`X`)** и **равновесную концентрацию `H2` (`Y`)**. Варианты: `1)` 0,1; `2)` 0,2; `3)` 0,3; `4)` 0,4; `5)` 0,5; `6)` 0,6 моль/л."}, {"table": [["Строка (моль/л)", "`2 CO`", "`4 H2`", "`1 CH3OCH3`", "`1 H2O`"], ["**Исходно (`c_исх`)**", "**`X`** (`0,2 + 0,4 = 0,6`)", "`1,2`", "`0` (не помещали)", "`0`"], ["**Изменение (`Δc`)**", "`−2 · 0,2 = −0,4`", "`−4 · 0,2 = −0,8`", "`+0,2` (якорь!)", "`+0,2`"], ["**Равновесно (`c_равн`)**", "`0,2`", "**`Y`** (`1,2 − 0,8 = 0,4`)", "`0,2`", "`0,2`"]]}, {"steps": ["**Якорный столбец — `CH3OCH3`:** исходно его не было (`0`), в равновесии стало `0,2 моль/л`. Значит образовалось `Δc(CH3OCH3) = +0,2 моль/л`. Коэффициент перед ним равен `1`, поэтому шаг реакции `x = 0,2 моль/л`.", "**Переносим `x = 0,2` на реагенты:** перед `CO` стоит коэффициент `2` → прореагировало `2 · 0,2 = 0,4 моль/л` (`Δc = −0,4`). Перед `H2` стоит коэффициент `4` → прореагировало `4 · 0,2 = 0,8 моль/л` (`Δc = −0,8`).", "**Находим `X` (исходную концентрацию `CO`):** `CO` — реагент, он расходовался, поэтому исходно его было **больше**, чем осталось в равновесии: `X = 0,2 + 0,4 = 0,6 моль/л` → это вариант **6**.", "**Находим `Y` (равновесную концентрацию `H2`):** из исходных `1,2 моль/л` израсходовалось `0,8 моль/л`: `Y = 1,2 − 0,8 = 0,4 моль/л` → это вариант **4**.", "**Проверка ответа:** записываем номера вариантов в порядке `X`, `Y` → **`64`**. (Обратная проверка: из `0,6` `CO` и `1,2` `H2` ушло `0,4` и `0,8` в соотношении `2:4`, осталось `0,2` и `0,4`, образовалось `0,2` эфира — всё сходится!)"]}, {"h": "4. Усложнённые типы №23 на 95–100 баллов"}, {"p": "Кроме базового типа из ДЕМО-2027, в реальных вариантах ЕГЭ встречаются три усложнения. Разберём каждое на числах."}, {"h4": "Тип А: даны количества вещества (моль), объём реактора V ≠ 1 л и продукт уже был на старте"}, {"p": "**Задача:** в реактор объёмом `5 л` поместили `3 моль` `N2`, `7,5 моль` `H2` и `1 моль` `NH3`. После установления равновесия `N2(г) + 3H2(г) ⇄ 2NH3(г)` равновесная концентрация `NH3` составила `0,6 моль/л`. Найдите равновесные концентрации `N2` и `H2`."}, {"steps": ["**Переводим моли в концентрации (`c = n / 5`):** `c_исх(N2) = 3 / 5 = 0,6 моль/л`; `c_исх(H2) = 7,5 / 5 = 1,5 моль/л`; `c_исх(NH3) = 1 / 5 = 0,2 моль/л` (не ноль!).", "**Определяем направление сдвига по якорю `NH3`:** было `0,2`, стало `0,6 моль/л` — концентрация продукта **выросла** на `+0,4 моль/л`! Значит, преобладала прямая реакция (`→`). *(Если бы концентрация `NH3` упала, например с `0,6` до `0,2`, реакция пошла бы влево, и знаки в строке `Δc` поменялись бы на противоположные: `+` слева, `−` справа!)*", "**Находим шаг `x`:** перед `NH3` коэффициент `2`, значит `x = 0,4 / 2 = 0,2 моль/л`.", "**Считаем реагенты:** `Δc(N2) = −1 · 0,2 = −0,2` → `c_равн(N2) = 0,6 − 0,2 = 0,4 моль/л`; `Δc(H2) = −3 · 0,2 = −0,6` → `c_равн(H2) = 1,5 − 0,6 = 0,9 моль/л`."]}, {"h4": "Тип Б: задана доля (процент) прореагировавшего вещества"}, {"p": "**Задача:** в реакторе постоянного объёма смешали `SO2` (`0,8 моль/л`) и `O2` (`0,5 моль/л`). К моменту установления равновесия `2SO2(г) + O2(г) ⇄ 2SO3(г)` прореагировало `25 %` исходного `SO2`. Найдите равновесные концентрации `O2` и `SO3`."}, {"steps": ["**Находим `Δc(SO2)` напрямую из процента:** `25 %` от `0,8 моль/л` — это `0,8 · 0,25 = 0,2 моль/л`. Так как `SO2` — реагент, `Δc(SO2) = −0,2 моль/л`.", "**Находим шаг `x`:** коэффициент перед `SO2` равен `2`, значит `x = 0,2 / 2 = 0,1 моль/л`.", "**Считаем искомые концентрации:** `Δc(O2) = −1 · 0,1 = −0,1` → `c_равн(O2) = 0,5 − 0,1 = 0,4 моль/л`; `Δc(SO3) = +2 · 0,1 = +0,2` → `c_равн(SO3) = 0 + 0,2 = 0,2 моль/л`. *(Обратная проверка для сложных вариантов: если сказано, что прореагировало `40 %` реагента, значит его равновесная концентрация составляет `100 % − 40 % = 60 %` от исходной!)*"]}, {"h4": "Тип В: нет готового «якорного» столбца (задача с соотношением через x)"}, {"p": "**Задача:** в реактор постоянного объёма поместили `CO` (`0,8 моль/л`) и `H2O(г)` (`0,8 моль/л`). После установления равновесия `CO(г) + H2O(г) ⇄ CO2(г) + H2(г)` равновесная концентрация `CO` оказалась в `3` раза больше равновесной концентрации `CO2`. Найдите равновесные концентрации `H2O` и `H2`."}, {"steps": ["**Вводим неизвестный шаг реакции `x`:** все коэффициенты равны `1`, значит `Δc(CO) = −x`, `Δc(H2O) = −x`, `Δc(CO2) = +x`, `Δc(H2) = +x`.", "**Выражаем равновесные концентрации через `x`:** `c_равн(CO) = 0,8 − x`, `c_равн(CO2) = 0 + x = x`.", "**Составляем уравнение по условию:** `c_равн(CO) = 3 · c_равн(CO2)` → `0,8 − x = 3x` → `4x = 0,8` → `x = 0,2 моль/л`.", "**Находим ответ:** `c_равн(H2O) = 0,8 − 0,2 = 0,6 моль/л`; `c_равн(H2) = 0 + 0,2 = 0,2 моль/л`."]}, {"warn": "Четыре самые частые ошибки, на которых теряют балл в задании № 23:\n1. **Подставили моли вместо моль/л** при объёме реактора `V = 2, 5, 10 л`.\n2. **Перепутали `X` и `Y` при переносе в бланк** — в № 23 порядок цифр строго важен (и цифры могут повторяться!).\n3. **Подставили в пропорцию по коэффициентам `c_равн` реагента вместо `|Δc|`** — стехиометрия связывает **только строку изменений `Δc`**, а не остатки реагентов.\n4. **Забыли, что для реагента `c_исх > c_равн`** (при прямой реакции `c_исх = c_равн + |Δc|`). И помни: если в уравнении есть твёрдое вещество, в таблицу газовых концентраций его не включают.", "t": "Как не потерять лёгкие 2 балла в №23"}, {"bridge": {"kim": "№ 23 КИМ (2 балла; 1 ошибка = 1 балл, цифры могут повторяться)", "ask": "По таблице или тексту задачи найти две величины (`X` и `Y` — исходные или равновесные концентрации / количества веществ) и выбрать их номера из списка `1–6`.", "watch": "Объём реактора `V ≠ 1 л` (проверяй единицы: «моль» или «моль/л»!), ненулевая исходная концентрация продукта, обратное направление сдвига, перепутанные местами `X` и `Y`.", "tip": "Всегда рисуй на черновике мини-таблицу И–И–Р с коэффициентами в шапке столбцов и делай быструю проверку: у реагентов при прямой реакции верхнее число всегда больше нижнего."}}], "short": [{"list": ["В реакторе постоянного объёма (`V = const`) изменения концентраций `Δc` строго пропорциональны стехиометрическим коэффициентам уравнения.", "Если даны моли и объём `V ≠ 1 л`, обязательно переведи их в концентрации по формуле `c = n / V` до заполнения таблицы И–И–Р.", "Если в условии не сказано, что продукт поместили в реактор изначально, его `c_исх = 0`; если поместили — сравни `c_исх` и `c_равн`, чтобы понять направление сдвига.", "При прямой реакции: для реагентов `c_равн = c_исх − |Δc|` (и `c_исх = c_равн + |Δc|`), для продуктов `c_равн = c_исх + |Δc|`.", "В бланк № 23 записывай номера выбранных ответов строго в порядке `X`, затем `Y` (цифры могут повторяться)."]}]}], "gloss": [["Закон сохранения массы веществ", "Общая масса веществ, вступивших в химическую реакцию, всегда равна общей массе образовавшихся продуктов, поскольку атомы при реакции не исчезают и не возникают из ничего.", "В реакции 2Fe + 3Cl2 → 2FeCl3 слева и справа ровно по 2 атома Fe и 6 атомов Cl."], ["Окислительно-восстановительная реакция", "Химическая реакция, в ходе которой изменяются степени окисления хотя бы одного элемента за счёт переноса электронов от восстановителя к окислителю.", "Fe + CuSO4 → FeSO4 + Cu↓ (железо окисляется с 0 до +2, медь восстанавливается с +2 до 0)."], ["Тепловой эффект реакции", "Количество теплоты Q, которое выделяется (+Q, экзотермическая реакция, ΔH < 0) или поглощается (−Q, эндотермическая реакция, ΔH > 0) в ходе химической реакции.", "N2 + O2 ⇄ 2NO − Q (эндотермическая); Na2O + H2O → 2NaOH + Q (экзотермическая)."], ["Катализатор", "Вещество, которое ускоряет химическую реакцию за счёт снижения энергии активации E_a, но в итоге не расходуется, не входит в состав продуктов и не смещает химическое равновесие.", "V2O5 в окислении SO2 до SO3; MnO2 при разложении H2O2; Fe в синтезе аммиака."], ["Обратимая реакция", "Химическая реакция, которая при одних и тех же условиях протекает одновременно в двух противоположных направлениях — прямом и обратном (знак ⇄).", "N2(г) + 3H2(г) ⇄ 2NH3(г) + Q; CH3COOH + C2H5OH ⇄ CH3COOC2H5 + H2O."], ["Энергия активации", "Минимальный избыток энергии (по сравнению со средней энергией исходных частиц), которым должны обладать сталкивающиеся молекулы для разрыва старых связей и начала реакции.", "Катализатор снижает E_a, открывая обходной путь реакции, поэтому доля активных столкновений резко растёт."], ["Правило Вант-Гоффа", "Эмпирическое правило кинетики: при повышении температуры на каждые 10 °C скорость большинства химических реакций возрастает в γ раз (обычно γ = 2…4): v2 / v1 = γ^{(T2 − T1)/10}.", "При γ = 2 нагревание на 30 °C ускоряет реакцию в 2³ = 8 раз."], ["Принцип Ле Шателье", "Если на систему в состоянии химического равновесия оказать внешнее воздействие (изменить температуру, давление или концентрацию), равновесие смещается в направлении, ослабляющем это воздействие.", "При нагревании экзотермической реакции (+Q) равновесие смещается влево — в сторону поглощения тепла."], ["Гидролиз", "Обменное взаимодействие вещества (соли, бинарного соединения, сложного эфира) с водой. Обратимый гидролиз солей — эндотермический процесс (−Q), который усиливается при нагревании и разбавлении.", "CO3^{2−} + H2O ⇄ HCO3^{−} + OH^{−} − Q (обратимый); Al2S3 + 6H2O → 2Al(OH)3↓ + 3H2S↑ (необратимый)."], ["Молярная концентрация", "Отношение количества растворённого или газообразного вещества n (моль) к объёму раствора или реактора V (л): c = n / V (единица измерения — моль/л).", "Если в реакторе объёмом 5 л находится 3 моль N2, его концентрация равна 3 / 5 = 0,6 моль/л."], ["Стехиометрические коэффициенты", "Числа перед формулами в уравнении реакции, показывающие соотношение количеств прореагировавших и образовавшихся веществ (и их изменений концентрации Δc при V = const).", "В 2CO + 4H2 ⇄ CH3OCH3 + H2O образование 0,2 моль/л эфира требует расхода 0,4 моль/л CO и 0,8 моль/л H2."]], "_img": {}}</script>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const THEME_KEY='ege100-theme';
let T=null, S=null, FIGS={}, IMG={}, CHEM=false, RUS=false;

const THEMES=['auto','light','paper','dark'];
const THEME_LABELS={auto:'◐ Авто',light:'☀ Светлая',paper:'▤ Бумага',dark:'☾ Тёмная'};
function applyTheme(){
  const raw=LS.get(THEME_KEY,'auto');
  const t=THEMES.includes(raw)?raw:'auto';
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  $$('[data-theme-btn]').forEach(b=>{
    b.textContent=THEME_LABELS[t];
    b.title='Переключить тему оформления (Авто → Светлая → Бумага → Тёмная)';
  });
}
function toggleTheme(){
  const raw=LS.get(THEME_KEY,'auto');
  const i=THEMES.indexOf(raw);
  LS.set(THEME_KEY,THEMES[(i+1)%THEMES.length]);
  applyTheme();
}

const SUB='₀₁₂₃₄₅₆₇₈₉', SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻'};
function fmt(s, forceChem){
  if(s==null)return '';
  let h=esc(s);
  h=h.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,(m,t,l)=>'<button type="button" class="glink" data-term="'+esc(t)+'">'+(l||t)+'</button>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(«—])\*(?!\s)([^*]+?)\*(?=[\s,.;:!?)»—]|$)/g,'$1<em>$2</em>');
  h=h.replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>');
  h=h.replace(/`([^`\n]+?)`/g,'<code>$1</code>');
  // Русская разметка
  h=h.replace(/\{~([^}]+)\}/g,'<span class="ru-stress">$1\u0301</span>');
  h=h.replace(/\{!:([^}]*)\}/g,'<span class="ru-ortho">$1</span>');
  h=h.replace(/\{\((\d+)\)\}/g,'<span class="ru-pos">$1</span>');
  h=h.replace(/\{п:([^}]+)\}/g,'<span class="ru-m ru-p">$1</span>');
  h=h.replace(/\{к:([^}]+)\}/g,'<span class="ru-m ru-k">$1</span>');
  h=h.replace(/\{с:([^}]+)\}/g,'<span class="ru-m ru-s">$1</span>');
  h=h.replace(/\{о:([^}]+)\}/g,'<span class="ru-m ru-o">$1</span>');
  h=h.replace(/\{подл:([^}]+)\}/g,'<span class="ru-syn ru-podl">$1</span>');
  h=h.replace(/\{сказ:([^}]+)\}/g,'<span class="ru-syn ru-skaz">$1</span>');
  h=h.replace(/\{опр:([^}]+)\}/g,'<span class="ru-syn ru-opr">$1</span>');
  h=h.replace(/\{обст:([^}]+)\}/g,'<span class="ru-syn ru-obst">$1</span>');
  h=h.replace(/\{ввод:([^}]+)\}/g,'<span class="ru-vvod">$1</span>');
  if(CHEM || forceChem){
    h=h.split(/(<[^>]+>)/).map(p=>p[0]==='<'?p:p.replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')).join('');
  }
  return h.replace(/\n/g,'<br>');
}
function plain(s){
  return String(s==null?'':s)
    .replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,(m,t,l)=>l||t)
    .replace(/\*\*/g,'').replace(/\{[пксо!~]:([^}]*)\}/g,'$1').replace(/\{~([^}]+)\}/g,'$1')
    .replace(/\{(?:подл|сказ|опр|обст|ввод):([^}]+)\}/g,'$1').replace(/\{\((\d+)\)\}/g,'($1)')
    .replace(/`([^`\n]+?)`/g,'$1')
    .replace(/\^\{([^}]*)\}/g,(m,x)=>[...x].map(c=>SUP[c]||c).join('')).replace(/_\{([^}]*)\}/g,'$1');
}
const lines=v=>Array.isArray(v)?v:String(v==null?'':v).split('\n');
const body=v=>v==null?'':Array.isArray(v)?blocks(v):'<p>'+fmt(v)+'</p>';
const inl=v=>v==null?'':Array.isArray(v)?blocks(v):fmt(v);

function cleanSvg(src){
  try{
    const d=new DOMParser().parseFromString(String(src),'image/svg+xml');
    const svg=d.documentElement;
    if(!svg||svg.nodeName.toLowerCase()!=='svg')return '';
    svg.querySelectorAll('script,foreignObject').forEach(n=>n.remove());
    svg.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{
      if(/^on/i.test(a.name)||/javascript:/i.test(a.value))n.removeAttribute(a.name);
    }));
    return new XMLSerializer().serializeToString(svg);
  }catch(e){return '';}
}
function card(c){
  if(typeof c==='string')return '<div class="panel">'+body(c)+'</div>';
  return '<div class="panel">'+(c.tag?'<div class="eyebrow">'+fmt(c.tag)+'</div>':'')+(c.t?'<h3>'+fmt(c.t)+'</h3>':'')+(c.x?body(c.x):'')+(c.eq?R.eq(c.eq,{sm:1}):'')+(c.x2?body(c.x2):'')+(c.b?blocks(c.b):'')+(c.chip?'<span class="chip">'+fmt(c.chip)+'</span>':'')+'</div>';
}
const box=k=>(v,b)=>'<div class="panel '+k+'">'+(b.t?'<strong>'+fmt(b.t)+'</strong> ':'')+inl(v)+'</div>';

let TREE_ID=0;
function renderTreeStatic(node){
  if(!node)return '';
  if(node.a!=null)return '<div class="tree-ans"><strong>Вывод:</strong> '+fmt(node.a)+(node.why?'<div class="small" style="margin-top:4px">'+fmt(node.why)+'</div>':'')+'</div>';
  return '<div class="tree-step"><div class="tree-q">'+fmt(node.q)+'</div><ul>'

}
function renderCompare(c){
  if(c.rows&&c.cols){

  }
  const side=(s)=>s?'<div class="cmp-card"><h4>'+fmt(s.title||'')+'</h4>'+(Array.isArray(s.items)?R.list(s.items):body(s.b||s.text||''))+'</div>':'';
  return '<div class="cmp-wrap">'+(c.t?'<h4>'+fmt(c.t)+'</h4>':'')+'<div class="cmp-cards">'+side(c.left)+side(c.right)+'</div></div>';

};
const TYPES=Object.keys(R);
function blk(b){if(b==null)return '';if(typeof b==='string')return '<p>'+fmt(b)+'</p>';if(Array.isArray(b))return blocks(b);const t=TYPES.find(k=>k in b);return t?R[t](b[t],b):'';}
function blocks(a){return (Array.isArray(a)?a:[a]).map(blk).join('');}

function figView(id){
  const d=FIGS[id]||{t:id}, r=IMG[id];
  if(!r)return '<div class="figempty">Рисунок «'+fmt(d.t)+'» ('+esc(id)+') отсутствует.</div>';
  const pins=r.num?'':(r.pins||[]).map(p=>'<span class="pin" style="left:'+(p.x*100).toFixed(2)+'%;top:'+(p.y*100).toFixed(2)+'%">'+esc(p.n)+'</span>').join('');

}
function figBlock(v,b){
  return '<figure class="figbox" data-fig="'+esc(v)+'"><figcaption><strong>'+fmt(b.t||v)+'</strong>'+(b.cap?' <span class="small">· '+fmt(b.cap)+'</span>':'')+'</figcaption>'

function initTrees(){
  const store={};
  const walk=(v)=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(v.tree&&v.tree.root){store[v.tree.t||'']=v.tree;}for(const k in v)if(k!=='svg')walk(v[k]);}};
  (T.modules||[]).forEach(m=>walk(m.b));
  let idx=0;
  $$('.treebox').forEach(boxEl=>{
    idx++;
    const tid=boxEl.dataset.tree;
    const titleEl=$('.tree-head strong',boxEl);
    const titleTxt=titleEl?titleEl.textContent:'';
    let treeObj=null;
    const findTree=(v)=>{if(treeObj)return;if(Array.isArray(v))v.forEach(findTree);else if(v&&typeof v==='object'){if(v.tree&&plain(v.tree.t||'Алгоритм выбора')===titleTxt){treeObj=v.tree;return;}for(const k in v)if(k!=='svg')findTree(v[k]);}};
    (T.modules||[]).forEach(m=>findTree(m.b));
    if(!treeObj)return;
    const host=$('#'+tid,boxEl);
    const hist=[];
    function draw(node){
      if(!node)return;
      if(node.a!=null){
        host.innerHTML='<div class="tree-ans"><strong>Вывод:</strong> '+fmt(node.a)+(node.why?'<div class="small" style="margin-top:5px">'+fmt(node.why)+'</div>':'')+'</div><div class="actions" style="margin:10px 0 0"><button type="button" class="ghost" data-tback style="padding:5px 10px;font-size:12.5px">← Назад</button><button type="button" class="ghost" data-treset style="padding:5px 10px;font-size:12.5px">Сначала</button></div>';
      }else{
        host.innerHTML='<div class="tree-step"><div class="tree-q">'+fmt(node.q)+'</div><div class="actions" style="margin:8px 0 0">'
          +(node.yes?'<button type="button" class="btn" data-tyes style="padding:6px 14px">Да</button>':'')
          +(node.no?'<button type="button" class="ghost" data-tno style="padding:6px 14px">Нет</button>':'')
          +(hist.length?'<button type="button" class="ghost" data-tback style="padding:6px 10px;font-size:12.5px">← Шаг назад</button>':'')
          +'</div></div>';
      }
      const yb=$('[data-tyes]',host), nb=$('[data-tno]',host), bb=$('[data-tback]',host), rb=$('[data-treset]',host);
      if(yb)yb.onclick=()=>{hist.push(node);draw(node.yes);};
      if(nb)nb.onclick=()=>{hist.push(node);draw(node.no);};
      if(bb)bb.onclick=()=>{const prev=hist.pop();if(prev)draw(prev);};
      if(rb)rb.onclick=()=>{hist.length=0;draw(treeObj.root);};
    }
    draw(treeObj.root);
    const allBtn=$('[data-tree-all]',boxEl), allEl=$('#'+tid+'_all',boxEl);
    allBtn.onclick=()=>{
      const shown=allEl.style.display!=='none';
      allEl.style.display=shown?'none':'block';
      host.style.display=shown?'block':'none';
      allBtn.textContent=shown?'Показать всю схему':'Интерактивный режим';
    };
  });
}

function initInteractive(){
  const M=T.modules||[], G=T.gloss||[];
  const save=()=>{
    LS.set('ege100:kon:'+T.id,S);
    if(window.EGE100Sync&&window.EGE100Sync.isConfigured()){
      window.EGE100Sync.syncGist().catch(()=>{});
    }
  };
  const upd=()=>{
    const n=M.filter(m=>S.completed[m.id]).length;
    if($('#sideProgress'))$('#sideProgress').textContent=n;
    if($('#sideBar'))$('#sideBar').style.width=(M.length?100*n/M.length:0)+'%';
    $$('.complete').forEach(b=>{
      const v=!!S.completed[b.dataset.complete];
      b.textContent=v?'✓ Модуль изучен':'Отметить модуль '+b.dataset.complete+' изученным';
      b.classList.toggle('btn',v);b.classList.toggle('ghost',!v);
    });
  };
  $$('.complete').forEach(b=>b.onclick=()=>{S.completed[b.dataset.complete]=!S.completed[b.dataset.complete];save();upd();});
  upd();

  if($('#mobileJump'))$('#mobileJump').onchange=e=>{const el=document.getElementById(e.target.value.slice(1));if(el)el.scrollIntoView({behavior:'smooth'});};
  if('IntersectionObserver' in window){
    const ob=new IntersectionObserver(en=>{
      const v=en.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
      if(v){
        $$('.nav').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+v.target.id));
        const opt=$('#mobileJump option[value="#'+v.target.id+'"]');
        if(opt)$('#mobileJump').value='#'+v.target.id;
      }
    },{rootMargin:'-12% 0px -70% 0px'});
    $$('main>section[id]').forEach(s=>ob.observe(s));
  }

  if(G.length && $('#glossHost')){
    const drawG=()=>{
      const q=$('#glossSearch').value.trim().toLowerCase();
      const L=G.filter(x=>x.join(' ').toLowerCase().includes(q));
      $('#glossHost').innerHTML=L.map(x=>'<article class="term"><strong>'+fmt(x[0])+'</strong><p>'+fmt(x[1])+'</p>'+(x[2]?'<small>Пример: '+fmt(x[2])+'</small>':'')+'</article>').join('')||'<p class="small">Ничего не найдено.</p>';
    };
    $('#glossSearch').addEventListener('input',drawG);
    drawG();
  }

  // Поповер глоссария
  const pop=$('#gPopover');
  const gMap=new Map(G.map(g=>[String(g[0]).toLowerCase(),g]));
  document.addEventListener('click',e=>{
    const gl=e.target.closest('.glink');
    if(gl){
      e.stopPropagation();
      const termKey=gl.dataset.term.toLowerCase();
      const entry=gMap.get(termKey);
      if(!entry){if($('#glossary'))$('#glossary').scrollIntoView({behavior:'smooth'});return;}
      pop.innerHTML='<h4>'+fmt(entry[0])+'</h4><p>'+fmt(entry[1])+'</p>'+(entry[2]?'<p class="small"><strong>Пример:</strong> '+fmt(entry[2])+'</p>':'')+'<div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px"><button type="button" class="ghost" id="gpAll" style="padding:4px 9px;font-size:12px">К словарю ↓</button><button type="button" class="ghost" id="gpClose" style="padding:4px 9px;font-size:12px">✕</button></div>';
      const rc=gl.getBoundingClientRect();
      pop.style.display='block';
      const pw=pop.offsetWidth||320, ph=pop.offsetHeight||140;
      const left=Math.max(10,Math.min(window.innerWidth-pw-10,rc.left));
      const top=(rc.bottom+ph+12<window.innerHeight)?rc.bottom+8:Math.max(10,rc.top-ph-8);
      pop.style.left=left+'px';pop.style.top=top+'px';
      $('#gpClose',pop).onclick=()=>pop.style.display='none';
      $('#gpAll',pop).onclick=()=>{pop.style.display='none';if($('#glossary'))$('#glossary').scrollIntoView({behavior:'smooth'});};
      return;
    }
    if(pop.style.display==='block'&&!e.target.closest('#gPopover'))pop.style.display='none';
  });

  // Увеличение рисунков
  const dlg=$('#imgZoom');
  $('#imgZoomClose').onclick=()=>dlg.close();
  $$('[data-zoom]').forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.zoom, d=FIGS[id]||{};
    $('#imgZoomTitle').textContent=plain(d.t||id);
    $('#imgZoomBody').innerHTML=figView(id);
    if(dlg.showModal)dlg.showModal();
  });

  initTrees();

  if($('#clearAll'))$('#clearAll').onclick=()=>{
    if(!confirm('Сбросить отметки изученных модулей?'))return;
    S={completed:{}};save();upd();
  };
}

function jumpFromHash(){
  const raw=location.hash.slice(1);if(!raw)return;
  const q=new URLSearchParams(raw);
  if(q.has('b')){
    const m=q.get('b').match(/^(\d+)\.(\d+)$/);
    const el=m?document.getElementById('b-'+m[1]+'-'+m[2]):null;
    if(el){el.scrollIntoView({behavior:'instant',block:'center'});const nxt=el.nextElementSibling;if(nxt){nxt.classList.add('bflash');setTimeout(()=>nxt.classList.add('fade'),2200);}}
    return;
  }
  const el=document.getElementById(decodeURIComponent(raw));
  if(el)el.scrollIntoView({behavior:'instant'});
}

try{
  const raw=$('#topic-data').textContent.trim();
  if(raw&&raw[0]==='{'){
    T=JSON.parse(raw);
    IMG=T._img||{};
    delete T._img;
    render();

  }
}catch(e){
  $('#app').innerHTML='<main style="padding:32px"><div class="panel warn"><strong>Ошибка загрузки данных:</strong> '+esc(e.message)+'</div></main>';
}
})();
