<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учебник ЕГЭ-100</title>
<style>
:root{
  --bg:#f6f7f9;--sidebar:#ffffff;--paper:#ffffff;--paper2:#f1f4f8;--line:#dde3ec;--text:#18202c;--dim:#546274;
  --a:#0f766e;--a-soft:#e6f4f1;--a-bd:#99d6cd;
  --b:#2563eb;--b-soft:#eff6ff;--gold:#b45309;--gold-soft:#fef7e6;--bad:#be123c;--bad-soft:#fff1f2;--good:#15803d;--good-soft:#eefbf3;
  --radius:16px;--shadow:0 4px 20px rgba(15,23,42,.06);
  --svg-bg:#f8fafc;--svg-surface:#ffffff;--svg-surface2:#eef3f9;--svg-ink:#18202c;--svg-dim:#546274;--svg-line:#cbd5e1;
  --svg-acc:#0f766e;--svg-gold:#b45309;--svg-bad:#dc2626;--svg-good:#15803d;--svg-blue:#2563eb;
}
:root[data-subject="biology"]{--a:#15803d;--a-soft:#ecfdf3;--a-bd:#9ce2b8;--svg-acc:#15803d}
:root[data-subject="russian"]{--a:#7c3aed;--a-soft:#f5f3ff;--a-bd:#c4b5fd;--svg-acc:#7c3aed}

@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0b121c;--sidebar:#0f1824;--paper:#131f2e;--paper2:#182739;--line:#263950;--text:#e6eef7;--dim:#96abc2;
    --a:#2dd4bf;--a-soft:#102f33;--a-bd:#1e5d61;
    --b:#60a5fa;--b-soft:#15253f;--gold:#f5c469;--gold-soft:#2b2316;--bad:#fb7185;--bad-soft:#2e181f;--good:#4ade80;--good-soft:#132b1e;
    --shadow:0 12px 36px rgba(2,6,16,.45);
    --svg-bg:#0d1723;--svg-surface:#162436;--svg-surface2:#1e3047;--svg-ink:#e6eef7;--svg-dim:#96abc2;--svg-line:#2c425c;
    --svg-acc:#2dd4bf;--svg-gold:#f5c469;--svg-bad:#fb7185;--svg-good:#4ade80;--svg-blue:#60a5fa;
  }
  :root[data-subject="biology"]:not([data-theme]){--a:#4ade80;--a-soft:#132d1f;--a-bd:#225c3c;--svg-acc:#4ade80}
  :root[data-subject="russian"]:not([data-theme]){--a:#a78bfa;--a-soft:#21193b;--a-bd:#4a3880;--svg-acc:#a78bfa}
}
:root[data-theme="dark"]{
  --bg:#0b121c;--sidebar:#0f1824;--paper:#131f2e;--paper2:#182739;--line:#263950;--text:#e6eef7;--dim:#96abc2;
  --a:#2dd4bf;--a-soft:#102f33;--a-bd:#1e5d61;
  --b:#60a5fa;--b-soft:#15253f;--gold:#f5c469;--gold-soft:#2b2316;--bad:#fb7185;--bad-soft:#2e181f;--good:#4ade80;--good-soft:#132b1e;
  --shadow:0 12px 36px rgba(2,6,16,.45);
  --svg-bg:#0d1723;--svg-surface:#162436;--svg-surface2:#1e3047;--svg-ink:#e6eef7;--svg-dim:#96abc2;--svg-line:#2c425c;
  --svg-acc:#2dd4bf;--svg-gold:#f5c469;--svg-bad:#fb7185;--svg-good:#4ade80;--svg-blue:#60a5fa;
}
:root[data-theme="dark"][data-subject="biology"]{--a:#4ade80;--a-soft:#132d1f;--a-bd:#225c3c;--svg-acc:#4ade80}
:root[data-theme="dark"][data-subject="russian"]{--a:#a78bfa;--a-soft:#21193b;--a-bd:#4a3880;--svg-acc:#a78bfa}
:root[data-theme="paper"]{
  --bg:#eae1cf;--sidebar:#f1e8d6;--paper:#f6efe1;--paper2:#ece2ce;--line:#d6c8b0;--text:#2a231b;--dim:#625648;
  --a:#0f6b63;--a-soft:#e0ebe4;--a-bd:#9cc2b7;
  --b:#24529a;--b-soft:#e3e9f0;--gold:#9c4a08;--gold-soft:#f3e5cb;--bad:#a82039;--bad-soft:#f3dfdf;--good:#1f6d3d;--good-soft:#e1ece2;
  --shadow:0 4px 18px rgba(58,42,22,.07);
  --svg-bg:#f1e8d7;--svg-surface:#f8f2e6;--svg-surface2:#e9dfc9;--svg-ink:#2a231b;--svg-dim:#625648;--svg-line:#cabaa0;
  --svg-acc:#0f6b63;--svg-gold:#9c4a08;--svg-bad:#a82039;--svg-good:#1f6d3d;--svg-blue:#24529a;
}
:root[data-theme="paper"][data-subject="biology"]{--a:#1f6d3d;--a-soft:#e1ece2;--a-bd:#9ec3a6;--svg-acc:#1f6d3d}
:root[data-theme="paper"][data-subject="russian"]{--a:#6b3fa0;--a-soft:#e9e1ee;--a-bd:#bda6d6;--svg-acc:#6b3fa0}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:32px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
a{color:var(--a)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.layout{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--sidebar);border-right:1px solid var(--line);padding:18px 14px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--line);font-weight:800}
.atom{display:grid;place-items:center;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);width:40px;height:40px;border-radius:12px;font-size:22px;flex:none}
.brand-meta{min-width:0;line-height:1.25}
.brand-meta small{display:block;font-weight:500;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-tools{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);color:var(--text);text-decoration:none;font-size:12.5px;font-weight:600;flex:1 1 auto}
.sbtn:hover{border-color:var(--a);color:var(--a)}
.sbtn.pri{background:var(--a-soft);border-color:var(--a-bd);color:var(--a)}
.navtag{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin:16px 10px 4px;font-weight:700}
.nav{display:block;padding:7px 10px;border-radius:9px;color:var(--dim);text-decoration:none;font-size:13.5px;line-height:1.38}
.nav:hover,.nav.active{color:var(--text);background:var(--a-soft)}
.nav.active{font-weight:700;color:var(--a)}

main{min-width:0;max-width:1060px;width:100%;margin:0 auto;padding:24px clamp(16px,3.6vw,52px) 110px}
.mobileNav{display:none}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,46px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-wm{position:absolute;right:18px;bottom:-22px;font-size:160px;line-height:1;opacity:.05;pointer-events:none;user-select:none}
h1{font-size:clamp(28px,4.2vw,46px);line-height:1.15;letter-spacing:-.03em;margin:.2em 0 .35em;max-width:860px}
h2{font-size:clamp(22px,2.8vw,31px);line-height:1.25;letter-spacing:-.02em;margin:0 0 12px}
h3{font-size:19.5px;line-height:1.32;margin:26px 0 10px}
h4{font-size:16px;margin:18px 0 8px}
p{margin:10px 0 14px}
.sub{color:var(--dim);font-size:clamp(15.5px,1.55vw,18px);max-width:780px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--a)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-block;background:var(--a-soft);color:var(--a);border:1px solid var(--a-bd);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.btn,.ghost{border:1px solid var(--a);border-radius:11px;padding:9px 15px;background:var(--a);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.06)}
.ghost{background:var(--paper2);color:var(--text);border-color:var(--line)}
.ghost:hover{border-color:var(--a);color:var(--a)}

.lesson{margin-top:44px;border-top:1px solid var(--line);padding-top:34px}
.sectionlead{font-size:17px;color:var(--dim);max-width:850px}
.small{font-size:13.5px;color:var(--dim)}
.muted{color:var(--dim)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px 20px;margin:16px 0;min-width:0;box-shadow:var(--shadow)}
.two>.panel,.three>.panel{margin:0}
.panel h3:first-child,.panel h4:first-child{margin-top:0}
.hint{background:var(--a-soft);border-left:4px solid var(--a)}
.warn{background:var(--bad-soft);border-left:4px solid var(--bad)}
.note{background:var(--b-soft);border-left:4px solid var(--b)}
.key{background:var(--gold-soft);border-left:4px solid var(--gold)}
.eq{font-family:Cambria,"Times New Roman",serif;font-size:clamp(18px,2vw,23px);line-height:1.6;background:var(--paper2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 16px;overflow-x:auto;white-space:nowrap;margin:13px 0}
.eq.sm{font-size:18px}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

.step{display:grid;grid-template-columns:34px 1fr;gap:12px;margin:14px 0}
.stepnum{display:grid;place-items:center;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);font-size:13.5px;font-weight:800;border-radius:10px;width:34px;height:34px;align-self:start}
.step p{margin:0 0 6px}
.list{padding-left:22px}.list li{margin:7px 0}

details{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:11px 0}
summary{padding:12px 16px;cursor:pointer;color:var(--a);font-weight:700}
details>div{padding:0 18px 15px}

.mapflow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:16px 0}
.flowbox{flex:1 1 150px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.flowbox strong{display:block;line-height:1.3}
.flowbox small{display:block;color:var(--dim);margin-top:3px}
.arrow{align-self:center;color:var(--a);font-size:18px;font-weight:700}

.tablewrap{width:100%;overflow:auto;border-radius:12px;border:1px solid var(--line);margin:14px 0;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:500px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--paper2);color:var(--text);font-weight:750}
tr:last-child td{border-bottom:0}

.svgwrap{padding:14px;border-radius:16px;background:var(--svg-bg);border:1px solid var(--line);margin:16px 0}
.svgwrap svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}

/* Новые блоки: bridge, compare, tree, essay */
.bridge{background:var(--paper);border:1px solid var(--a-bd);border-radius:var(--radius);padding:16px 20px;margin:18px 0;box-shadow:var(--shadow)}
.bridge-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bridge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.bridge-cell{background:var(--paper2);border-radius:11px;padding:11px 13px;font-size:14.5px}
.bridge-cell b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px}

.cmp-wrap{margin:16px 0}
.cmp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cmp-card h4{margin:0 0 8px;color:var(--a)}

.treebox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow)}
.tree-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tree-step{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.tree-q{font-weight:700;margin-bottom:8px}
.tree-ans{border-left:4px solid var(--good);background:var(--good-soft);border-radius:10px;padding:11px 14px;margin-top:8px}
.tree-static ul{margin:6px 0 6px 18px;padding:0}
.tree-static li{margin:4px 0}

.essaybox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.essay-text{background:var(--paper2);border-left:3px solid var(--a);padding:12px 15px;border-radius:10px;margin:10px 0;font-size:15px}

/* Русская разметка */
.ru-stress{color:var(--bad);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ru-ortho{background:var(--gold-soft);border:1px solid var(--gold);border-radius:5px;padding:0 3px;font-weight:700}
.ru-pos{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);font-size:12px;font-weight:800;vertical-align:baseline;margin:0 2px}
.ru-m{padding:0 2px;border-radius:3px}
.ru-p{border-top:2px solid var(--b);border-right:2px solid var(--b);padding-right:3px}
.ru-k{border-top:2px solid var(--a);border-radius:6px 6px 0 0;padding-top:1px}
.ru-s{background:linear-gradient(135deg,transparent 48%,var(--gold) 49%,var(--gold) 51%,transparent 52%) top/100% 6px no-repeat;padding-top:5px}
.ru-o{border:1.5px solid var(--dim);border-radius:4px;padding:0 3px}
.ru-syn{text-decoration:underline;text-underline-offset:4px}
.ru-podl{text-decoration-color:var(--b)}
.ru-skaz{text-decoration-style:double;text-decoration-color:var(--bad)}
.ru-opr{text-decoration-style:wavy;text-decoration-color:var(--a)}
.ru-obst{text-decoration-style:dotted;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.ru-vvod{background:var(--b-soft);border-radius:5px;padding:0 4px}

/* Рисунки и метки */
.figbox{margin:16px 0;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.figbox figcaption{margin-bottom:10px}
.figimg{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.figimg img{max-width:100%;max-height:70vh;width:auto;height:auto;display:block}
.pinwrap{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:25px;height:25px;padding:0 6px;border-radius:13px;background:#0f766e;color:#fff;border:2px solid #fff;font:700 12.5px/21px system-ui,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.figlegend{margin:10px 0 0;padding:0;list-style:none;columns:2 260px;font-size:14px}
.figlegend li{break-inside:avoid;margin:4px 0}
.figlegend b{display:inline-block;min-width:22px;color:var(--a)}
.figempty{padding:18px;border:2px dashed var(--line);border-radius:12px;color:var(--dim);text-align:center}

/* Словарь и поповер */
.glink{background:none;border:0;border-bottom:1.5px dashed var(--a);color:inherit;padding:0;font:inherit;cursor:pointer}
.glink:hover{color:var(--a)}
#gPopover{position:fixed;z-index:80;max-width:min(360px,92vw);background:var(--paper);border:1px solid var(--a-bd);border-radius:14px;padding:13px 15px;box-shadow:0 16px 40px rgba(0,0,0,.22);display:none}
#gPopover h4{margin:0 0 6px;color:var(--a);font-size:16px}
#gPopover p{margin:0 0 6px;font-size:14px}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.term{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.term strong{display:block;color:var(--a);font-size:16.5px}
.term p{margin:4px 0;font-size:14.5px}
.term small{color:var(--dim)}

.statbar{height:8px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.statbar span{height:100%;background:var(--a);display:block;width:0}
.banchor{display:block;height:0;scroll-margin-top:80px}
.bflash{outline:3px solid var(--gold);outline-offset:5px;border-radius:8px;transition:outline-color 1.4s}
.bflash.fade{outline-color:transparent}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.timeline .panel{margin:0;text-align:center}
.timeline strong{font-size:21px;color:var(--gold)}
footer{color:var(--dim);text-align:center;margin:56px 0 0;font-size:13px}

dialog#imgZoom{max-width:95vw;max-height:94vh;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--paper);color:var(--text)}
dialog#imgZoom::backdrop{background:rgba(0,0,0,.68)}
dialog#imgZoom img{max-width:90vw;max-height:82vh;display:block;background:#fff;border-radius:8px}

@media(max-width:1000px){
  .layout{display:block}
  .side{display:none}
  .mobileNav{display:flex;position:sticky;top:0;z-index:30;background:var(--sidebar);border-bottom:1px solid var(--line);padding:8px 12px;align-items:center;gap:8px}
  .mobileNav select{flex:1;min-width:0;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--paper2)}
  .mbtn{border:1px solid var(--line);background:var(--paper2);border-radius:9px;padding:6px 10px;text-decoration:none;font-size:13px;font-weight:700}
  main{padding-top:18px}
}
@media(max-width:670px){
  .two,.three,.gloss,.cmp-cards{grid-template-columns:1fr}
  .timeline{grid-template-columns:repeat(2,1fr)}
  .arrow{display:none}
  .flowbox{flex-basis:100%}
  .figlegend{columns:1}
  table{font-size:13px}
}
@media print{
  body{background:#fff;color:#111}
  .side,.mobileNav,.actions,#gPopover,.tree-interactive{display:none!important}
  .tree-static{display:block!important}
  main{max-width:none;padding:0}
  .panel,.bridge,.figbox,.essaybox,details,.eq{box-shadow:none;background:#fff;border-color:#999}
  details>div{display:block!important}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="application/json" id="topic-data">{"id": "zadanie-1-stroenie-atoma", "subject": "Химия", "subjectSlug": "chemistry", "short": "Задание 1 · Строение атома", "version": "26.11.2026", "icon": "⚛", "title": "Задание 1 · Строение атома и электронные конфигурации", "sub": "Пошаговый учебник ЕГЭ-2027 по коду 1.1 ФИПИ: от устройства ядра и чёрно-белой таблицы Менделеева до провала электрона, возбуждённого состояния, ионов и всех ловушек КИМ.", "chips": ["ЕГЭ-2027", "Код 1.1", "№ 1 КИМ", "С нуля до 100"], "scope": ["1.1"], "status": "Сверено с утверждённым комплектом ФИПИ ЕГЭ-2027 (код 1.1, задание № 1 КИМ).", "mode": "from_scratch", "goals": [["01 · Атом и таблица ФИПИ", "находить число протонов, нейтронов и электронов, разбираться с изотопами и безошибочно отличать подгруппы А и Б в чёрно-белой таблице ЕГЭ"], ["02 · Уровни и орбитали", "расселять электроны по энергетическим ячейкам по принципу Паули и правилу Хунда и точно считать неспаренные электроны"], ["03 · Клечковский и s/p/d", "составлять электронную конфигурацию любого элемента 1–4 периодов, определять семейство и суммарное число s-, p- и d-электронов"], ["04 · d-элементы и провал", "объяснять и записывать провал электрона у Cr и Cu (и ориентироваться в 5-м периоде: Mo, Ag)"], ["05 · Внешние vs валентные", "различать внешние, предвнешние и валентные электроны у s-, p- и d-элементов (включая He и Zn) и находить одинаковую внешнюю оболочку"], ["06 · Возбуждённое состояние", "определять ступени возбуждения атомов (C, P, S, Cl) и объяснять, почему N, O, F не переходят в возбуждённое состояние"], ["07 · Конфигурации ионов", "составлять конфигурации катионов и анионов (сначала убирая 4s у d-металлов) и отличать конфигурацию благородного газа от 3d¹⁰"], ["08 · Стратегия № 1 КИМ", "узнавать все 12 типов формулировок задания № 1 ФИПИ и решать их без потери балла на словах-переключателях"]], "audit": {"title": "Исходные материалы и границы охвата", "intro": "Учебник создан с нуля по утверждённому комплекту ФИПИ ЕГЭ-2027 (кодификатор 1.1, спецификация, демоверсия ЕГЭ-2027 и методические рекомендации ФИПИ).", "b": [{"more": "Опора на нормативную базу и границы темы", "open": true, "b": [{"list": ["**Нормативная основа:** код **1.1** кодификатора ФИПИ ЕГЭ-2027 — современная модель строения атома, распределение электронов по энергетическим уровням, классификация химических элементов (s-, p-, d-элементы), основное и возбуждённое состояния, электронная конфигурация атомов и ионов, валентные электроны.", "**Рабочая зона ЕГЭ:** основная часть заданий № 1 строится на элементах **1–4 периодов** (`H`–`Kr`, `Z = 1–36`), реже встречаются элементы главных подгрупп 5-го периода (`Rb, Sr, Sn, Sb, Te, I, Xe`) и классические примеры провала `Mo`, `Ag`. Все они учтены в учебнике.", "**Научная точность:** все пограничные вопросы (валентные электроны `Zn`, запрет возбуждения `N, O, F`, порядок ионизации `4s` раньше `3d`, отличие `[Ar]3d¹⁰` от конфигурации аргона) сверены с учебником В. В. Ерёмина «Начала химии» и официальным комплектом ФИПИ ЕГЭ-2027."]}]}]}, "summary": [{"p": "Задание № 1 ЕГЭ по химии даёт 1 первичный балл и на первый взгляд кажется лёгким, но именно в нём чаще всего ошибаются из-за шести скрытых переключателей: **внешние vs валентные**, **всего в атоме vs на внешнем уровне**, **основное vs возбуждённое состояние**, **провал у Cr и Cu**, **уход 4s раньше 3d в ионах** и **He как s-элемент**."}, {"p": "Привычка сначала выписать точные конфигурации всех пяти элементов ряда, а затем подчеркнуть слова-переключатели в условии превращает задание № 1 в гарантированный балл за 60–90 секунд — и одновременно даёт прочную базу для заданий № 2, № 3, № 4 и всей неорганики."}], "limits": "Закономерности изменения свойств по Периодической системе (радиус атома, электроотрицательность, кислотно-основные свойства оксидов и гидроксидов — код 1.2, задание № 2), а также определение степеней окисления и валентностей в конкретных соединениях (код 1.3, задание № 3) вынесены в следующие учебники маршрута.", "modules": [{"id": "01", "group": "База с нуля", "nav": "Атом и таблица ФИПИ", "codes": ["1.1"], "eyebrow": "01 · Задание 1 · Код 1.1", "title": "Атом, ядро и чёрно-белая таблица ФИПИ", "lead": "Почему на ЕГЭ тебе выдают чёрно-белую таблицу Менделеева без подписей «А» и «Б» и без раскраски по семействам — и как за три секунды прочитать из неё всё о ядре и оболочке любого атома?", "b": [{"key": "Всё, что нужно для старта в задании № 1, уже напечатано в таблице Менделеева. **Порядковый номер `Z`** равен заряду ядра, числу протонов и числу электронов в нейтральном атоме, а **главную и побочную подгруппы** в чёрно-белом бланке ФИПИ выдаёт выравнивание символа элемента внутри ячейки.", "t": "Главная мысль."}, {"more": "Что нужно знать заранее (опора с нуля)", "open": true, "b": [{"list": ["**Химический элемент** — это вид атомов с одинаковым зарядом ядра. У каждого элемента есть свой латинский символ (`O` — кислород, `Fe` — железо) и своё место в Периодической системе.", "**Электрический заряд** бывает положительным (`+`) и отрицательным (`−`). Разноимённые заряды притягиваются, а сумма равного числа `+` и `−` даёт ноль (электронейтральность).", "**Период** — это горизонтальный ряд таблицы Менделеева (от 1 до 7), а **группа** — вертикальный столбец (от I до VIII).", "**Относительная атомная масса `Ar`** — число в ячейке таблицы рядом с символом (например, `16,00` у кислорода). Она показывает, во сколько раз атом данного элемента тяжелее `1/12` массы атома углерода-12."]}]}, {"h": "1. Из чего устроен атом: ядро и электронная оболочка"}, {"p": "Представь стадион: в самом центре лежит крошечное зёрнышко, а всё огромное пространство вокруг — почти пустота, в которой движутся лёгкие частицы. Так же устроен [[Атом|атом]]. В центре находится **ядро** — в нём сосредоточена почти вся масса атома, и оно заряжено положительно. Вокруг ядра движутся отрицательно заряженные электроны (`e⁻`), образуя **электронную оболочку**."}, {"p": "Ядро состоит из частиц двух типов: **протонов (`p⁺`)** с зарядом `+1` и массой примерно `1 а.е.м.` и **нейтронов (`n⁰`)** с зарядом `0` и такой же массой `1 а.е.м.`. Электрон (`e⁻`) имеет заряд `−1`, а его масса почти в `1840` раз меньше массы протона, поэтому в расчётах массы атома вкладом электронов пренебрегают."}, {"table": [["Частица", "Обозначение", "Заряд", "Относительная масса", "Где находится и как найти число"], ["Протон", "`p⁺`", "`+1`", "`1`", "В ядре; равно [[Порядковый номер Z|порядковому номеру Z]]"], ["Нейтрон", "`n⁰`", "`0`", "`1`", "В ядре; `N = A − Z` (для конкретного изотопа)"], ["Электрон", "`e⁻`", "`−1`", "`≈ 0` (`1/1836`)", "В оболочке; в нейтральном атоме равно `Z`"]]}, {"hint": "Атом в целом всегда электронейтрален: суммарный заряд его ядра и оболочки равен нулю. Поэтому сколько протонов (`+`) в ядре, ровно столько же электронов (`−`) в оболочке нейтрального атома. Стоит изменить число протонов — получится уже другой химический элемент; а если изменить только число электронов, элемент останется прежним, но атом превратится в ион.", "t": "Почему число электронов в атоме всегда равно Z?"}, {"h": "2. Массовое число, изотопы и загадка хлора 35,5"}, {"p": "Сумма протонов и нейтронов в ядре конкретного атома называется [[Массовое число A|массовым числом A]]: `A = Z + N`. Отсюда число нейтронов находится вычитанием: `N = A − Z`. Например, у наиболее распространённого атома алюминия `²⁷Al` порядковый номер `Z = 13`, значит в ядре `13` протонов и `27 − 13 = 14` нейтронов."}, {"p": "В природе у одного и того же элемента часто встречаются атомы с одинаковым числом протонов `Z`, но разным числом нейтронов `N`. Такие разновидности называются [[Изотопы|изотопами]]. Поскольку заряд ядра и число электронов у изотопов одинаковы, они занимают одну клетку таблицы Менделеева и ведут себя химически почти одинаково."}, {"p": "Именно из-за изотопов в таблице Менделеева стоят дробные атомные массы. Классический пример — хлор (`Z = 17`, `Ar = 35,45`, в расчётах ЕГЭ `35,5`). В природе нет атома с половинкой нейтрона: природный хлор представляет собой смесь примерно `75%` изотопа `³⁵Cl` (`18` нейтронов) и `25%` изотопа `³⁷Cl` (`20` нейтронов). Средневзвешенная масса этой смеси как раз и равна `0,75 · 35 + 0,25 · 37 = 35,5`."}, {"warn": "В задании № 1 встречается вопрос: «У наиболее распространённых изотопов каких элементов число протонов равно числу нейтронов?». Среди первых 20 элементов равенство `p = n` выполняется ровно у девяти основных изотопов: `⁴He` (`2=2`), `¹²C` (`6=6`), `¹⁴N` (`7=7`), `¹⁶O` (`8=8`), `²⁰Ne` (`10=10`), `²⁴Mg` (`12=12`), `²⁸Si` (`14=14`), `³²S` (`16=16`), `⁴⁰Ca` (`20=20`). У протия `¹H` вообще `0` нейтронов (`1p, 0n`), а у `⁷Li`, `⁹Be`, `¹¹B`, `¹⁹F`, `²³Na`, `²⁷Al`, `³¹P`, `³⁵Cl`, `⁴⁰Ar`, `³⁹K` число нейтронов больше числа протонов. Не округляй `Ar(Cl) = 35,45` до `36` — у хлора нет стабильного изотопа с `19` нейтронами, его основной изотоп `³⁵Cl` (`17` протонов и `18` нейтронов).", "t": "Ловушка ЕГЭ: округление Ar и изотопы хлора"}, {"h": "3. Как читать чёрно-белую таблицу ФИПИ без цветных подсказок"}, {"p": "На экзамене у тебя будет только официальная **короткопериодная чёрно-белая таблица Менделеева** из комплекта КИМ. В ней нет деления на цвета и нет букв «А» и «Б» в шапке столбцов. Чтобы не перепутать главную и побочную подгруппы, посмотри внимательно на реальный фрагмент таблицы ЕГЭ ниже."}, {"fig": "fipi_pshe_1_4", "file": "fipi_pshe_1_4.png", "t": "Официальная Периодическая система ФИПИ ЕГЭ-2027 (периоды 1–4)"}, {"p": "Секрет чёрно-белого бланка прост: **внутри каждого столбца (группы) символы элементов выровнены по-разному**. Посмотри на I группу: `H`, `Li`, `Na`, `K` прижаты к **левому** краю ячейки — это **главная подгруппа (IA)**. А `Cu` в 4-м периоде сдвинут к **правому** краю — это **побочная подгруппа (IB)**. Теперь посмотри на VI группу: `O`, `S`, `Se` прижаты к **правому** краю — значит здесь главная подгруппа (VIA) справа, а сдвинутый влево `Cr` относится к побочной подгруппе (VIB)."}, {"p": "Запомни универсальное правило ориентира: **главная подгруппа (А)** в любой группе начинается с элементов малых периодов (1–3 периоды: `H–Ar`). Какой край ячейки занимают элементы 2-го и 3-го периодов в данном столбце — на том же краю стоят все элементы главной подгруппы (А) ниже. Элементы, сдвинутые к противоположному краю в 4–7 периодах, — это **побочная подгруппа (Б)**."}, {"svg": "<svg viewBox='0 0 460 220' xmlns='http://www.w3.org/2000/svg'><rect width='460' height='220' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Чтение ячейки и подгрупп в таблице ФИПИ<\/text><rect x='16' y='40' width='198' height='164' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='115' y='60' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-acc,#14b8a6)'>Состав атома из ячейки<\/text><rect x='50' y='72' width='130' height='74' rx='8' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)' stroke-width='1.5'/><text x='115' y='91' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>13  (Z = p⁺ = e⁻)<\/text><text x='115' y='118' text-anchor='middle' font-size='18' font-weight='700' fill='var(--svg-ink,#e6eef7)'>26,98  Al<\/text><text x='115' y='138' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Алюминий<\/text><text x='115' y='168' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>p⁺ = 13,  e⁻ = 13<\/text><text x='115' y='188' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>²⁷Al: n⁰ = 27 − 13 = 14<\/text><rect x='230' y='40' width='214' height='164' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='337' y='60' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>Сдвиг символа = подгруппа<\/text><text x='284' y='80' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-dim,#94a8c0)'>I группа<\/text><text x='390' y='80' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-dim,#94a8c0)'>VI группа<\/text><rect x='244' y='88' width='80' height='30' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='254' y='108' font-size='13' font-weight='700' fill='var(--svg-good,#34c77b)'>K<\/text><text x='316' y='108' text-anchor='end' font-size='12' fill='var(--svg-dim,#94a8c0)'>IA<\/text><rect x='244' y='124' width='80' height='30' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='254' y='144' font-size='12' fill='var(--svg-dim,#94a8c0)'>IB<\/text><text x='316' y='144' text-anchor='end' font-size='13' font-weight='700' fill='var(--svg-blue,#60a5fa)'>Cu<\/text><rect x='350' y='88' width='80' height='30' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='360' y='108' font-size='12' fill='var(--svg-dim,#94a8c0)'>VIA<\/text><text x='422' y='108' text-anchor='end' font-size='13' font-weight='700' fill='var(--svg-good,#34c77b)'>S<\/text><rect x='350' y='124' width='80' height='30' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='360' y='144' font-size='13' font-weight='700' fill='var(--svg-blue,#60a5fa)'>Cr<\/text><text x='422' y='144' text-anchor='end' font-size='12' fill='var(--svg-dim,#94a8c0)'>VIB<\/text><text x='337' y='176' text-anchor='middle' font-size='12' fill='var(--svg-good,#34c77b)'>зелёный = главная (А)<\/text><text x='337' y='194' text-anchor='middle' font-size='12' fill='var(--svg-blue,#60a5fa)'>синий = побочная (Б)<\/text><\/svg>", "cap": "Определение состава атома по ячейке алюминия и чтение подгрупп А/Б по выравниванию символа в таблице ФИПИ."}, {"h": "4. Разбор вслух: состав ядра и подгруппы"}, {"steps": ["**Задача:** Для элементов `O`, `Al`, `Cl`, `Cr` определи число протонов, нейтронов (для основного изотопа), электронов, номер периода и подгруппу по таблице ФИПИ.", "**Кислород (`O`):** `Z = 8`, 2-й период, VI группа, символ справа (как у `S`, `Se` — это главная подгруппа VIA). Протонов `8`, электронов `8`. Масса `16,00` → основной изотоп `¹⁶O` имеет `16 − 8 = 8` нейтронов (`p = n`).", "**Алюминий (`Al`):** `Z = 13`, 3-й период, III группа, символ справа — главная подгруппа IIIA. Протонов `13`, электронов `13`. Масса `26,98` → `²⁷Al`, нейтронов `27 − 13 = 14` (`p ≠ n`).", "**Хлор (`Cl`):** `Z = 17`, 3-й период, VII группа, символ справа — главная подгруппа VIIA. Протонов `17`, электронов `17`. Средняя масса `35,45` — это смесь `³⁵Cl` (`18` нейтронов) и `³⁷Cl` (`20` нейтронов), ни у одного природного изотопа `p` не равно `n`.", "**Хром (`Cr`):** `Z = 24`, 4-й период, VI группа, но символ сдвинут **влево** (противоположно `O` и `S`) — значит это **побочная подгруппа VIB** (`d`-элемент). Протонов `24`, электронов `24`, у `⁵²Cr` нейтронов `52 − 24 = 28`."]}, {"bridge": {"kim": "№ 1 КИМ", "ask": "«Определите, у наиболее распространённых изотопов каких элементов число протонов равно числу нейтронов» или скрытое требование отличить элемент главной подгруппы от побочной (например, `Ca` от `Zn`, `S` от `Cr`).", "watch": "В 4-м периоде `K, Ca, Ga, Ge, As, Se, Br, Kr` — главные подгруппы (А), а `Sc–Zn` (10 элементов подряд!) — побочные подгруппы (Б). В VIII группе главную подгруппу (VIIIA) образуют только благородные газы (`He, Ne, Ar, Kr, Xe, Rn`), а триада `Fe, Co, Ni` — побочная подгруппа (VIIIB).", "tip": "Всегда начинай решение задания № 1 с быстрого взгляда на таблицу ФИПИ: найди `Z`, период и сразу отметь, в главной (А) или побочной (Б) подгруппе стоит каждый из пяти элементов ряда."}}], "short": [{"list": ["Атом электронейтрален: число протонов (`p⁺`) в ядре и число электронов (`e⁻`) в оболочке равны порядковому номеру `Z`.", "Число нейтронов в ядре конкретного изотопа равно разности массового числа и порядкового номера: `N = A − Z`.", "Изотопы — атомы одного элемента с одинаковым `Z`, но разным числом нейтронов; из-за природной смеси изотопов `Ar(Cl) = 35,45` (смесь `³⁵Cl` и `³⁷Cl`).", "В чёрно-белой таблице ФИПИ главная подгруппа (А) совпадает по выравниванию с элементами 2–3 периодов, а побочная (Б) сдвинута к противоположному краю ячейки.", "В 4-м периоде все десять элементов от скандия `₂₁Sc` до цинка `₃₀Zn` относятся к побочным подгруппам (Б)."]}]}, {"id": "02", "group": "База с нуля", "nav": "Уровни и орбитали", "codes": ["1.1"], "eyebrow": "02 · Задание 1 · Код 1.1", "title": "Энергетические уровни, орбитали, принцип Паули и правило Хунда", "lead": "Почему у углерода с шестью электронами неспаренных электронов ровно два, у азота — три, а у кислорода снова два? Всё решают три строгих правила «расселения» электронов вокруг ядра.", "b": [{"key": "Электронная оболочка устроена как многоэтажный дом: **номер периода = число уровней (этажей `n`)**, на каждом уровне есть **подуровни (`s, p, d, f`)**, а внутри них — **орбитали (комнаты-ячейки)**. В одну ячейку помещается не больше двух электронов с противоположными спинами (Паули), а пустые ячейки одного подуровня сначала заселяются по одному (Хунд).", "t": "Главная мысль."}, {"h": "1. Энергетические уровни и формула 2n²"}, {"p": "В прошлом модуле мы нашли общее число электронов в атоме (`Z`). Но электроны не сбиваются в одну кучу вокруг ядра: они располагаются слоями с разной энергией. Такой слой называется [[Энергетический уровень|энергетическим уровнем]] и обозначается главным квантовым числом `n = 1, 2, 3, 4...` (чем больше `n`, тем дальше электрон от ядра и тем выше его энергия)."}, {"p": "В Периодической системе число заполняемых энергетических уровней атома равно **номеру периода**: у лития (2-й период) их два, у серы (3-й период) — три, у железа (4-й период) — четыре. Максимальное число электронов, которое вообще может вместить уровень с номером `n`, подчиняется формуле `N_{max} = 2n²`:"}, {"table": [["Уровень `n`", "Макс. электронов (`2n²`)", "Какие подуровни есть на уровне", "Сколько всего орбиталей (`n²`)"], ["`n = 1`", "`2 · 1² = 2`", "только `1s`", "`1` (`1`)"], ["`n = 2`", "`2 · 2² = 8`", "`2s`, `2p` (**нет `2d`!**)", "`4` (`1 + 3`)"], ["`n = 3`", "`2 · 3² = 18`", "`3s`, `3p`, `3d`", "`9` (`1 + 3 + 5`)"], ["`n = 4`", "`2 · 4² = 32`", "`4s`, `4p`, `4d`, `4f`", "`16` (`1 + 3 + 5 + 7`)"]]}, {"hint": "Посмотри на строку `n = 2`: на втором уровне существуют только `2s` и `2p`, а подуровня `2d` в природе не существует. Запомни этот факт прямо сейчас — в модуле 06 именно он объяснит, почему азот, кислород и фтор не переходят в возбуждённое состояние.", "t": "Почему число подуровней на уровне равно n?"}, {"h": "2. Подуровни и формы орбиталей"}, {"p": "В современной квантовой модели электрон не летает по чёткой круговой дорожке, как планета. Он образует **электронное облако**. Область пространства, где вероятность найти электрон наибольшая (обычно принимают около `90%`), называется [[Орбиталь|орбиталью]]. На бумаге одну орбиталь рисуют в виде квадратной клетки — **энергетической ячейки**."}, {"p": "Орбитали одинаковой формы и одинаковой энергии внутри одного уровня объединяются в [[Подуровень|подуровень]]. В школьном курсе и на ЕГЭ встречаются четыре типа подуровней: `s`, `p`, `d`, `f`. Число орбиталей в них образует простую нечётную последовательность `1, 3, 5, 7`, а максимальное число электронов вдвое больше — `2, 6, 10, 14`:"}, {"list": ["**`s`-подуровень** — `1` орбиталь (максимум `2 e⁻`), форма облака — **сфера** (шар с центром в ядре).", "**`p`-подуровень** — `3` орбитали (максимум `6 e⁻`), форма — **объёмная восьмёрка (гантель)**; три орбитали направлены строго вдоль взаимно перпендикулярных осей `x`, `y`, `z` (`pₓ`, `pᵧ`, `p_z`).", "**`d`-подуровень** — `5` орбиталей (максимум `10 e⁻`), более сложная форма (четырёхлепестковые розетки).", "**`f`-подуровень** — `7` орбиталей (максимум `14 e⁻`), сложные многолепестковые формы."]}, {"h": "3. Три правила заселения орбиталей"}, {"p": "Чтобы понять, как именно электроны занимают клетки, представь гостиницу с правилами расселения. Каждый электрон обладает собственным квантовым свойством — [[Спин|спином]], который может иметь два противоположных направления (их рисуют стрелками `↑` и `↓`)."}, {"ol": ["**Принцип минимума энергии:** электроны всегда сначала занимают самые низкие по энергии (ближайшие к ядру) орбитали, а потом поднимаются выше. Такое состояние с минимальной энергией называется **основным**.", "**[[Принцип Паули]]:** на одной орбитали (в одной клетке) может находиться **не более двух электронов**, причём их спины обязаны быть противоположны (`↑↓`). Два электрона в одной клетке называют **спаренными** (электронной парой), один электрон в клетке — **неспаренным** (`↑`).", "**[[Правило Хунда]]:** в пределах одного подуровня (например, среди трёх одинаковых по энергии клеток `2p`) электроны сначала занимают **свободные клетки по одному** с параллельными спинами (`↑  ↑  ↑`), потому что одноимённые заряды отталкиваются и им выгоднее разойтись по разным комнатам. И только когда свободных клеток не осталось, электроны начинают подселяться вторыми, образуя пары (`↑↓  ↑  ↑`)."]}, {"svg": "<svg viewBox='0 0 460 250' xmlns='http://www.w3.org/2000/svg'><rect width='460' height='250' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Формы орбиталей и правило Хунда (2p-подуровень)<\/text><rect x='14' y='38' width='146' height='196' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='87' y='58' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-acc,#14b8a6)'>s- и p-орбитали<\/text><circle cx='87' cy='96' r='24' fill='var(--svg-acc,#14b8a6)' fill-opacity='0.22' stroke='var(--svg-acc,#14b8a6)' stroke-width='2'/><circle cx='87' cy='96' r='3' fill='var(--svg-gold,#e5a93c)'/><text x='87' y='136' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>s: сфера (1 ячейка)<\/text><ellipse cx='69' cy='174' rx='18' ry='11' fill='var(--svg-blue,#60a5fa)' fill-opacity='0.25' stroke='var(--svg-blue,#60a5fa)' stroke-width='2'/><ellipse cx='105' cy='174' rx='18' ry='11' fill='var(--svg-blue,#60a5fa)' fill-opacity='0.25' stroke='var(--svg-blue,#60a5fa)' stroke-width='2'/><circle cx='87' cy='174' r='3' fill='var(--svg-gold,#e5a93c)'/><text x='87' y='204' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>p: гантель<\/text><text x='87' y='221' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>(3 ячейки: x, y, z)<\/text><rect x='172' y='38' width='274' height='196' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='309' y='58' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>Заполнение 2p по правилу Хунда<\/text><text x='186' y='92' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>₆C (2p²)<\/text><rect x='254' y='72' width='30' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='269' y='93' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='288' y='72' width='30' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='303' y='93' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='322' y='72' width='30' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-line,#2a3f57)'/><text x='362' y='92' font-size='12' fill='var(--svg-good,#34c77b)'>2 неспар.<\/text><text x='186' y='140' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>₇N (2p³)<\/text><rect x='254' y='120' width='30' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='269' y='141' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='288' y='120' width='30' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='303' y='141' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='322' y='120' width='30' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='337' y='141' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><text x='362' y='140' font-size='12' fill='var(--svg-good,#34c77b)'>3 неспар.<\/text><text x='186' y='188' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>₈O (2p⁴)<\/text><rect x='254' y='168' width='30' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='269' y='189' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-blue,#60a5fa)'>↑↓<\/text><rect x='288' y='168' width='30' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='303' y='189' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='322' y='168' width='30' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='337' y='189' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><text x='362' y='188' font-size='12' fill='var(--svg-good,#34c77b)'>2 неспар.<\/text><text x='309' y='220' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Сначала по одному (↑), затем пары (↑↓)<\/text><\/svg>", "cap": "Формы s- и p-орбиталей и пошаговое заселение трёх 2p-ячеек у углерода, азота и кислорода по правилу Хунда."}, {"h": "4. Разбор вслух: считаем неспаренные электроны в основном состоянии"}, {"steps": ["**Задача:** Определи число неспаренных электронов в основном состоянии у `₄Be`, `₆C`, `₇N`, `₈O` и `₁₂Mg`.", "**Бериллий (`₄Be`) и магний (`₁₂Mg`):** у `Be` четыре электрона: `1s²` (пара `↑↓`) и `2s²` (пара `↑↓`). Все клетки заполнены парами → **0 неспаренных электронов**. Точно так же у `Mg` (`1s²2s²2p⁶3s²`), `He`, `Ne`, `Ar`, `Ca`, `Zn` — все электроны спарены (**0 неспаренных**).", "**Углерод (`₆C`):** `1s²2s²2p²`. Внутренние `1s²` и `2s²` полностью спарены. Остаются 2 электрона на трёх клетках `2p`. По правилу Хунда они садятся в две разные клетки (`↑  ↑  [ ]`), не образуя пару → **2 неспаренных электрона**.", "**Азот (`₇N`):** `1s²2s²2p³`. Три `2p`-электрона занимают все три клетки по одному (`↑  ↑  ↑`) → **3 неспаренных электрона** (максимум для `p`-подуровня).", "**Кислород (`₈O`):** `1s²2s²2p⁴`. Четвёртый `2p`-электрон вынужден подселиться в уже занятую клетку с противоположным спином (`↑↓  ↑  ↑`). Одна пара и два одиночных электрона → снова **2 неспаренных электрона**!"]}, {"warn": "Самая частая ошибка новичков — думать, что «2 электрона на `2p²` образуют пару, значит у углерода 0 неспаренных». Это прямое нарушение правила Хунда! А вторая ловушка — забыть, что **отсутствие неспаренных электронов (0)** бывает не только у благородных газов (`He, Ne, Ar, Kr`), но и у всех `s²`-элементов (`Be, Mg, Ca, Sr, Ba`) и у элементов с полностью закрытым `d`-подуровнем и парой `s²` (`₃₀Zn`: `[Ar]3d¹⁰4s²`). Также различай **спаренные электроны** (например, на внешнем слое `₆C` `2s²2p²` ровно `2` спаренных и `2` неспаренных электрона — их число равно; у `₈O` `2s²2p⁴` — `4` спаренных и `2` неспаренных) и **пустые (вакантные) орбитали** на внешнем подуровне: у `B` (`2p¹`) их `2`, у `C` (`2p²`) — `1`, а у `N, O, F` — `0`.", "t": "Ловушка ЕГЭ: 0 неспаренных — это не только инертные газы"}, {"bridge": {"kim": "№ 1 КИМ", "ask": "«Определите, атомы каких из указанных элементов в основном состоянии содержат ровно 2 (или 3, 1, 0) неспаренных электрона» или «не содержат неспаренных электронов».", "watch": "Считай неспаренные только на **недозаполненном** подуровне (закрытые `s²`, `p⁶`, `d¹⁰` всегда дают 0). Но для `d`-элементов с провалом (`Cr`, `Cu`) обязательно проверь оба подуровня `3d` и `4s` — об этом подробно в модуле 04!", "tip": "Для быстрой проверки `p`-элементов используй симметрию: `p¹` → 1, `p²` → 2, `p³` → 3, `p⁴` → 2, `p⁵` → 1, `p⁶` → 0. Для `d`-подуровня та же горка до 5: `d¹` → 1, `d²` → 2, `d³` → 3, `d⁴` → 4, `d⁵` → 5, `d⁶` → 4, `d⁷` → 3, `d⁸` → 2, `d⁹` → 1, `d¹⁰` → 0."}}], "short": [{"list": ["Число энергетических уровней атома равно номеру периода, а максимальная вместимость уровня — `2n²` (`2, 8, 18, 32`).", "На втором уровне (`n = 2`) есть только `2s` и `2p` — подуровня `2d` не существует.", "Число орбиталей (клеток) на подуровнях: `s = 1` (до `2 e⁻`), `p = 3` (до `6 e⁻`), `d = 5` (до `10 e⁻`), `f = 7` (до `14 e⁻`).", "По принципу Паули в одной клетке не больше двух электронов с противоположными спинами (`↑↓`); по правилу Хунда клетки одного подуровня сначала заполняются по одному (`↑`).", "В основном состоянии **0 неспаренных электронов** имеют благородные газы (`He, Ne, Ar, Kr`), элементы IIA группы (`Be, Mg, Ca, Sr, Ba`) и `Zn` (`[Ar]3d¹⁰4s²`)."]}]}, {"id": "03", "group": "Конфигурации", "nav": "Клечковский и s/p/d", "codes": ["1.1"], "eyebrow": "03 · Задание 1 · Код 1.1", "title": "Правило Клечковского, семейства s, p, d и подсчёт электронов", "lead": "Почему у калия (`Z = 19`) девятнадцатый электрон не садится на пустой 3d-подуровень третьего слоя, а «прыгает» на четвёртый уровень 4s — и как не попасться на задании из ДЕМО-2027?", "b": [{"key": "Подуровни заполняются не строго по номерам слоёв, а по возрастанию энергии — по **двухчастному правилу Клечковского (`n + l`)**. Из-за этого **`4s` заполняется раньше `3d`**, а тип элемента (`s`, `p` или `d`) определяется тем подуровнем, который заполняется **последним**.", "t": "Главная мысль."}, {"h": "1. Правило Клечковского: почему 4s опережает 3d"}, {"p": "В модуле 02 мы узнали, что электроны всегда выбирают состояние с минимальной энергией. Внутри первых трёх уровней всё идёт по порядку: `1s → 2s → 2p → 3s → 3p`. На этом моменте у аргона (`₁₈Ar`) набралось `18` электронов: `1s²2s²2p⁶3s²3p⁶`. Казалось бы, 19-й электрон у калия (`₁₉K`) должен пойти на свободный `3d`. Но в реальности он идёт на `4s`!"}, {"p": "Причина в том, что энергия подуровня зависит не только от номера слоя `n`, но и от формы орбитали, которую задаёт **орбитальное квантовое число `l`**: для `s` это `0`, для `p` — `1`, для `d` — `2`, для `f` — `3`. [[Правило Клечковского]] состоит из двух частей:"}, {"ol": ["**Часть 1:** подуровни заполняются в порядке возрастания суммы **`n + l`**.", "**Часть 2:** если у двух подуровней суммы `n + l` **одинаковы**, то раньше заполняется подуровень с **меньшим `n`**."]}, {"p": "Проверим это прямо на спорных парах:"}, {"list": ["`3p` (`3 + 1 = 4`) vs `4s` (`4 + 0 = 4`): суммы равны `4`, но у `3p` меньше `n` (`3 < 4`) → сначала заполняется **`3p`**, затем **`4s`**.", "`4s` (`4 + 0 = 4`) vs `3d` (`3 + 2 = 5`): `4 < 5` → сначала заполняется **`4s`**, и только потом **`3d`**!", "`3d` (`3 + 2 = 5`) vs `4p` (`4 + 1 = 5`): суммы равны `5`, но у `3d` меньше `n` (`3 < 4`) → сначала заполняется **`3d`**, затем **`4p`**."]}, {"svg": "<svg viewBox='0 0 460 264' xmlns='http://www.w3.org/2000/svg'><rect width='460' height='264' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Энергетическая лестница (правило Клечковского)<\/text><line x1='38' y1='244' x2='38' y2='44' stroke='var(--svg-dim,#94a8c0)' stroke-width='2'/><polygon points='38,38 33,48 43,48' fill='var(--svg-dim,#94a8c0)'/><text x='28' y='62' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-dim,#94a8c0)'>E<\/text><rect x='58' y='220' width='90' height='24' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='103' y='237' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>1s  (1+0=1)<\/text><rect x='58' y='190' width='90' height='24' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='103' y='207' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>2s  (2+0=2)<\/text><rect x='164' y='168' width='92' height='24' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='210' y='185' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>2p  (2+1=3)<\/text><rect x='58' y='142' width='90' height='24' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='103' y='159' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>3s  (3+0=3)<\/text><rect x='164' y='118' width='92' height='24' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='210' y='135' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>3p  (3+1=4)<\/text><rect x='58' y='92' width='90' height='24' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='103' y='109' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>4s  (4+0=4)<\/text><rect x='272' y='68' width='96' height='24' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='320' y='85' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>3d  (3+2=5)<\/text><rect x='164' y='44' width='92' height='24' rx='5' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='210' y='61' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>4p  (4+1=5)<\/text><path d='M 150 102 Q 210 92 268 81' fill='none' stroke='var(--svg-gold,#e5a93c)' stroke-width='2' stroke-dasharray='4,3'/><text x='352' y='124' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-gold,#e5a93c)'>Перехлёст!<\/text><text x='352' y='142' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>4s ниже 3d,<\/text><text x='352' y='158' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>поэтому 4s<\/text><text x='352' y='174' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>идёт раньше<\/text><text x='352' y='204' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Итог: 1s → 2s → 2p<\/text><text x='352' y='220' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>→ 3s → 3p → 4s → 3d → 4p<\/text><\/svg>", "cap": "Порядок заполнения подуровней 1–4 периодов по правилу Клечковского: энергия 4s (n+l=4) ниже энергии 3d (n+l=5)."}, {"h": "2. Как правильно записывать электронную конфигурацию"}, {"p": "В **полной электронной конфигурации** перечисляют все занятые подуровни, а число электронов на каждом подуровне пишут **строго верхним индексом**: например, у фосфора (`₁₅P`) — `1s²2s²2p⁶3s²3p³`. В **сокращённой записи** закрытую оболочку предыдущего благородного газа прячут в квадратные скобки: `[He]` = `1s²`, `[Ne]` = `1s²2s²2p⁶`, `[Ar]` = `1s²2s²2p⁶3s²3p⁶`, а для элементов 5-го периода используют **`[Kr]` = `1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶`** (`36 e⁻`). Тогда фосфор записывается кратко `[Ne]3s²3p³`, а стронций (`₃₈Sr`) — `[Kr]5s²`."}, {"p": "Для элементов 4-го периода начиная со скандия (`₂₁Sc`) важно различать **порядок заполнения** и **порядок записи по слоям**. Заполняется `4s`, а потом `3d`, но в итоговой формуле принято записывать слои по возрастанию номера `n` — сначала весь 3-й уровень (`3s²3p⁶3d^k`), затем 4-й (`4s^m`). Например, для титана (`₂₂Ti`): `1s²2s²2p⁶3s²3p⁶3d²4s²`, или кратко `[Ar]3d²4s²`. Такая запись сразу держит на правом краю **внешний** 4-й уровень — и в модулях 05 и 07 она спасёт тебя от ошибок с внешними электронами и ионами."}, {"h": "3. Классификация элементов: s-, p-, d- и f-семейства"}, {"p": "К какому электронному семейству относится элемент, определяется строго по **последнему заполняемому подуровню** его нейтрального атома в основном состоянии:"}, {"table": [["Семейство", "Последний подуровень", "Кто входит в 1–4 периодах", "Важная особенность для ЕГЭ"], ["**`s`-элементы**", "`ns`", "`H`, **`He`**, IA (`Li, Na, K`), IIA (`Be, Mg, Ca`)", "**Гелий (`₂He`, `1s²`) — это `s`-элемент**, хотя стоит в VIII группе!"], ["**`p`-элементы**", "`np`", "IIIA–VIIIA начиная с 2-го периода (`B–Ne`, `Al–Ar`, `Ga–Kr`)", "У `₃₁Ga–₃₆Kr` уже есть **полностью заполненный `3d¹⁰`** под внешним слоем!"], ["**`d`-элементы**", "`(n−1)d`", "Все побочные подгруппы 4-го периода: `₂₁Sc–₃₀Zn` (10 элементов)", "Заполняется **предвнешний** 3-й слой (`3d`), а внешний `4s` уже занят."], ["**`f`-элементы**", "`(n−2)f`", "Лантаноиды и актиноиды (внизу таблицы)", "В задании № 1 ЕГЭ их конфигурации не спрашивают."]]}, {"warn": "Две главные ловушки семейств: во-первых, **гелий (`₂He`)** никогда не относят к `p`-элементам — его конфигурация `1s²`, у него вообще нет `p`-электронов, он `s`-элемент. Во-вторых, у `p`-элементов 4-го периода (**`Ga, Ge, As, Se, Br, Kr`**) конфигурация имеет вид `[Ar]3d¹⁰4s²4p^k`, поэтому на вопрос «у каких элементов есть полностью заполненный `d`-подуровень?» подходят не только `Cu` и `Zn`, но и `Ga–Kr`!", "t": "Ловушка ЕГЭ: He — s-элемент, а у Ga–Kr есть 3d¹⁰"}, {"h": "4. Разбор вслух: конфигурации и задача № 1 из ДЕМО-2027"}, {"steps": ["**Пример А (построение по Клечковскому):** Составим конфигурации `₁₉K`, `₂₂Ti`, `₃₅Br` и элемента 5-го периода `₅₃I`. У `₁₉K` после аргона (`18 e⁻`) 19-й электрон идёт на `4s`: `1s²2s²2p⁶3s²3p⁶4s¹` (`[Ar]4s¹`, `s`-элемент). У `₂₂Ti` после `4s²` (20 `e⁻`) два электрона идут на `3d`: `1s²2s²2p⁶3s²3p⁶3d²4s²` (`[Ar]3d²4s²`, `d`-элемент). У `₃₅Br` заполняется `3d¹⁰` и пять электронов идут на `4p`: `1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁵` (`[Ar]3d¹⁰4s²4p⁵`, `p`-элемент с закрытым `3d¹⁰`). Дальше цепочка продолжается `4p → 5s → 4d → 5p → 6s`, поэтому у иода `₅₃I` конфигурация `[Kr]4d¹⁰5s²5p⁵` — у него сразу `20` `d`-электронов (`3d¹⁰ + 4d¹⁰`).", "**Пример Б (реальное задание № 1 из ДЕМО-2027 ФИПИ):** Дан ряд элементов: `1) O   2) F   3) Al   4) Si   5) Li`. *«Определите, атомы каких двух из указанных в ряду элементов в основном состоянии содержат такое же число `s`-электронов, как и катион натрия.»*", "**Шаг 1 — найдём число `s`-электронов у `Na⁺`:** нейтральный натрий `₁₁Na` имеет конфигурацию `1s²2s²2p⁶3s¹`. Отдав один электрон с внешнего `3s¹`, катион `Na⁺` получает конфигурацию `1s²2s²2p⁶`. Считаем **все** `s`-электроны: `1s²` (2) + `2s²` (2) = **4 `s`-электрона**.", "**Шаг 2 — считаем все `s`-электроны в каждом элементе ряда:** `1) O` (`1s²2s²2p⁴`) → `2 + 2 = 4`; `2) F` (`1s²2s²2p⁵`) → `2 + 2 = 4`; `3) Al` (`1s²2s²2p⁶3s²3p¹`) → `2 + 2 + 2 = 6`; `4) Si` (`1s²2s²2p⁶3s²3p²`) → `2 + 2 + 2 = 6`; `5) Li` (`1s²2s¹`) → `2 + 1 = 3`.", "**Шаг 3 — проверка и ответ:** ровно 4 `s`-электрона содержат кислород (`1`) и фтор (`2`). Ответ: **`12`** (в задании № 1 порядок цифр не важен, `21` тоже засчитывается)."]}, {"bridge": {"kim": "№ 1 КИМ", "ask": "«Содержат одинаковое число `s`- (или `p`-, `d`-) электронов», «число `p`-электронов равно числу `s`-электронов», «число `p`-электронов в два раза больше числа `s`-электронов».", "watch": "Если в условии **не сказано** «на внешнем уровне», то считают **все** `s`- или `p`-электроны **во всём атоме**! Например, у `₁₂Mg` (`1s²2s²2p⁶3s²`) всего `6` `s`-электронов и `6` `p`-электронов (`6 = 6`), как и у `₈O` (`1s²2s²2p⁴`: `4 = 4`). А на вопрос «содержат **только `s`-электроны** / не содержат `p`-электронов» подходят строго четыре элемента всей таблицы: **`H`, `He`, `Li`, `Be`**!", "tip": "Чтобы не сбиться при суммировании, всегда выписывай полную (не сокращённую!) конфигурацию для элементов 1–3 периодов и отдельно подчёркивай все `s` одной чертой, а все `p` — волнистой."}}], "short": [{"list": ["По двухчастному правилу Клечковского подуровни заполняются по росту `n + l`, а при равенстве — по росту `n`: `1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s → 4d → 5p`.", "Число электронов на подуровне всегда пишется верхним индексом (`3p⁴`, `4s²`), а у `d`-элементов 4-го периода слои записывают по возрастанию `n`: `[Ar]3d^k 4s^m`.", "Семейство (`s, p, d, f`) определяется последним заполняемым подуровнем: `₂He` (`1s²`) — `s`-элемент; `₂₁Sc–₃₀Zn` — `d`-элементы; `₃₁Ga–₃₆Kr` — `p`-элементы с закрытым `3d¹⁰`.", "При подсчёте «числа `s`- или `p`-электронов в атоме» (без оговорки «на внешнем уровне») складываются электроны со **всех** энергетических уровней атома."]}]}, {"id": "04", "group": "Конфигурации", "nav": "d-элементы и провал", "codes": ["1.1"], "eyebrow": "04 · Задание 1 · Код 1.1", "title": "d-элементы 4-го периода и провал электрона (Cr, Cu)", "lead": "Почему у хрома 6 неспаренных электронов вместо 4, а у меди на внешнем уровне всего 1 электрон, как у натрия? Разбираемся с главной ловушкой задания № 1.", "b": [{"key": "У десяти `d`-элементов 4-го периода (`₂₁Sc–₃₀Zn`) заполняется предвнешний `3d`-подуровень при уже занятом внешнем `4s`. У восьми из них внешний слой — `4s²`, а у двух — **хрома (`₂₄Cr`: `[Ar]3d⁵4s¹`)** и **меди (`₂₉Cu`: `[Ar]3d¹⁰4s¹`)** — происходит **провал электрона** с `4s` на `3d` ради повышенной устойчивости полузаполненного (`3d⁵`) или полностью заполненного (`3d¹⁰`) подуровня.", "t": "Главная мысль."}, {"h": "1. Как заполняется ряд Sc–Zn (21–30)"}, {"p": "В модуле 03 мы остановились на кальции (`₂₀Ca`: `[Ar]4s²`). Дальше, начиная со скандия (`₂₁Sc`), в игру вступает предвнешний `3d`-подуровень (5 ячеек, до 10 электронов). Внешний 4-й уровень при этом уже содержит два электрона `4s²`. Поэтому у обычного `d`-элемента при переходе к следующему номеру растёт только число `3d`-электронов: `Sc` (`3d¹4s²`), `Ti` (`3d²4s²`), `V` (`3d³4s²`)."}, {"p": "Казалось бы, у четвёртого по счёту `d`-элемента — **хрома (`₂₄Cr`)** — должно получиться `[Ar]3d⁴4s²`, а у девятого — **меди (`₂₉Cu`)** — `[Ar]3d⁹4s²`. Но природа вносит поправку, которую называют [[Провал электрона|провалом (или проскоком) электрона]]."}, {"h": "2. Почему происходит провал электрона у Cr и Cu"}, {"p": "Энергии подуровней `4s` и `3d` очень близки. При этом наполовину заполненный (`3d⁵` — во всех пяти ячейках по одному электрону с параллельными спинами) и полностью заполненный (`3d¹⁰` — во всех пяти ячейках по паре) подуровни обладают **дополнительной симметрией и выигрышем в энергии** (обменной устойчивостью)."}, {"p": "Когда до такого выгодного состояния не хватает всего **одного** электрона (`3d⁴` → `3d⁵` у хрома, `3d⁹` → `3d¹⁰` у меди), один электрон с внешнего `4s`-подуровня «перескакивает» (проваливается) на предвнешний `3d`-подуровень:"}, {"list": ["**Хром (`₂₄Cr`):** вместо `3d⁴4s²` образуется **`[Ar]3d⁵4s¹`**. В итоге: **`1` внешний электрон (`4s¹`)**, **`6` неспаренных электронов** (`5` на `3d` + `1` на `4s`) — рекорд среди всех элементов 1–4 периодов!", "**Медь (`₂₉Cu`):** вместо `3d⁹4s²` образуется **`[Ar]3d¹⁰4s¹`**. В итоге: **`1` внешний электрон (`4s¹`)**, **`1` неспаренный электрон** (на `4s¹`, так как весь `3d¹⁰` полностью спарен)."]}, {"svg": "<svg viewBox='0 0 460 246' xmlns='http://www.w3.org/2000/svg'><rect width='460' height='246' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Провал электрона (4s → 3d) у Cr и Cu<\/text><rect x='14' y='38' width='432' height='92' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='28' y='59' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>₂₄Cr: [Ar] 3d⁵ 4s¹  →  6 неспаренных, 1 внешний<\/text><text x='28' y='96' font-size='12' fill='var(--svg-dim,#94a8c0)'>3d⁵<\/text><rect x='60' y='74' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='77' y='95' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='98' y='74' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='115' y='95' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='136' y='74' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='153' y='95' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='174' y='74' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='191' y='95' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='212' y='74' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><text x='229' y='95' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-good,#34c77b)'>↑<\/text><text x='272' y='96' font-size='12' fill='var(--svg-dim,#94a8c0)'>4s¹<\/text><rect x='300' y='74' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='317' y='95' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><path d='M 317 72 Q 273 56 232 72' fill='none' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><polygon points='229,73 238,67 236,75' fill='var(--svg-good,#34c77b)'/><text x='348' y='88' font-size='12' fill='var(--svg-good,#34c77b)'>1 e⁻ с 4s<\/text><text x='348' y='104' font-size='12' fill='var(--svg-good,#34c77b)'>ушёл в 3d⁵<\/text><rect x='14' y='140' width='432' height='92' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='28' y='161' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>₂₉Cu: [Ar] 3d¹⁰ 4s¹  →  1 неспаренный, 1 внешний<\/text><text x='24' y='198' font-size='12' fill='var(--svg-dim,#94a8c0)'>3d¹⁰<\/text><rect x='60' y='176' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='77' y='197' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-blue,#60a5fa)'>↑↓<\/text><rect x='98' y='176' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='115' y='197' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-blue,#60a5fa)'>↑↓<\/text><rect x='136' y='176' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='153' y='197' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-blue,#60a5fa)'>↑↓<\/text><rect x='174' y='176' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='191' y='197' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-blue,#60a5fa)'>↑↓<\/text><rect x='212' y='176' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><text x='229' y='197' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-good,#34c77b)'>↑↓<\/text><text x='272' y='198' font-size='12' fill='var(--svg-dim,#94a8c0)'>4s¹<\/text><rect x='300' y='176' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='317' y='197' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><path d='M 317 174 Q 273 158 232 174' fill='none' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><polygon points='229,175 238,169 236,177' fill='var(--svg-good,#34c77b)'/><text x='348' y='190' font-size='12' fill='var(--svg-good,#34c77b)'>1 e⁻ с 4s<\/text><text x='348' y='206' font-size='12' fill='var(--svg-good,#34c77b)'>закрыл 3d¹⁰<\/text><\/svg>", "cap": "Графические ячейки 3d и 4s у хрома и меди: переход одного 4s-электрона создаёт устойчивые 3d⁵ и 3d¹⁰."}, {"h": "3. Полная таблица всех десяти d-элементов 4-го периода"}, {"table": [["Элемент (`Z`)", "Конфигурация", "Внешних (`4s`)", "Неспаренных `e⁻`", "Особенность"], ["`₂₁Sc`", "`[Ar]3d¹4s²`", "`2`", "`1`", "Начало `3d`-ряда"], ["`₂₂Ti`", "`[Ar]3d²4s²`", "`2`", "`2`", "Норма"], ["`₂₃V`", "`[Ar]3d³4s²`", "`2`", "`3`", "Норма"], ["**`₂₄Cr`**", "**`[Ar]3d⁵4s¹`**", "**`1`**", "**`6`**", "**Провал электрона (`3d⁵4s¹`)!**"], ["`₂₅Mn`", "`[Ar]3d⁵4s²`", "`2`", "`5`", "Устойчивый `3d⁵` + пара `4s²`"], ["`₂₆Fe`", "`[Ar]3d⁶4s²`", "`2`", "`4`", "Началось спаривание в `3d`"], ["`₂₇Co`", "`[Ar]3d⁷4s²`", "`2`", "`3`", "Норма"], ["`₂₈Ni`", "`[Ar]3d⁸4s²`", "`2`", "`2`", "Норма"], ["**`₂₉Cu`**", "**`[Ar]3d¹⁰4s¹`**", "**`1`**", "**`1`**", "**Провал электрона (`3d¹⁰4s¹`)!**"], ["`₃₀Zn`", "`[Ar]3d¹⁰4s²`", "`2`", "`0`", "Все электроны спарены (`0`)"]]}, {"h": "4. Что нужно знать про 5-й период (Mo, Ag)"}, {"p": "В 95% заданий № 1 ЕГЭ проверяют элементы 1–4 периодов, но иногда в ряду появляются элементы 5-го периода — прежде всего прямые аналоги хрома и меди: **молибден (`₄₂Mo`)** и **серебро (`₄₇Ag`)**. Посмотри на их положение прямо под `Cr` и `Cu` в таблице ФИПИ:"}, {"fig": "fipi_pshe_1_5", "file": "fipi_pshe_1_5.png", "t": "Периоды 1–5 таблицы ФИПИ: аналоги с провалом электрона (Cr → Mo в VIB, Cu → Ag в IB)"}, {"p": "У молибдена (`₄₂Mo`: `[Kr]4d⁵5s¹`) и серебра (`₄₇Ag`: `[Kr]4d¹⁰5s¹`) происходит точно такой же провал электрона с `5s` на `4d`, как у `Cr` и `Cu`."}, {"note": "В 5-м периоде провал электрона наблюдается также у `₄₁Nb` (`4d⁴5s¹`), `₄₄Ru` (`4d⁷5s¹`), `₄₅Rh` (`4d⁸5s¹`), а у палладия `₄₆Pd` проваливаются сразу оба электрона (`4d¹⁰5s⁰`, вообще нет электронов на 5-м уровне!). В реальных вариантах ЕГЭ эти редкие случаи не проверяют, но знать о них полезно для олимпиад и кругозора.", "t": "За рамками ЕГЭ — для понимания."}, {"h": "5. Разбор вслух: сравниваем Cr, Mn, Cu и Zn"}, {"steps": ["**Задача:** Для `Cr`, `Mn`, `Cu`, `Zn` определи: 1) число внешних электронов, 2) число неспаренных электронов, 3) общее число `s`-электронов во всём атоме.", "**Хром (`₂₄Cr`, `1s²2s²2p⁶3s²3p⁶3d⁵4s¹`):** внешних `1` (`4s¹`), неспаренных `5 + 1 = 6`, всего `s`-электронов `2 + 2 + 2 + 1 = 7` (нечётное число — важная примета провала!).", "**Марганец (`₂₅Mn`, `1s²2s²2p⁶3s²3p⁶3d⁵4s²`):** внешних `2` (`4s²`), неспаренных `5` (только на `3d⁵`, а `4s²` спарены), всего `s`-электронов `2 + 2 + 2 + 2 = 8`.", "**Медь (`₂₉Cu`, `1s²2s²2p⁶3s²3p⁶3d¹⁰4s¹`):** внешних `1` (`4s¹`), неспаренных `1` (только на `4s¹`, так как `3d¹⁰` полностью спарен), всего `s`-электронов `2 + 2 + 2 + 1 = 7`.", "**Цинк (`₃₀Zn`, `1s²2s²2p⁶3s²3p⁶3d¹⁰4s²`):** внешних `2` (`4s²`), неспаренных `0`, всего `s`-электронов `8`."]}, {"warn": "Обрати внимание на скрытую ловушку с **числом `s`-электронов у `Cr` и `Cu`**: из-за провала у них на `4s` остаётся `1` электрон, поэтому суммарно в атоме у них **`7` `s`-электронов** (`1s²2s²3s²4s¹`) — ровно столько же, сколько у калия (`₁₉K`)! Если забыть провал, получишь ошибочные `8` `s`-электронов.", "t": "Ловушка ЕГЭ: провал меняет даже сумму s-электронов!"}, {"bridge": {"kim": "№ 1 КИМ", "ask": "«На внешнем уровне содержится 1 электрон» (в ряду с `Li/Na/K` и `Cr/Cu`), «содержат 6 неспаренных электронов», «содержат одинаковое число `s`-электронов» (в паре `K` и `Cr`/`Cu`).", "watch": "Как только видишь в ряду из пяти элементов **`Cr` или `Cu`** — сразу мысленно ставь над ними восклицательный знак и пиши `3d⁵4s¹` и `3d¹⁰4s¹`. В 9 случаях из 10 составители добавили их в ряд именно ради проверки провала!", "tip": "Помни тройку-антипод: у `Cr` **1** внешний, **6** неспаренных, **7** всего `s`-электронов; у `Cu` **1** внешний, **1** неспаренный, **7** всего `s`-электронов."}}], "short": [{"list": ["У `d`-элементов 4-го периода (`₂₁Sc–₃₀Zn`) заполняется предвнешний `3d`-подуровень, а внешним остаётся 4-й уровень (`4s`).", "В 4-м периоде провал электрона с `4s` на `3d` происходит строго у двух элементов: **`₂₄Cr` (`[Ar]3d⁵4s¹`)** и **`₂₉Cu` (`[Ar]3d¹⁰4s¹`)**.", "У `Cr` — **1** внешний электрон, **6** неспаренных электронов и **7** `s`-электронов всего; у `Cu` — **1** внешний, **1** неспаренный и **7** `s`-электронов всего.", "У остальных восьми `d`-элементов 4-го периода (`Sc, Ti, V, Mn, Fe, Co, Ni, Zn`) на внешнем уровне находятся **2** электрона (`4s²`).", "В 5-м периоде аналогичный провал характерен для `₄₂Mo` (`[Kr]4d⁵5s¹`) и `₄₇Ag` (`[Kr]4d¹⁰5s¹`)."]}]}, {"id": "05", "group": "Сравнение оболочек", "nav": "Внешние vs валентные", "codes": ["1.1"], "eyebrow": "05 · Задание 1 · Код 1.1", "title": "Внешние, предвнешние и валентные электроны", "lead": "У хрома на внешнем уровне всего 1 электрон, а валентных — сразу 6. У магния, гелия и железа — одинаковая конфигурация внешнего уровня `ns²`. Разбираем самое коварное терминологическое различие в задании № 1.", "b": [{"key": "**Внешние электроны** — это строго электроны самого последнего слоя (`max n`). **Валентные электроны** — это электроны, участвующие в образовании химических связей: для `s`- и `p`-элементов они **совпадают с внешними** (`ns + np`), а для `d`-элементов (`Sc–Cu`) включают ещё и предвнешний `d`-подуровень (`ns + (n−1)d`), кроме стабильного `3d¹⁰` у цинка.", "t": "Главная мысль."}, {"h": "1. Внешние vs валентные: почему термины нельзя путать"}, {"p": "В главных подгруппах (у `s`- и `p`-элементов) ученики привыкают к простому совпадению: номер группы равен и числу [[Внешние электроны|внешних электронов]], и числу [[Валентные электроны|валентных электронов]]. Например, у фосфора (`₁₅P`, VA группа, `[Ne]3s²3p³`) на внешнем 3-м уровне `5` электронов, и все `5` — валентные."}, {"p": "Но как только появляется `d`-элемент (побочная подгруппа Б), эти два числа **расходятся**! Посмотри почему: у `d`-элементов 4-го периода энергии `4s` и `3d` почти одинаковы, поэтому в химических реакциях атом использует электроны **с обоих подуровней** (`3d` и `4s`). Значит, у `₂₄Cr` (`[Ar]3d⁵4s¹`) внешний уровень (`n = 4`) содержит только **`1`** электрон (`4s¹`), а валентных электронов у него **`5 + 1 = 6`** (именно поэтому высшая степень окисления хрома `+6`). У `₂₅Mn` (`[Ar]3d⁵4s²`) внешних **`2`**, а валентных **`5 + 2 = 7`**."}, {"compare": {"t": "Внешние vs валентные электроны по семействам", "cols": ["s- и p-элементы (подгруппа А)", "d-элементы Sc–Cu (подгруппа Б)"], "rows": [["Внешние электроны (`max n`)", "`ns + np` (равны номеру группы А; у `He` — 2)", "Только `ns` (`4s²` → 2; у `Cr, Cu` `4s¹` → 1)"], ["Валентные электроны", "`ns + np` (совпадают с внешними!)", "`ns + (n−1)d` (`Sc`=3, `Ti`=4, `V`=5, `Cr`=6, `Mn`=7, `Fe`=8...)"], ["Где лежат валентные `e⁻`", "Только на внешнем уровне (`n`)", "На внешнем `ns` **и** предвнешнем `(n−1)d`"]]}}, {"h": "2. Две тонкости на 100 баллов: цинк (Zn) и гелий (He)"}, {"list": ["**Тонкость цинка (`₃₀Zn`, `[Ar]3d¹⁰4s²`):** формально цинк — последний `d`-элемент 4-го периода. Но его `3d¹⁰`-подуровень полностью завершён и прочно «утоплен» вглубь оболочки, поэтому в химических связях `3d`-электроны цинка **не участвуют** (степень окисления цинка в соединениях всегда `+2`, никогда не выше). В ЕГЭ и учебнике Ерёмина у цинка считают **2 внешних и 2 валентных электрона (`4s²`)**. *(У меди `₂₉Cu` `3d`-электроны частично участвуют в связях — отсюда `Cu^{+2}`, поэтому формально в школьной модели к валентным относят все `11` электронов `3d¹⁰4s¹`, а у `Co` и `Ni` сумма `3d + 4s` равна `9` и `10`; однако в однозначных заданиях № 1 на подсчёт валентных у `d`-элементов ФИПИ обычно даёт `Sc–Fe`, особенно `Cr`, `Mn`, `Fe`, `V`, `Ti`.)*", "**Тонкость гелия (`₂He`, `1s²`):** гелий стоит в VIII группе, но на его единственном (внешнем) 1-м уровне всего **`2`** электрона, а не 8! Поэтому по числу внешних электронов и по формуле внешнего уровня (`ns²`) гелий попадает в одну компанию с `Be, Mg, Ca, Sr, Ba` и `d`-металлами без провала (`Sc–Ni, Zn`)."]}, {"svg": "<svg viewBox='0 0 460 226' xmlns='http://www.w3.org/2000/svg'><rect width='460' height='226' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Внешние (max n) vs Валентные электроны<\/text><rect x='14' y='40' width='136' height='170' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='82' y='60' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-acc,#14b8a6)'>₁₅P (p-элемент)<\/text><rect x='26' y='72' width='112' height='34' rx='6' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='82' y='94' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>3s² 3p³ (внешн.)<\/text><text x='82' y='132' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>Внешних: 5<\/text><text x='82' y='152' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-good,#34c77b)'>Валентных: 5<\/text><text x='82' y='182' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Совпадают<\/text><rect x='162' y='40' width='136' height='170' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='230' y='60' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>₂₄Cr (d-элемент)<\/text><rect x='174' y='72' width='112' height='26' rx='6' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='230' y='90' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>4s¹ (внешний)<\/text><rect x='174' y='104' width='112' height='26' rx='6' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)' stroke-width='2'/><text x='230' y='122' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-blue,#60a5fa)'>3d⁵ (предвн.)<\/text><text x='230' y='154' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>Внешних: 1<\/text><text x='230' y='174' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-good,#34c77b)'>Валентных: 6<\/text><text x='230' y='196' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>3d⁵ + 4s¹<\/text><rect x='310' y='40' width='136' height='170' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='378' y='60' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-blue,#60a5fa)'>₃₀Zn (d¹⁰ закрыт)<\/text><rect x='322' y='72' width='112' height='26' rx='6' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='378' y='90' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>4s² (внешний)<\/text><rect x='322' y='104' width='112' height='26' rx='6' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-line,#2a3f57)' stroke-dasharray='4,3'/><text x='378' y='122' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>3d¹⁰ (не валент.)<\/text><text x='378' y='154' text-anchor='middle' font-size='12' fill='var(--svg-ink,#e6eef7)'>Внешних: 2<\/text><text x='378' y='174' text-anchor='middle' font-size='12' font-weight='700' fill='var(--svg-good,#34c77b)'>Валентных: 2<\/text><text x='378' y='196' text-anchor='middle' font-size='12' fill='var(--svg-dim,#94a8c0)'>Только 4s²<\/text><\/svg>", "cap": "Сравнение внешних и валентных электронов у p-элемента (P), переходного d-элемента (Cr) и цинка (Zn) с инертным 3d¹⁰."}, {"h": "3. Одинаковая конфигурация внешнего уровня и «электроны до завершения»"}, {"p": "В ЕГЭ очень любят формулировку **«имеют одинаковую электронную конфигурацию внешнего энергетического уровня»** (в общем виде — через букву `n`). Здесь нужно смотреть **только** на внешний слой, отбросив всё внутреннее:"}, {"list": ["**`ns¹`** (1 внешний электрон): водород `H` (`1s¹`), все щелочные металлы (`Li, Na, K, Rb, Cs`) **+ элементы с провалом `Cr, Cu, Mo, Ag`**!", "**`ns²`** (2 внешних электрона): **гелий `He` (`1s²`)**, все элементы IIA группы (`Be, Mg, Ca, Sr, Ba`) **+ все `d`-элементы без провала (`Sc, Ti, V, Mn, Fe, Co, Ni, Zn`)**!", "**`ns²np^k`**: элементы одной главной подгруппы IIIA–VIIIA (кроме гелия!). Например, у `O` (`2s²2p⁴`) и `S` (`3s²3p⁴`) одинаковая конфигурация внешнего уровня `ns²np⁴`."]}, {"p": "Для быстрого сравнения **внешнего и предвнешнего (внутреннего) слоёв** удобно записывать электроны по слоям (суммируя все подуровни с одинаковым `n`): у `₄Be` это `2, 2` (внешний = внутреннему), у `₆C` — `2, 4` (внешний в 2 раза больше внутреннего), у `₁₂Mg` — `2, 8, 2`. Для `d`-элементов 4-го периода на **предвнешнем** 3-м слое лежат **все** электроны с `n = 3` (`3s² + 3p⁶ + 3d^k`), а не только `3d`: у `₂₄Cr` распределение по слоям **`2, 8, 13, 1`**, у `₂₆Fe` — **`2, 8, 14, 2`**, у `₂₉Cu` — **`2, 8, 18, 1`**! В условиях КИМ также встречаются общие формулы валентных электронов `d`-элементов вида **`(n−1)d⁵ns¹`** (`Cr, Mo`) или **`(n−1)d¹⁰ns²`** (`Zn, Cd`)."}, {"p": "Ещё одна популярная формулировка — **«до завершения внешнего энергетического уровня недостаёт `k` электронов»**. Для всех элементов начиная со 2-го периода под «завершением внешнего уровня» в ЕГЭ понимают устойчивый **октет** благородного газа (`ns²np⁶`, 8 электронов — не путай с «полностью заполненным уровнем» по формуле `2n²`, разницу разберём в модуле 08!), поэтому для `p`-элементов число недостающих электронов равно `8 − (число внешних e⁻)`: галогенам (`F, Cl, Br, I`) не хватает `1`, халькогенам (`O, S, Se`) — `2`, пниктогенам (`N, P, As`) — `3`, углероду и кремнию — `4`. А вот для **водорода (`H`, `1s¹`)** 1-й уровень вмещает максимум **2** электрона (дублет `1s²`), поэтому до завершения ему не хватает всего **1 электрона**, ровно как фтору и хлору!"}, {"h": "4. Разбор вслух: две классические задачи на внешние и валентные"}, {"steps": ["**Задача 1:** Из ряда `1) Li   2) B   3) Cr   4) Fe   5) N` выбери два элемента с одинаковой конфигурацией внешнего уровня.", "**Выписываем внешние уровни:** `Li` → `2s¹` (`ns¹`, **+**); `B` → `2s²2p¹`; `Cr` (`[Ar]3d⁵4s¹`) → `4s¹` (`ns¹`, **+**); `Fe` (`[Ar]3d⁶4s²`) → `4s²` (`ns²`); `N` → `2s²2p³`. Единственная пара с одинаковой внешней конфигурацией (`ns¹`) — `Li` и `Cr`. Ответ: **`13`**.", "**Задача 2:** Из ряда `1) P  2) V  3) Cr  4) Mg  5) Zn` выбери два элемента, у которых **число валентных электронов равно 5**.", "**Считаем валентные электроны:** `P` (`3s²3p³`) → **`5`**; `V` (`[Ar]3d³4s²`) → `3 + 2 = `**`5`**; `Cr` (`[Ar]3d⁵4s¹`) → `5 + 1 = 6`; `Mg` (`3s²`) → `2`; `Zn` (`[Ar]3d¹⁰4s²`) → `2` (`3d¹⁰` не валентен). Ответ: **`12`** (`P` и `V`)."]}, {"warn": "Осторожно с вопросом **«число внеш
