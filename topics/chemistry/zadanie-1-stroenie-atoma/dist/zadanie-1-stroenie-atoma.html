них электронов меньше числа валентных»** (или «валентные электроны находятся на `s`- и `d`-подуровнях»). Это прямой намёк на **переходные `d`-элементы (`Sc–Cu`)**, потому что у `s`- и `p`-элементов внешние всегда равны валентным, а у `Zn` `3d¹⁰` в связях не участвует!", "t": "Ловушка ЕГЭ: не приравнивай внешние и валентные у d-металлов"}, {"bridge": {"kim": "№ 1 КИМ", "ask": "«Имеют одинаковую конфигурацию внешнего уровня», «содержат одинаковое число валентных электронов», «число электронов на внешнем уровне равно 1 (или 2)», «до завершения внешнего уровня не хватает 1 электрона».", "watch": "Различай три слова: **внешние** (`max n`), **предвнешние** (`n − 1`, например `3d` в 4-м периоде) и **валентные** (`ns + np` или `ns + (n−1)d`). Для водорода «до завершения» = 1 электрон (до `1s²`), а не 7!", "tip": "Если в условии сказано «внешнего уровня» — смело вычёркивай всё, кроме максимального `n`. Если сказано «валентных» — для `d`-элементов `Sc–Cu` обязательно прибавляй `(n−1)d`."}}], "short": [{"list": ["Внешние электроны — только электроны уровня с максимальным `n`: у `d`-элементов 4-го периода это `4s²` (2) или `4s¹` (1 у `Cr`, `Cu`).", "Валентные электроны: у `s`- и `p`-элементов совпадают с внешними (`ns + np`), у `d`-элементов `Sc–Cu` равны сумме `ns + (n−1)d`, а у `Zn` закрытый `3d¹⁰` не валентен (только `4s²` — 2 валентных).", "Одинаковую внешнюю оболочку `ns¹` имеют `H`, IA группа, `Cr`, `Cu` (и `Mo, Ag`); оболочку `ns²` — `He`, IIA группа и все `d`-элементы без провала (`Sc–Ni, Zn`).", "До завершения внешнего уровня водороду `H` не хватает `1` электрона (до дублета `1s²`), так же как фтору и хлору (до октета `ns²np⁶`)."]}]}, {"id": "06", "group": "Состояния и ионы", "nav": "Возбуждённое состояние", "codes": ["1.1"], "eyebrow": "06 · Задание 1 · Код 1.1", "title": "Основное и возбуждённое состояния атома", "lead": "Почему углерод в основном состоянии имеет 2 неспаренных электрона, но в метане CH4 образует 4 связи — и почему азот, кислород и фтор так сделать НЕ могут?", "b": [{"key": "При переходе в **возбуждённое состояние** электронная пара внешнего уровня распадается, и один электрон переходит на **свободную орбиталь того же энергетического уровня `n`**. Для этого нужны сразу два условия: **неподелённая пара** и **пустая ячейка на том же `n`**. У `N`, `O` и `F` пустых ячеек на 2-м уровне нет (нет `2d`-подуровня!), поэтому они **не возбуждаются**.", "t": "Главная мысль."}, {"h": "1. Что такое возбуждённое состояние и когда оно возможно"}, {"p": "В основном состоянии электроны занимают самые низкие по энергии ячейки. Но если атом получает извне порцию энергии (например, при сближении с другими атомами в химической реакции), спаренные электроны могут «разъехаться» по разным комнатам. Такой переход называется [[Возбуждённое состояние|возбуждённым состоянием]] атома (обозначают звёздочкой, например `C*`)."}, {"p": "В школьной химии и на ЕГЭ рассматривают переходы **только в пределах одного и того же внешнего энергетического уровня `n`** (перескок на следующий этаж `n + 1` требует слишком большой энергии и в химических связях не окупается). Значит, атом способен перейти в возбуждённое состояние тогда и только тогда, когда на его внешнем уровне одновременно есть:"}, {"ol": ["**Электронная пара (`↑↓`)**, которую можно распарить.", "**Свободная (пустая) орбиталь (`[ ]`)** на том же уровне `n` (`np` или `nd`), куда может уйти второй электрон."]}, {"h": "2. Элементы 2-го периода: почему B и C возбуждаются, а N, O, F — нет"}, {"p": "Вспомни таблицу из модуля 02: на 2-м уровне (`n = 2`) есть **только `2s` (1 клетка) и `2p` (3 клетки)**, а подуровня `2d` не существует. Проверим каждый элемент 2-го периода:"}, {"list": ["**`₄Be` (`2s²2p⁰`):** есть пара `2s²` и три пустые клетки `2p` → переход `2s² → 2s¹2p¹` (было `0` неспаренных, стало **`2`**).", "**`₅B` (`2s²2p¹`):** есть пара `2s²` и две пустые клетки `2p` → переход `2s²2p¹ → 2s¹2p²` (было `1`, стало **`3`**).", "**`₆C` (`2s²2p²`):** есть пара `2s²` и одна пустая клетка `2p` → переход `2s²2p² → 2s¹2p³` (было `2`, стало **`4`** — отсюда четырёхвалентность углерода в органике и `CO2`!).", "**`₇N` (`2s²2p³`), `₈O` (`2s²2p⁴`), `₉F` (`2s²2p⁵`):** все три клетки `2p` уже заняты (у азота `↑ ↑ ↑`, у кислорода `↑↓ ↑ ↑`, у фтора `↑↓ ↑↓ ↑`), а подуровня **`2d` не существует**! Распаривать пару `2s²` (или `2p`-пары) просто **некуда**."]}, {"hint": "Почему тогда в азотной кислоте `HNO3` степень окисления азота `+5`, если его атом не возбуждается? Не путай степень окисления и валентность! У азота всего 4 орбитали на 2-м уровне (`2s` и три `2p`), поэтому его **максимальная валентность равна IV** (три связи по обменному механизму + одна по донорно-акцепторному за счёт пары `2s²`, как в `NH4⁺` или `HNO3`). Пять ковалентных связей азот образовать физически не может.", "t": "А как же азот с +5 в HNO3?"}, {"h": "3. Элементы 3-го периода: появление 3d-подуровня и ступени возбуждения"}, {"p": "Начиная с 3-го периода (`n = 3`) на внешнем уровне появляется пустой **`3d`-подуровень** (сразу 5 свободных клеток!). Это меняет всё: у фосфора (`P`), серы (`S`) и хлора (`Cl`) открывается возможность распаривать электроны на `3d` — причём у серы и хлора возбуждение идёт **ступенчато** (сначала распаривается первая пара, затем вторая, у хлора — даже третья):"}, {"table": [["Элемент", "Основное состояние (неспар.)", "1-е возбуждённое (неспар.)", "2-е возбуждённое (неспар.)", "3-е возбуждённое (неспар.)"], ["`₁₄Si`", "`3s²3p²` (`2`)", "`3s¹3p³` (`4`)", "—", "—"], ["`₁₅P`", "`3s²3p³` (`3`)", "`3s¹3p³3d¹` (`5`)", "—", "—"], ["`₁₆S`", "`3s²3p⁴` (`2`)", "`3s²3p³3d¹` (`4`)", "`3s¹3p³3d²` (`6`)", "—"], ["`₁₇Cl`", "`3s²3p⁵` (`1`)", "`3s²3p⁴3d¹` (`3`)", "`3s²3p³3d²` (`5`)", "`3s¹3p³3d³` (`7`)"]]}, {"p": "Заметь красивую закономерность: при каждом шаге возбуждения распадается **одна** пара, поэтому число неспаренных электронов всегда растёт ровно на **`+2`** (`2 → 4 → 6` у серы; `1 → 3 → 5 → 7` у хлора). И обрати внимание на порядок распаривания у `S` и `Cl`: сначала распадаются более близкие по энергии `3p`-пары (`3p → 3d`), и только в последнюю очередь — более глубокая `3s`-пара (`3s → 3d`)."}, {"svg": "<svg viewBox='0 0 460 256' xmlns='http://www.w3.org/2000/svg'><rect width='460' height='256' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Возбуждение: C и S (можно) vs N (запрет 2d)<\/text><rect x='14' y='38' width='432' height='62' rx='9' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='26' y='58' font-size='13' font-weight='700' fill='var(--svg-good,#34c77b)'>₆C*: 2s² 2p² → 2s¹ 2p³ (2 → 4 неспаренных)<\/text><text x='26' y='84' font-size='12' fill='var(--svg-dim,#94a8c0)'>2s¹<\/text><rect x='54' y='66' width='26' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)'/><text x='67' y='83' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><text x='92' y='84' font-size='12' fill='var(--svg-dim,#94a8c0)'>2p³<\/text><rect x='120' y='66' width='26' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='133' y='83' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='150' y='66' width='26' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='163' y='83' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='180' y='66' width='26' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><text x='193' y='83' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-good,#34c77b)'>↑<\/text><text x='220' y='83' font-size='12' fill='var(--svg-ink,#e6eef7)'>Есть пустая 2p-ячейка<\/text><rect x='14' y='108' width='432' height='68' rx='9' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='26' y='128' font-size='13' font-weight='700' fill='var(--svg-good,#34c77b)'>₁₆S (возб.): 3s²3p⁴ → 3s²3p³3d¹ (4) → 3s¹3p³3d² (6)<\/text><text x='26' y='158' font-size='12' fill='var(--svg-dim,#94a8c0)'>3s¹<\/text><rect x='54' y='140' width='24' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)'/><text x='66' y='157' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><text x='86' y='158' font-size='12' fill='var(--svg-dim,#94a8c0)'>3p³<\/text><rect x='112' y='140' width='24' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='124' y='157' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='139' y='140' width='24' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='151' y='157' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='166' y='140' width='24' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='178' y='157' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><text x='200' y='158' font-size='12' fill='var(--svg-dim,#94a8c0)'>3d²<\/text><rect x='228' y='140' width='24' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><text x='240' y='157' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-good,#34c77b)'>↑<\/text><rect x='255' y='140' width='24' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><text x='267' y='157' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-good,#34c77b)'>↑<\/text><rect x='282' y='140' width='24' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-line,#2a3f57)'/><rect x='309' y='140' width='24' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-line,#2a3f57)'/><rect x='336' y='140' width='24' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-line,#2a3f57)'/><text x='368' y='157' font-size='12' fill='var(--svg-good,#34c77b)'>Есть 3d!<\/text><rect x='14' y='184' width='432' height='58' rx='9' fill='var(--svg-surface,#162334)' stroke='var(--svg-bad,#ef6b6b)'/><text x='26' y='204' font-size='13' font-weight='700' fill='var(--svg-bad,#ef6b6b)'>₇N, ₈O, ₉F — НЕ возбуждаются (нет 2d-подуровня!)<\/text><text x='26' y='228' font-size='12' fill='var(--svg-dim,#94a8c0)'>2s²<\/text><rect x='54' y='210' width='26' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='67' y='227' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-blue,#60a5fa)'>↑↓<\/text><text x='92' y='228' font-size='12' fill='var(--svg-dim,#94a8c0)'>2p³<\/text><rect x='120' y='210' width='26' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='133' y='227' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='150' y='210' width='26' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='163' y='227' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='180' y='210' width='26' height='24' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='193' y='227' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><text x='220' y='227' font-size='12' font-weight='700' fill='var(--svg-bad,#ef6b6b)'>✕ 2d не существует → некуда идти<\/text><\/svg>", "cap": "Сравнение возбуждения углерода (пустая 2p), серы (пустой 3d) и азота (отсутствие 2d блокирует распаривание 2s²)."}, {"h": "4. Разбор вслух: кто может и кто не может перейти в возбуждённое состояние"}, {"steps": ["**Задача:** Дан ряд элементов: `1) N   2) P   3) O   4) S   5) F`. Определи, какие элементы ряда **не могут** перейти в возбуждённое состояние в пределах внешнего уровня, и выбери два элемента, которые **могут** иметь в возбуждённом состоянии 4 или 5 неспаренных электронов.", "**Проверяем 2-й период (`N, O, F`):** у всех троих `2p`-ячейки полностью заняты (нет ни одной пустой клетки), а `2d`-подуровня не существует. Значит, `N`, `O` и `F` в возбуждённое состояние **не переходят**.", "**Проверяем 3-й период (`P, S`):** у `₁₅P` (`3s²3p³`) есть пара `3s²` и пустой `3d` → переходит в `3s¹3p³3d¹` (**`5` неспаренных**). У `₁₆S` (`3s²3p⁴`) есть две пары (`3p` и `3s`) и пустой `3d` → первое возбуждённое `3s²3p³3d¹` (**`4` неспаренных**), второе `3s¹3p³3d²` (**`6` неспаренных**).", "**Проверка:** заметь, что щелочные металлы (`Li, Na, K`) и водород (`H`) тоже не распаривают электроны в пределах внешнего уровня, потому что у них на внешнем слое всего 1 электрон — **нет электронной пары**, которую можно было бы распарить!"]}, {"warn": "На ЕГЭ любят ловушку со словами **«в возбуждённом состоянии»**: например, «имеют в возбуждённом состоянии конфигурацию внешнего уровня `ns¹np²`» → это элементы IIIA группы (`B`, `Al`, `Ga`), а «`ns¹np³`» → элементы IVA группы (`C`, `Si`, `Ge`). Никогда не путай `O` с `S` и `N` с `P` — они в одних группах, но у 2-го периода (`N, O, F`) возбуждённого состояния нет!", "t": "Ловушка ЕГЭ: S возбуждается до 6 неспаренных, а O — нет!"}, {"bridge": {"kim": "№ 1 КИМ", "ask": "«В основном состоянии…» vs «в возбуждённом состоянии имеют `N` неспаренных электронов», «имеют в первом возбуждённом состоянии конфигурацию `ns¹np²` / `ns²np³nd¹`», «не способны переходить в возбуждённое состояние».", "watch": "Сразу обводи кружком слово **«основном»** или **«возбуждённом»** в условии! Углерод в основном имеет `2` неспаренных, а в возбуждённом — `4`; сера в основном `2`, в возбуждённом — `4` и `6`.", "tip": "Кто **НЕ** возбуждается в рамках ЕГЭ: 1) нет пары на внешнем слое (`H, Li, Na, K`); 2) нет свободных орбиталей на внешнем уровне (`He, Ne, N, O, F`)."}}], "short": [{"list": ["Возбуждённое состояние — распаривание электронной пары с переходом электрона на свободную орбиталь **того же** уровня `n`.", "Для возбуждения нужны оба условия: наличие пары (`↑↓`) и наличие пустой ячейки (`[ ]`) на том же уровне `n`.", "Во 2-м периоде возбуждаются `Be` (`2s¹2p¹`, 2 неспар.), `B` (`2s¹2p²`, 3 неспар.) и `C` (`2s¹2p³`, 4 неспар.).", "Атомы **`N`, `O`, `F`** не переходят в возбуждённое состояние, потому что все `2p`-ячейки заняты, а `2d`-подуровня не существует.", "В 3-м периоде `Mg` (`3s¹3p¹`), `Al` (`3s¹3p²`) и `Si` (`3s¹3p³`) возбуждаются за счёт пустых `3p`-орбиталей (как `Be, B, C`), а благодаря пустому `3d`-подуровню возбуждаются `P` (до 5 неспар.), `S` (4 и 6 неспар.) и `Cl` (3, 5 и 7 неспар.); точно так же в 4-м периоде `As, Se, Br` используют пустой `4d`-подуровень."]}]}, {"id": "07", "group": "Состояния и ионы", "nav": "Конфигурации ионов", "codes": ["1.1"], "eyebrow": "07 · Задание 1 · Код 1.1", "title": "Электронные конфигурации ионов и благородных газов", "lead": "Почему у катиона Fe^{2+} конфигурация [Ar]3d⁶, а не [Ar]3d⁴4s², и почему ион цинка Zn^{2+} ([Ar]3d¹⁰) НЕ имеет электронной конфигурации аргона?", "b": [{"key": "При образовании **катиона (`X^{k+}`)** атом отдаёт `k` электронов с **самого внешнего уровня** (у `d`-металлов 4-го периода **сначала уходят `4s`-электроны**, и только потом `3d`). При образовании **аниона (`X^{m−}`)** атом принимает `m` электронов на ближайший свободный подуровень. Конфигурацию **благородного газа** имеют только оболочки `1s²` (`[He]`) и `ns²np⁶` (`[Ne], [Ar], [Kr]`), но **не** 18-электронная `[Ar]3d¹⁰`!", "t": "Главная мысль."}, {"h": "1. Катионы, анионы и строгий стандарт записи зарядов"}, {"p": "Нейтральный атом может отдать или принять электроны — тогда число протонов в ядре (`Z`) остаётся прежним, а баланс зарядов нарушается и образуется **ион**:"}, {"list": ["**Катион (`X^{k+}`)** — положительно заряженный ион, который образуется при **отдаче** `k` электронов (`e⁻` стало меньше на `k`). Например: `₁₁Na` (`11 e⁻`) − `1 e⁻` → `Na⁺` (`10 e⁻`); `₂₀Ca` (`20 e⁻`) − `2 e⁻` → `Ca^{2+}` (`18 e⁻`).", "**Анион (`X^{m−}`)** — отрицательно заряженный ион, который образуется при **принятии** `m` электронов (`e⁻` стало больше на `m`). Например: `₁₆S` (`16 e⁻`) + `2 e⁻` → `S^{2−}` (`18 e⁻`); `₉F` (`9 e⁻`) + `1 e⁻` → `F⁻` (`10 e⁻`)."]}, {"warn": "Сразу привыкай к строгому стандарту части 2 ФИПИ (задания 29–30): **заряд иона** всегда пишется **цифрой перед знаком** (`Fe^{2+}`, `Fe^{3+}`, `O^{2−}`, `S^{2−}`, `Al^{3+}`), а **степень окисления** — **знаком перед цифрой** (`Fe^{+2}`, `O^{−2}`, `S^{−2}`). За перепутанный порядок знака и цифры в ионных уравнениях на ЕГЭ снимают балл!", "t": "Стандарт ЕГЭ: заряд иона (2+) vs степень окисления (+2)"}, {"h": "2. Главное правило ионизации d-металлов: 4s уходит раньше 3d!"}, {"p": "В модуле 03 мы видели, что при **заполнении** нейтрального атома `4s` идёт раньше `3d`. Но как только `3d`-подуровень начал заполняться, электроны на `3d` оказываются **ближе к ядру** (на 3-м слое), а `4s`-электроны остаются на **самом дальнем, внешнем 4-м слое**. Оторвать электрон легче с внешнего слоя, поэтому действует железное правило:"}, {"hint": "При ионизации любого `d`-металла 4-го периода электроны **всегда сначала уходят с внешнего `4s`-подуровня**, и только после полного опустошения `4s` — с предвнешнего `3d`-подуровня! Именно поэтому в модуле 03 мы договорились сразу писать `...3d^k 4s^m` — внешний `4s` стоит справа на краю и уходит первым.", "t": "Почему 4s заполняется раньше 3d, но уходит тоже раньше?"}, {"svg": "<svg viewBox='0 0 460 242' xmlns='http://www.w3.org/2000/svg'><rect width='460' height='242' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' font-size='15' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Ионизация d-металла: Fe → Fe²⁺ → Fe³⁺<\/text><rect x='14' y='38' width='432' height='58' rx='9' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='26' y='62' font-size='13' font-weight='700' fill='var(--svg-ink,#e6eef7)'>Fe ([Ar] 3d⁶ 4s²)<\/text><text x='26' y='82' font-size='12' fill='var(--svg-dim,#94a8c0)'>4 неспаренных<\/text><rect x='164' y='52' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='177' y='70' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-blue,#60a5fa)'>↑↓<\/text><rect x='194' y='52' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='207' y='70' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='224' y='52' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='237' y='70' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='254' y='52' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='267' y='70' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='284' y='52' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='297' y='70' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='332' y='52' width='28' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><text x='346' y='70' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-bad,#ef6b6b)'>↑↓<\/text><text x='366' y='69' font-size='12' font-weight='700' fill='var(--svg-bad,#ef6b6b)'>4s² уходят<\/text><text x='366' y='84' font-size='12' fill='var(--svg-bad,#ef6b6b)'>первыми<\/text><rect x='14' y='104' width='432' height='58' rx='9' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='26' y='128' font-size='13' font-weight='700' fill='var(--svg-gold,#e5a93c)'>Fe²⁺ ([Ar] 3d⁶ 4s⁰)<\/text><text x='26' y='148' font-size='12' fill='var(--svg-dim,#94a8c0)'>4 неспаренных<\/text><rect x='164' y='118' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><text x='177' y='136' text-anchor='middle' font-size='13' font-weight='700' fill='var(--svg-blue,#60a5fa)'>↑↓<\/text><rect x='194' y='118' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='207' y='136' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='224' y='118' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='237' y='136' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='254' y='118' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='267' y='136' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='284' y='118' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='297' y='136' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-gold,#e5a93c)'>↑<\/text><rect x='332' y='118' width='28' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-line,#2a3f57)' stroke-dasharray='3,3'/><text x='366' y='135' font-size='12' fill='var(--svg-dim,#94a8c0)'>4s пуст;<\/text><text x='366' y='150' font-size='12' fill='var(--svg-dim,#94a8c0)'>−1 e⁻ с 3d<\/text><rect x='14' y='170' width='432' height='58' rx='9' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)'/><text x='26' y='194' font-size='13' font-weight='700' fill='var(--svg-good,#34c77b)'>Fe³⁺ ([Ar] 3d⁵ 4s⁰)<\/text><text x='26' y='214' font-size='12' fill='var(--svg-good,#34c77b)'>5 неспаренных<\/text><rect x='164' y='184' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='177' y='202' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-good,#34c77b)'>↑<\/text><rect x='194' y='184' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='207' y='202' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-good,#34c77b)'>↑<\/text><rect x='224' y='184' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='237' y='202' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-good,#34c77b)'>↑<\/text><rect x='254' y='184' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='267' y='202' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-good,#34c77b)'>↑<\/text><rect x='284' y='184' width='26' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='297' y='202' text-anchor='middle' font-size='14' font-weight='700' fill='var(--svg-good,#34c77b)'>↑<\/text><rect x='332' y='184' width='28' height='26' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-line,#2a3f57)' stroke-dasharray='3,3'/><text x='366' y='201' font-size='12' font-weight='700' fill='var(--svg-good,#34c77b)'>Устойчив.<\/text><text x='366' y='216' font-size='12' fill='var(--svg-good,#34c77b)'>3d⁵-слой<\/text><\/svg>", "cap": "Пошаговая ионизация железа: при образовании Fe²⁺ уходит пара 4s², а при переходе в Fe³⁺ — один электрон из пары 3d, образуя устойчивый полузаполненный 3d⁵."}, {"h": "3. Изоэлектронные частицы и ловушка «конфигурация инертного газа»"}, {"p": "Частицы разных элементов с одинаковым числом электронов и одинаковой электронной конфигурацией называются [[Изоэлектронные частицы|изоэлектронными]]. На ЕГЭ регулярно проверяют три главных изоэлектронных ряда благородных газов:"}, {"table": [["Благородный газ", "Конфигурация", "Кто имеет такую же конфигурацию (изоэлектронный ряд)"], ["**`₂He`** (`2 e⁻`)", "`1s²`", "`H⁻`, `Li⁺`, `Be^{2+}`"], ["**`₁₀Ne`** (`10 e⁻`)", "`1s²2s²2p⁶`", "`N^{3−}`, `O^{2−}`, `F⁻`, `Na⁺`, `Mg^{2+}`, `Al^{3+}`"], ["**`₁₈Ar`** (`18 e⁻`)", "`1s²2s²2p⁶3s²3p⁶`", "`P^{3−}`, `S^{2−}`, `Cl⁻`, `K⁺`, `Ca^{2+}`, **`Sc^{3+}`**"], ["**`₃₆Kr`** (`36 e⁻`)", "`[Ar]3d¹⁰4s²4p⁶`", "`Se^{2−}`, `Br⁻`, `Rb⁺`, `Sr^{2+}`"]]}, {"warn": "Тончайшая ловушка на 95–100 баллов! Посмотри на ионы **`Cu⁺`**, **`Zn^{2+}`**, **`Ga^{3+}`** и **`Ge^{4+}`**. У всех четверых остаётся `28` электронов, и их конфигурация — **`[Ar]3d¹⁰`** (`1s²2s²2p⁶3s²3p⁶3d¹⁰`). У них **НЕ** конфигурация аргона (`18 e⁻`) и **НЕ** конфигурация криптона (`36 e⁻`)! Это 18-электронная (псевдоинертная) внешняя оболочка 3-го слоя (`3s²3p⁶3d¹⁰`). Зато у **`Sc^{3+}`** (отдал `4s²` и `3d¹`) остаётся ровно `[Ar]` — конфигурация благородного газа! И не попадись на катион водорода **`H⁺`**: у него вообще **`0` электронов**, поэтому в отличие от гидрид-иона `H⁻` (`1s²` = `[He]`) катион `H⁺` **не имеет** конфигурации благородного газа.", "t": "Ловушка ЕГЭ: [Ar]3d¹⁰ — это НЕ конфигурация благородного газа!"}, {"h": "4. Разбор вслух: составляем конфигурации сложных ионов"}, {"steps": ["**Задача:** Составь электронные конфигурации ионов `S^{2−}`, `Ca^{2+}`, `Sc^{3+}`, `Cr^{3+}`, `Fe^{2+}`, `Fe^{3+}`, `Cu⁺`, `Zn^{2+}`, `Ga^{3+}` и укажи, какие из них имеют конфигурацию благородного газа.", "**`S^{2−}` (`16 + 2 = 18 e⁻`):** атом серы `[Ne]3s²3p⁴` принимает 2 электрона в `3p` → `[Ne]3s²3p⁶` = **`[Ar]`** (конфигурация аргона — ДА).", "**`Ca^{2+}` (`20 − 2 = 18 e⁻`):** атом кальция `[Ar]4s²` отдаёт `4s²` → **`[Ar]`** (ДА).", "**`Sc^{3+}` (`21 − 3 = 18 e⁻`):** атом скандия `[Ar]3d¹4s²` отдаёт сначала `4s²`, затем `3d¹` → **`[Ar]`** (ДА).", "**`Cr^{3+}` (`24 − 3 = 21 e⁻`):** атом хрома `[Ar]3d⁵4s¹` отдаёт `1` электрон с `4s¹` и `2` электрона с `3d⁵` → **`[Ar]3d³`** (`3` неспаренных; НЕТ).", "**`Fe^{2+}` и `Fe^{3+}`:** атом железа `[Ar]3d⁶4s²` → у `Fe^{2+}` уходят `4s²` → **`[Ar]3d⁶`** (`4` неспаренных); у `Fe^{3+}` уходит ещё 1 электрон с `3d` → **`[Ar]3d⁵`** (`5` неспаренных; НЕТ).", "**`Cu⁺`, `Zn^{2+}`, `Ga^{3+}` (`28 e⁻`):** `Cu` (`[Ar]3d¹⁰4s¹`) − `1 e⁻` (с `4s¹`) → `[Ar]3d¹⁰`; `Zn` (`[Ar]3d¹⁰4s²`) − `2 e⁻` (с `4s²`) → `[Ar]3d¹⁰`; `Ga` (`[Ar]3d¹⁰4s²4p¹`) − `3 e⁻` (с `4p¹` и `4s²`) → **`[Ar]3d¹⁰`** (у всех троих 0 неспаренных, но это **НЕ** конфигурация благородного газа!)."]}, {"bridge": {"kim": "№ 1 КИМ", "ask": "«Анионы / катионы каких элементов имеют конфигурацию неона (аргона, инертного газа)», «катионы `X^{2+}` / `X^{3+}` содержат одинаковое число неспаренных электронов», «число `s`-электронов в атоме такое же, как в катионе `Na⁺` (или `Fe^{2+}`)».", "watch": "Если в условии дана формула иона `d`-металла (например, `Cr^{3+}` или `Fe^{2+}`), помни: у него **нет** `4s`-электронов! Значит, число `s`-электронов у `Fe^{2+}` равно `6` (`1s²2s²3s²`), а не `8`!", "tip": "Для любого иона делай строго два шага: 1) запиши конфигурацию нейтрального атома (с учётом провала у `Cr`, `Cu`); 2) убери/добавь электроны с **крайнего правого** (внешнего) уровня."}}], "short": [{"list": ["Заряд иона пишется цифрой перед знаком (`Fe^{2+}`, `S^{2−}`), а степень окисления — знаком перед цифрой (`Fe^{+2}`, `S^{−2}`).", "При образовании катионов `d`-металлов 4-го периода электроны всегда сначала уходят с внешнего `4s`, и только затем с `3d` (`Fe^{2+} = [Ar]3d⁶`, `Fe^{3+} = [Ar]3d⁵`, `Cr^{3+} = [Ar]3d³`).", "Конфигурацию благородного газа имеют ионы с оболочкой `1s²` или `ns²np⁶` (например, `Li⁺`, `O^{2−}`, `Na⁺`, `S^{2−}`, `Ca^{2+}`, `Sc^{3+}`).", "Ионы `Cu⁺`, `Zn^{2+}`, `Ga^{3+}`, `Ge^{4+}` имеют оболочку `[Ar]3d¹⁰` (`28 e⁻`) и **не** обладают электронной конфигурацией благородного газа."]}]}, {"id": "08", "group": "КИМ на 100%", "nav": "Стратегия № 1 КИМ", "codes": ["1.1"], "eyebrow": "08 · Задание 1 · Код 1.1", "title": "Все формулировки задания № 1 КИМ и алгоритм безошибочного решения", "lead": "Почему выпускники, знающие всю теорию, теряют 1 балл в задании № 1 за 10 секунд? Потому что путают одно слово в условии. Собираем все 12 типов формулировок ФИПИ в единый боевой алгоритм.", "b": [{"key": "В задании № 1 всегда даны **5 элементов** и нужно выбрать ровно **2** номера (порядок цифр не важен, `1` первичный балл). Безошибочная стратегия занимает 60–90 секунд: **сначала выпиши конфигурации всех пяти элементов**, затем **подчеркни слова-переключатели в условии** и проверь каждый элемент по всем критериям сразу.", "t": "Главная мысль."}, {"h": "1. Слова-переключатели: навигатор по всем 12 формулировкам КИМ"}, {"p": "Разработчики ФИПИ редко придумывают новую теорию — вместо этого они комбинируют знакомые понятия через короткие слова-переключатели. Посмотри на полную карту всех 12 типов заданий № 1:"}, {"table": [["№", "Что спрашивают в КИМ № 1", "Куда смотреть в конфигурации", "Главная ловушка"], ["1", "Число **протонов / нейтронов** (`p = n`)", "`p = Z`, `n = A − Z` (основной изотоп)", "У `Cl` (`35,45`) нет изотопа с `p = n`"], ["2", "Число **неспаренных `e⁻`** (основное сост.)", "Ячейки недозаполненного подуровня (Хунд)", "`Cr` (`6`), `Cu` (`1`), `Zn`/`Mg`/`He` (`0`)"], ["3", "**Общее число** `s`-, `p`- или `d`-электронов", "Сумма по **всем** уровням атома", "Посчитать только внешний слой; забыть `4s¹` у `Cr`/`Cu`"], ["4", "**Семейство** (`s, p, d`) или закрытый `3d¹⁰`", "Последний заполняемый подуровень", "`He` — `s`-элемент; у `Ga–Kr` есть `3d¹⁰`"], ["5", "**Провал электрона** (`1` внешний у `d`)", "`Cr` (`3d⁵4s¹`), `Cu` (`3d¹⁰4s¹`), `Mo`, `Ag`", "Написать `3d⁴4s²` или `3d⁹4s²`"], ["6", "Одинаковая конфигурация **внешнего уровня**", "Только `max n` (`ns¹`, `ns²`, `ns²np^k`)", "`Cr, Cu` в `ns¹`; `He` и `Sc–Ni, Zn` в `ns²`"], ["7", "**Внешние** vs **валентные** электроны", "Внешние = `max n`; валентные = `ns + (n−1)d` (`Sc–Cu`)", "Приравнять у `Cr, Mn, Fe`; включить `3d¹⁰` у `Zn`"], ["8", "**Недостаёт** `e⁻` до завершения внешнего уровня", "`8 − внешние` (для `n ≥ 2`), **`2 − 1 = 1` для `H`**", "Считать «до 8» для водорода `H`"], ["9", "**Возбуждённое состояние** (возможность / неспар.)", "Есть пара + пустая орбиталь того же `n`", "`N, O, F` **не возбуждаются** (нет `2d`!)"], ["10", "Конфигурация **иона** / **благородного газа**", "Для `d`-катионов сначала убрать `4s`", "`[Ar]3d¹⁰` (`Zn²⁺, Ga³⁺, Cu⁺`) ≠ аргон!"], ["11", "Число **занятых уровней / подуровней / орбиталей**", "Уровни = период; подуровни = число слагаемых; орбитали = клетки", "Спутать «содержащий `e⁻`» и «полностью заполненный»"], ["12", "**Комбинированное условие** (2 признака сразу)", "Проверять **оба** признака для каждого из 5 элементов", "Отсеять только по первому признаку"]]}, {"h": "2. Интерактивное дерево выбора стратегии"}, {"tree": {"t": "Как мгновенно выбрать способ решения задания № 1", "root": {"q": "В условии упоминается ИОН (катион / анион / степень окисления +k или −m)?", "yes": {"a": "Шаг 1: напиши нейтральный атом (помни про Cr/Cu). Шаг 2: отними электроны с внешнего слоя (у d-металлов сначала 4s!) или добавь на ближайший свободный. Проверь, не попалась ли псевдоинертная ловушка [Ar]3d¹⁰.", "why": "Для ионов d-металлов удаление с 3d вместо 4s — самая частая причина потери балла."}, "no": {"q": "В условии есть слова «возбуждённое состояние»?", "yes": {"a": "Сразу вычеркни N, O, F, He, Ne (нет свободных орбиталей на том же n) и H, Li, Na, K (нет пары). Для остальных распаривай пары в пределах того же уровня n (сначала np → nd, затем ns → nd).", "why": "На 2-м уровне нет 2d-подуровня, поэтому N, O, F не возбуждаются, а P, S, Cl распаривают пары на 3d."}, "no": {"q": "Спрашивают про «внешний уровень» или «валентные электроны»?", "yes": {"a": "Если «внешний» — смотри только max n (для d-элементов 4s¹ или 4s²; He = 1s²). Если «валентные» — для s/p это ns+np, для Sc–Cu это ns+(n−1)d, для Zn только 4s² (2).", "why": "У переходных d-металлов число внешних (1 или 2) и число валентных электронов не совпадают."}, "no": {"a": "Выпиши полные конфигурации всех 5 элементов (учитывая провал Cr/Cu) и аккуратно посчитай по условию: неспаренные по Хунду, сумму всех s/p/d-электронов или p=n в ядре.", "why": "Полная запись на черновике исключает пропуск внутренних s- и p-электронов и путаницу между уровнями и орбиталями."}}}}}}, {"h": "3. Единый 5-шаговый алгоритм решения на экзамене"}, {"ol": ["**Найди все 5 элементов в таблице ФИПИ:** подпиши прямо в КИМ их `Z`, период и подгруппу (`А` или `Б`).", "**Выпиши конфигурации всех пяти элементов:** для 1–3 периодов — полную, для 4-го — `[Ar]3d^k 4s^m`, сразу помечая восклицательным знаком `Cr` (`3d⁵4s¹`) и `Cu` (`3d¹⁰4s¹`).", "**Подчеркни слова-переключатели в условии:** *основное/возбуждённое*, *внешние/валентные/всего*, *полностью заполненные/содержащие электроны*, *атом/ион*.", "**Поставь «+» или «−» каждому из пяти элементов** (проверив **все** части условия, если оно комбинированное).", "**Сверь число ответов:** в задании № 1 их всегда ровно **два**. Если получилось три — ищи пропущенную тонкость (`He`, `Cr`, `Cu`, `Zn`, `N/O/F`, `[Ar]3d¹⁰`). Запиши две цифры без пробелов (порядок не важен)."]}, {"h": "4. Пять полных экзаменационных разборов сложных прототипов"}, {"steps": ["**Прототип 1 (провал + внешний уровень `ns¹`):** Ряд: `1) K   2) Be   3) Cu   4) N   5) P`. *Условие:* «На внешнем энергетическом уровне в основном состоянии находится ровно 1 электрон». **Разбор:** `K` (`[Ar]4s¹` → `1`, **+**), `Be` (`2s²` → `2`), `Cu` (`[Ar]3d¹⁰4s¹` → провал! **`1`**, **+**), `N` (`2s²2p³` → `5`), `P` (`3s²3p³` → `5`). **Ответ: `13`.**", "**Прототип 2 (валентные vs внешние электроны):** Ряд: `1) Cr   2) S   3) Mn   4) Mg   5) Zn`. *Условие:* «Число валентных электронов равно 6». **Разбор:** `Cr` (`[Ar]3d⁵4s¹` → валентные `3d⁵ + 4s¹` = **`6`**, **+**), `S` (`[Ne]3s²3p⁴` → **`6`**, **+**), `Mn` (`3d⁵4s²` → `7`), `Mg` (`3s²` → `2`), `Zn` (`[Ar]3d¹⁰4s²` → `3d¹⁰` не валентен → `2`). **Ответ: `12`.**", "**Прототип 3 (возбуждённое состояние и запрет `2d`):** Ряд: `1) N   2) S   3) O   4) Cl   5) C`. *Условие:* «В возбуждённом состоянии могут иметь конфигурацию внешнего уровня `ns²np³nd¹` (4 неспаренных электрона)» — или «не способны переходить в возбуждённое состояние». **Разбор:** не способны возбуждаться `N` (`1`) и `O` (`3`) из-за отсутствия `2d` (ответ **`13`**). А если спрашивают именно про `ns²np³nd¹`, то это `S` (`3s²3p³3d¹` — 1-е возбуждённое), а `C` даёт `2s¹2p³` (нет `d`!), `Cl` даёт `3s²3p⁴3d¹` / `3s²3p³3d²` / `3s¹3p³3d³`.", "**Прототип 4 (ионы `d`-металлов и конфигурация аргона):** Ряд: `1) Sc   2) Zn   3) Ca   4) Ga   5) Fe`. *Условие:* «При образовании катиона в высшей (или характерной) степени окисления (`Sc^{3+}`, `Zn^{2+}`, `Ca^{2+}`, `Ga^{3+}`, `Fe^{3+}`) приобретают электронную конфигурацию аргона». **Разбор:** `Sc^{3+}` = `[Ar]` (**+**), `Ca^{2+}` = `[Ar]` (**+**), `Zn^{2+}` = `[Ar]3d¹⁰` (**−**, не аргон!), `Ga^{3+}` = `[Ar]3d¹⁰` (**−**), `Fe^{3+}` = `[Ar]3d⁵` (**−**). **Ответ: `13`.**", "**Прототип 5 (общее число `s`- и `p`-электронов в атоме):** Ряд: `1) Be   2) C   3) O   4) Mg   5) Si`. *Условие:* «В основном состоянии содержат одинаковое число `s`- и `p`-электронов во всём атоме». **Разбор:** `Be` (`1s²2s²`: `4 s-e⁻`, `0 p-e⁻`), `C` (`1s²2s²2p²`: `4 s-e⁻`, `2 p-e⁻`), `O` (`1s²2s²2p⁴`: **`4 s-e⁻ = 4 p-e⁻`**, **+**), `Mg` (`1s²2s²2p⁶3s²`: **`6 s-e⁻ = 6 p-e⁻`**, **+**), `Si` (`1s²2s²2p⁶3s²3p²`: `6 s-e⁻`, `8 p-e⁻`). **Ответ: `34`.**"]}, {"warn": "Отдельно различай четыре термина и два похожих определения: **«уровень, содержащий электроны»** (= номер периода), **«завершённый внешний уровень»** (октет `ns²np⁶` или дублет `1s²`, например у `₁₈Ar` внешний уровень завершён), **«полностью заполненный уровень»** (по формуле `2n²`: у `₁₁Na`, `₁₈Ar` и `₁₉K–₂₈Ni` полностью заполнены только `2` уровня — 1-й и 2-й, потому что 3-й вмещает `18 e⁻` и на нём пуст или недозаполнен `3d`! Полностью заполненным 3-й уровень становится только начиная с **`₂₉Cu` и `₃₀Zn`** — `3s²3p⁶3d¹⁰ = 18 e⁻` — и далее у `Ga–Kr`), **«занятый подуровень»** (число слагаемых в полной записи: у `C` `1s²2s²2p²` их `3`) и **«занятая орбиталь»** (клетка с хотя бы одним электроном: у `C` их `1 + 1 + 2 = 4`, а полностью заполненных орбиталей — `2`).", "t": "Ловушка на 100 баллов: уровень vs подуровень vs орбиталь"}, {"bridge": {"kim": "№ 1 КИМ", "ask": "Любая из 12 формулировок задания № 1 ЕГЭ-2027 (базовый уровень, 1 балл, порядок двух цифр в бланке не имеет значения).", "watch": "Самая дорогая ошибка — решать задание № 1 в уме без записи конфигураций на черновике. Запись 5 конфигураций занимает 25 секунд и отсекает 99% случайных промахов.", "tip": "После того как нашёл две цифры ответа, перечитай условие ещё раз с конца и проверь, что оба выбранных элемента удовлетворяют **каждому** слову вопроса."}}], "short": [{"list": ["В задании № 1 всегда ровно 2 верных ответа из 5 элементов (1 балл, порядок цифр не важен).", "Всегда начинай с выписывания конфигураций всех пяти элементов ряда и сразу помечай `Cr`, `Cu`, `He`, `Zn`, `N/O/F`.", "Подчёркивай слова-переключатели: *основное/возбуждённое*, *внешние/валентные/всего*, *атом/ион*, *полностью заполненные/содержащие электроны*.", "Различай уровни (слои `n`), подуровни (`s, p, d`) и орбитали (отдельные клетки) — и помни, что у `₁₉K` 3-й уровень не полностью заполнен из-за пустого `3d`."]}]}], "gloss": [["Атом", "Электронейтральная частица, состоящая из положительно заряженного ядра и отрицательно заряженной электронной оболочки.", "Атом углерода ₆C содержит 6 протонов в ядре и 6 электронов в оболочке."], ["Порядковый номер Z", "Номер элемента в Периодической системе; численно равен заряду ядра, числу протонов и числу электронов в нейтральном атоме.", "У кислорода Z = 8: 8 протонов в ядре и 8 электронов в оболочке."], ["Массовое число A", "Суммарное число протонов и нейтронов в ядре конкретного изотопа (A = Z + N).", "У изотопа ²⁷Al массовое число 27: 13 протонов и 27 − 13 = 14 нейтронов."], ["Изотопы", "Разновидности атомов одного химического элемента с одинаковым числом протонов (Z), но разным числом нейтронов (N).", "Природный хлор состоит из изотопов ³⁵Cl (18 нейтронов) и ³⁷Cl (20 нейтронов), поэтому его средняя Ar = 35,5."], ["Энергетический уровень", "Совокупность электронов с близкой энергией и одинаковым главным квантовым числом n (номером слоя); число уровней равно номеру периода.", "У фосфора (3-й период) 3 энергетических уровня: n = 1, 2, 3."], ["Подуровень", "Часть энергетического уровня, объединяющая орбитали одинаковой формы и энергии: s (1 орбиталь), p (3), d (5), f (7).", "На 3-м уровне есть три подуровня: 3s, 3p и 3d."], ["Орбиталь", "Область пространства вокруг ядра, где вероятность обнаружить электрон наибольшая; графически обозначается одной клеткой (ячейкой).", "На подуровне 2p расположены три гантелеобразные орбитали (2pₓ, 2pᵧ, 2p_z)."], ["Спин", "Собственный квантовый момент электрона, который может принимать два противоположных значения (стрелки ↑ и ↓ в ячейке).", "Два электрона на одной орбитали 1s² обязательно имеют противоположные спины (↑↓)."], ["Принцип Паули", "На одной орбитали (в одной ячейке) не может находиться более двух электронов, причём их спины обязаны быть противоположны.", "Вместимость одной орбитали — максимум 2 e⁻, поэтому s-подуровень вмещает 2 e⁻, а p-подуровень — 6 e⁻."], ["Правило Хунда", "Электроны в пределах одного подуровня сначала занимают свободные орбитали по одному с параллельными спинами, и лишь затем образуют пары.", "У азота (2p³) три электрона сидят в трёх разных 2p-ячейках: ↑ ↑ ↑ (3 неспаренных)."], ["Правило Клечковского", "Орбитали заполняются в порядке возрастания суммы (n + l), а при равенстве этой суммы — в порядке возрастания главного числа n.", "Для 4s сумма 4+0=4, а для 3d сумма 3+2=5, поэтому 4s заполняется раньше 3d."], ["Провал электрона", "Переход одного электрона с внешнего s-подуровня на предвнешний d-подуровень ради повышенной устойчивости полузаполненной (d⁵) или полностью заполненной (d¹⁰) оболочки.", "У хрома ₂₄Cr конфигурация [Ar]3d⁵4s¹ (6 неспаренных), у меди ₂₉Cu — [Ar]3d¹⁰4s¹ (1 неспаренный)."], ["Внешние электроны", "Электроны, находящиеся на самом дальнем от ядра (внешнем) энергетическом уровне с максимальным значением n.", "У железа Fe ([Ar]3d⁶4s²) на внешнем 4-м уровне находятся только 2 электрона (4s²)."], ["Валентные электроны", "Электроны, способные участвовать в образовании химических связей: ns + np у s/p-элементов и ns + (n−1)d у d-элементов (кроме стабильного 3d¹⁰ у Zn).", "У хрома Cr 1 внешний электрон (4s¹), но 6 валентных (3d⁵4s¹); у цинка Zn — 2 внешних и 2 валентных (4s²)."], ["Возбуждённое состояние", "Состояние атома с более высокой энергией, возникающее при распаривании электронной пары и переходе электрона на свободную орбиталь того же уровня n.", "Углерод переходит из 2s²2p² (2 неспаренных) в 2s¹2p³ (4 неспаренных)."], ["Изоэлектронные частицы", "Атомы и ионы разных элементов, имеющие одинаковое общее число электронов и одинаковую электронную конфигурацию.", "N^{3−}, O^{2−}, F⁻, Ne, Na⁺, Mg^{2+}, Al^{3+} имеют одинаковую конфигурацию 1s²2s²2p⁶."]], "_img": {"fipi_pshe_1_4": {"data": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABLwAAAGpCAIAAAAInrjiAAAACXBIWXMAABcSAAAXEgFnn9JSAAHAb0lEQVR4nOydebxO5dr4tzTPowaJF5F5jF45ynAQMg9JwttgjhBKSMWhTJXTwKnOMRZSOa/ZQQkpOiFDQtrGTJGpDOf5fd/n+nV97tbz7LX2fvbwPHbX9w+fba31rHWve933dV/fNSaFDMMwDMMwDMMwDCMFkuJdAMMwDMMwDMMwDCNxMWk0DMMwDMMwDMMwUsSk0TAMwzAMwzAMw0gRk0bDMAzDMAzDMAwjRUwaDcMwDMMwDMMwjBQxaTQMwzAMwzAMwzBSxKTRMAzDMAzDMAzDSBGTRsMwDMMwDMMwDCNFTBoNwzAMwzAMwzCMFDFpNAzDMAzDMAzDMFLEpNEwDMMwDMMwDMNIEZNGwzAMwzAMwzAMI0VMGg3DMAzDMAzDMIwUMWk0DMMwDMMwDMMwUsSk0TAMwzAMwzAMw0gRk8bsya+//rphw4avU813330X7yIbhmEYhpEip06d2rhxYyrH9P/85z/+aztx4oTmCcnJyWfPno1c5uDBg7rOH3744cyZMzEUm5KsX7/eLd6aNWvIUiL3buvWre5i33zzzZEjR2LYomEYmYFJY/aEAaBWrVrFU02bNm2iDhiGYRiGYSQC+/fvb9CgQWrG9LZt20ZamQeMsWbNmrJ8//79jx075lkAi+vTp4+u85lnnjl69GgMxf7ll1+qV6/uFq906dIrV670LEbe0qxZM3exKlWqLFq0KIYtGoaRGZg0Zk+2bNnyX//1X0mphtBs0mgYhmEYCcuePXuKFSuWmjH9nnvuQdX81/bVV1/lzZtXlv+f//mfyGt68+fPv+SSS3SdDz/88OHDh2Mo9 <script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const THEME_KEY='ege100-theme';
let T=null, S=null, FIGS={}, IMG={}, CHEM=false, RUS=false;

const THEMES=['auto','light','paper','dark'];
const THEME_LABELS={auto:'◐ Авто',light:'☀ Светлая',paper:'▤ Бумага',dark:'☾ Тёмная'};
function applyTheme(){
  const raw=LS.get(THEME_KEY,'auto');
  const t=THEMES.includes(raw)?raw:'auto';
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  $$('[data-theme-btn]').forEach(b=>{
    b.textContent=THEME_LABELS[t];
    b.title='Переключить тему оформления (Авто → Светлая → Бумага → Тёмная)';
  });
}
function toggleTheme(){
  const raw=LS.get(THEME_KEY,'auto');
  const i=THEMES.indexOf(raw);
  LS.set(THEME_KEY,THEMES[(i+1)%THEMES.length]);
  applyTheme();
}

const SUB='₀₁₂₃₄₅₆₇₈₉', SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻'};
function fmt(s, forceChem){
  if(s==null)return '';
  let h=esc(s);
  h=h.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,(m,t,l)=>'<button type="button" class="glink" data-term="'+esc(t)+'">'+(l||t)+'</button>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(«—])\*(?!\s)([^*]+?)\*(?=[\s,.;:!?)»—]|$)/g,'$1<em>$2</em>');
  h=h.replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>');
  h=h.replace(/`([^`\n]+?)`/g,'<code>$1</code>');
  // Русская разметка
  h=h.replace(/\{~([^}]+)\}/g,'<span class="ru-stress">$1\u0301</span>');
  h=h.replace(/\{!:([^}]*)\}/g,'<span class="ru-ortho">$1</span>');
  h=h.replace(/\{\((\d+)\)\}/g,'<span class="ru-pos">$1</span>');
  h=h.replace(/\{п:([^}]+)\}/g,'<span class="ru-m ru-p">$1</span>');
  h=h.replace(/\{к:([^}]+)\}/g,'<span class="ru-m ru-k">$1</span>');
  h=h.replace(/\{с:([^}]+)\}/g,'<span class="ru-m ru-s">$1</span>');
  h=h.replace(/\{о:([^}]+)\}/g,'<span class="ru-m ru-o">$1</span>');
  h=h.replace(/\{подл:([^}]+)\}/g,'<span class="ru-syn ru-podl">$1</span>');
  h=h.replace(/\{сказ:([^}]+)\}/g,'<span class="ru-syn ru-skaz">$1</span>');
  h=h.replace(/\{опр:([^}]+)\}/g,'<span class="ru-syn ru-opr">$1</span>');
  h=h.replace(/\{обст:([^}]+)\}/g,'<span class="ru-syn ru-obst">$1</span>');
  h=h.replace(/\{ввод:([^}]+)\}/g,'<span class="ru-vvod">$1</span>');
  if(CHEM || forceChem){
    h=h.split(/(<[^>]+>)/).map(p=>p[0]==='<'?p:p.replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')).join('');
  }
  return h.replace(/\n/g,'<br>');
}
function plain(s){
  return String(s==null?'':s)
    .replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,(m,t,l)=>l||t)
    .replace(/\*\*/g,'').replace(/\{[пксо!~]:([^}]*)\}/g,'$1').replace(/\{~([^}]+)\}/g,'$1')
    .replace(/\{(?:подл|сказ|опр|обст|ввод):([^}]+)\}/g,'$1').replace(/\{\((\d+)\)\}/g,'($1)')
    .replace(/`([^`\n]+?)`/g,'$1')
    .replace(/\^\{([^}]*)\}/g,(m,x)=>[...x].map(c=>SUP[c]||c).join('')).replace(/_\{([^}]*)\}/g,'$1');
}
const lines=v=>Array.isArray(v)?v:String(v==null?'':v).split('\n');
const body=v=>v==null?'':Array.isArray(v)?blocks(v):'<p>'+fmt(v)+'</p>';
const inl=v=>v==null?'':Array.isArray(v)?blocks(v):fmt(v);

function cleanSvg(src){
  try{
    const d=new DOMParser().parseFromString(String(src),'image/svg+xml');
    const svg=d.documentElement;
    if(!svg||svg.nodeName.toLowerCase()!=='svg')return '';
    svg.querySelectorAll('script,foreignObject').forEach(n=>n.remove());
    svg.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{
      if(/^on/i.test(a.name)||/javascript:/i.test(a.value))n.removeAttribute(a.name);
    }));
    return new XMLSerializer().serializeToString(svg);
  }catch(e){return '';}
}
function card(c){
  if(typeof c==='string')return '<div class="panel">'+body(c)+'</div>';
  return '<div class="panel">'+(c.tag?'<div class="eyebrow">'+fmt(c.tag)+'</div>':'')+(c.t?'<h3>'+fmt(c.t)+'</h3>':'')+(c.x?body(c.x):'')+(c.eq?R.eq(c.eq,{sm:1}):'')+(c.x2?body(c.x2):'')+(c.b?blocks(c.b):'')+(c.chip?'<span class="chip">'+fmt(c.chip)+'</span>':'')+'</div>';
}
const box=k=>(v,b)=>'<div class="panel '+k+'">'+(b.t?'<strong>'+fmt(b.t)+'</strong> ':'')+inl(v)+'</div>';

let TREE_ID=0;
function renderTreeStatic(node){

  return '<div class="tree-step"><div class="tree-q">'+fmt(node.q)+'</div><ul>'
    +(node.yes?'<li><b>Да →</b> '+renderTreeStatic(node.yes)+'</li>':'')

    +'</ul></div>';
}
function renderCompare(c){
  if(c.rows&&c.cols){
    const head=['Признак',...c.cols,'Почему важно'].slice(0,c.rows[0]?.length||4);
    return '<div class="cmp-wrap">'+(c.t?'<h4>'+fmt(c.t)+'</h4>':'')+R.table([head,...c.rows])+'</div>';
  }
  const side=(s)=>s?'<div class="cmp-card"><h4>'+fmt(s.title||'')+'</h4>'+(Array.isArray(s.items)?R.list(s.items):body(s.b||s.text||''))+'</div>':'';
  return '<div class="cmp-wrap">'+(c.t?'<h4>'+fmt(c.t)+'</h4>':'')+'<div class="cmp-cards">'+side(c.left)+side(c.right)+'</div></div>';
}

  table:v=>'<div class="tablewrap"><table><thead><tr>'+v[0].map(c=>'<th>'+fmt(c)+'</th>').join('')+'</tr></thead><tbody>'+v.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>',
  flow:v=>'<div class="mapflow">'+v.map((f,i)=>(i?'<div class="arrow">→</div>':'')+'<div class="flowbox"><strong>'+fmt(Array.isArray(f)?f[0]:f)+'</strong>'+(Array.isArray(f)&&f[1]?'<small>'+fmt(f[1])+'</small>':'')+'</div>').join('')+'</div>',
  more:(v,b)=>'<details'+(b.open?' open':'')+'><summary>'+fmt(v)+'</summary><div>'+body(b.b)+'</div></details>',
  svg:(v,b)=>'<div class="svgwrap" role="img"'+(b.cap?' aria-label="'+esc(plain(b.cap))+'"':'')+'>'+cleanSvg(v)+(b.cap?'<p class="small" style="margin:10px 0 0;text-align:center">'+fmt(b.cap)+'</p>':'')+'</div>',
  fig:(v,b)=>figBlock(v,b),
  bridge:v=>'<div class="bridge"><div class="bridge-head"><span class="eyebrow">Мост к КИМ ЕГЭ</span>'+(v.kim?'<span class="chip">'+fmt(v.kim)+'</span>':'')+'</div><div class="bridge-grid">'
    +(v.ask?'<div class="bridge-cell"><b>Как спрашивают</b>'+fmt(v.ask)+'</div>':'')
    +(v.watch?'<div class="bridge-cell"><b>На чём ловят</b>'+fmt(v.watch)+'</div>':'')
    +(v.tip?'<div class="bridge-cell"><b>Как читать условие</b>'+fmt(v.tip)+'</div>':'')
    +'</div></div>',
  compare:v=>renderCompare(v),
  tree:v=>{const tid='tr_'+(++TREE_ID);return '<div class="treebox" data-tree="'+tid+'"><div class="tree-head"><strong>'+fmt(v.t||'Алгоритм выбора')+'</strong><button type="button" class="ghost" data-tree-all="'+tid+'" style="padding:5px 10px;font-size:12.5px">Показать всю схему</button></div><div class="tree-interactive" id="'+tid+'"></div><div class="tree-static" id="'+tid+'_all" style="display:none">'+renderTreeStatic(v.root)+'</div></div>';},
  essay:v=>'<div class="essaybox"><div class="eyebrow">Разбор сочинения № 27</div>'+(v.t?'<h4>'+fmt(v.t)+'</h4>':'')+(v.prompt?'<p class="small"><strong>Задание/проблема:</strong> '+fmt(v.prompt)+'</p>':'')+(v.text?'<div class="essay-text">'+fmt(v.text)+'</div>':'')+(v.criteria?R.table([['Критерий','Аспект','Балл','Комментарий'],...v.criteria]):'')+'</div>'

function blk(b){if(b==null)return '';if(typeof b==='string')return '<p>'+fmt(b)+'</p>';if(Array.isArray(b))return blocks(b);const t=TYPES.find(k=>k in b);return t?R[t](b[t],b):'';}

function figView(id){

function figBlock(v,b){

function initTrees(){
  const store={};
  const walk=(v)=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(v.tree&&v.tree.root){store[v.tree.t||'']=v.tree;}for(const k in v)if(k!=='svg')walk(v[k]);}};
  (T.modules||[]).forEach(m=>walk(m.b));
  let idx=0;
  $$('.treebox').forEach(boxEl=>{
    idx++;
    const tid=boxEl.dataset.tree;
    const titleEl=$('.tree-head strong',boxEl);
    const titleTxt=titleEl?titleEl.textContent:'';
    let treeObj=null;
    const findTree=(v)=>{if(treeObj)return;if(Array.isArray(v))v.forEach(findTree);else if(v&&typeof v==='object'){if(v.tree&&plain(v.tree.t||'Алгоритм выбора')===titleTxt){treeObj=v.tree;return;}for(const k in v)if(k!=='svg')findTree(v[k]);}};
    (T.modules||[]).forEach(m=>findTree(m.b));
    if(!treeObj)return;
    const host=$('#'+tid,boxEl);
    const hist=[];
    function draw(node){
      if(!node)return;
      if(node.a!=null){
        host.innerHTML='<div class="tree-ans"><strong>Вывод:</strong> '+fmt(node.a)+(node.why?'<div class="small" style="margin-top:5px">'+fmt(node.why)+'</div>':'')+'</div><div class="actions" style="margin:10px 0 0"><button type="button" class="ghost" data-tback style="padding:5px 10px;font-size:12.5px">← Назад</button><button type="button" class="ghost" data-treset style="padding:5px 10px;font-size:12.5px">Сначала</button></div>';
      }else{
        host.innerHTML='<div class="tree-step"><div class="tree-q">'+fmt(node.q)+'</div><div class="actions" style="margin:8px 0 0">'
          +(node.yes?'<button type="button" class="btn" data-tyes style="padding:6px 14px">Да</button>':'')
          +(node.no?'<button type="button" class="ghost" data-tno style="padding:6px 14px">Нет</button>':'')
          +(hist.length?'<button type="button" class="ghost" data-tback style="padding:6px 10px;font-size:12.5px">← Шаг назад</button>':'')
          +'</div></div>';
      }
      const yb=$('[data-tyes]',host), nb=$('[data-tno]',host), bb=$('[data-tback]',host), rb=$('[data-treset]',host);
      if(yb)yb.onclick=()=>{hist.push(node);draw(node.yes);};
      if(nb)nb.onclick=()=>{hist.push(node);draw(node.no);};
      if(bb)bb.onclick=()=>{const prev=hist.pop();if(prev)draw(prev);};
      if(rb)rb.onclick=()=>{hist.length=0;draw(treeObj.root);};
    }
    draw(treeObj.root);
    const allBtn=$('[data-tree-all]',boxEl), allEl=$('#'+tid+'_all',boxEl);
    allBtn.onclick=()=>{
      const shown=allEl.style.display!=='none';
      allEl.style.display=shown?'none':'block';
      host.style.display=shown?'block':'none';
      allBtn.textContent=shown?'Показать всю схему':'Интерактивный режим';
    };
  });
}

  $('#app').innerHTML='<div class="layout"><aside class="side" aria-label="Навигация">'+side+'</aside><div>'+mob+'<main id="main">'+hero+guide+mods+audit+gloss+revision+'<footer>'+esc(plain(T.title))+' · ЕГЭ-100 · Автономный учебник</footer></main></div></div>';

  applyTheme();
  $$('[data-theme-btn]').forEach(b=>b.onclick=toggleTheme);
  initInteractive();
  jumpFromHash();
}

function initInteractive(){
  const M=T.modules||[], G=T.gloss||[];
  const save=()=>{
    LS.set('ege100:kon:'+T.id,S);
    if(window.EGE100Sync&&window.EGE100Sync.isConfigured()){
      window.EGE100Sync.syncGist().catch(()=>{});
    }
  };
  const upd=()=>{
    const n=M.filter(m=>S.completed[m.id]).length;
    if($('#sideProgress'))$('#sideProgress').textContent=n;
    if($('#sideBar'))$('#sideBar').style.width=(M.length?100*n/M.length:0)+'%';
    $$('.complete').forEach(b=>{
      const v=!!S.completed[b.dataset.complete];
      b.textContent=v?'✓ Модуль изучен':'Отметить модуль '+b.dataset.complete+' изученным';
      b.classList.toggle('btn',v);b.classList.toggle('ghost',!v);
    });
  };
  $$('.complete').forEach(b=>b.onclick=()=>{S.completed[b.dataset.complete]=!S.completed[b.dataset.complete];save();upd();});
  upd();

  if($('#mobileJump'))$('#mobileJump').onchange=e=>{const el=document.getElementById(e.target.value.slice(1));if(el)el.scrollIntoView({behavior:'smooth'});};
  if('IntersectionObserver' in window){
    const ob=new IntersectionObserver(en=>{
      const v=en.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
      if(v){
        $$('.nav').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+v.target.id));
        const opt=$('#mobileJump option[value="#'+v.target.id+'"]');
        if(opt)$('#mobileJump').value='#'+v.target.id;
      }
    },{rootMargin:'-12% 0px -70% 0px'});
    $$('main>section[id]').forEach(s=>ob.observe(s));
  }

  if(G.length && $('#glossHost')){
    const drawG=()=>{
      const q=$('#glossSearch').value.trim().toLowerCase();
      const L=G.filter(x=>x.join(' ').toLowerCase().includes(q));
      $('#glossHost').innerHTML=L.map(x=>'<article class="term"><strong>'+fmt(x[0])+'</strong><p>'+fmt(x[1])+'</p>'+(x[2]?'<small>Пример: '+fmt(x[2])+'</small>':'')+'</article>').join('')||'<p class="small">Ничего не найдено.</p>';
    };
    $('#glossSearch').addEventListener('input',drawG);
    drawG();
  }

  // Поповер глоссария
  const pop=$('#gPopover');
  const gMap=new Map(G.map(g=>[String(g[0]).toLowerCase(),g]));
  document.addEventListener('click',e=>{
    const gl=e.target.closest('.glink');
    if(gl){
      e.stopPropagation();
      const termKey=gl.dataset.term.toLowerCase();
      const entry=gMap.get(termKey);
      if(!entry){if($('#glossary'))$('#glossary').scrollIntoView({behavior:'smooth'});return;}
      pop.innerHTML='<h4>'+fmt(entry[0])+'</h4><p>'+fmt(entry[1])+'</p>'+(entry[2]?'<p class="small"><strong>Пример:</strong> '+fmt(entry[2])+'</p>':'')+'<div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px"><button type="button" class="ghost" id="gpAll" style="padding:4px 9px;font-size:12px">К словарю ↓</button><button type="button" class="ghost" id="gpClose" style="padding:4px 9px;font-size:12px">✕</button></div>';
      const rc=gl.getBoundingClientRect();
      pop.style.display='block';
      const pw=pop.offsetWidth||320, ph=pop.offsetHeight||140;
      const left=Math.max(10,Math.min(window.innerWidth-pw-10,rc.left));
      const top=(rc.bottom+ph+12<window.innerHeight)?rc.bottom+8:Math.max(10,rc.top-ph-8);
      pop.style.left=left+'px';pop.style.top=top+'px';
      $('#gpClose',pop).onclick=()=>pop.style.display='none';
      $('#gpAll',pop).onclick=()=>{pop.style.display='none';if($('#glossary'))$('#glossary').scrollIntoView({behavior:'smooth'});};
      return;
    }
    if(pop.style.display==='block'&&!e.target.closest('#gPopover'))pop.style.display='none';
  });

  // Увеличение рисунков
  const dlg=$('#imgZoom');
  $('#imgZoomClose').onclick=()=>dlg.close();
  $$('[data-zoom]').forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.zoom, d=FIGS[id]||{};
    $('#imgZoomTitle').textContent=plain(d.t||id);
    $('#imgZoomBody').innerHTML=figView(id);
    if(dlg.showModal)dlg.showModal();
  });

  initTrees();

  if($('#clearAll'))$('#clearAll').onclick=()=>{
    if(!confirm('Сбросить отметки изученных модулей?'))return;
    S={completed:{}};save();upd();
  };
}

function jumpFromHash(){
  const raw=location.hash.slice(1);if(!raw)return;
  const q=new URLSearchParams(raw);
  if(q.has('b')){
    const m=q.get('b').match(/^(\d+)\.(\d+)$/);
    const el=m?document.getElementById('b-'+m[1]+'-'+m[2]):null;
    if(el){el.scrollIntoView({behavior:'instant',block:'center'});const nxt=el.nextElementSibling;if(nxt){nxt.classList.add('bflash');setTimeout(()=>nxt.classList.add('fade'),2200);}}
    return;
  }
  const el=document.getElementById(decodeURIComponent(raw));
  if(el)el.scrollIntoView({behavior:'instant'});
}

try{
  const raw=$('#topic-data').textContent.trim();
  if(raw&&raw[0]==='{'){
    T=JSON.parse(raw);
    IMG=T._img||{};
    delete T._img;
    render();
  }else{
    applyTheme();
    $('#app').innerHTML='<main style="max-width:760px;padding:48px 20px"><div class="panel"><h2>Шаблон учебника ЕГЭ-100</h2><p>Этот файл — движок оформления. Собери тему через <code>python core/cli.py build &lt;subject&gt; &lt;id&gt;</code>, чтобы получить готовый автономный учебник.</p></div></main>';
  }
}catch(e){
  $('#app').innerHTML='<main style="padding:32px"><div class="panel warn"><strong>Ошибка загрузки данных:</strong> '+esc(e.message)+'</div></main>';
}
})();
</script>
</body>
</html>
