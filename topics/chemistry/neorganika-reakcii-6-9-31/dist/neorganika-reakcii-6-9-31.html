172' y='127' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>восст.<\/text><circle cx='286' cy='78' r='16' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)' stroke-width='2'/><text x='286' y='83' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='13' font-weight='700'>+4<\/text><text x='286' y='52' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>SO₂, SO₃²⁻<\/text><text x='286' y='112' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>чаще<\/text><text x='286' y='127' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>восст.<\/text><circle cx='400' cy='78' r='16' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><text x='400' y='83' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='13' font-weight='700'>+6<\/text><text x='400' y='52' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>SO₃, H₂SO₄<\/text><text x='400' y='112' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>только<\/text><text x='400' y='127' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>окисл.<\/text><\/svg>"}, {"h": "1. Простое вещество сера S(0)"}, {"p": "Сера реагирует почти со всеми металлами (кроме золота и платины), причём с ртутью — уже при комнатной температуре (демеркуризация разбитого термометра: `Hg + S → HgS`), а с медью и железом при нагревании даёт низшие сульфиды (`Cu2S` и `FeS`, но НЕ `CuS` и НЕ `Fe2S3`!):"}, {"eq": ["Fe + S —t°→ FeS", "2Cu + S —t°→ Cu2S", "2Al + 3S —t°→ Al2S3"]}, {"p": "С неметаллами сера ведёт себя по разнице электроотрицательностей: с `H2` и `C` она окислитель (`H2 + S —t°→ H2S`, `C + 2S —t°→ CS2`), а с `O2`, `F2`, `Cl2` — восстановитель. С водой сера не реагирует, но в **горячей концентрированной щёлочи** диспропорционирует на сульфид и сульфит, а кислотами-окислителями окисляется до `SO2` или `H2SO4`:"}, {"eq": ["S + O2 —t°→ SO2", "3S + 6KOH(гор., конц.) —t°→ 2K2S + K2SO3 + 3H2O", "S + 6HNO3(конц.) —t°→ H2SO4 + 6NO2↑ + 2H2O", "S + 2H2SO4(конц.) —t°→ 3SO2↑ + 2H2O"]}, {"warn": "Антипаттерн № 4: при сжигании серы в кислороде образуется ТОЛЬКО `SO2`! Получить `SO3` из серы в одну стадию нельзя — нужен катализатор `V2O5` и нагревание для окисления уже готового `SO2`: `2SO2 + O2 ⇄t°, кат. V2O5 2SO3`.", "t": "Ловушка ЕГЭ: S + O2 никогда не даёт SO3"}, {"h": "2. Сероводород H2S, сульфиды и обжиг пирита FeS2"}, {"p": "`H2S` — ядовитый газ с запахом тухлых яиц, в воде даёт слабую двухосновную сероводородную кислоту (образует сульфиды `Na2S` и гидросульфиды `NaHS`). Из-за минимальной степени окисления `S^{−2}` сероводород — мощнейший восстановитель:"}, {"eq": ["2H2S + O2(нед.) —t°→ 2S↓ + 2H2O", "2H2S + 3O2(изб.) —t°→ 2SO2↑ + 2H2O", "2H2S + SO2 → 3S↓ + 2H2O", "H2S + 8HNO3(конц.) → H2SO4 + 8NO2↑ + 4H2O"]}, {"p": "В заданиях № 6, 7, 8 и 31 важно делить нерастворимые сульфиды на две группы:"}, {"compare": {"t": "Как нерастворимые сульфиды ведут себя с HCl / H2SO4(разб.)", "left": {"title": "Растворяются в HCl (выделяется H2S↑)", "items": ["`FeS`, `ZnS`, `MnS`", "`FeS + 2HCl → FeCl2 + H2S↑`", "`ZnS + H2SO4(разб.) → ZnSO4 + H2S↑`"]}, "right": {"title": "НЕ растворяются в HCl и H2SO4(разб.)!", "items": ["`CuS`, `Cu2S`, `Ag2S`, `HgS`, `PbS`", "Отсюда важное следствие для № 6–8: слабая кислота `H2S` **вытесняет сильную** из солей `Cu^{2+}`, `Ag^{+}`, `Pb^{2+}`, `Hg^{2+}` (`CuSO4 + H2S → CuS↓ + H2SO4`), тогда как `FeSO4 + H2S` и `ZnCl2 + H2S` НЕ идут!", "Растворить такие сульфиды можно только кислотой-окислителем: `CuS + 8HNO3(конц.) → CuSO4 + 8NO2↑ + 4H2O`"]}}}, {"p": "Классическая промышленная реакция (производство серной кислоты, № 8, 9, 25, 31) — **обжиг пирита `FeS2`** (железного колчедана, где железо в `+2`, а сера в `−1`). Образуется бурый `Fe2O3` и `SO2`:"}, {"eq": "4FeS2 + 11O2 —t°→ 2Fe2O3 + 8SO2↑"}, {"h": "3. Оксид серы(IV) SO2 и сульфиты"}, {"p": "`SO2` (сернистый газ, резкий запах горящей спички) — кислотный оксид: со щелочами даёт сульфиты (`Na2SO3`, при избытке щёлочи) или гидросульфиты (`NaHSO3`, при избытке `SO2`). В ОВР `SO2` и `Na2SO3` почти всегда **восстановители** (переходят в `S^{+6}`), и только с `H2S` сернистый газ выступает как **окислитель** (`2H2S + SO2 → 3S↓ + 2H2O`):"}, {"eq": ["SO2 + Br2 + 2H2O → H2SO4 + 2HBr", "SO2 + Cl2 + 2H2O → H2SO4 + 2HCl", "5SO2 + 2KMnO4 + 2H2O → K2SO4 + 2MnSO4 + 2H2SO4", "Na2SO3 + H2O2 → Na2SO4 + H2O"]}, {"h": "4. Серная кислота: разбавленная vs концентрированная"}, {"p": "Почему `H2SO4(разб.)` и `H2SO4(конц.)` в ЕГЭ ведут себя как две совершенно разные кислоты? В разбавленной кислоте окислителем работает протон `H^{+}`, как в `HCl`: она реагирует только с металлами до водорода и даёт `H2↑` (с железом — `FeSO4`). В концентрированной кислоте окислителем становится атом серы `S^{+6}`: водород `H2` **никогда не выделяется**, реакция идёт даже с медью и неметаллами, а железо, алюминий и хром на холоде **пассивируются**!"}, {"table": [["С кем реагирует H2SO4(конц.)", "Главный продукт восстановления серы", "Уравнение реакции", "Важная деталь ЕГЭ"], ["Активные металлы (`Mg`, `Zn`, `Ca`, `Na`, `Al` при `t°`)", "`H2S` (иногда `S` или `SO2` — по условию)", "`4Zn + 5H2SO4(конц.) → 4ZnSO4 + H2S↑ + 4H2O`", "Для `Al` обязательно нагревание (пассивация на холоде!)"], ["Металлы средней и малой активности (`Fe` при `t°`, `Cr` при `t°`, `Cu`, `Ag`, `Hg`)", "`SO2`", "`Cu + 2H2SO4(конц.) —t°→ CuSO4 + SO2↑ + 2H2O`; `2Fe + 6H2SO4(конц.) —t°→ Fe2(SO4)3 + 3SO2↑ + 6H2O`", "`Fe` окисляется до `+3`, `Au` и `Pt` не реагируют"], ["Неметаллы (`C`, `S`, `P`)", "`SO2`", "`C + 2H2SO4(конц.) —t°→ CO2↑ + 2SO2↑ + 2H2O`; `2P + 5H2SO4(конц.) —t°→ 2H3PO4 + 5SO2↑ + 2H2O`", "Только при нагревании!"], ["Восстановители (`FeO`, `FeSO4`, `HBr`, `HI`, `H2S`)", "`SO2` (с `HI` — `H2S`)", "`2FeO + 4H2SO4(конц.) —t°→ Fe2(SO4)3 + SO2↑ + 4H2O`", "`Fe(+2)` всегда доокисляется до `Fe(+3)`"]]}, {"steps": ["**Разбор вслух: уравниваем обжиг пирита FeS2**", "`4FeS2 + 11O2 —t°→ 2Fe2O3 + 8SO2↑`", "**Шаг 1 (электроны от двух восстановителей сразу):** в `1` формульной единице `FeS2` железо `Fe^{+2}` отдаёт `1e⁻` (до `Fe^{+3}`), а два атома серы `2S^{−1}` отдают `2·5 = 10e⁻` (до `2S^{+4}`). Итого `1` молекула `FeS2` отдаёт `11e⁻`!", "**Шаг 2 (окислитель):** `O2⁰ + 4e⁻ → 2O^{−2}` (принимает `4e⁻`).", "**Шаг 3 (баланс):** НОК(11, 4) = 44 → ставим `4` перед `FeS2` и `11` перед `O2`. Справа получаем `2Fe2O3` и `8SO2`. Проверяем `O`: слева `11·2 = 22`, справа `2·3 + 8·2 = 6 + 16 = 22`. Идеально!"]}, {"bridge": {"kim": "№ 6, 7, 8, 9, 31 КИМ", "ask": "В № 7 и № 8 постоянно сталкивают `H2SO4(разб.)` и `H2SO4(конц.)`, `S + O2`, `H2S + SO2`, обжиг `FeS2` и растворимость `CuS`/`FeS` в `HCl`.", "watch": "Ловят на: 1) `CuS + HCl` (реакция НЕ идёт!); 2) попытке получить `SO3` прямым сжиганием серы в кислороде (идёт только до `SO2`!); 3) `Fe + H2SO4(конц.)` на холоде (пассивация!) и продукте `FeSO4` вместо `Fe2(SO4)3` при нагревании; 4) обесцвечивании бромной воды сернистым газом `SO2 + Br2 + 2H2O → H2SO4 + 2HBr`.", "tip": "Всегда проверяй слово «концентрированная» или «разбавленная» у серной кислоты — это полностью меняет список реагентов и продуктов."}}], "short": [{"list": ["Сера при сжигании в `O2` даёт только `SO2`; с `Fe` даёт `FeS`, с `Cu` — `Cu2S`, с `Hg` — `HgS` при н.у.; в горячей щёлочи диспропорционирует на `K2S + K2SO3`.", "`H2S` с недостатком `O2` и с `SO2` даёт серу `S↓`, с избытком `O2` — `SO2`.", "`FeS` и `ZnS` растворяются в `HCl`, а `CuS`, `Ag2S`, `HgS`, `PbS` — нет (растворяются только в кислотах-окислителях вроде `HNO3`).", "Обжиг пирита даёт `Fe2O3` и `SO2`: `4FeS2 + 11O2 —t°→ 2Fe2O3 + 8SO2↑`.", "`H2SO4(разб.)` реагирует только с металлами до `H2` (давая `H2↑` и `FeSO4`), а `H2SO4(конц.)` — окислитель (никогда не даёт `H2`, пассивирует `Fe/Al/Cr` на холоде, окисляет `Cu`, `C`, `S`, `P`, `Fe(+2)` при нагревании до `SO2`)."]}]}, {"id": "07", "group": "Химия неметаллов", "nav": "Азот, HNO3 и нитраты", "codes": ["2.3"], "eyebrow": "07 · Код 2.3 · Азот и его соединения", "title": "Азот, аммиак, оксиды азота, азотная кислота и разложение нитратов", "lead": "Почему азотная кислота никогда не выделяет водород даже с активными металлами, и почему при прокаливании нитрата лития и нитрата калия получаются совершенно разные наборы продуктов?", "b": [{"key": "Азот охватывает степени окисления от `−3` (`NH3`, `NH4^{+}`) до `+5` (`HNO3`, нитраты). Три главных опоры экзамена: аммиак проявляет одновременно основные и восстановительные свойства; `HNO3` любой концентрации — окислитель (без `H2`); схема термического разложения нитратов привязана к ряду напряжений, но имеет 4 обязательных исключения.", "t": "Главная мысль."}, {"h": "1. Азот N2, аммиак NH3 и соли аммония"}, {"p": "В молекуле `N2` атомы связаны сверхпрочной **тройной связью** `N≡N`, поэтому азот крайне инертен. При н.у. он реагирует только с литием (`6Li + N2 → 2Li3N`), при нагревании — с `Mg`, `Ca`, `Al` (`3Mg + N2 —t°→ Mg3N2`), с водородом под давлением на железном катализаторе (`N2 + 3H2 ⇄t°, p, кат. Fe 2NH3`) и с кислородом только в электрическом разряде или при ~2000 °C — до **оксида азота(II) `NO`** (`N2 + O2 ⇄t°, молния 2NO`, но НЕ `NO2`!)."}, {"p": "Аммиак `NH3` — газ с резким запахом, отлично растворим в воде (даёт слабую щёлочь `NH3·H2O`, окрашивает влажный лакмус в синий). В реакциях `NH3` выступает в двух ролях:"}, {"compare": {"t": "Две роли аммиака NH3 в реакциях ЕГЭ", "left": {"title": "Основание (присоединяет H^{+})", "items": ["С кислотами → соли аммония: `NH3 + HCl → NH4Cl` (белый дым!); `2NH3 + H2SO4 → (NH4)2SO4`", "Водный раствор `NH3·H2O` осаждает нерастворимые гидроксиды: `FeCl3 + 3NH3·H2O → Fe(OH)3↓ + 3NH4Cl`", "Избыток `NH3·H2O` растворяет `Cu(OH)2`, `Zn(OH)2`, `Ag2O`, но НЕ `Al(OH)3`, `Cr(OH)3`, `Fe(OH)3`"]}, "right": {"title": "Восстановитель (N^{−3} → N2⁰ или N^{+2})", "items": ["Горение в `O2` БЕЗ катализатора → `N2`: `4NH3 + 3O2 —t°→ 2N2↑ + 6H2O`", "Окисление на Pt-катализаторе → `NO`: `4NH3 + 5O2 —t°, кат. Pt→ 4NO↑ + 6H2O`", "Восстановление оксида меди(II): `2NH3 + 3CuO —t°→ 3Cu + N2↑ + 3H2O`", "С хлором/бромом: `8NH3(изб.) + 3Cl2 → N2↑ + 6NH4Cl`"]}}}, {"p": "Соли аммония легко распознать качественной реакцией со щёлочью при нагревании (`NH4Cl + NaOH —t°→ NH3↑ + NaCl + H2O`, выделяется газ с резким запахом, синеет влажный лакмус). При нагревании сухих солей аммония они **всегда разлагаются**, но по-разному: если анион **не окислитель**, выделяется `NH3` (реакция не ОВР); если анион **окислитель** (`NO2⁻`, `NO3⁻`, `Cr2O7^{2−}`), идёт внутримолекулярная ОВР с выделением `N2` или `N2O`:"}, {"eq": ["NH4Cl —t°→ NH3↑ + HCl↑", "NH4HCO3 —t°→ NH3↑ + CO2↑ + H2O", "NH4NO2 —t°→ N2↑ + 2H2O", "NH4NO3 —t°→ N2O↑ + 2H2O", "(NH4)2Cr2O7 —t°→ N2↑ + Cr2O3 + 4H2O"]}, {"h": "2. Оксиды азота: несолеобразующие vs NO2 (смешанный ангидрид)"}, {"p": "Оксиды `N2O` (веселящий газ) и `NO` (бесцветный газ) — **несолеобразующие**: они не реагируют с водой, кислотами и щелочами. Важнейшая особенность `NO` — на воздухе он мгновенно окисляется кислородом в **бурый газ `NO2`** (`2NO + O2 → 2NO2`)."}, {"p": "Сам бурый газ `NO2` (степень окисления `+4`, промежуточная между `+3` и `+5`) — кислотный оксид, который в воде и щелочах **диспропорционирует** сразу на два продукта (нитрит и нитрат). А если добавить кислород `O2`, весь азот доокисляется до `+5` — получается **только нитрат** (или только `HNO3`):"}, {"eq": ["2NO2 + H2O(хол.) → HNO2 + HNO3", "3NO2 + H2O(гор.) → 2HNO3 + NO↑", "2NO2 + 2KOH → KNO2 + KNO3 + H2O", "4NO2 + O2 + 2H2O → 4HNO3", "4NO2 + O2 + 4KOH → 4KNO3 + 2H2O"]}, {"h": "3. Азотная кислота HNO3 (разбавленная и концентрированная)"}, {"warn": "Антипаттерн № 5: азотная кислота ЛЮБОЙ концентрации — сильный окислитель за счёт `N^{+5}`! При реакции металлов с `HNO3` водород `H2` **никогда не выделяется**. На холоде `HNO3(конц.)` пассивирует `Fe`, `Al`, `Cr` (но `HNO3(разб.)` с ними реагирует!). Золото `Au` и платина `Pt` в чистой `HNO3` не растворяются.", "t": "Главное правило по HNO3"}, {"table": [["Реагент", "С HNO3(конц.)", "С HNO3(разб.)", "Пример уравнения"], ["Малоактивные металлы (`Cu`, `Ag`, `Hg`)", "Всегда бурый газ **`NO2`**", "Бесцветный газ **`NO`**", "`Cu + 4HNO3(конц.) → Cu(NO3)2 + 2NO2↑ + 2H2O`; `3Cu + 8HNO3(разб.) → 3Cu(NO3)2 + 2NO↑ + 4H2O`"], ["Средние металлы (`Fe`, `Cr`, `Al` — с конц. только при `t°`!; `Zn`)", "**`NO2`** (у `Zn` может быть `NO2` или `N2O`)", "`NO`, `N2O`, `N2` или `NH4NO3` (у `Fe` — чаще `NO`)", "`Fe + 6HNO3(конц.) —t°→ Fe(NO3)3 + 3NO2↑ + 3H2O`; `Fe + 4HNO3(разб.) → Fe(NO3)3 + NO↑ + 2H2O`"], ["Активные металлы (`Mg`, `Ca`, `Zn` с очень разб.)", "`N2O` / `NO2` (по условию)", "**`NH4NO3`** (или `N2O`, `N2`)", "`4Mg + 10HNO3(оч. разб.) → 4Mg(NO3)2 + NH4NO3 + 3H2O`"], ["Неметаллы (`C`, `S`, `P`)", "**`NO2`** + высшая кислота (`CO2`, `H2SO4`, `H3PO4`)", "`NO` (реакция идёт медленнее, при `t°`)", "`P + 5HNO3(конц.) —t°→ H3PO4 + 5NO2↑ + H2O`; `C + 4HNO3(конц.) —t°→ CO2↑ + 4NO2↑ + 2H2O`"]]}, {"p": "Сама концентрированная азотная кислота неустойчива и на свету или при нагревании разлагается с выделением бурого газа (поэтому она желтеет при хранении): `4HNO3(конц.) —hν/t°→ 4NO2↑ + O2↑ + 2H2O`."}, {"h": "4. Термическое разложение нитратов (хит № 8, 9, 31)"}, {"p": "Нитраты при нагревании разлагаются строго по электрохимическому ряду напряжений — чем менее активен металл, тем глубже распадается соль:"}, {"svg": "<svg viewBox='0 0 460 190' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='190' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='25' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Термическое разложение нитратов (t°)<\/text><rect x='14' y='42' width='136' height='92' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)' stroke-width='1.6'/><text x='82' y='64' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='13' font-weight='700'>Левее Mg<\/text><text x='82' y='82' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>K, Na, Ba, Ca, Sr<\/text><text x='82' y='103' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Нитрит + O₂↑<\/text><text x='82' y='121' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='12'>(кроме LiNO₃!)<\/text><rect x='162' y='42' width='146' height='92' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.6'/><text x='235' y='64' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='13' font-weight='700'>От Mg до Cu (+ Li)<\/text><text x='235' y='82' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>Li, Mg, Al, Zn, Fe, Cu<\/text><text x='235' y='103' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Оксид + NO₂↑ + O₂↑<\/text><text x='235' y='121' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>высший оксид для Fe²⁺!<\/text><rect x='320' y='42' width='126' height='92' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-acc,#14b8a6)' stroke-width='1.6'/><text x='383' y='64' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='13' font-weight='700'>Правее Cu<\/text><text x='383' y='82' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>Hg, Ag<\/text><text x='383' y='103' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Металл + NO₂↑ + O₂↑<\/text><text x='383' y='121' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>оксиды неустойчивы<\/text><rect x='14' y='144' width='432' height='34' rx='6' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-line,#2a3f57)' stroke-width='1.2'/><text x='230' y='166' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12' font-weight='700'>Особый случай: NH₄NO₃ —t°→ N₂O↑ + 2H₂O (без кислорода!)<\/text><\/svg>"}, {"steps": ["**Разбор вслух: 5 ключевых уравнений разложения нитратов (включая ловушки!)**", "**1. Нитрат калия (левее Mg):** `2KNO3 —t°→ 2KNO2 + O2↑` (только кислород, бурого газа нет!).", "**2. Исключение `LiNO3` (стоит левее Mg, но маленький ион `Li^{+}` разрушает нитрит):** `4LiNO3 —t°→ 2Li2O + 4NO2↑ + O2↑`.", "**3. Нитрат меди(II) (группа Mg–Cu):** `2Cu(NO3)2 —t°→ 2CuO + 4NO2↑ + O2↑`.", "**4. Исключение `Fe(NO3)2` (кислород при прокаливании сразу окисляет `Fe^{+2}` до `Fe^{+3}`!):** `4Fe(NO3)2 —t°→ 2Fe2O3 + 8NO2↑ + O2↑`. Проверяем `O`: слева `4·6 = 24`, справа `2·3 + 8·2 + 2 = 6 + 16 + 2 = 24`!", "**5. Исключение `Mn(NO3)2` (марганец окисляется до `+4` за счёт собственного кислорода, поэтому `O2` не выделяется!):** `Mn(NO3)2 —t°→ MnO2 + 2NO2↑`.", "**6. Нитрат серебра (правее Cu):** `2AgNO3 —t°→ 2Ag + 2NO2↑ + O2↑`."]}, {"bridge": {"kim": "№ 6, 7, 8, 9, 31 КИМ", "ask": "Разложение нитратов и реакции `HNO3`/`NO2`/`NH3` встречаются почти в каждом варианте ЕГЭ в № 8, № 9 и № 31.", "watch": "Ловят на: 1) `LiNO3` и `Fe(NO3)2` при разложении; 2) `NH4NO3` vs `NH4NO2` (`N2O` vs `N2`); 3) горении `NH3` без катализатора (`N2`) vs на `Pt` (`NO`); 4) `NO2 + KOH` (`KNO2 + KNO3`) vs `NO2 + O2 + KOH` (только `KNO3`); 5) выделении `H2` с `HNO3` (никогда!).", "tip": "Если в № 31 написано «твёрдую соль прокалили, выделилась смесь газов, среди которых бурый газ» — это почти гарантированно нитрат из группы `Mg–Cu`, `LiNO3` или `AgNO3`."}}], "short": [{"list": ["`N2` инертен из-за тройной связи; с `Li` реагирует при н.у., с `Mg`/`Ca` при `t°`, с `O2` — только до `NO` при очень высокой температуре/разряде.", "`NH3` горит в `O2` без катализатора до `N2`, на `Pt`-катализаторе — до `NO`; восстанавливает `CuO` до `Cu` и `N2`.", "`NH4NO2 —t°→ N2 + 2H2O`, `NH4NO3 —t°→ N2O + 2H2O`, `(NH4)2Cr2O7 —t°→ N2 + Cr2O3 + 4H2O`.", "`NO2` со щёлочью даёт нитрит + нитрат, а в присутствии `O2` — только нитрат.", "`HNO3` любой концентрации никогда не выделяет `H2`; на холоде `HNO3(конц.)` пассивирует `Fe`, `Al`, `Cr`; с `Cu`/`Ag` конц. даёт `NO2`, разб. — `NO`.", "Разложение нитратов: левее `Mg` → нитрит + `O2` (кроме `LiNO3`!), `Mg–Cu` → оксид + `NO2` + `O2` (для `Fe(NO3)2` — `Fe2O3`!), правее `Cu` → металл + `NO2` + `O2`."]}]}, {"id": "08", "group": "Химия неметаллов", "nav": "P, C, Si и их соединения", "codes": ["2.3"], "eyebrow": "08 · Код 2.3 · Фосфор, углерод и кремний", "title": "Фосфор, углерод, кремний и их соединения", "lead": "Почему песок SiO2 не растворяется в воде и соляной кислоте, но боится плавиковой кислоты HF, и почему белый фосфор и кремний способны реагировать со щелочами прямо в водном растворе?", "b": [{"key": "Фосфор (`P`), углерод (`C`) и кремний (`Si`) — неметаллы, в которых ЕГЭ особенно любит проверять нестандартные свойства: диспропорционирование фосфора в щелочах, три ряда фосфатов, реакции углерода и `CO` как восстановителей, гидролиз карбидов/фосфидов/силицидов, а также уникальную «кислотостойкость» `Si` и `SiO2` при их реакции с `HF` и щелочами.", "t": "Главная мысль."}, {"h": "1. Фосфор (P), фосфиды и три ряда солей H3PO4"}, {"p": "Фосфор в ЕГЭ встречается как белый (`P4`, ядовит, светится в темноте, самовоспламеняется) и красный (`P`, полимер, спокойнее). С кислородом и хлором продукты зависят от избытка/недостатка окислителя:"}, {"eq": ["4P + 3O2(нед.) —t°→ 2P2O3", "4P + 5O2(изб.) —t°→ 2P2O5", "2P + 3Cl2(нед.) → 2PCl3", "2P + 5Cl2(изб.) → 2PCl5"]}, {"p": "С водородом фосфор **напрямую не реагирует** (запомни для № 7!). Поэтому ядовитый газ **фосфин `PH3`** получают двумя другими путями — гидролизом фосфидов активных металлов или **диспропорционированием белого фосфора в горячей щёлочи** (хит № 8 и № 31!):"}, {"eq": ["3Ca + 2P —t°→ Ca3P2", "Ca3P2 + 6H2O → 3Ca(OH)2 + 2PH3↑", "4P(белый) + 3NaOH(конц.) + 3H2O —t°→ PH3↑ + 3NaH2PO2"]}, {"hint": "Обрати внимание на соль `NaH2PO2` — это **гипофосфит натрия** (средняя соль одноосновной фосфорноватистой кислоты `H3PO2`, где степень окисления фосфора `+1`). Два атома водорода в `H2PO2⁻` связаны напрямую с фосфором и на металл не замещаются!", "t": "Почему NaH2PO2 — средняя, а не кислая соль?"}, {"p": "Галогениды фосфора `PCl3` и `PCl5` необратимо гидролизуются водой (и щелочами) без изменения степени окисления фосфора, а оксид `P2O5` с холодной и горячей водой даёт разные кислоты; в промышленности сам фосфор получают восстановлением фосфорита углём в присутствии песка:"}, {"eq": ["PCl3 + 3H2O → H3PO3 + 3HCl", "PCl5 + 4H2O → H3PO4 + 5HCl", "P2O5 + H2O(хол.) → 2HPO3", "P2O5 + 3H2O(гор.) → 2H3PO4", "Ca3(PO4)2 + 3SiO2 + 5C —t°→ 3CaSiO3 + 2P + 5CO↑"]}, {"p": "С концентрированными кислотами-окислителями (`HNO3`, `H2SO4`) фосфор окисляется до `H3PO4` (`P + 5HNO3(конц.) —t°→ H3PO4 + 5NO2↑ + H2O`). С бертолетовой солью `KClO3` красный фосфор бурно реагирует при трении (спичечный коробок): `6P + 5KClO3 → 3P2O5 + 5KCl`."}, {"p": "Ортофосфорная кислота `H3PO4` — трёхосновная кислота средней силы, образующая **три ряда солей** (`PO4^{3−}` фосфаты, `HPO4^{2−}` гидрофосфаты, `H2PO4⁻` дигидрофосфаты). В таблице растворимости ФИПИ почти все **дигидрофосфаты** (`Ca(H2PO4)2`, `Ba(H2PO4)2`, кроме `Hg(H2PO4)2` с прочерком) имеют пометку **«Р»**, тогда как средние фосфаты (`Ca3(PO4)2`) и гидрофосфат кальция (`CaHPO4`) нерастворимы (**«Н»**). Управлять переходами между тремя солями кальция можно соотношением `H3PO4` и `Ca(OH)2`:"}, {"eq": ["Ca3(PO4)2 + 4H3PO4 → 3Ca(H2PO4)2", "Ca(H2PO4)2 + Ca(OH)2(нед.) → 2CaHPO4↓ + 2H2O", "Ca(H2PO4)2 + 2Ca(OH)2(изб.) → Ca3(PO4)2↓ + 4H2O"]}, {"h": "2. Углерод (C), оксиды CO и CO2, карбиды и карбонаты"}, {"p": "Углерод при нагревании — отличный восстановитель. Запомни его главные реакции с неметаллами, оксидами, водой и кислотами-окислителями:"}, {"eq": ["2C + O2(нед.) —t°→ 2CO", "C + O2(изб.) —t°→ CO2", "C + CO2 —t°→ 2CO", "C + H2O(пар) —t°→ CO↑ + H2↑", "CaO + 3C —t°→ CaC2 + CO↑", "SiO2 + 2C —t°→ Si + 2CO↑"]}, {"p": "Угарный газ `CO` — **несолеобразующий** оксид: с водой, кислотами и водными растворами щелочей при н.у. он **не реагирует**! (Только при высокой температуре и давлении с твёрдой щёлочью образуется формиат `CO + NaOH —t°, p→ HCOONa`, это из органики). Зато `CO` — сильный восстановитель (`Fe2O3 + 3CO —t°→ 2Fe + 3CO2`, `2CO + O2 —t°→ 2CO2`)."}, {"p": "Углекислый газ `CO2` — классический кислотный оксид (со щелочами даёт `Na2CO3` при избытке щёлочи или `NaHCO3` при избытке `CO2`). Неожиданная, но частая реакция ЕГЭ: **магний горит в углекислом газе**, отбирая у него кислород: `2Mg + CO2 —t°→ 2MgO + C` (поэтому горящий магний нельзя тушить углекислотным огнетушителем!)."}, {"p": "В заданиях № 8, 9 и 31 обязательно различай **два главных карбида** и их гидролиз водой (или кислотой):"}, {"compare": {"t": "Гидролиз карбидов: ацетиленид vs метанид", "left": {"title": "Карбид кальция CaC2 → ацетилен C2H2", "items": ["`CaC2 + 2H2O → Ca(OH)2 + C2H2↑`", "`CaC2 + 2HCl → CaCl2 + C2H2↑`"]}, "right": {"title": "Карбид алюминия Al4C3 → метан CH4", "items": ["`Al4C3 + 12H2O → 4Al(OH)3↓ + 3CH4↑`", "`Al4C3 + 12HCl → 4AlCl3 + 3CH4↑`"]}}}, {"h": "3. Кремний (Si), оксид кремния(IV) SiO2 и силикаты"}, {"p": "Кремний — главный источник неожиданных «да/нет» в задании № 7. Он **не реагирует с водородом** напрямую (как и фосфор!) и **не реагирует ни с одной отдельной кислотой** (`HCl`, `H2SO4`, `HNO3`, и даже с отдельной `HF` в ЕГЭ он НЕ реагирует — растворяется только в смеси `HF + HNO3`!). Зато кремний бурно растворяется в **водных растворах щелочей** с выделением водорода (как `Al` и `Zn`), реагирует с `F2` при н.у., а с `Cl2`, `O2` и `Mg` — при нагревании:"}, {"eq": ["Si + 2NaOH(водн.) + H2O —t°→ Na2SiO3 + 2H2↑", "Si + 2F2 → SiF4↑", "Si + 2Cl2 —t°→ SiCl4", "SiCl4 + 3H2O → H2SiO3↓ + 4HCl", "Si + O2 —t°→ SiO2", "Si + 2Mg —t°→ Mg2Si", "Mg2Si + 4HCl → 2MgCl2 + SiH4↑"]}, {"warn": "Антипаттерн № 6 (ловушка на каждый второй вариант № 7): оксид кремния(IV) `SiO2` имеет атомную кристаллическую решётку, поэтому он **НЕ реагирует с водой**! Нельзя писать `SiO2 + H2O → H2SiO3`. Единственная кислота, которая растворяет `SiO2`, — это плавиковая кислота `HF` (`SiO2 + 4HF → SiF4↑ + 2H2O`). А вот сам кремний `Si` с отдельной `HF` в ЕГЭ НЕ реагирует!", "t": "Ловушка ЕГЭ: SiO2 vs Si с водой и кислотами"}, {"p": "При нагревании (сплавлении) `SiO2` как нелетучий кислотный оксид вытесняет летучий `CO2` из карбонатов (варка стекла!), реагирует с основными оксидами и щелочами, а также восстанавливается магнием до кремния:"}, {"eq": ["SiO2 + Na2CO3 —сплавление→ Na2SiO3 + CO2↑", "SiO2 + CaCO3 —сплавление→ CaSiO3 + CO2↑", "SiO2 + 2NaOH —t°→ Na2SiO3 + H2O", "SiO2 + CaO —t°→ CaSiO3", "SiO2 + 2Mg —t°→ Si + 2MgO"]}, {"p": "Кремниевая кислота `H2SiO3` — **единственная нерастворимая кислота** в таблице растворимости ФИПИ (выпадает в виде студенистого осадка). Поскольку она слабее даже угольной кислоты, её вытесняет из раствора силиката обычный углекислый газ `CO2`: `Na2SiO3 + CO2(нед.) + H2O → H2SiO3↓ + Na2CO3`, а при избытке `CO2` — `Na2SiO3 + 2CO2(изб.) + 2H2O → H2SiO3↓ + 2NaHCO3`. При нагревании `H2SiO3 —t°→ SiO2 + H2O`."}, {"steps": ["**Разбор вслух: проверяем баланс в реакции белого фосфора со щёлочью**", "`4P(белый) + 3NaOH(конц.) + 3H2O —t°→ PH3↑ + 3NaH2PO2`", "**Шаг 1 (баланс электронов):** `P⁰ + 3e⁻ → P^{−3}` (окислитель, ×1); `P⁰ − 1e⁻ → P^{+1}` (восстановитель, ×3). Итого справа `1 PH3` и `3 NaH2PO2`, а слева `1 + 3 = 4 P`.", "**Шаг 2 (натрий):** справа `3 Na` в `3NaH2PO2`, значит слева `3NaOH`.", "**Шаг 3 (водород и проверка по кислороду):** справа `H`: `3 + 3·2 = 9`; слева `3` уже в `3NaOH`, не хватает `6 H` → `3H2O`. Проверяем `O`: слева `3 + 3 = 6`, справа `3·2 = 6`. Сошлось!"]}, {"bridge": {"kim": "№ 6, 7, 8, 9, 31 КИМ", "ask": "В № 7 `P`, `C`, `Si`, `CO`, `CO2`, `SiO2` — любимые «убийцы баллов». В № 8 и № 31 часто проверяют гидролиз `CaC2`/`Al4C3`/`Ca3P2`/`Mg2Si`/`PCl5`/`SiCl4`, сплавление `SiO2 + Na2CO3` и растворение `Si` в `NaOH`.", "watch": "Ловят на: 1) `P + H2` и `Si + H2` (напрямую НЕ идут!); 2) `SiO2 + H2O` (НЕ идёт!); 3) `Si` с отдельными кислотами `HCl`, `H2SO4`, `HNO3`, `HF` (НЕ идёт!); 4) `CO + NaOH(водн.)` при н.у. (НЕ идёт!); 5) попытке осадить `H2SiO3` из `SiO2 + H2O` вместо `Na2SiO3 + HCl` или `Na2SiO3 + CO2 + H2O`.", "tip": "Увидев `Si` в № 7 — сразу ищи в строке `NaOH`, `F2`, `Cl2`, `O2`, `Mg`, и смело вычёркивай строки с `H2`, `HCl`, `H2SO4`, `HF`, `H2O`. Увидев `SiO2` — ищи `HF`, `NaOH`, `Na2CO3`, `CaO`, `C`, `Mg`, и вычёркивай `H2O`, `HCl`, `HNO3`."}}], "short": [{"list": ["Фосфор не реагирует напрямую с `H2`; фосфин `PH3` получают гидролизом фосфидов (`Ca3P2 + H2O`) или диспропорционированием белого фосфора в горячей щёлочи (`4P(белый) + 3NaOH(конц.) + 3H2O —t°→ PH3↑ + 3NaH2PO2`).", "Ортофосфорная кислота `H3PO4` даёт 3 ряда солей; почти все дигидрофосфаты (кроме `Hg(H2PO4)2`) растворимы, а средние фосфаты и `CaHPO4` — осадки; `PCl3`/`PCl5` гидролизуются водой до `H3PO3`/`H3PO4` и `HCl`.", "Углерод восстанавливает оксиды металлов, `SiO2` (до `Si` и `CO`), `CO2` (до `CO`) и `H2O(пар)` (до `CO + H2`). `CO` — несолеобразующий оксид; магний горит в `CO2` (`2Mg + CO2 —t°→ 2MgO + C`).", "Гидролиз `CaC2` даёт ацетилен `C2H2`, а гидролиз `Al4C3` — метан `CH4`.", "Кремний `Si` не реагирует с `H2` и отдельными кислотами (`HCl`, `H2SO4`, `HNO3`, `HF`), но реагирует со щелочами (`Si + 2NaOH(водн.) + H2O —t°→ Na2SiO3 + 2H2↑`), `F2`, `Cl2`, `O2` и `Mg`.", "`SiO2` не реагирует с водой и обычными кислотами; растворяется в `HF` (`SiF4 + H2O`), сплавляется со щелочами, основными оксидами и карбонатами (`Na2SiO3 + CO2↑`) и восстанавливается `C` и `Mg`."]}]}, {"id": "09", "group": "Практикум КИМ", "nav": "Алгоритмы № 6, 7, 8, 9", "codes": ["2.2", "2.3", "2.4"], "eyebrow": "09 · Код 2.4 · Генетическая связь и задания 6–9", "title": "Задания № 6, 7, 8, 9 КИМ: алгоритмы отбора реагентов и генетические цепочки", "lead": "Почему даже сильные ученики теряют баллы в № 7 и № 8, хотя знают свойства веществ по отдельности — и как метод быстрого отсева превращает 4 сложных задания первой части в 7 стабильных первичных баллов?", "b": [{"key": "Задания № 6, 7, 8 (по 2 балла) и № 9 (1 балл) дают суммарно **7 первичных баллов** — больше десятой части всего экзамена! В № 7 ключ к скорости — **метод отсева** (достаточно найти одно нереагирующее вещество, чтобы вычеркнуть всю строку), а в № 9 — знание [[генетическая связь|генетических мостиков]] через нерастворимые оксиды, гидроксиды и смену степени окисления.", "t": "Главная мысль."}, {"h": "1. Генетическая карта неорганических классов (опора для № 9)"}, {"p": "Генетический ряд — это цепочка превращений веществ одного элемента через разные классы. В задании № 9 чаще всего нужно подобрать два неизвестных вещества `X` и `Y`, чтобы замкнуть цепочку `A —(+X)→ B —(+Y)→ C`. Посмотри на универсальную карту переходов:"}, {"svg": "<svg viewBox='0 0 460 238' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='238' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Генетическая карта неорганических классов<\/text><rect x='16' y='44' width='86' height='42' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='59' y='70' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13' font-weight='700'>Металл<\/text><rect x='132' y='44' width='94' height='42' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='179' y='63' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Осн./амф.<\/text><text x='179' y='78' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>оксид<\/text><rect x='256' y='44' width='94' height='42' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='303' y='63' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Основание /<\/text><text x='303' y='78' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>амф. гидр.<\/text><rect x='16' y='138' width='86' height='42' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.5'/><text x='59' y='164' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13' font-weight='700'>Неметалл<\/text><rect x='132' y='138' width='94' height='42' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.5'/><text x='179' y='157' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Кислотный<\/text><text x='179' y='172' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>оксид<\/text><rect x='256' y='138' width='94' height='42' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.5'/><text x='303' y='164' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13' font-weight='700'>Кислота<\/text><rect x='374' y='90' width='72' height='44' rx='8' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)' stroke-width='2'/><text x='410' y='117' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='14' font-weight='700'>СОЛЬ<\/text><line x1='102' y1='65' x2='128' y2='65' stroke='var(--svg-dim,#94a8c0)' stroke-width='1.8'/><polygon points='132,65 124,61 124,69' fill='var(--svg-dim,#94a8c0)'/><text x='117' y='56' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+O₂<\/text><line x1='226' y1='65' x2='252' y2='65' stroke='var(--svg-dim,#94a8c0)' stroke-width='1.8'/><polygon points='256,65 248,61 248,69' fill='var(--svg-dim,#94a8c0)'/><text x='241' y='56' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+H₂O*<\/text><line x1='102' y1='159' x2='128' y2='159' stroke='var(--svg-dim,#94a8c0)' stroke-width='1.8'/><polygon points='132,159 124,155 124,163' fill='var(--svg-dim,#94a8c0)'/><text x='117' y='150' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+O₂<\/text><line x1='226' y1='159' x2='252' y2='159' stroke='var(--svg-dim,#94a8c0)' stroke-width='1.8'/><polygon points='256,159 248,155 248,163' fill='var(--svg-dim,#94a8c0)'/><text x='241' y='150' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+H₂O*<\/text><line x1='350' y1='65' x2='408' y2='88' stroke='var(--svg-good,#34c77b)' stroke-width='1.8'/><polygon points='410,90 401,89 405,83' fill='var(--svg-good,#34c77b)'/><line x1='350' y1='159' x2='408' y2='136' stroke='var(--svg-good,#34c77b)' stroke-width='1.8'/><polygon points='410,134 405,141 401,135' fill='var(--svg-good,#34c77b)'/><text x='230' y='204' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='12'>*Если осадок (Fe(OH)₃, Cu(OH)₂, H₂SiO₃) —<\/text><text x='230' y='222' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>иди в обход через соль: оксид → соль → осадок!<\/text><\/svg>"}, {"p": "Этот «обход через соль» — главный приём для № 9. Нельзя получить `Cu(OH)2` из `CuO + H2O`, `Al(OH)3` из `Al2O3 + H2O` или `H2SiO3` из `SiO2 + H2O`. Вместо этого сначала переводим нерастворимый оксид в **растворимую соль** (`CuO → CuSO4`, `SiO2 → Na2SiO3`), а затем осаждаем нужный гидроксид или кислоту (`CuSO4 + 2NaOH → Cu(OH)2↓ + Na2SO4`, `Na2SiO3 + 2HCl → H2SiO3↓ + 2NaCl`)."}, {"h": "2. Алгоритм решения задания № 7 (метод быстрого отсева)"}, {"p": "В задании № 7 даны 4 вещества (А, Б, В, Г) и 5 наборов по 3 реагента. Если проверять все `4 × 5 × 3 = 60` реакций подряд, ты потратишь 10 минут. Вместо этого используй **дерево быстрого отсева**:"}, {"tree": {"t": "Как быстро выбрать правильный набор из 3 реагентов в № 7", "root": {"q": "Вещество А — простое вещество (металл или неметалл)?", "yes": {"q": "Это малоактивный металл (Cu, Ag) или инертный неметалл (N2, Si, C)?", "yes": {"a": "Сразу вычеркни строки с водой (для Cu, Si), HCl/H2SO4(разб.) (для Cu, Si, C), H2 (для P, Si) и солями активных металлов", "why": "После отсева обычно остаётся 1–2 строки — проверь в них кислоты-окислители, щёлочи (для Si/Al/Zn/P/S/Cl2), O2 и галогены."}, "no": {"a": "Для активных и средних металлов отсей строки с основными оксидами и щелочами (кроме Al, Zn, Be!); для галогенов/O2 — строки с O2, N2, C (для Cl2/Br2)", "why": "Остаётся одна строка, где все 3 реагента химически совместимы."}}, "no": {"q": "Это несолеобразующий оксид (CO, NO, N2O) или нерастворимый SiO2?", "yes": {"a": "Сразу вычеркни все строки с водой, кислотами (кроме HF для SiO2) и водными щелочами при н.у. (для CO, NO, N2O)", "why": "Для CO/NO ищи ОВР-пары (O2, CuO, Fe2O3); для SiO2 — HF, NaOH, Na2CO3, CaO, C."}, "no": {"a": "Действуй по правилу «подобное с подобным не реагирует» (основное с основным, кислотное с кислотным), проверь растворимость солей (нерастворимые `BaSO4`, `AgCl`, `CaCO3` не вступают в РИО с другими солями и щелочами!) и возможные ОВР", "why": "Помни тонкости: кислая соль слабой кислоты (`NaHCO3`, `NaHS`, `NaH2PO4`) реагирует И с сильной кислотой, И со щёлочью; `NaHSO4` с `HCl`/`HNO3` НЕ реагирует, но реагирует с `Mg`, `Na2CO3`, `NaOH`; `Fe^{3+}` и `Cu^{2+}` дают ОВР с `KI`/`Na2S`, а `CuSO4 + H2S → CuS↓ + H2SO4` идёт!"}}}}}, {"h": "3. Различение осадков в кислотах (хит задания № 6)"}, {"table": [["Осадок и цвет", "Реакция с HCl / HNO3(разб.)", "Как это используют в № 6"], ["`BaSO4` (белый)", "**НЕ растворяется** ни в `HCl`, ни в `HNO3`", "Отличает сульфат от `BaCO3` и `BaSO3` (оба белые, но растворяются в `HCl` с выделением `CO2↑` и `SO2↑`)"], ["`AgCl` (белый), `AgBr` (бледно-жёлтый), `AgI` (жёлтый)", "**НЕ растворяются** в `HNO3`", "Отличает галогениды серебра от жёлтого `Ag3PO4` (он **растворяется** в `HNO3`!)"], ["`CuS`, `Ag2S`, `PbS`, `HgS` (чёрные)", "**НЕ растворяются** в `HCl`/`H2SO4(разб.)`, но растворяются в `HNO3`", "Отличает их от `FeS` и `ZnS`, которые растворяются в `HCl` с запахом `H2S`"]]}, {"h": "4. Полные разборы форматов № 6, № 7, № 8 и № 9"}, {"steps": ["**Разбор 1 (формат № 6 — две пробирки):** В пробирку с раствором соли `X` добавили раствор `NaOH` — выпал осадок, который растворился в избытке щёлочи. В другую пробирку с тем же `X` добавили раствор `BaCl2` — выпал белый осадок. Кто `X`?", "**Ход мысли:** 1) Осадок, растворимый в избытке `NaOH` → амфотерный катион (`Al^{3+}`, `Zn^{2+}` или `Cr^{3+}`). 2) Белый осадок с `BaCl2` → анион `SO4^{2−}` (или `CO3^{2−}`/`SO3^{2−}`, но с `Al^{3+}` они не существуют!). Значит `X` — **сульфат алюминия `Al2(SO4)3`** (или `ZnSO4`)."]}, {"steps": ["**Разбор 2 (формат № 7 — отбор строки):** Для оксида кремния(IV) `SiO2` выбери строку из 3 реагентов: 1) `H2O, NaOH, HF`; 2) `HCl, CaO, C`; 3) `Na2CO3, HF, KOH`; 4) `SO2, O2, NaCl`.", "**Метод отсева:** в строке 1 сразу вычёркиваем `H2O` (`SiO2` с водой не реагирует); в строке 2 вычёркиваем `HCl`; в строке 4 вычёркиваем кислотный оксид `SO2`, `O2` и `NaCl`. Остаётся **строка 3**: `SiO2 + Na2CO3 —сплавление→ Na2SiO3 + CO2↑`; `SiO2 + 4HF → SiF4↑ + 2H2O`; `SiO2 + 2KOH —t°→ K2SiO3 + H2O`. Все три реакции идут!"]}, {"steps": ["**Разбор 3 (формат № 8 — исходные → продукты):** Сравни две почти одинаковые пары: А) `Fe3O4 + HCl` и Б) `Fe3O4 + HNO3(конц.)` при нагревании.", "**Ход мысли:** `Fe3O4` содержит `Fe^{+2}` и `Fe^{+3}`. Кислота `HCl` не окислитель → степени окисления сохраняются, получаем **две соли**: `FeCl2 + FeCl3 + H2O`. Кислота `HNO3(конц.)` — сильный окислитель → весь `Fe^{+2}` окисляется до `Fe^{+3}`, получаем **одну соль** `Fe(NO3)3 + NO2↑ + H2O`."]}, {"steps": ["**Разбор 4 (формат № 9 — цепочка X → Y):** `Fe —(+X)→ FeCl3 —(+Y)→ FeCl2`.", "**Ход мысли:** 1) Чтобы перевести `Fe(0)` сразу в `Fe(+3)` (а не в `FeCl2`!), нужна не `HCl`, а сильный окислитель — **хлор `Cl2`** (`2Fe + 3Cl2 —t°→ 2FeCl3`). 2) Чтобы восстановить `FeCl3` до `FeCl2` без лишних посторонних катионов или с чистым переходом, идеально подходит **железо `Fe`** (`2FeCl3 + Fe → 3FeCl2`), либо `Cu`, либо `KI`/`H2S` (смотря что есть в списке вариантов!)."]}, {"bridge": {"kim": "№ 6, 7, 8, 9 КИМ", "ask": "В № 6 всегда два наблюдения в двух пробирках; в № 7 — 4 вещества и 5 троек реагентов; в № 8 — 4 пары реагентов и 6 наборов продуктов; в № 9 — цепочка из двух переходов `X` и `Y`.", "watch": "Самая дорогая техническая ошибка в № 6–8: перепутать порядок цифр (в № 6–9 порядок цифр ВАЖЕН!) или потерять 1 балл из-за избытка/недостатка реагента (например, `KHCO3` вместо `K2CO3` при избытке `CO2`).", "tip": "В № 7 обязательно проверяй все 3 вещества в выбранной строке, даже если первые 4 строки уже отсеяны: это страхует от невнимательности."}}], "short": [{"list": ["Нерастворимые гидроксиды (`Cu(OH)2`, `Fe(OH)3`, `Al(OH)3`) и кремниевую кислоту `H2SiO3` нельзя получить прямой реакцией оксида с водой — в цепочках № 9 иди в обход через растворимую соль.", "В № 7 применяй метод быстрого отсева: одно нереагирующее вещество сразу исключает всю строку из трёх реагентов.", "В № 8 всегда проверяй 4 переключателя продуктов: концентрация кислоты (`H2SO4`/`HNO3`), температура (холод/нагревание, раствор/сплавление), избыток/недостаток и наличие ОВР-пары.", "В № 6, 7, 8 и 9 порядок записи цифр в бланке строго важен: ошибка на одной позиции в № 6–8 снижает балл с 2 до 1, а в № 9 — сразу до 0."]}]}, {"id": "10", "group": "Практикум КИМ", "nav": "Задание № 31 на 4/4 балла", "codes": ["2.2", "2.3", "2.4"], "eyebrow": "10 · Коды 2.2–2.4 · Часть 2 (4 первичных балла)", "title": "Задание № 31 КИМ: мысленный эксперимент из 4 реакций на 4/4 балла", "lead": "Как за 5 минут расшифровать текстовый рассказ о четырёх пробирках, безошибочно узнать каждое скрытое вещество по цвету осадка или запаху газа и получить максимальные 4 балла?", "b": [{"key": "Задание № 31 оценивается в **4 первичных балла** — ровно по **1 баллу за каждое правильно записанное и уравненное уравнение**. Даже если одна реакция не получилась, остальные три принесут 3 балла. Главный ключ — не писать уравнения вслепую, а сначала составить краткую «карту веществ» по цветовым, газовым и температурным маркерам текста.", "t": "Главная мысль."}, {"h": "1. Критерии оценивания ФИПИ: за что дают и за что снимают баллы"}, {"list": ["**1 балл за каждое из 4 уравнений:** в уравнении должны быть верно указаны формулы всех исходных веществ и продуктов и **правильно расставлены коэффициенты**.", "**Обязательные требования:** удвоенные коэффициенты допустимы только если они не искажают смысл, но лучше всегда приводить коэффициенты к наименьшим целым; указывать условия над стрелкой (`t°`, `кат.`) и стрелки `↓`/`↑` в бланке № 31 *не обязательно*, но следить за тем, какие продукты соответствуют описанному условию (раствор vs сплавление, избыток vs недостаток) — **критически важно**!", "**За что ставят 0 баллов за конкретную реакцию:** неверный коэффициент хотя бы у одного вещества; запись не того продукта при указанном избытке/недостатке (например, `Na2CO3` вместо `NaHCO3`, когда в условии сказано «пропустили избыток `CO2`»); запись несуществующей реакции или противоречие описанному признаку (в тексте «выделился бурый газ», а в уравнении `NO`)."]}, {"h": "2. Словарь маркеров задания № 31 (как читать подсказки текста)"}, {"table": [["Фраза в условии № 31", "Что это за вещество / процесс", "На что сразу обратить внимание"], ["«Выделился **бурый газ**»", "`NO2` (или пары `Br2`, если речь о бромидах)", "Реакция с `HNO3(конц.)` или разложение нитрата группы `Mg–Cu` / `Li` / `Ag`"], ["«Бесцветный газ, **буреющий на воздухе**»", "`NO` (`2NO + O2 → 2NO2`)", "Реакция с `HNO3(разб.)` или каталитическое окисление `NH3`"], ["«Газ с **запахом тухлых яиц**»", "`H2S`", "Сульфид + `HCl`, совместный гидролиз `Al2S3`/`Cr2S3`, или `KI`/`Zn` + `H2SO4(конц.)`"], ["«Газ с **резким запахом**»", "`NH3` (щелочная среда), `SO2` (обесцвечивает `KMnO4`/`Br2`), `HCl`", "Смотри, в какой среде газ выделился: со щёлочью → `NH3`, с кислотой → `SO2` или `HCl`"], ["«Выпал **бурый осадок**»", "`Fe(OH)3` (реже `MnO2` в нейтральной среде с `KMnO4`)", "Соль `Fe(III)` + щёлочь / `NH3·H2O` / карбонат (совместный гидролиз)"], ["«Выпал **серо-зелёный осадок, буреющий на воздухе**»", "`Fe(OH)2 → Fe(OH)3`", "Не забудь добавить `O2` и `H2O` в уравнение окисления: `4Fe(OH)2 + O2 + 2H2O → 4Fe(OH)3`!"], ["«Белый студенистый осадок, **растворившийся в избытке щёлочи**»", "`Al(OH)3` или `Zn(OH)2` (для `Cr(OH)3` — серо-зелёный)", "В растворе пиши гидроксокомплекс `Na[Al(OH)4]` / `Na2[Zn(OH)4]`"], ["«**Жёлтый раствор стал оранжевым**» (или наоборот)", "`CrO4^{2−}` (жёлт., `OH⁻`) `↔ Cr2O7^{2−}` (оранж., `H^{+}`)", "Это переход без ОВР! Не меняй степень окисления хрома"], ["«Выпал **чёрный осадок**, не растворяющийся в `HCl`»", "`CuS`, `Ag2S`, `PbS` или `HgS`", "Растворяется только в `HNO3` (ОВР)"]]}, {"h": "3. Три эталонных разбора реальных типов задания № 31"}, {"steps": ["**Кейс 1 (разложение нитрата + амфотерность + комплекс):** *«Нитрат алюминия прокалили до постоянной массы. Твёрдый остаток сплавили с карбонатом натрия. Полученную соль растворили в избытке соляной кислоты. К образовавшемуся раствору добавили избыток раствора сульфида натрия.»*", "**Реакция 1 (разложение нитрата группы Mg–Cu):** `4Al(NO3)3 —t°→ 2Al2O3 + 12NO2↑ + 3O2↑`. Проверяем `O`: слева `4·9 = 36`, справа `2·3 + 12·2 + 3·2 = 6 + 24 + 6 = 36`.", "**Реакция 2 (сплавление амфотерного оксида с карбонатом):** `Al2O3 + Na2CO3 —сплавление→ 2NaAlO2 + CO2↑`. Проверяем `O`: `3 + 3 = 6` и `4 + 2 = 6`.", "**Реакция 3 (метаалюминат + избыток HCl → две соли, осадок `Al(OH)3` растворяется!):** `NaAlO2 + 4HCl(изб.) → AlCl3 + NaCl + 2H2O`. Проверяем `H`: `4` и `4`, `O`: `2` и `2`.", "**Реакция 4 (совместный гидролиз `Al^{3+}` + `S^{2−}`):** `2AlCl3 + 3Na2S + 6H2O → 2Al(OH)3↓ + 3H2S↑ + 6NaCl`. Проверяем `H`: `12` и `6 + 6 = 12`, `O`: `6` и `6`. Чистые **4/4 балла**!"]}, {"steps": ["**Кейс 2 (железо + осаждение + окисление на воздухе + ОВР с HI):** *«Железные опилки растворили в соляной кислоте. К полученному раствору добавили раствор гидроксида натрия, при этом выпал серо-зелёный осадок. Влажный осадок оставили на воздухе до полного побурения. Побуревший осадок растворили в растворе иодоводородной кислоты.»*", "**Реакция 1 (неокисляющая кислота → Fe(+2)):** `Fe + 2HCl → FeCl2 + H2↑`.", "**Реакция 2 (осаждение гидроксида железа(II)):** `FeCl2 + 2NaOH → Fe(OH)2↓ + 2NaCl`.", "**Реакция 3 (окисление влажного `Fe(OH)2` кислородом воздуха до бурого `Fe(OH)3`):** `4Fe(OH)2 + O2 + 2H2O → 4Fe(OH)3`. Проверяем `O`: `4·2 + 2 + 2 = 12` и `4·3 = 12`.", "**Реакция 4 (ОВР `Fe(OH)3 + HI`, НЕ обмен!):** `2Fe(OH)3 + 6HI → 2FeI2 + I2↓ + 6H2O`. Баланс: `2Fe^{+3} + 2e⁻ → 2Fe^{+2}`; `2I^{−1} − 2e⁻ → I2⁰`. Проверяем `H`: `2·3 + 6 = 12` и `6·2 = 12`; `O`: `6` и `6`; `I`: `6` и `4 + 2 = 6`. Чистые **4/4 балла**!"]}, {"steps": ["**Кейс 3 (неметаллы: кремний + щёлочь + CO2 + HF):** *«Кремний растворили в горячем растворе гидроксида натрия. Через полученный раствор пропустили избыток углекислого газа. Выпавший студенистый осадок отфильтровали и прокалили. Полученный твёрдый оксид обработали плавиковой кислотой.»*", "**Реакция 1 (Si + щёлочь):** `Si + 2NaOH(водн.) + H2O —t°→ Na2SiO3 + 2H2↑`.", "**Реакция 2 (избыток CO2 → кислая соль NaHCO3!):** `Na2SiO3 + 2CO2(изб.) + 2H2O → H2SiO3↓ + 2NaHCO3`. Проверяем `O`: `3 + 4 + 2 = 9` и `3 + 6 = 9`.", "**Реакция 3 (прокаливание H2SiO3):** `H2SiO3 —t°→ SiO2 + H2O`.", "**Реакция 4 (травление SiO2 плавиковой кислотой):** `SiO2 + 4HF → SiF4↑ + 2H2O`. Проверяем `O`: `2` и `2`, `F`: `4` и `4`. Чистые **4/4 балла**!"]}, {"warn": "В Кейсе 3 посмотри на реакцию 2: «пропустили **избыток** углекислого газа»! Если написать `Na2SiO3 + CO2 + H2O → H2SiO3↓ + Na2CO3`, эксперт ФИПИ поставит **0 баллов** за эту реакцию, потому что при избытке `CO2` карбонат обязан перейти в гидрокарбонат `NaHCO3`. Всегда подчёркивай в черновике слова «избыток», «недостаток», «концентрированная», «разбавленная», «сплавили», «прокалили»!", "t": "Главная причина потери 1 балла в № 31"}, {"bridge": {"kim": "№ 31 КИМ (4 первичных балла)", "ask": "Описывается последовательность из ровно 4 химических превращений. Нужно записать 4 сбалансированных молекулярных уравнения.", "watch": "Ловят на: 1) неверной проверке баланса (особенно по кислороду в ОВР); 2) игнорировании слова «избыток» (`NaHCO3` vs `Na2CO3`, `Na[Al(OH)4]` vs `Al(OH)3`, `AlCl3` vs `Al(OH)3`); 3) забытой ОВР в `Fe(OH)3 + HI` или `Fe3O4 + HNO3`.", "tip": "После записи всех 4 уравнений в чистовик проведи обязательный «кислородный аудит»: в каждом уравнении посчитай число атомов `O` (или последнего элемента) слева и справа. Это занимает 30 секунд и спасает 1–2 балла."}}], "short": [{"list": ["В задании № 31 каждое из 4 сбалансированных уравнений оценивается независимо в 1 первичный балл (максимум 4 балла).", "Перед записью уравнений выпиши все маркеры текста: цвет осадка/раствора, запах газа, наличие слов «избыток/недостаток», «прокалили», «сплавили», «концентрированная/разбавленная».", "При избытке `CO2`, `SO2` или `H2S` в щелочной среде или с силикатами/гидроксокомплексами всегда пиши кислую соль (`NaHCO3`, `NaHSO3`, `NaHS`).", "В конце обязательно пересчитай атомы всех элементов (включая кислород) слева и справа в каждом из 4 уравнений."]}]}], "gloss": [["Алюмотермия", "Способ пирометаллургического получения тугоплавких и средних металлов (Cr, Fe, Mn, W) восстановлением их оксидов металлическим алюминием при нагревании.", "Cr2O3 + 2Al —t°→ 2Cr + Al2O3"], ["Амфотерный гидроксид", "Гидроксид (Al(OH)3, Zn(OH)2, Be(OH)2, Cr(OH)3, Pb(OH)2, Sn(OH)2), проявляющий свойства основания в реакциях с кислотами и свойства кислоты в реакциях со щелочами.", "Al(OH)3 + 3HCl → AlCl3 + 3H2O; Al(OH)3 + NaOH(водн.) → Na[Al(OH)4]"], ["Генетическая связь", "Взаимосвязь между веществами разных классов (простое вещество ↔ оксид ↔ гидроксид/кислота ↔ соль), образованными одним химическим элементом.", "Cu → CuO → CuSO4 → Cu(OH)2 → CuO"], ["Гидрид", "Бинарное соединение элемента с водородом; гидриды активных металлов (NaH, CaH2) содержат ион H⁻ (степень окисления −1) и бурно разлагаются водой с выделением H2.", "CaH2 + 2H2O → Ca(OH)2 + 2H2↑"], ["Гидроксокомплекс", "Растворимое комплексное соединение, образующееся при растворении амфотерных металлов, их оксидов или гидроксидов в водном растворе щёлочи.", "Na[Al(OH)4], Na2[Zn(OH)4], Na[Cr(OH)4]"], ["Гидрометаллургия", "Получение металлов из руд через перевод соединения металла в водный раствор соли с последующим вытеснением более активным металлом или электролизом раствора.", "CuO + H2SO4(разб.) → CuSO4 + H2O; CuSO4 + Fe → FeSO4 + Cu"], ["Диспропорционирование", "Окислительно-восстановительная реакция, в которой один и тот же элемент одновременно повышает и понижает свою степень окисления.", "Cl2 + 2NaOH(хол.) → NaCl + NaClO + H2O"], ["Карбид", "Бинарное соединение металла или неметалла с углеродом; при гидролизе CaC2 даёт ацетилен C2H2, а Al4C3 — метан CH4.", "CaC2 + 2H2O → Ca(OH)2 + C2H2↑"], ["Нитрид", "Бинарное соединение элемента с азотом в степени окисления −3; нитриды активных металлов необратимо гидролизуются водой с выделением аммиака.", "Mg3N2 + 6H2O → 3Mg(OH)2↓ + 2NH3↑"], ["Пассивация", "Образование плотной защитной оксидной плёнки на поверхности Fe, Al и Cr под действием холодных концентрированных HNO3 и H2SO4, останавливающей реакцию без нагревания.", "Fe + HNO3(конц., хол.) — реакция не идёт"], ["Пероксид", "Соединение, содержащее кислородную группу –O–O– (пероксид-ион O2^{2−}) со степенью окисления кислорода −1.", "Na2O2 (получается при горении Na в O2)"], ["Пирометаллургия", "Получение металлов из оксидных (или предварительно обожжённых сульфидных) руд восстановлением при высокой температуре с помощью C, CO, H2 или более активных металлов (Al, Mg).", "Fe2O3 + 3CO —t°→ 2Fe + 3CO2"], ["Совместный гидролиз", "Необратимое взаимодействие в воде солей слабых оснований (Al^{3+}, Cr^{3+} с CO3^{2−}, S^{2−}, SO3^{2−}; Fe^{3+} — только с CO3^{2−}/HCO3⁻, т.к. с S^{2−} и SO3^{2−} идёт ОВР), приводящее к выпадению гидроксида и выделению газа.", "2AlCl3 + 3Na2CO3 + 3H2O → 2Al(OH)3↓ + 3CO2↑ + 6NaCl"], ["Электрометаллургия", "Получение активных металлов (Li–Al) электролизом расплавов их галогенидов, щелочей или раствора Al2O3 в расплавленном криолите.", "2NaCl(расплав) —электролиз→ 2Na + Cl2↑"]], "_img": {"fipi-pshe": {"data": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACSMAAAZ2CAIAAADVZbb1AAAACXBIWXMAAB7CAAAewgFu0HU+AAUw3ElEQVR4nOzdefwd46E/8G8iRBKJEtSeqliLthJUf9HW0gp1lWvXWmKp4qJ2Ubyu2lpb0Yi1JCix9qL2llYtQUVuYgvahlpuIpEgsSSS72+a8+q8xnO <script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const THEME_KEY='ege100-theme';
let T=null, S=null, FIGS={}, IMG={}, CHEM=false, RUS=false;

const THEMES=['auto','light','paper','dark'];
const THEME_LABELS={auto:'◐ Авто',light:'☀ Светлая',paper:'▤ Бумага',dark:'☾ Тёмная'};
function applyTheme(){
  const raw=LS.get(THEME_KEY,'auto');
  const t=THEMES.includes(raw)?raw:'auto';
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  $$('[data-theme-btn]').forEach(b=>{
    b.textContent=THEME_LABELS[t];
    b.title='Переключить тему оформления (Авто → Светлая → Бумага → Тёмная)';
  });
}
function toggleTheme(){
  const raw=LS.get(THEME_KEY,'auto');
  const i=THEMES.indexOf(raw);
  LS.set(THEME_KEY,THEMES[(i+1)%THEMES.length]);
  applyTheme();
}

const SUB='₀₁₂₃₄₅₆₇₈₉', SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻'};
function fmt(s, forceChem){
  if(s==null)return '';
  let h=esc(s);
  h=h.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,(m,t,l)=>'<button type="button" class="glink" data-term="'+esc(t)+'">'+(l||t)+'</button>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(«—])\*(?!\s)([^*]+?)\*(?=[\s,.;:!?)»—]|$)/g,'$1<em>$2</em>');
  h=h.replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>');
  h=h.replace(/`([^`\n]+?)`/g,'<code>$1</code>');
  // Русская разметка
  h=h.replace(/\{~([^}]+)\}/g,'<span class="ru-stress">$1\u0301</span>');
  h=h.replace(/\{!:([^}]*)\}/g,'<span class="ru-ortho">$1</span>');
  h=h.replace(/\{\((\d+)\)\}/g,'<span class="ru-pos">$1</span>');
  h=h.replace(/\{п:([^}]+)\}/g,'<span class="ru-m ru-p">$1</span>');
  h=h.replace(/\{к:([^}]+)\}/g,'<span class="ru-m ru-k">$1</span>');
  h=h.replace(/\{с:([^}]+)\}/g,'<span class="ru-m ru-s">$1</span>');
  h=h.replace(/\{о:([^}]+)\}/g,'<span class="ru-m ru-o">$1</span>');
  h=h.replace(/\{подл:([^}]+)\}/g,'<span class="ru-syn ru-podl">$1</span>');
  h=h.replace(/\{сказ:([^}]+)\}/g,'<span class="ru-syn ru-skaz">$1</span>');
  h=h.replace(/\{опр:([^}]+)\}/g,'<span class="ru-syn ru-opr">$1</span>');
  h=h.replace(/\{обст:([^}]+)\}/g,'<span class="ru-syn ru-obst">$1</span>');
  h=h.replace(/\{ввод:([^}]+)\}/g,'<span class="ru-vvod">$1</span>');
  if(CHEM || forceChem){
    h=h.split(/(<[^>]+>)/).map(p=>p[0]==='<'?p:p.replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')).join('');
  }
  return h.replace(/\n/g,'<br>');
}
function plain(s){
  return String(s==null?'':s)
    .replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,(m,t,l)=>l||t)
    .replace(/\*\*/g,'').replace(/\{[пксо!~]:([^}]*)\}/g,'$1').replace(/\{~([^}]+)\}/g,'$1')
    .replace(/\{(?:подл|сказ|опр|обст|ввод):([^}]+)\}/g,'$1').replace(/\{\((\d+)\)\}/g,'($1)')
    .replace(/`([^`\n]+?)`/g,'$1')
    .replace(/\^\{([^}]*)\}/g,(m,x)=>[...x].map(c=>SUP[c]||c).join('')).replace(/_\{([^}]*)\}/g,'$1');
}
const lines=v=>Array.isArray(v)?v:String(v==null?'':v).split('\n');
const body=v=>v==null?'':Array.isArray(v)?blocks(v):'<p>'+fmt(v)+'</p>';
const inl=v=>v==null?'':Array.isArray(v)?blocks(v):fmt(v);

function cleanSvg(src){
  try{
    const d=new DOMParser().parseFromString(String(src),'image/svg+xml');
    const svg=d.documentElement;
    if(!svg||svg.nodeName.toLowerCase()!=='svg')return '';
    svg.querySelectorAll('script,foreignObject').forEach(n=>n.remove());
    svg.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{
      if(/^on/i.test(a.name)||/javascript:/i.test(a.value))n.removeAttribute(a.name);
    }));
    return new XMLSerializer().serializeToString(svg);
  }catch(e){return '';}
}
function card(c){
  if(typeof c==='string')return '<div class="panel">'+body(c)+'</div>';
  return '<div class="panel">'+(c.tag?'<div class="eyebrow">'+fmt(c.tag)+'</div>':'')+(c.t?'<h3>'+fmt(c.t)+'</h3>':'')+(c.x?body(c.x):'')+(c.eq?R.eq(c.eq,{sm:1}):'')+(c.x2?body(c.x2):'')+(c.b?blocks(c.b):'')+(c.chip?'<span class="chip">'+fmt(c.chip)+'</span>':'')+'</div>';
}
const box=k=>(v,b)=>'<div class="panel '+k+'">'+(b.t?'<strong>'+fmt(b.t)+'</strong> ':'')+inl(v)+'</div>';

let TREE_ID=0;
function renderTreeStatic(node){
  if(!node)return '';
  if(node.a!=null)return '<div class="tree-ans"><strong>Вывод:</strong> '+fmt(node.a)+(node.why?'<div class="small" style="margin-top:4px">'+fmt(node.why)+'</div>':'')+'</div>';
  return '<div class="tree-step"><div class="tree-q">'+fmt(node.q)+'</div><ul>'
    +(node.yes?'<li><b>Да →</b> '+renderTreeStatic(node.yes)+'</li>':'')
    +(node.no?'<li><b>Нет →</b> '+renderTreeStatic(node.no)+'</li>':'')
    +'</ul></div>';
}
function renderCompare(c){
  if(c.rows&&c.cols){
    const head=['Признак',...c.cols,'Почему важно'].slice(0,c.rows[0]?.length||4);
    return '<div class="cmp-wrap">'+(c.t?'<h4>'+fmt(c.t)+'</h4>':'')+R.table([head,...c.rows])+'</div>';
  }
  const side=(s)=>s?'<div class="cmp-card"><h4>'+fmt(s.title||'')+'</h4>'+(Array.isArray(s.items)?R.list(s.items):body(s.b||s.text||''))+'</div>':'';
  return '<div class="cmp-wrap">'+(c.t?'<h4>'+fmt(c.t)+'</h4>':'')+'<div class="cmp-cards">'+side(c.left)+side(c.right)+'</div></div>';
}

const R={
  p:v=>'<p>'+fmt(v)+'</p>',
  lead:v=>'<p class="sectionlead">'+fmt(v)+'</p>',
  small:v=>'<p class="small">'+fmt(v)+'</p>',
  h:v=>'<h3>'+fmt(v)+'</h3>',
  h4:v=>'<h4>'+fmt(v)+'</h4>',
  eq:(v,b)=>'<div class="eq'+(b&&b.sm?' sm':'')+'">'+lines(v).map(x=>fmt(x,true)).join('<br>')+'</div>',
  list:v=>'<ul class="list">'+v.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>',
  ol:v=>'<ol class="list">'+v.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ol>',
  steps:(v,b)=>v.map((x,i)=>'<div class="step"><div class="stepnum">'+(i+(b.n||1))+'</div><div>'+(Array.isArray(x)?blocks(x):'<p>'+fmt(x)+'</p>')+'</div></div>').join(''),
  hint:box('hint'), warn:box('warn'), note:box('note'), key:box('key'),
  grid:(v,b)=>{const n=b.cols||(v.length>=3&&v.length%3===0?3:v.length===1?1:2);return n===1?v.map(card).join(''):'<div class="'+(n===3?'three':'two')+'">'+v.map(card).join('')+'</div>';},
  table:v=>'<div class="tablewrap"><table><thead><tr>'+v[0].map(c=>'<th>'+fmt(c)+'</th>').join('')+'</tr></thead><tbody>'+v.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>',
  flow:v=>'<div class="mapflow">'+v.map((f,i)=>(i?'<div class="arrow">→</div>':'')+'<div class="flowbox"><strong>'+fmt(Array.isArray(f)?f[0]:f)+'</strong>'+(Array.isArray(f)&&f[1]?'<small>'+fmt(f[1])+'</small>':'')+'</div>').join('')+'</div>',
  more:(v,b)=>'<details'+(b.open?' open':'')+'><summary>'+fmt(v)+'</summary><div>'+body(b.b)+'</div></details>',
  svg:(v,b)=>'<div class="svgwrap" role="img"'+(b.cap?' aria-label="'+esc(plain(b.cap))+'"':'')+'>'+cleanSvg(v)+(b.cap?'<p class="small" style="margin:10px 0 0;text-align:center">'+fmt(b.cap)+'</p>':'')+'</div>',
  fig:(v,b)=>figBlock(v,b),
  bridge:v=>'<div class="bridge"><div class="bridge-head"><span class="eyebrow">Мост к КИМ ЕГЭ</span>'+(v.kim?'<span class="chip">'+fmt(v.kim)+'</span>':'')+'</div><div class="bridge-grid">'
    +(v.ask?'<div class="bridge-cell"><b>Как спрашивают</b>'+fmt(v.ask)+'</div>':'')
    +(v.watch?'<div class="bridge-cell"><b>На чём ловят</b>'+fmt(v.watch)+'</div>':'')
    +(v.tip?'<div class="bridge-cell"><b>Как читать условие</b>'+fmt(v.tip)+'</div>':'')
    +'</div></div>',
  compare:v=>renderCompare(v),
  tree:v=>{const tid='tr_'+(++TREE_ID);return '<div class="treebox" data-tree="'+tid+'"><div class="tree-head"><strong>'+fmt(v.t||'Алгоритм выбора')+'</strong><button type="button" class="ghost" data-tree-all="'+tid+'" style="padding:5px 10px;font-size:12.5px">Показать всю схему</button></div><div class="tree-interactive" id="'+tid+'"></div><div class="tree-static" id="'+tid+'_all" style="display:none">'+renderTreeStatic(v.root)+'</div></div>';},
  essay:v=>'<div class="essaybox"><div class="eyebrow">Разбор сочинения № 27</div>'+(v.t?'<h4>'+fmt(v.t)+'</h4>':'')+(v.prompt?'<p class="small"><strong>Задание/проблема:</strong> '+fmt(v.prompt)+'</p>':'')+(v.text?'<div class="essay-text">'+fmt(v.text)+'</div>':'')+(v.criteria?R.table([['Критерий','Аспект','Балл','Комментарий'],...v.criteria]):'')+'</div>'
};
const TYPES=Object.keys(R);
function blk(b){if(b==null)return '';if(typeof b==='string')return '<p>'+fmt(b)+'</p>';if(Array.isArray(b))return blocks(b);const t=TYPES.find(k=>k in b);return t?R[t](b[t],b):'';}
function blocks(a){return (Array.isArray(a)?a:[a]).map(blk).join('');}

function figView(id){
  const d=FIGS[id]||{t:id}, r=IMG[id];
  if(!r)return '<div class="figempty">Рисунок «'+fmt(d.t)+'» ('+esc(id)+') отсутствует.</div>';
  const pins=r.num?'':(r.pins||[]).map(p=>'<span class="pin" style="left:'+(p.x*100).toFixed(2)+'%;top:'+(p.y*100).toFixed(2)+'%">'+esc(p.n)+'</span>').join('');
  return '<div class="figimg"><img src="'+r.data+'" alt="'+esc(plain(d.t))+'"><span class="pinwrap">'+pins+'</span></div>';
}
function figBlock(v,b){
  return '<figure class="figbox" data-fig="'+esc(v)+'"><figcaption><strong>'+fmt(b.t||v)+'</strong>'+(b.cap?' <span class="small">· '+fmt(b.cap)+'</span>':'')+'</figcaption>'
    +figView(v)
    +'<ol class="figlegend">'+(b.marks||[]).map(m=>'<li><b>'+esc(m[0])+'</b> — '+fmt(m[1])+(m[2]?' <span class="muted">· '+fmt(m[2])+'</span>':'')+'</li>').join('')+'</ol>'
    +'<div class="actions" style="margin:10px 0 0"><button type="button" class="ghost" data-zoom="'+esc(v)+'" style="padding:5px 10px;font-size:12.5px">🔍 Увеличить</button></div></figure>';
}

function initTrees(){
  const store={};
  const walk=(v)=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(v.tree&&v.tree.root){store[v.tree.t||'']=v.tree;}for(const k in v)if(k!=='svg')walk(v[k]);}};
  (T.modules||[]).forEach(m=>walk(m.b));
  let idx=0;
  $$('.treebox').forEach(boxEl=>{
    idx++;
    const tid=boxEl.dataset.tree;
    const titleEl=$('.tree-head strong',boxEl);
    const titleTxt=titleEl?titleEl.textContent:'';
    let treeObj=null;
    const findTree=(v)=>{if(treeObj)return;if(Array.isArray(v))v.forEach(findTree);else if(v&&typeof v==='object'){if(v.tree&&plain(v.tree.t||'Алгоритм выбора')===titleTxt){treeObj=v.tree;return;}for(const k in v)if(k!=='svg')findTree(v[k]);}};
    (T.modules||[]).forEach(m=>findTree(m.b));
    if(!treeObj)return;
    const host=$('#'+tid,boxEl);
    const hist=[];
    function draw(node){
      if(!node)return;
      if(node.a!=null){
        host.innerHTML='<div class="tree-ans"><strong>Вывод:</strong> '+fmt(node.a)+(node.why?'<div class="small" style="margin-top:5px">'+fmt(node.why)+'</div>':'')+'</div><div class="actions" style="margin:10px 0 0"><button type="button" class="ghost" data-tback style="padding:5px 10px;font-size:12.5px">← Назад</button><button type="button" class="ghost" data-treset style="padding:5px 10px;font-size:12.5px">Сначала</button></div>';
      }else{
        host.innerHTML='<div class="tree-step"><div class="tree-q">'+fmt(node.q)+'</div><div class="actions" style="margin:8px 0 0">'
          +(node.yes?'<button type="button" class="btn" data-tyes style="padding:6px 14px">Да</button>':'')
          +(node.no?'<button type="button" class="ghost" data-tno style="padding:6px 14px">Нет</button>':'')
          +(hist.length?'<button type="button" class="ghost" data-tback style="padding:6px 10px;font-size:12.5px">← Шаг назад</button>':'')
          +'</div></div>';
      }
      const yb=$('[data-tyes]',host), nb=$('[data-tno]',host), bb=$('[data-tback]',host), rb=$('[data-treset]',host);
      if(yb)yb.onclick=()=>{hist.push(node);draw(node.yes);};
      if(nb)nb.onclick=()=>{hist.push(node);draw(node.no);};
      if(bb)bb.onclick=()=>{const prev=hist.pop();if(prev)draw(prev);};
      if(rb)rb.onclick=()=>{hist.length=0;draw(treeObj.root);};
    }
    draw(treeObj.root);
    const allBtn=$('[data-tree-all]',boxEl), allEl=$('#'+tid+'_all',boxEl);
    allBtn.onclick=()=>{
      const shown=allEl.style.display!=='none';
      allEl.style.display=shown?'none':'block';
      host.style.display=shown?'block':'none';
      allBtn.textContent=shown?'Показать всю схему':'Интерактивный режим';
    };
  });
}

function render(){
  const subjSlug=T.subjectSlug||(String(T.subject||'').toLowerCase().includes('био')?'biology':String(T.subject||'').toLowerCase().includes('рус')?'russian':'chemistry');
  document.documentElement.dataset.subject=subjSlug;
  CHEM=subjSlug==='chemistry';
  RUS=subjSlug==='russian';
  document.title=(T.subject?T.subject+' · ':'')+plain(T.title)+' — ЕГЭ-100';

  FIGS={};
  const walkF=(v)=>{if(Array.isArray(v))v.forEach(walkF);else if(v&&typeof v==='object'){if(typeof v.fig==='string')FIGS[v.fig]=v;for(const k in v)if(k!=='svg')walkF(v[k]);}};
  (T.modules||[]).forEach(m=>walkF(m.b));

  S=Object.assign({completed:{}},LS.get('ege100:kon:'+T.id,{}));
  const M=T.modules||[], G=T.gloss||[];
  const nav=[['Начало','#start','Обзор темы'],['Начало','#guide','Маршрут и цели']];
  M.forEach(m=>nav.push([m.group||'Модули','#m-'+m.id,m.id+' · '+plain(m.nav||m.title)]));
  if(T.audit)nav.push(['Итог и справка','#audit','Источники и границы']);
  if(G.length)nav.push(['Итог и справка','#glossary','Словарь ('+G.length+')']);
  if(M.length)nav.push(['Итог и справка','#revision','Итоговая карта']);

  const portalHref='../../../../index.html';
  const trenerHref='../../../../trener.html?topic='+encodeURIComponent(T.id);

  let side='<div class="brand"><div class="atom">'+esc(T.icon||'📘')+'</div><div class="brand-meta"><span>'+esc((T.subject||'ЕГЭ-100').toUpperCase())+'</span><small>'+esc(plain(T.short||T.title))+'</small></div></div>'
    +'<div class="side-tools"><a class="sbtn" href="'+portalHref+'">← Портал</a><a class="sbtn pri" href="'+trenerHref+'">🎯 Тренажёр</a><button type="button" class="sbtn" data-theme-btn></button></div>';
  let grp=null;
  nav.forEach(([gr,href,lbl])=>{
    if(gr!==grp){grp=gr;side+='<div class="navtag">'+esc(gr)+'</div>';}
    side+='<a class="nav" href="'+href+'">'+esc(lbl)+'</a>';
  });
  side+='<div class="panel small" style="margin-top:18px;padding:12px">Изучено: <strong id="sideProgress">0</strong> / '+M.length+' модулей<div class="statbar"><span id="sideBar"></span></div><span id="saveStatus" class="small">Прогресс хранится локально.</span></div>';

  const mob='<div class="mobileNav"><a class="mbtn" href="'+portalHref+'">←</a><select id="mobileJump" aria-label="Раздел">'+nav.map(n=>'<option value="'+n[1]+'">'+esc(n[2])+'</option>').join('')+'</select><button type="button" class="mbtn" data-theme-btn>◐</button></div>';

  const chips=[M.length+' модулей',...(T.chips||[])].filter(Boolean).map(c=>'<span class="chip">'+fmt(c)+'</span>').join('');
  const hero='<section class="hero" id="start"><div class="hero-wm">'+esc(T.icon||'★')+'</div><div class="eyebrow">'+fmt(T.eyebrow||((T.subject||'')+' · Учебник ЕГЭ-100 с нуля'+(T.version?' · '+T.version:'')))+'</div><h1>'+fmt(T.title)+'</h1>'+(T.sub?'<p class="sub">'+fmt(T.sub)+'</p>':'')+'<div class="meta">'+chips+'</div><div class="actions">'+(M.length?'<a class="btn" href="#m-'+esc(M[0].id)+'">Начать с модуля 01 →</a>':'')+'<a class="ghost" href="'+trenerHref+'">🎯 Тренажёр по теме</a></div></section>';

  const goals=T.goals||[];
  const guide='<section class="lesson" id="guide"><div class="eyebrow">Маршрут 0 → 100</div><h2>Что ты будешь понимать и уметь</h2>'
    +(goals.length?R.grid(goals.map(g=>({t:g[0],x:g[1]})),{}):'')
    +'<h3>Как работать с учебником</h3>'
    +R.flow([['Читай по порядку','каждый модуль опирается на предыдущие'],['Следи за причиной','механизм всегда до правила'],['Проверяй по шагам','используй схемы и «Мост к ЕГЭ»'],['Закрепляй','1 · 3 · 7 · 14 дней в тренажёре']])
    +(T.status?'<div class="panel note">'+inl(T.status)+'</div>':'')+'</section>';

  const mods=M.map((m,idx)=>{
    const nx=M[idx+1];
    return '<section class="lesson" id="m-'+esc(m.id)+'" data-unit="'+esc(m.id)+'">'
      +(m.eyebrow?'<div class="eyebrow">'+fmt(m.eyebrow)+'</div>':'')
      +'<h2>'+fmt(m.title)+'</h2>'
      +((m.codes||[]).length?'<p class="small">Кодификатор ФИПИ-2027: '+m.codes.map(esc).join(', ')+'</p>':'')
      +(m.lead?'<p class="sectionlead">'+fmt(m.lead)+'</p>':'')
      +(m.b||[]).map((b,bi)=>'<a class="banchor" id="b-'+esc(m.id)+'-'+(bi+1)+'"></a>'+blk(b)).join('')
      +(m.short?'<details><summary>Коротко для запоминания · модуль '+esc(m.id)+'</summary><div>'+body(m.short)+'</div></details>':'')
      +'<div class="actions"><button class="ghost complete" type="button" data-complete="'+esc(m.id)+'"></button>'
      +(nx?'<a class="btn" href="#m-'+esc(nx.id)+'">Далее: '+esc(plain(nx.nav||nx.title))+' →</a>':'<a class="btn" href="'+trenerHref+'">Перейти в тренажёр →</a>')
      +'</div></section>';
  }).join('');

  const A=T.audit;
  const audit=A?'<section class="lesson" id="audit"><div class="eyebrow">Методика и аудит</div><h2>'+fmt(A.title||'Исходные материалы и границы охвата')+'</h2>'+body(A.intro)+blocks(A.b||[])+'</section>':'';

  const gloss=G.length?'<section class="lesson" id="glossary"><div class="eyebrow">Словарь терминов</div><h2>Понятия простыми словами</h2><input type="search" id="glossSearch" placeholder="Поиск термина…" style="width:100%;max-width:420px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);margin:6px 0 16px"><div id="glossHost" class="gloss"></div></section>':'';

  const rv=[['+1 день','Перечитай главные мысли (key) и памятки «Коротко».'],['+3 дня','Пройди разборы steps и проверь «Мост к КИМ ЕГЭ».'],['+7 дней','Повтори все ловушки warn и исключения темы.'],['+14 дней','Прогони режим «Вариант по теме» в тренажёре.']];
  const revision='<section class="lesson" id="revision"><div class="eyebrow">Финиш маршрута</div><h2>Итоговая карта темы и план повторения</h2>'
    +R.flow(M.map(m=>[m.id,plain(m.nav||m.title)]))
    +(T.summary?blocks(T.summary):'')
    +'<h3>Интервальное повторение</h3><div class="timeline">'+rv.map(r=>'<div class="panel"><strong>'+fmt(r[0])+'</strong><p class="small">'+fmt(r[1])+'</p></div>').join('')+'</div>'
    +(T.limits?'<div class="panel key" style="margin-top:16px"><strong>Границы охвата:</strong> '+inl(T.limits)+'</div>':'')
    +'<div class="actions"><a class="btn" href="'+trenerHref+'">🎯 Закрепить в тренажёре</a><button class="ghost" id="clearAll" type="button">Сбросить отметки модулей</button></div></section>';

  $('#app').innerHTML='<div class="layout"><aside class="side" aria-label="Навигация">'+side+'</aside><div>'+mob+'<main id="main">'+hero+guide+mods+audit+gloss+revision+'<footer>'+esc(plain(T.title))+' · ЕГЭ-100 · Автономный учебник</footer></main></div></div>';

  applyTheme();
  $$('[data-theme-btn]').forEach(b=>b.onclick=toggleTheme);
  initInteractive();
  jumpFromHash();
}

function initInteractive(){
  const M=T.modules||[], G=T.gloss||[];
  const save=()=>{
    LS.set('ege100:kon:'+T.id,S);
    if(window.EGE100Sync&&window.EGE100Sync.isConfigured()){
      window.EGE100Sync.syncGist().catch(()=>{});
    }
  };
  const upd=()=>{
    const n=M.filter(m=>S.completed[m.id]).length;
    if($('#sideProgress'))$('#sideProgress').textContent=n;
    if($('#sideBar'))$('#sideBar').style.width=(M.length?100*n/M.length:0)+'%';
    $$('.complete').forEach(b=>{
      const v=!!S.completed[b.dataset.complete];
      b.textContent=v?'✓ Модуль изучен':'Отметить модуль '+b.dataset.complete+' изученным';
      b.classList.toggle('btn',v);b.classList.toggle('ghost',!v);
    });
  };
  $$('.complete').forEach(b=>b.onclick=()=>{S.completed[b.dataset.complete]=!S.completed[b.dataset.complete];save();upd();});
  upd();

  if($('#mobileJump'))$('#mobileJump').onchange=e=>{const el=document.getElementById(e.target.value.slice(1));if(el)el.scrollIntoView({behavior:'smooth'});};
  if('IntersectionObserver' in window){
    const ob=new IntersectionObserver(en=>{
      const v=en.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
      if(v){
        $$('.nav').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+v.target.id));
        const opt=$('#mobileJump option[value="#'+v.target.id+'"]');
        if(opt)$('#mobileJump').value='#'+v.target.id;
      }
    },{rootMargin:'-12% 0px -70% 0px'});
    $$('main>section[id]').forEach(s=>ob.observe(s));
  }

  if(G.length && $('#glossHost')){
    const drawG=()=>{
      const q=$('#glossSearch').value.trim().toLowerCase();
      const L=G.filter(x=>x.join(' ').toLowerCase().includes(q));
      $('#glossHost').innerHTML=L.map(x=>'<article class="term"><strong>'+fmt(x[0])+'</strong><p>'+fmt(x[1])+'</p>'+(x[2]?'<small>Пример: '+fmt(x[2])+'</small>':'')+'</article>').join('')||'<p class="small">Ничего не найдено.</p>';
    };
    $('#glossSearch').addEventListener('input',drawG);
    drawG();
  }

  // Поповер глоссария
  const pop=$('#gPopover');
  const gMap=new Map(G.map(g=>[String(g[0]).toLowerCase(),g]));
  document.addEventListener('click',e=>{
    const gl=e.target.closest('.glink');
    if(gl){
      e.stopPropagation();
      const termKey=gl.dataset.term.toLowerCase();
      const entry=gMap.get(termKey);
      if(!entry){if($('#glossary'))$('#glossary').scrollIntoView({behavior:'smooth'});return;}
      pop.innerHTML='<h4>'+fmt(entry[0])+'</h4><p>'+fmt(entry[1])+'</p>'+(entry[2]?'<p class="small"><strong>Пример:</strong> '+fmt(entry[2])+'</p>':'')+'<div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px"><button type="button" class="ghost" id="gpAll" style="padding:4px 9px;font-size:12px">К словарю ↓</button><button type="button" class="ghost" id="gpClose" style="padding:4px 9px;font-size:12px">✕</button></div>';
      const rc=gl.getBoundingClientRect();
      pop.style.display='block';
      const pw=pop.offsetWidth||320, ph=pop.offsetHeight||140;
      const left=Math.max(10,Math.min(window.innerWidth-pw-10,rc.left));
      const top=(rc.bottom+ph+12<window.innerHeight)?rc.bottom+8:Math.max(10,rc.top-ph-8);
      pop.style.left=left+'px';pop.style.top=top+'px';
      $('#gpClose',pop).onclick=()=>pop.style.display='none';
      $('#gpAll',pop).onclick=()=>{pop.style.display='none';if($('#glossary'))$('#glossary').scrollIntoView({behavior:'smooth'});};
      return;
    }
    if(pop.style.display==='block'&&!e.target.closest('#gPopover'))pop.style.display='none';
  });

  // Увеличение рисунков
  const dlg=$('#imgZoom');
  $('#imgZoomClose').onclick=()=>dlg.close();
  $$('[data-zoom]').forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.zoom, d=FIGS[id]||{};
    $('#imgZoomTitle').textContent=plain(d.t||id);
    $('#imgZoomBody').innerHTML=figView(id);
    if(dlg.showModal)dlg.showModal();
  });

  initTrees();

  if($('#clearAll'))$('#clearAll').onclick=()=>{
    if(!confirm('Сбросить отметки изученных модулей?'))return;
    S={completed:{}};save();upd();
  };
}

function jumpFromHash(){
  const raw=location.hash.slice(1);if(!raw)return;
  const q=new URLSearchParams(raw);
  if(q.has('b')){
    const m=q.get('b').match(/^(\d+)\.(\d+)$/);
    const el=m?document.getElementById('b-'+m[1]+'-'+m[2]):null;
    if(el){el.scrollIntoView({behavior:'instant',block:'center'});const nxt=el.nextElementSibling;if(nxt){nxt.classList.add('bflash');setTimeout(()=>nxt.classList.add('fade'),2200);}}
    return;
  }
  const el=document.getElementById(decodeURIComponent(raw));
  if(el)el.scrollIntoView({behavior:'instant'});
}

try{
  const raw=$('#topic-data').textContent.trim();
  if(raw&&raw[0]==='{'){
    T=JSON.parse(raw);
    IMG=T._img||{};
    delete T._img;
    render();
  }else{
    applyTheme();
    $('#app').innerHTML='<main style="max-width:760px;padding:48px 20px"><div class="panel"><h2>Шаблон учебника ЕГЭ-100</h2><p>Этот файл — движок оформления. Собери тему через <code>python core/cli.py build &lt;subject&gt; &lt;id&gt;</code>, чтобы получить готовый автономный учебник.</p></div></main>';
  }
}catch(e){
  $('#app').innerHTML='<main style="padding:32px"><div class="panel warn"><strong>Ошибка загрузки данных:</strong> '+esc(e.message)+'</div></main>';
}
})();
</script>
