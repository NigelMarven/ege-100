<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учебник ЕГЭ-100</title>
<style>
:root{
  --bg:#f6f7f9;--sidebar:#ffffff;--paper:#ffffff;--paper2:#f1f4f8;--line:#dde3ec;--text:#18202c;--dim:#546274;
  --a:#0f766e;--a-soft:#e6f4f1;--a-bd:#99d6cd;
  --b:#2563eb;--b-soft:#eff6ff;--gold:#b45309;--gold-soft:#fef7e6;--bad:#be123c;--bad-soft:#fff1f2;--good:#15803d;--good-soft:#eefbf3;
  --radius:16px;--shadow:0 4px 20px rgba(15,23,42,.06);
  --svg-bg:#f8fafc;--svg-surface:#ffffff;--svg-surface2:#eef3f9;--svg-ink:#18202c;--svg-dim:#546274;--svg-line:#cbd5e1;
  --svg-acc:#0f766e;--svg-gold:#b45309;--svg-bad:#dc2626;--svg-good:#15803d;--svg-blue:#2563eb;
}
:root[data-subject="biology"]{--a:#15803d;--a-soft:#ecfdf3;--a-bd:#9ce2b8;--svg-acc:#15803d}
:root[data-subject="russian"]{--a:#7c3aed;--a-soft:#f5f3ff;--a-bd:#c4b5fd;--svg-acc:#7c3aed}

@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0b121c;--sidebar:#0f1824;--paper:#131f2e;--paper2:#182739;--line:#263950;--text:#e6eef7;--dim:#96abc2;
    --a:#2dd4bf;--a-soft:#102f33;--a-bd:#1e5d61;
    --b:#60a5fa;--b-soft:#15253f;--gold:#f5c469;--gold-soft:#2b2316;--bad:#fb7185;--bad-soft:#2e181f;--good:#4ade80;--good-soft:#132b1e;
    --shadow:0 12px 36px rgba(2,6,16,.45);
    --svg-bg:#0d1723;--svg-surface:#162436;--svg-surface2:#1e3047;--svg-ink:#e6eef7;--svg-dim:#96abc2;--svg-line:#2c425c;
    --svg-acc:#2dd4bf;--svg-gold:#f5c469;--svg-bad:#fb7185;--svg-good:#4ade80;--svg-blue:#60a5fa;
  }
  :root[data-subject="biology"]:not([data-theme]){--a:#4ade80;--a-soft:#132d1f;--a-bd:#225c3c;--svg-acc:#4ade80}
  :root[data-subject="russian"]:not([data-theme]){--a:#a78bfa;--a-soft:#21193b;--a-bd:#4a3880;--svg-acc:#a78bfa}
}
:root[data-theme="dark"]{
  --bg:#0b121c;--sidebar:#0f1824;--paper:#131f2e;--paper2:#182739;--line:#263950;--text:#e6eef7;--dim:#96abc2;
  --a:#2dd4bf;--a-soft:#102f33;--a-bd:#1e5d61;
  --b:#60a5fa;--b-soft:#15253f;--gold:#f5c469;--gold-soft:#2b2316;--bad:#fb7185;--bad-soft:#2e181f;--good:#4ade80;--good-soft:#132b1e;
  --shadow:0 12px 36px rgba(2,6,16,.45);
  --svg-bg:#0d1723;--svg-surface:#162436;--svg-surface2:#1e3047;--svg-ink:#e6eef7;--svg-dim:#96abc2;--svg-line:#2c425c;
  --svg-acc:#2dd4bf;--svg-gold:#f5c469;--svg-bad:#fb7185;--svg-good:#4ade80;--svg-blue:#60a5fa;
}
:root[data-theme="dark"][data-subject="biology"]{--a:#4ade80;--a-soft:#132d1f;--a-bd:#225c3c;--svg-acc:#4ade80}
:root[data-theme="dark"][data-subject="russian"]{--a:#a78bfa;--a-soft:#21193b;--a-bd:#4a3880;--svg-acc:#a78bfa}
:root[data-theme="paper"]{
  --bg:#eae1cf;--sidebar:#f1e8d6;--paper:#f6efe1;--paper2:#ece2ce;--line:#d6c8b0;--text:#2a231b;--dim:#625648;
  --a:#0f6b63;--a-soft:#e0ebe4;--a-bd:#9cc2b7;
  --b:#24529a;--b-soft:#e3e9f0;--gold:#9c4a08;--gold-soft:#f3e5cb;--bad:#a82039;--bad-soft:#f3dfdf;--good:#1f6d3d;--good-soft:#e1ece2;
  --shadow:0 4px 18px rgba(58,42,22,.07);
  --svg-bg:#f1e8d7;--svg-surface:#f8f2e6;--svg-surface2:#e9dfc9;--svg-ink:#2a231b;--svg-dim:#625648;--svg-line:#cabaa0;
  --svg-acc:#0f6b63;--svg-gold:#9c4a08;--svg-bad:#a82039;--svg-good:#1f6d3d;--svg-blue:#24529a;
}
:root[data-theme="paper"][data-subject="biology"]{--a:#1f6d3d;--a-soft:#e1ece2;--a-bd:#9ec3a6;--svg-acc:#1f6d3d}
:root[data-theme="paper"][data-subject="russian"]{--a:#6b3fa0;--a-soft:#e9e1ee;--a-bd:#bda6d6;--svg-acc:#6b3fa0}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:32px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
a{color:var(--a)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.layout{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--sidebar);border-right:1px solid var(--line);padding:18px 14px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--line);font-weight:800}
.atom{display:grid;place-items:center;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);width:40px;height:40px;border-radius:12px;font-size:22px;flex:none}
.brand-meta{min-width:0;line-height:1.25}
.brand-meta small{display:block;font-weight:500;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-tools{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);color:var(--text);text-decoration:none;font-size:12.5px;font-weight:600;flex:1 1 auto}
.sbtn:hover{border-color:var(--a);color:var(--a)}
.sbtn.pri{background:var(--a-soft);border-color:var(--a-bd);color:var(--a)}
.navtag{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin:16px 10px 4px;font-weight:700}
.nav{display:block;padding:7px 10px;border-radius:9px;color:var(--dim);text-decoration:none;font-size:13.5px;line-height:1.38}
.nav:hover,.nav.active{color:var(--text);background:var(--a-soft)}
.nav.active{font-weight:700;color:var(--a)}

main{min-width:0;max-width:1060px;width:100%;margin:0 auto;padding:24px clamp(16px,3.6vw,52px) 110px}
.mobileNav{display:none}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,46px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-wm{position:absolute;right:18px;bottom:-22px;font-size:160px;line-height:1;opacity:.05;pointer-events:none;user-select:none}
h1{font-size:clamp(28px,4.2vw,46px);line-height:1.15;letter-spacing:-.03em;margin:.2em 0 .35em;max-width:860px}
h2{font-size:clamp(22px,2.8vw,31px);line-height:1.25;letter-spacing:-.02em;margin:0 0 12px}
h3{font-size:19.5px;line-height:1.32;margin:26px 0 10px}
h4{font-size:16px;margin:18px 0 8px}
p{margin:10px 0 14px}
.sub{color:var(--dim);font-size:clamp(15.5px,1.55vw,18px);max-width:780px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--a)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-block;background:var(--a-soft);color:var(--a);border:1px solid var(--a-bd);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.btn,.ghost{border:1px solid var(--a);border-radius:11px;padding:9px 15px;background:var(--a);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.06)}
.ghost{background:var(--paper2);color:var(--text);border-color:var(--line)}
.ghost:hover{border-color:var(--a);color:var(--a)}

.lesson{margin-top:44px;border-top:1px solid var(--line);padding-top:34px}
.sectionlead{font-size:17px;color:var(--dim);max-width:850px}
.small{font-size:13.5px;color:var(--dim)}
.muted{color:var(--dim)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px 20px;margin:16px 0;min-width:0;box-shadow:var(--shadow)}
.two>.panel,.three>.panel{margin:0}
.panel h3:first-child,.panel h4:first-child{margin-top:0}
.hint{background:var(--a-soft);border-left:4px solid var(--a)}
.warn{background:var(--bad-soft);border-left:4px solid var(--bad)}
.note{background:var(--b-soft);border-left:4px solid var(--b)}
.key{background:var(--gold-soft);border-left:4px solid var(--gold)}
.eq{font-family:Cambria,"Times New Roman",serif;font-size:clamp(18px,2vw,23px);line-height:1.6;background:var(--paper2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 16px;overflow-x:auto;white-space:nowrap;margin:13px 0}
.eq.sm{font-size:18px}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

.step{display:grid;grid-template-columns:34px 1fr;gap:12px;margin:14px 0}
.stepnum{display:grid;place-items:center;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);font-size:13.5px;font-weight:800;border-radius:10px;width:34px;height:34px;align-self:start}
.step p{margin:0 0 6px}
.list{padding-left:22px}.list li{margin:7px 0}

details{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:11px 0}
summary{padding:12px 16px;cursor:pointer;color:var(--a);font-weight:700}
details>div{padding:0 18px 15px}

.mapflow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:16px 0}
.flowbox{flex:1 1 150px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.flowbox strong{display:block;line-height:1.3}
.flowbox small{display:block;color:var(--dim);margin-top:3px}
.arrow{align-self:center;color:var(--a);font-size:18px;font-weight:700}

.tablewrap{width:100%;overflow:auto;border-radius:12px;border:1px solid var(--line);margin:14px 0;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:500px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--paper2);color:var(--text);font-weight:750}
tr:last-child td{border-bottom:0}

.svgwrap{padding:14px;border-radius:16px;background:var(--svg-bg);border:1px solid var(--line);margin:16px 0}
.svgwrap svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}

/* Новые блоки: bridge, compare, tree, essay */
.bridge{background:var(--paper);border:1px solid var(--a-bd);border-radius:var(--radius);padding:16px 20px;margin:18px 0;box-shadow:var(--shadow)}
.bridge-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bridge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.bridge-cell{background:var(--paper2);border-radius:11px;padding:11px 13px;font-size:14.5px}
.bridge-cell b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px}

.cmp-wrap{margin:16px 0}
.cmp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cmp-card h4{margin:0 0 8px;color:var(--a)}

.treebox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow)}
.tree-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tree-step{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.tree-q{font-weight:700;margin-bottom:8px}
.tree-ans{border-left:4px solid var(--good);background:var(--good-soft);border-radius:10px;padding:11px 14px;margin-top:8px}
.tree-static ul{margin:6px 0 6px 18px;padding:0}
.tree-static li{margin:4px 0}

.essaybox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.essay-text{background:var(--paper2);border-left:3px solid var(--a);padding:12px 15px;border-radius:10px;margin:10px 0;font-size:15px}

/* Русская разметка */
.ru-stress{color:var(--bad);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ru-ortho{background:var(--gold-soft);border:1px solid var(--gold);border-radius:5px;padding:0 3px;font-weight:700}
.ru-pos{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);font-size:12px;font-weight:800;vertical-align:baseline;margin:0 2px}
.ru-m{padding:0 2px;border-radius:3px}
.ru-p{border-top:2px solid var(--b);border-right:2px solid var(--b);padding-right:3px}
.ru-k{border-top:2px solid var(--a);border-radius:6px 6px 0 0;padding-top:1px}
.ru-s{background:linear-gradient(135deg,transparent 48%,var(--gold) 49%,var(--gold) 51%,transparent 52%) top/100% 6px no-repeat;padding-top:5px}
.ru-o{border:1.5px solid var(--dim);border-radius:4px;padding:0 3px}
.ru-syn{text-decoration:underline;text-underline-offset:4px}
.ru-podl{text-decoration-color:var(--b)}
.ru-skaz{text-decoration-style:double;text-decoration-color:var(--bad)}
.ru-opr{text-decoration-style:wavy;text-decoration-color:var(--a)}
.ru-obst{text-decoration-style:dotted;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.ru-vvod{background:var(--b-soft);border-radius:5px;padding:0 4px}

/* Рисунки и метки */
.figbox{margin:16px 0;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.figbox figcaption{margin-bottom:10px}
.figimg{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.figimg img{max-width:100%;max-height:70vh;width:auto;height:auto;display:block}
.pinwrap{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:25px;height:25px;padding:0 6px;border-radius:13px;background:#0f766e;color:#fff;border:2px solid #fff;font:700 12.5px/21px system-ui,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.figlegend{margin:10px 0 0;padding:0;list-style:none;columns:2 260px;font-size:14px}
.figlegend li{break-inside:avoid;margin:4px 0}
.figlegend b{display:inline-block;min-width:22px;color:var(--a)}
.figempty{padding:18px;border:2px dashed var(--line);border-radius:12px;color:var(--dim);text-align:center}

/* Словарь и поповер */
.glink{background:none;border:0;border-bottom:1.5px dashed var(--a);color:inherit;padding:0;font:inherit;cursor:pointer}
.glink:hover{color:var(--a)}
#gPopover{position:fixed;z-index:80;max-width:min(360px,92vw);background:var(--paper);border:1px solid var(--a-bd);border-radius:14px;padding:13px 15px;box-shadow:0 16px 40px rgba(0,0,0,.22);display:none}
#gPopover h4{margin:0 0 6px;color:var(--a);font-size:16px}
#gPopover p{margin:0 0 6px;font-size:14px}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.term{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.term strong{display:block;color:var(--a);font-size:16.5px}
.term p{margin:4px 0;font-size:14.5px}
.term small{color:var(--dim)}

.statbar{height:8px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.statbar span{height:100%;background:var(--a);display:block;width:0}
.banchor{display:block;height:0;scroll-margin-top:80px}
.bflash{outline:3px solid var(--gold);outline-offset:5px;border-radius:8px;transition:outline-color 1.4s}
.bflash.fade{outline-color:transparent}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.timeline .panel{margin:0;text-align:center}
.timeline strong{font-size:21px;color:var(--gold)}
footer{color:var(--dim);text-align:center;margin:56px 0 0;font-size:13px}

dialog#imgZoom{max-width:95vw;max-height:94vh;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--paper);color:var(--text)}
dialog#imgZoom::backdrop{background:rgba(0,0,0,.68)}
dialog#imgZoom img{max-width:90vw;max-height:82vh;display:block;background:#fff;border-radius:8px}

@media(max-width:1000px){
  .layout{display:block}
  .side{display:none}
  .mobileNav{display:flex;position:sticky;top:0;z-index:30;background:var(--sidebar);border-bottom:1px solid var(--line);padding:8px 12px;align-items:center;gap:8px}
  .mobileNav select{flex:1;min-width:0;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--paper2)}
  .mbtn{border:1px solid var(--line);background:var(--paper2);border-radius:9px;padding:6px 10px;text-decoration:none;font-size:13px;font-weight:700}
  main{padding-top:18px}
}
@media(max-width:670px){
  .two,.three,.gloss,.cmp-cards{grid-template-columns:1fr}
  .timeline{grid-template-columns:repeat(2,1fr)}
  .arrow{display:none}
  .flowbox{flex-basis:100%}
  .figlegend{columns:1}
  table{font-size:13px}
}
@media print{
  body{background:#fff;color:#111}
  .side,.mobileNav,.actions,#gPopover,.tree-interactive{display:none!important}
  .tree-static{display:block!important}
  main{max-width:none;padding:0}
  .panel,.bridge,.figbox,.essaybox,details,.eq{box-shadow:none;background:#fff;border-color:#999}
  details>div{display:block!important}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="application/json" id="topic-data">{"id": "neorganika-reakcii-6-9-31", "subject": "Химия", "subjectSlug": "chemistry", "short": "Неорганика (№ 6–9, 31)", "version": "26.11.2026", "icon": "⚗", "title": "Неорганика металлов и неметаллов: задания № 6–9 и № 31 ЕГЭ", "sub": "Системный курс с нуля до 100 баллов: как выводить продукты реакций металлов, неметаллов и их соединений из логики строения, ряда напряжений и степеней окисления — без слепой зубрёжки сотен уравнений.", "chips": ["ЕГЭ-2027", "Коды 2.2–2.4", "№ 6–9, 31 КИМ", "С нуля до 100"], "scope": ["2.2", "2.3", "2.4"], "status": "Сверено с утверждённым комплектом ФИПИ ЕГЭ-2027 (коды 2.2, 2.3, 2.4; задания № 6, 7, 8, 9, 31 КИМ).", "mode": "from_scratch", "goals": [["01 · Карта неорганики и металлургия", "Ориентироваться в 4 типах неорганических реакций и выбирать промышленный способ получения любого металла по ряду напряжений"], ["02 · Активные металлы (Na, K, Ca, Mg)", "Безошибочно писать реакции щелочных, щёлочноземельных металлов, магния, пероксидов, щелочей и карбонатов"], ["03 · Амфотерные металлы (Al, Zn)", "Различать реакции в растворе (гидроксокомплексы) и при сплавлении (алюминаты/цинкаты), предсказывать действие кислот и кислых оксидов"], ["04 · Переходные металлы (Fe, Cr, Cu)", "Управлять степенями окисления Fe(+2/+3), Cr(+3/+6) и Cu(+1/+2), видеть пассивацию и отличать ОВР от совместного гидролиза"], ["05 · Галогены (F, Cl, Br, I)", "Предсказывать вытеснение галогенов, диспропорционирование в холодной и горячей щёлочи и реакции галогенидов с конц. H2SO4"], ["06 · Сера и её соединения", "Отличать свойства H2S, SO2, нерастворимых сульфидов и понимать, почему разбавленная и концентрированная H2SO4 работают по-разному"], ["07 · Азот, HNO3 и нитраты", "Решать любые реакции с аммиаком, NO/NO2, разбавленной и концентрированной HNO3 и безошибочно раскладывать любой нитрат при нагревании"], ["08 · Фосфор, углерод, кремний", "Уверенно писать реакции фосфидов, карбидов, силицидов, трёх рядов фосфатов, CO/CO2 и особые реакции Si и SiO2"], ["09 · Алгоритмы № 6, 7, 8, 9 КИМ", "Быстро отсеивать лишние реагенты в № 7, прогнозировать продукты в № 8 и собирать генетические цепочки № 9"], ["10 · Задание № 31 на 4/4 балла", "Расшифровывать текстовое описание эксперимента по цветовым и газовым маркерам и записывать все 4 уравнения без потери баллов"]], "audit": {"title": "Границы охвата и опора на кодификатор ФИПИ-2027", "intro": "Учебник создан с нуля по утверждённому комплекту документов ФИПИ ЕГЭ-2027 (коды 2.2, 2.3, 2.4). По статистике методических рекомендаций ФИПИ задания № 7 (25,4 %) и № 8 (30,8 %) дают самый глубокий провал на экзамене, поэтому в каждом модуле теория сразу связана с механизмами, ловушками и реальными формулировками КИМ.", "b": [{"more": "Опора на предыдущие темы маршрута", "open": true, "b": ["Предполагается базовое знакомство с классификацией веществ (№ 5), условиями РИО и гидролиза (№ 6, 21, 30) и методом электронного баланса в ОВР (№ 19, 29). Все необходимые опорные правила кратко напомнены в модуле 01 и прямо перед сложными шагами."]}]}, "summary": [{"p": "Вся неорганическая химия ЕГЭ держится не на зазубривании сотен уравнений, а на четырёх опорах: положении металла в ряду напряжений, кислотно-основном характере (включая амфотерность), шкале степеней окисления и условиях среды (вода vs расплав, холод vs нагревание, разб. vs конц.)."}, {"p": "Если перед каждой реакцией задавать себе три вопроса — «есть ли здесь пара окислитель–восстановитель?», «подходят ли вещества по кислотно-основной логике?» и «каковы условия (среда, температура, избыток)?» — задания № 6, 7, 8, 9 и 31 превращаются из угадывания в предсказуемый алгоритм."}], "limits": "Подробная классификация и тривиальная номенклатура (код 2.1, № 5), детальный разбор ПИУ/СИУ (код 1.9, № 30), расчёт электролиза (код 1.13, № 20), полный список качественных реакций органических и неорганических веществ (код 2.5, № 24) и промышленные аппараты (№ 25) вынесены в соответствующие темы маршрута; здесь они используются ровно в объёме, необходимом для безошибочного решения № 6–9 и № 31.", "modules": [{"id": "01", "group": "Начало с нуля", "nav": "Логика реакций и металлургия", "codes": ["2.2", "2.4"], "eyebrow": "01 · Коды 2.2, 2.4 · Фундамент неорганики", "title": "Логика неорганических реакций и способы получения металлов", "lead": "Зачем учить 500 уравнений наизусть, если почти любую реакцию в ЕГЭ можно вывести за 10 секунд — и почему натрий получают только электролизом расплава, а железо выплавляют в домне с угарным газом?", "b": [{"key": "Вся неорганическая химия ЕГЭ подчиняется всего четырём движущим силам: кислотно-основному взаимодействию, окислительно-восстановительному переносу электронов, комплексообразованию и термическому разложению. А способ получения любого металла жёстко задан его положением в электрохимическом ряду напряжений.", "t": "Главная мысль."}, {"more": "Что нужно знать заранее (опора с нуля)", "open": true, "b": ["**Классы веществ:** оксиды делятся на несолеобразующие (`CO`, `NO`, `N2O`, `SiO`) и солеобразующие — основные (металлы в степенях окисления `+1`, `+2`, кроме `BeO`, `ZnO`, `SnO`, `PbO`), амфотерные (`BeO`, `ZnO`, `Al2O3`, `Cr2O3`, `Fe2O3`, `SnO`, `PbO`) и кислотные (оксиды неметаллов и металлов в высших степенях окисления `+5`, `+6`, `+7`, например `CrO3`, `Mn2O7`).", "**Заряд иона vs степень окисления:** в заряде иона цифра стоит *перед* знаком (`Fe^{3+}`, `SO4^{2−}`), а в степени окисления знак стоит *перед* цифрой (`Fe^{+3}`, `S^{+6}`). В заданиях части 2 смешивать их нельзя.", "**Условия РИО:** реакция ионного обмена в водном растворе идёт до конца, если выпадает осадок («Н» или «М»), выделяется газ или образуется слабый электролит (вода, слабая кислота, `NH3·H2O`).", "**Условия ОВР:** нужен окислитель (атом, способный *принять* `e⁻` и понизить степень окисления) и восстановитель (атом, способный *отдать* `e⁻` и повысить степень окисления)."]}, {"h": "1. Твои два главных справочника на экзамене"}, {"p": "На ЕГЭ по химии рядом с бланком всегда лежат два официальных документа ФИПИ: **Периодическая система** и **Таблица растворимости с электрохимическим рядом напряжений металлов**. Не держи в голове то, что уже напечатано перед глазами: по ПСХЭ определяй максимальные и минимальные степени окисления, а по таблице растворимости — осадки, прочерки (совместный гидролиз или ОВР) и активность металлов."}, {"fig": "fipi-pshe", "file": "fipi-pshe.png", "cap": "Официальная Периодическая система химических элементов Д. И. Менделеева (КИМ ЕГЭ-2027, ФИПИ)."}, {"fig": "fipi-solubility", "file": "fipi-solubility.png", "cap": "Официальная таблица растворимости кислот, солей и оснований в воде и электрохимический ряд напряжений металлов (КИМ ЕГЭ-2027, ФИПИ)."}, {"h": "2. Четыре вопроса, которые предсказывают любую реакцию"}, {"p": "По статистике ФИПИ задания № 7 (25,4 % успешности) и № 8 (30,8 %) — самые провальные во всей первой части. Причина одна: ученики пытаются «узнать» реакцию по памяти. Вместо этого перед любой парой веществ задавай четыре вопроса в строгом порядке:"}, {"flow": [["1. Есть ли пара ОВР?", "Сильный окислитель (`HNO3`, `H2SO4(конц.)`, `KMnO4`, `Cl2`, `O2`, `Fe^{3+}`) + восстановитель (металл, `H2S`, `I⁻`, `SO2`, `Fe^{2+}`) → сначала проверяй ОВР!"], ["2. Кислотно-основная пара?", "Основное + кислотное → соль (+ вода); амфотерное реагирует и с кислотами, и со щелочами."], ["3. Идёт ли РИО / гидролиз?", "Проверь таблицу растворимости: есть ли осадок («Н»/«М»), газ, слабый электролит или прочерк «–» (совместный гидролиз)?"], ["4. Каковы условия?", "Водный раствор vs сплавление, холод vs нагревание, недостаток vs избыток реагента — они меняют продукты."]]}, {"h": "3. Общие способы получения металлов (металлургия)"}, {"p": "В природе почти все металлы (кроме золота, платины и части меди/серебра) находятся в виде соединений — оксидов, сульфидов, карбонатов, хлоридов, где металл имеет положительную степень окисления (`M^{+n}`). Значит, **получение любого металла — это всегда его восстановление**: `M^{+n} + n e⁻ → M⁰`."}, {"p": "Но почему для натрия и алюминия нужен электрический ток (дорогой электролиз расплава), а железо и медь спокойно восстанавливают углём или водородом? Всё решает **положение металла в электрохимическом ряду напряжений**: чем левее металл, тем прочнее он держит свои электроны в соединении (тем сильнее нужно «вталкивать» их обратно)."}, {"svg": "<svg viewBox='0 0 460 195' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='195' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='26' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Способы получения металлов по ряду напряжений<\/text><rect x='14' y='44' width='134' height='134' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='1.6'/><text x='81' y='66' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='13' font-weight='700'>Li … Al<\/text><text x='81' y='85' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Электрометаллургия<\/text><text x='81' y='106' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>Только электролиз<\/text><text x='81' y='123' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>РАСПЛАВОВ солей<\/text><text x='81' y='140' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>или Al₂O₃ в криолите<\/text><text x='81' y='162' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12'>Водный р-р → H₂!<\/text><rect x='160' y='44' width='146' height='134' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-acc,#14b8a6)' stroke-width='1.6'/><text x='233' y='66' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='13' font-weight='700'>Mn, Zn, Cr, Fe … Pb<\/text><text x='233' y='85' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Пирометаллургия<\/text><text x='233' y='106' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>Восстановление из<\/text><text x='233' y='123' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>оксидов: C, CO, H₂,<\/text><text x='233' y='140' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>Al (алюмотермия)<\/text><text x='233' y='162' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+ электролиз р-ров<\/text><rect x='318' y='44' width='128' height='134' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)' stroke-width='1.6'/><text x='382' y='66' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='13' font-weight='700'>Cu, Hg, Ag, Pt, Au<\/text><text x='382' y='85' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Пиро- и гидро-<\/text><text x='382' y='106' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>C, CO, H₂ и<\/text><text x='382' y='123' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>Fe + CuSO₄,<\/text><text x='382' y='140' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>обжиг HgS → Hg,<\/text><text x='382' y='162' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>самородки (Au, Pt)<\/text><\/svg>"}, {"p": "Разберём три промышленных метода металлургии на конкретных уравнениях, которые регулярно встречаются в заданиях № 7, 8, 9 и 31:"}, {"table": [["Метод", "Суть и восстановитель", "Ключевые уравнения ЕГЭ", "Для каких металлов"], ["**[[электрометаллургия|Электрометаллургия]]**", "Электролиз расплавов галогенидов, щелочей или раствора `Al2O3` в расплавленном криолите `Na3[AlF6]`", "`2NaCl(расплав) —электролиз→ 2Na + Cl2↑`; `2Al2O3(расплав в криолите) —электролиз→ 4Al + 3O2↑`", "Активные металлы (`Li–Al`)"], ["**[[пирометаллургия|Пирометаллургия]]**", "Восстановление оксидов при высокой температуре (`C`, `CO`, `H2`, `Al`, `Mg` — металлотермия). Сульфидные руды предварительно обжигают до оксида!", "`Fe2O3 + 3CO —t°→ 2Fe + 3CO2`; `CuO + H2 —t°→ Cu + H2O`; `Cr2O3 + 2Al —t°→ 2Cr + Al2O3` ([[алюмотермия]])", "Средние и малоактивные (`Zn, Cr, Fe, Cu, W`)"], ["**[[гидрометаллургия|Гидрометаллургия]]**", "Перевод руды в раствор соли (выщелачивание), затем вытеснение более активным металлом (не щелочным!) или электролиз раствора", "`CuO + H2SO4(разб.) → CuSO4 + H2O`, затем `CuSO4 + Fe → FeSO4 + Cu`", "Малоактивные и часть средних (`Cu, Ag, Au, Zn`)"]]}, {"steps": ["**Разбор вслух: как выбрать способ получения Na, Al, Fe и Cu из сырья**", "**1. Натрий из поваренной соли NaCl:** натрий стоит левее алюминия, значит, из водного раствора `NaCl` на катоде выделится только `H2`. Берём **электролиз расплава**: `2NaCl(расплав) —электролиз→ 2Na + Cl2↑`.", "**2. Алюминий из боксита Al2O3:** алюминий слишком активен для восстановления углём или водородом в школьной схеме, а при электролизе водного раствора `AlCl3` снова выделится `H2`. Нужен **электролиз расплава** `Al2O3` в криолите (криолит снижает температуру плавления с ~2050 °C до ~950 °C): `2Al2O3(расплав) —электролиз→ 4Al + 3O2↑`.", "**3. Железо из гематита Fe2O3:** металл средней активности — идеально подходит **пирометаллургия** (восстановление `CO`, `C`, `H2` или `Al`): `Fe2O3 + 3CO —t°→ 2Fe + 3CO2`. Проверяем баланс по кислороду: 3 + 3 = 6 слева, 3 · 2 = 6 справа.", "**4. Медь из сульфидной руды CuS:** сначала сульфид обжигают в кислороде (`2CuS + 3O2 —t°→ 2CuO + 2SO2↑`), а затем `CuO` либо восстанавливают `H2`/`CO` (пирометаллургия), либо растворяют в `H2SO4(разб.)` и вытесняют железом (гидрометаллургия): `CuSO4 + Fe → FeSO4 + Cu`."]}, {"warn": "Три классические ловушки по металлургии: 1) `Al2O3` НЕ восстанавливается водородом `H2` и угарным газом `CO`! 2) При нагревании `Fe2O3 + 3C` в избытке угля образуется `CO` (`Fe2O3 + 3C —t°→ 2Fe + 3CO↑`), хотя в зависимости от условий может выделяться и `CO2`; 3) При обжиге сульфида ртути `HgS` сразу получается металлическая ртуть (`HgS + O2 —t°→ Hg + SO2↑`), потому что оксид `HgO` термически неустойчив и разлагается на `Hg` и `O2`!", "t": "Ловушки ЕГЭ по получению металлов"}, {"bridge": {"kim": "№ 7, 8, 9, 25 КИМ", "ask": "Спрашивают, какими восстановителями можно получить Fe, Cr, Cu из их оксидов, почему Al и Na получают электролизом расплавов, и какие реакции лежат в основе алюмотермии и гидрометаллургии.", "watch": "Ловят на попытке восстановить `MgO`, `CaO` или `Al2O3` водородом `H2` или угарным газом `CO`, а также на электролизе водных растворов `NaCl` и `AlCl3` вместо расплавов.", "tip": "Смотри на границу `Al` в ряду напряжений: всё от `Li` до `Al` включительно — только электролиз расплава; правее `Al` — открыты пиро- и гидрометаллургия."}}], "short": [{"list": ["Неорганические реакции предсказываются по 4 шагам: ОВР-совместимость → кислотно-основный характер → таблица растворимости (РИО/гидролиз) → условия среды и температуры.", "Активные металлы (`Li–Al`) получают электрометаллургией — электролизом расплавов их солей, щелочей или раствора `Al2O3` в криолите.", "Металлы средней и малой активности (`Zn, Cr, Fe, Cu, W`) получают пирометаллургией (восстановление оксидов `C`, `CO`, `H2`, `Al`) и гидрометаллургией (вытеснение из раствора соли более активным металлом или электролиз раствора).", "Сульфидные руды (например, `ZnS`, `CuS`) перед восстановлением обжигают кислородом до оксидов и `SO2` (а `HgS` при обжиге сразу даёт `Hg` и `SO2`).", "Оксиды активных металлов (`Na2O`, `CaO`, `MgO`, `Al2O3`) не восстанавливаются водородом `H2` и угарным газом `CO`."]}]}, {"id": "02", "group": "Химия металлов", "nav": "Na, K, Ca, Mg", "codes": ["2.2"], "eyebrow": "02 · Код 2.2 · Металлы IA и IIA групп", "title": "Активные металлы: Na, K, Ca, Mg и их соединения", "lead": "Почему натрий, сгорая в кислороде, не даёт обычный оксид Na2O, а кусочек натрия, брошенный в голубой раствор медного купороса CuSO4, даёт не красную медь, а голубой осадок и пузырьки газа?", "b": [{"key": "Щелочные (Li, Na, K) и щёлочноземельные (Ca, Ba) металлы — сильнейшие восстановители. Они отдают электроны настолько легко, что в воде мгновенно вытесняют водород, а с кислородом часто образуют пероксиды и надпероксиды. Магний (Mg) — переходный «мостик»: он активен, но при комнатной температуре защищён плотной оксидной плёнкой.", "t": "Главная мысль."}, {"h": "1. Как активные металлы реагируют с кислородом и неметаллами"}, {"p": "В школе часто возникает привычка писать для любого металла «металл + O2 → оксид». Для кальция и магния это действительно работает, а вот для натрия и калия — одна из самых частых ловушек заданий № 7, 8 и 31. Чем больше радиус катиона щелочного металла, тем устойчивее рядом с ним крупные кислородные анионы — [[пероксид]]-ион `O2^{2−}` (степень окисления кислорода `−1`) и надпероксид-ион `O2^{−}`."}, {"table": [["Металл", "Реакция с кислородом O2", "Продукт и степень окисления O", "Почему так получается"], ["Li, Mg, Ca", "4Li + O2 → 2Li2O; 2Mg + O2 —t°→ 2MgO", "Обычный оксид (`O^{−2}`)", "Маленькие катионы `Li^{+}`, `Mg^{2+}`, `Ca^{2+}` стабилизируют компактный анион `O^{2−}`"], ["Na", "2Na + O2 → Na2O2", "[[пероксид|Пероксид натрия]] (`O^{−1}`)", "Крупный `Na^{+}` легче образует кристаллическую решётку с гантелеобразным `O2^{2−}`"], ["K (Rb, Cs)", "K + O2 → KO2", "Надпероксид калия (`O^{−1/2}`)", "Ещё более крупный `K^{+}` стабилизирует ион `O2^{−}`"]]}, {"p": "Как тогда получить чистый оксид `Na2O` или `K2O`? Нагреть пероксид с избытком самого металла — металл «довосстановит» кислород из `−1` до `−2`:"}, {"eq": ["Na2O2 + 2Na —t°→ 2Na2O", "2KO2 + 6K —t°→ 4K2O"]}, {"p": "С другими неметаллами (галогенами, серой, водородом, азотом, углеродом) активные металлы легко вступают в соединения, образуя солеобразные бинарные вещества — галогениды, сульфиды, [[гидрид|гидриды]], [[нитрид|нитриды]] и [[карбид|карбиды]]:"}, {"eq": ["2Na + H2 —t°→ 2NaH", "Ca + H2 —t°→ CaH2", "3Mg + N2 —t°→ Mg3N2", "6Li + N2 → 2Li3N", "Ca + 2C —t°→ CaC2"]}, {"hint": "Литий — единственный металл в ЕГЭ, который реагирует с азотом `N2` уже при комнатной температуре. Магний и кальций образуют нитриды `Mg3N2` и `Ca3N2` при нагревании, а натрий и калий с `N2` напрямую не реагируют — это важно помнить для задания № 7.", "t": "Запомни границу по азоту"}, {"h": "2. Реакции с водой и почему Na не вытесняет медь из раствора CuSO4"}, {"p": "В электрохимическом ряду напряжений `Li, K, Ba, Ca, Na` стоят в самом начале. При комнатной температуре они бурно реагируют с водой, образуя щёлочь и водород:"}, {"eq": ["2Na + 2H2O → 2NaOH + H2↑", "Ca + 2H2O → Ca(OH)2 + H2↑"]}, {"p": "А вот магний `Mg` с холодной водой практически не реагирует: его поверхность сразу покрывается тонкой плёнкой нерастворимого `Mg(OH)2`, которая отсекает воду. Но при кипячении плёнка разрушается, а с водяным паром при высокой температуре образуется уже оксид `MgO`, потому что `Mg(OH)2` при нагревании разлагается:"}, {"eq": ["Mg + 2H2O(гор.) —t°→ Mg(OH)2↓ + H2↑", "Mg + H2O(пар) —t°→ MgO + H2↑"]}, {"warn": "Антипаттерн № 1: никогда не пиши вытеснение другого металла щелочным или щёлочноземельным металлом из ВОДНОГО раствора соли! Если бросить натрий в раствор `CuSO4`, реакция `2Na + CuSO4 → Cu + Na2SO4` НЕ идёт. Молекул воды вокруг натрия во много раз больше, чем ионов `Cu^{2+}`, поэтому натрий мгновенно реагирует с водой, а образовавшаяся щёлочь `NaOH` тут же осаждает голубой `Cu(OH)2`.", "t": "Ловушка ЕГЭ: активный металл + водный раствор соли"}, {"steps": ["**Разбор вслух: что происходит при добавлении натрия в раствор сульфата меди(II)?**", "**Шаг 1.** Сначала `Na` реагирует с водой: `2Na + 2H2O → 2NaOH + H2↑`. Выделяется бесцветный газ (водород).", "**Шаг 2.** Образовавшийся `NaOH` вступает в РИО с `CuSO4`: `2NaOH + CuSO4 → Cu(OH)2↓ + Na2SO4`. Выпадает голубой осадок.", "**Шаг 3.** Складываем два уравнения (в № 31 часто удобно писать суммарно или в две стадии, если это требуется по условию): `2Na + 2H2O + CuSO4 → Cu(OH)2↓ + Na2SO4 + H2↑`. Проверяем баланс по кислороду: слева 2 + 4 = 6, справа 2 + 4 = 6. Всё сошлось."]}, {"h": "3. Свойства пероксидов, гидридов и нитридов (хиты № 8 и № 31)"}, {"p": "Бинарные соединения активных металлов — гидриды (`NaH`, `CaH2`), нитриды (`Mg3N2`, `Li3N`) и карбид кальция (`CaC2`) — необратимо разлагаются водой (гидролизуются). При этом степень окисления элементов **не меняется** (кроме гидридов, где `H^{−1}` и `H^{+1}` дают `H2`):"}, {"eq": ["NaH + H2O → NaOH + H2↑", "CaH2 + 2H2O → Ca(OH)2 + 2H2↑", "Mg3N2 + 6H2O → 3Mg(OH)2↓ + 2NH3↑", "CaC2 + 2H2O → Ca(OH)2 + C2H2↑"]}, {"p": "Пероксид натрия `Na2O2` — сильный окислитель и источник кислорода на подводных лодках и космических станциях. Он поглощает углекислый газ и возвращает кислород, а с водой реагирует по-разному при охлаждении и при нагревании:"}, {"eq": ["2Na2O2 + 2CO2 → 2Na2CO3 + O2↑", "2Na2O2 + 2H2O(гор.) → 4NaOH + O2↑", "Na2O2 + 2H2O(хол.) → 2NaOH + H2O2"]}, {"p": "С кислотами пероксид натрия образует соль и перекись водорода (при охлаждении) или кислород (при нагревании), а с восстановителями вроде `SO2` окисляет серу до `+6`:"}, {"eq": ["Na2O2 + SO2 → Na2SO4", "Na2O2 + 2HCl(хол.) → 2NaCl + H2O2"]}, {"p": "Сам **пероксид водорода `H2O2`** (степень окисления `O^{−1}`, промежуточная!) — важный участник № 7, 8 и 31. С катализатором `MnO2` он бурно разлагается (`2H2O2 —кат. MnO2→ 2H2O + O2↑`), с восстановителями (`KI`, `FeSO4`, `Na2SO3`, `Na[Cr(OH)4]`) работает как **окислитель** (`O^{−1} → O^{−2}`), а с более сильными окислителями (`KMnO4`, `Cl2`, `Ag2O`) — как **восстановитель** с выделением `O2↑`:"}, {"eq": ["2KI + H2O2 + H2SO4(разб.) → I2↓ + K2SO4 + 2H2O", "2KMnO4 + 5H2O2 + 3H2SO4(разб.) → 2MnSO4 + 5O2↑ + K2SO4 + 8H2O", "H2O2 + Cl2 → 2HCl + O2↑", "H2O2 + Ag2O → 2Ag + O2↑ + H2O"]}, {"h": "4. Щёлочи, гидроксид магния и взаимопереходы карбонатов"}, {"p": "Гидроксиды `NaOH`, `KOH`, `Ca(OH)2`, `Ba(OH)2` — сильные основания (щёлочи). В отличие от нерастворимого `Mg(OH)2`, щёлочи `NaOH` и `KOH` **термически устойчивы** (не разлагаются при прокаливании, только плавятся), тогда как `Ca(OH)2` и особенно `Mg(OH)2` при сильном прокаливании теряют воду:"}, {"eq": ["Mg(OH)2 —t°→ MgO + H2O", "Ca(OH)2 —t°→ CaO + H2O"]}, {"p": "Ключевой цикл для № 6, 8, 9 и 31 — переход между нерастворимым карбонатом кальция `CaCO3` (мел, мрамор, известняк) и растворимым гидрокарбонатом `Ca(HCO3)2` (временная жёсткость воды):"}, {"compare": {"t": "Как управлять карбонатом и гидрокарбонатом кальция", "left": {"title": "Избыток CO2 → растворение осадка", "items": ["Сначала мутнеет известковая вода: `Ca(OH)2 + CO2 → CaCO3↓ + H2O`", "При дальнейшем пропускании `CO2` осадок растворяется: `CaCO3 + CO2 + H2O → Ca(HCO3)2`", "В таблице растворимости ФИПИ только `Ca(HCO3)2` имеет пометку «Р» (у `Mg(HCO3)2` и `Ba(HCO3)2` стоит прочерк «–», потому что они не выделяются в твёрдом виде, хотя существуют в растворе)"]}, "right": {"title": "Кипячение или щёлочь → снова осадок", "items": ["При кипячении `Ca(HCO3)2` разлагается (накипь в чайнике): `Ca(HCO3)2 —t°→ CaCO3↓ + CO2↑ + H2O`", "При добавлении щёлочи кислая соль переходит в среднюю: `Ca(HCO3)2 + Ca(OH)2 → 2CaCO3↓ + 2H2O`", "При действии `NaOH` (изб.) выпадает `CaCO3`: `Ca(HCO3)2 + 2NaOH → CaCO3↓ + Na2CO3 + 2H2O`"]}}}, {"p": "Помни также про термическую устойчивость карбонатов: карбонаты щелочных металлов (`Na2CO3`, `K2CO3`) при прокаливании **не разлагаются** (кроме `Li2CO3 —t°→ Li2O + CO2↑`!), а карбонаты щёлочноземельных металлов и магния разлагаются на оксид и `CO2`: `CaCO3 —t°→ CaO + CO2↑`, `MgCO3 —t°→ MgO + CO2↑`. Гидрокарбонаты разлагаются **все** — даже `NaHCO3`: `2NaHCO3 —t°→ Na2CO3 + CO2↑ + H2O`."}, {"h": "5. Кислые соли (NaHSO4 vs NaHCO3) и основная соль малахит"}, {"p": "В заданиях № 6, 7, 8 и 31 важно различать два типа кислых солей. Кислые соли **слабых** кислот (`NaHCO3`, `KHCO3`, `NaHS`, `NaH2PO4`) реагируют **и с сильными кислотами** (выделяется слабая кислота/газ), **и со щелочами** (переходят в среднюю соль; со «своей» щёлочью — одна соль, с «чужой» — две соли). А вот **гидросульфат `NaHSO4` / `KHSO4`** (кислая соль сильной `H2SO4`) с `HCl` и `HNO3` **не реагирует**, зато сам ведёт себя как сильная кислота — растворяет активные металлы (`Mg`, `Zn`), оксиды и вытесняет `CO2` из карбонатов:"}, {"eq": ["2NaHCO3 + 2KOH → Na2CO3 + K2CO3 + 2H2O", "2KHCO3 + Ba(OH)2(нед.) → BaCO3↓ + K2CO3 + 2H2O", "KHCO3 + Ba(OH)2(изб.) → BaCO3↓ + KOH + H2O", "2NaHSO4 + Mg → MgSO4 + Na2SO4 + H2↑", "2NaHSO4 + Na2CO3 → 2Na2SO4 + CO2↑ + H2O"]}, {"p": "Из основных солей в ЕГЭ регулярно встречается **малахит** `(CuOH)2CO3` (зелёный минерал): при нагревании он разлагается на чёрный `CuO`, `CO2` и воду, а в кислотах растворяется с выделением `CO2↑`: `(CuOH)2CO3 —t°→ 2CuO + CO2↑ + H2O`; `(CuOH)2CO3 + 4HCl → 2CuCl2 + CO2↑ + 3H2O`."}, {"bridge": {"kim": "№ 6, 7, 8, 9, 31 КИМ", "ask": "В № 7 дают Na, Ca, Mg, Na2O2, CaCO3, NaHCO3 и просят выбрать строку из трёх реагентов. В № 8 проверяют разницу между реакцией Na с O2, Mg с холодной/горячей водой и Ca(OH)2 с недостатком/избытком CO2. В № 31 часто встречается «известковая вода помутнела, затем осадок растворился».", "watch": "Ловят на: 1) попытке написать `4Na + O2 → 2Na2O` вместо `Na2O2`; 2) попытке вытеснить медь натрием из водного раствора `CuSO4`; 3) разложении `Na2CO3` при нагревании (он не разлагается!); 4) реакции `Mg` с щелочами (магний НЕ амфотерен и со щелочами не реагирует!).", "tip": "Увидев в задании `Na`, `K` или `Ca` — сразу проверяй, есть ли в строке вода, `O2`, кислоты или неметаллы. Увидев `Mg` — помни, что он НЕ амфотерен (в отличие от `Be`, `Zn`, `Al`), зато горит даже в `CO2` (`2Mg + CO2 —t°→ 2MgO + C`)."}}], "short": [{"list": ["При горении в кислороде `Li`, `Mg`, `Ca` дают оксиды, `Na` даёт пероксид `Na2O2`, а `K` — надпероксид `KO2`.", "Щелочные и щёлочноземельные металлы бурно реагируют с водой при н.у.; из водных растворов солей они не вытесняют другой металл, а реагируют с водой с образованием щёлочи и `H2↑`.", "Магний не реагирует со щелочами (он не амфотерен), с холодной водой пассивируется плёнкой `Mg(OH)2`, но реагирует с кипящей водой (`Mg(OH)2 + H2`) и водяным паром (`MgO + H2`).", "Гидриды (`NaH`, `CaH2`), нитриды (`Mg3N2`, `Li3N`) и карбид кальция (`CaC2`) необратимо гидролизуются водой с выделением `H2`, `NH3` и `C2H2` соответственно.", "Пероксид натрия `Na2O2` с `CO2` даёт `Na2CO3 + O2↑`, а с `SO2` — `Na2SO4`.", "Карбонаты `Na2CO3` и `K2CO3` при нагревании не разлагаются, а `Li2CO3`, `CaCO3`, `MgCO3` и все гидрокарбонаты (`NaHCO3`, `Ca(HCO3)2`) разлагаются."]}]}, {"id": "03", "group": "Химия металлов", "nav": "Al и Zn (амфотерность)", "codes": ["2.2"], "eyebrow": "03 · Код 2.2 · Амфотерные металлы", "title": "Амфотерные металлы: Al и Zn, их оксиды, гидроксиды и комплексы", "lead": "Почему алюминиевая кастрюля спокойно стоит с водой на плите, хотя алюминий в ряду напряжений стоит левее цинка и железа, и почему осадок Al(OH)3 исчезает в избытке NaOH, но отказывается растворяться в водном аммиаке?", "b": [{"key": "Алюминий (`Al`), цинк (`Zn`), а также бериллий (`Be`), свинец (`Pb`), олово (`Sn`) и хром(III) образуют [[амфотерный гидроксид|амфотерные]] оксиды и гидроксиды. Они ведут себя как основания с кислотами и как кислоты со щелочами. Главный секрет безошибочных уравнений — жёстко разделять реакции в водном растворе (образуются гидроксокомплексы `[Al(OH)4]⁻`, `[Zn(OH)4]^{2−}`) и при сплавлении (образуются средние соли `NaAlO2`, `Na2ZnO2`).", "t": "Главная мысль."}, {"h": "1. Защитная плёнка Al2O3, пассивация и реакции с водой"}, {"p": "На воздухе алюминий мгновенно покрывается тончайшей, но очень прочной плёнкой оксида `Al2O3`. Именно она не даёт алюминиевой посуде реагировать с водой. Но стоит снять эту плёнку (например, растереть металл солью ртути — амальгамировать, или растворить плёнку щёлочью), и алюминий начинает бурно реагировать с водой:"}, {"eq": ["2Al(без плёнки) + 6H2O → 2Al(OH)3↓ + 3H2↑", "Zn + H2O(пар) —t°→ ZnO + H2↑"]}, {"p": "С концентрированными серной `H2SO4(конц.)` и азотной `HNO3(конц.)` кислотами на холоде алюминий **пассивируется** (оксидная плёнка уплотняется, реакция останавливается). Поэтому концентрированную азотную кислоту перевозят в алюминиевых цистернах! Но при нагревании плёнка разрушается, и идёт бурная ОВР (см. модули 06 и 07). Цинк в этих кислотах **не пассивируется** и реагирует даже на холоде."}, {"p": "С разбавленными неокисляющими кислотами (`HCl`, `H2SO4(разб.)`) оба металла реагируют классически — с выделением водорода:"}, {"eq": ["2Al + 6HCl → 2AlCl3 + 3H2↑", "Zn + H2SO4(разб.) → ZnSO4 + H2↑"]}, {"h": "2. Реакции Al и Zn со щелочами: раствор vs сплавление"}, {"p": "Главное отличие амфотерных металлов от магния, железа и меди — способность растворяться в водных растворах щелочей с выделением водорода. Почему это происходит? Сначала щёлочь растворяет защитную плёнку оксида, затем металл реагирует с водой, а выпадающий `Al(OH)3` или `Zn(OH)2` тут же связывается избытком `OH^{−}` в растворимый [[гидроксокомплекс]]:"}, {"eq": ["2Al + 2NaOH(водн.) + 6H2O → 2Na[Al(OH)4] + 3H2↑", "Zn + 2NaOH(водн.) + 2H2O → Na2[Zn(OH)4] + H2↑"]}, {"hint": "В ЕГЭ для алюминия в водном растворе щёлочи базовой формулой считается тетрагидроксоалюминат `Na[Al(OH)4]` (хотя при большом избытке щёлочи допустима и запись `Na3[Al(OH)6]`). Для цинка всегда пишем тетрагидроксоцинкат `Na2[Zn(OH)4]`. Обрати внимание на заряды: `Al^{3+} + 4OH^{−} → [Al(OH)4]⁻`, `Zn^{2+} + 4OH^{−} → [Zn(OH)4]^{2−}`.", "t": "Как не ошибиться с индексами в комплексе"}, {"p": "А если взять **твёрдый** оксид или гидроксид и **сплавить** его с твёрдой щёлочью или карбонатом (воды нет — она улетает в виде пара!), получаются безводные соли — **метаалюминат** `NaAlO2` или **цинкат** `Na2ZnO2`:"}, {"compare": {"t": "Амфотерные соединения со щелочами: раствор против сплавления", "left": {"title": "В водном растворе → гидроксокомплекс", "items": ["`Al2O3 + 2NaOH(водн.) + 3H2O → 2Na[Al(OH)4]`", "`Al(OH)3 + NaOH(водн.) → Na[Al(OH)4]`", "`ZnO + 2NaOH(водн.) + H2O → Na2[Zn(OH)4]`", "`Zn(OH)2 + 2NaOH(водн.) → Na2[Zn(OH)4]`"]}, "right": {"title": "При сплавлении (t°) → безводная соль + H2O↑/CO2↑", "items": ["`Al2O3 + 2NaOH(тв.) —сплавление→ 2NaAlO2 + H2O↑`", "`Al(OH)3 + NaOH(тв.) —сплавление→ NaAlO2 + 2H2O↑`", "`Al2O3 + Na2CO3(тв.) —сплавление→ 2NaAlO2 + CO2↑`", "`ZnO + Na2CO3(тв.) —сплавление→ Na2ZnO2 + CO2↑`"]}}}, {"h": "3. Полный цикл переходов алюминия: осадок, комплекс и его разрушение"}, {"p": "В заданиях № 6, 8, 9 и 31 обожают «качели» вокруг алюминия и цинка: из соли `AlCl3` получают осадок `Al(OH)3`, затем растворяют его в избытке щёлочи до `Na[Al(OH)4]`, а потом снова осаждают `Al(OH)3` кислотой или кислотным оксидом. Посмотри на полную карту этих переходов:"}, {"svg": "<svg viewBox='0 0 460 232' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='232' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='26' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Цикл превращений амфотерного алюминия<\/text><rect x='12' y='84' width='98' height='54' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='61' y='108' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>Al³⁺ (соль)<\/text><text x='61' y='127' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>AlCl₃, Al³⁺<\/text><rect x='176' y='84' width='108' height='54' rx='8' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.8'/><text x='230' y='108' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>Al(OH)₃↓<\/text><text x='230' y='127' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>белый осадок<\/text><rect x='350' y='84' width='98' height='54' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-acc,#14b8a6)' stroke-width='1.5'/><text x='399' y='108' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>[Al(OH)₄]⁻<\/text><text x='399' y='127' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>комплекс (р-р)<\/text><rect x='168' y='176' width='124' height='44' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><text x='230' y='196' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13' font-weight='700'>Al₂O₃ (тв.)<\/text><text x='230' y='212' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+ Na₂CO₃ → NaAlO₂<\/text><line x1='110' y1='100' x2='172' y2='100' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><polygon points='176,100 168,96 168,104' fill='var(--svg-good,#34c77b)'/><text x='143' y='74' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='12'>OH⁻ (нед.)<\/text><text x='143' y='58' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>или NH₃·H₂O<\/text><line x1='176' y1='124' x2='114' y2='124' stroke='var(--svg-blue,#60a5fa)' stroke-width='2'/><polygon points='110,124 118,120 118,128' fill='var(--svg-blue,#60a5fa)'/><text x='143' y='156' text-anchor='middle' fill='var(--svg-blue,#60a5fa)' font-size='12'>+ H⁺ (HCl)<\/text><line x1='284' y1='100' x2='346' y2='100' stroke='var(--svg-acc,#14b8a6)' stroke-width='2'/><polygon points='350,100 342,96 342,104' fill='var(--svg-acc,#14b8a6)'/><text x='317' y='74' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='12'>+ OH⁻ (изб.)<\/text><line x1='350' y1='124' x2='288' y2='124' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><polygon points='284,124 292,120 292,128' fill='var(--svg-gold,#e5a93c)'/><text x='352' y='156' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12'>+ CO₂ / HCl<\/text><text x='352' y='171' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>(нед. к-ты)<\/text><line x1='230' y1='138' x2='230' y2='172' stroke='var(--svg-dim,#94a8c0)' stroke-width='2'/><polygon points='230,176 226,168 234,168' fill='var(--svg-dim,#94a8c0)'/><text x='240' y='162' text-anchor='start' fill='var(--svg-dim,#94a8c0)' font-size='12'>t° (−H₂O)<\/text><\/svg>"}, {"p": "Самая коварная точка на схеме — **разрушение гидроксокомплекса**. Посмотри, как результат зависит от того, чем и в каком количестве мы действуем на `Na[Al(OH)4]`:"}, {"eq": ["Na[Al(OH)4] + HCl(нед.) → Al(OH)3↓ + NaCl + H2O", "Na[Al(OH)4] + 4HCl(изб.) → AlCl3 + NaCl + 4H2O", "Na[Al(OH)4] + CO2(изб.) → Al(OH)3↓ + NaHCO3", "Na2[Zn(OH)4] + 2CO2(изб.) → Zn(OH)2↓ + 2NaHCO3", "Na[Al(OH)4] + SO2(изб.) → Al(OH)3↓ + NaHSO3", "Na[Al(OH)4] + H2S(изб.) → Al(OH)3↓ + NaHS + H2O", "Na[Al(OH)4] + NH4Cl → Al(OH)3↓ + NH3↑ + NaCl + H2O"]}, {"warn": "Почему с `CO2`, `SO2`, `H2S` и солью аммония `NH4Cl` выпадает осадок `Al(OH)3`? Угольная, сернистая и сероводородная кислоты слишком слабые, чтобы растворить `Al(OH)3`, а их избыток даёт кислую соль (`NaHCO3`, `NaHSO3`, `NaHS`). С `NH4Cl` идёт взаимный гидролиз комплекса с катионом аммония (`Al(OH)3↓ + NH3↑`). Сильная кислота (`HCl`, `H2SO4`, `HNO3`) в избытке растворяет выпавший осадок до средней соли `AlCl3`! Заодно запомни границу амфотерности ЕГЭ: в водном растворе `NaOH` растворяются `Al(OH)3`, `Zn(OH)2`, `Cr(OH)3`, но **не** `Fe(OH)3` (он реагирует со щёлочью только при сплавлении — подробнее в модуле 04).", "t": "Ловушка ЕГЭ: CO2, NH4Cl и HCl с комплексами + граница с Fe(OH)3"}, {"h": "4. Важнейшее отличие Al(OH)3 от Zn(OH)2 — реакция с водным аммиаком"}, {"p": "Водный раствор аммиака `NH3·H2O` — слабое основание. Его концентрации `OH^{−}` хватает, чтобы осадить `Al(OH)3` из соли алюминия, но **не хватает**, чтобы растворить `Al(OH)3` в гидроксокомплекс. Поэтому при добавлении избытка `NH3·H2O` к `AlCl3` осадок `Al(OH)3` **не растворяется**!"}, {"p": "А вот `Zn(OH)2` (как и `Cu(OH)2`) образует устойчивый **аммиачный комплекс** `[Zn(NH3)4](OH)2`, поэтому осадок гидроксида цинка в избытке водного аммиака **растворяется**:"}, {"eq": ["AlCl3 + 3NH3·H2O(изб.) → Al(OH)3↓ + 3NH4Cl", "Zn(OH)2 + 4NH3·H2O(изб.) → [Zn(NH3)4](OH)2 + 4H2O"]}, {"h": "5. Совместный (необратимый) гидролиз солей алюминия"}, {"p": "Загляни в таблицу растворимости ФИПИ на пересечение `Al^{3+}` с `CO3^{2−}`, `S^{2−}` и `SO3^{2−}`: везде стоят прочерки «–». В водном растворе эти соли мгновенно и необратимо гидролизуются до осадка `Al(OH)3` и газа (`CO2`, `H2S` или `SO2`). А вот у `Zn^{2+}` карбонат, сульфид и сульфит в воде существуют (в таблице стоят «Н» и «М»), поэтому для солей цинка идёт обычный ионный обмен, а не совместный гидролиз!"}, {"eq": ["Al2S3 + 6H2O → 2Al(OH)3↓ + 3H2S↑", "2AlCl3 + 3Na2CO3 + 3H2O → 2Al(OH)3↓ + 3CO2↑ + 6NaCl", "AlCl3 + 3NaHCO3 → Al(OH)3↓ + 3CO2↑ + 3NaCl", "2Al(NO3)3 + 3K2S + 6H2O → 2Al(OH)3↓ + 3H2S↑ + 6KNO3"]}, {"steps": ["**Разбор вслух: полный цикл Al → AlCl3 → Al(OH)3 → Na[Al(OH)4] → Al(OH)3 → Al2O3 → NaAlO2**", "**1. Растворение металла в кислоте:** `2Al + 6HCl → 2AlCl3 + 3H2↑`.", "**2. Осаждение гидроксида (надёжнее всего — аммиаком, чтобы точно не перелить щёлочь):** `AlCl3 + 3NH3·H2O → Al(OH)3↓ + 3NH4Cl`.", "**3. Растворение осадка в избытке щёлочи:** `Al(OH)3 + NaOH(водн.) → Na[Al(OH)4]`.", "**4. Осаждение из комплекса пропусканием избытка CO2:** `Na[Al(OH)4] + CO2(изб.) → Al(OH)3↓ + NaHCO3`.", "**5. Прокаливание гидроксида:** `2Al(OH)3 —t°→ Al2O3 + 3H2O`.", "**6. Сплавление оксида с содой:** `Al2O3 + Na2CO3 —сплавление→ 2NaAlO2 + CO2↑`. Проверяем баланс последнего уравнения: Al (2=2), Na (2=2), C (1=1), O (3+3=6 и 4+2=6)."]}, {"bridge": {"kim": "№ 6, 7, 8, 9, 31 КИМ", "ask": "В № 6 часто дают пробирку с `Al(OH)3` или `Zn(OH)2` и просят выбрать вещества, в которых осадок растворяется (сильная кислота и щёлочь). В № 8 и № 31 постоянно проверяют пару «раствор щёлочи vs сплавление» и «пропускание CO2 через раствор гидроксокомплекса».", "watch": "Ловушки: 1) `Al(OH)3` НЕ растворяется в `NH3·H2O`, `CO2`, `H2S`; 2) `Al2O3` и `ZnO` НЕ реагируют с водой; 3) в `AlCl3 + Na2CO3` (в воде) выпадает `Al(OH)3` и выделяется `CO2`, а НЕ `Al2(CO3)3`!", "tip": "Увидев `Al` или `Zn` в условии — сразу проверяй три маркера: «в растворе» (комплекс) vs «сплавили» (`NaAlO2`/`Na2ZnO2`); «недостаток» vs «избыток» щёлочи или кислоты; `Al^{3+}` + слабый анион (`CO3^{2−}`, `S^{2−}`, `SO3^{2−}`) → совместный гидролиз."}}], "short": [{"list": ["Алюминий на холоде пассивируется концентрированными `HNO3` и `H2SO4`, а цинк — нет; без оксидной плёнки `Al` реагирует с водой при н.у., а `Zn` — с водяным паром при нагревании.", "В водном растворе щёлочи `Al`, `Zn`, их оксиды и гидроксиды образуют гидроксокомплексы `Na[Al(OH)4]` и `Na2[Zn(OH)4]`; при сплавлении с твёрдой щёлочью или карбонатом — безводные `NaAlO2` и `Na2ZnO2`.", "При пропускании `CO2`, `SO2` или `H2S` через раствор `Na[Al(OH)4]` выпадает осадок `Al(OH)3` и образуется кислая соль (`NaHCO3`, `NaHSO3`, `NaHS`); сильная кислота в избытке растворяет комплекс до средней соли (`AlCl3`).", "`Al(OH)3` не растворяется в избытке водного аммиака `NH3·H2O`, а `Zn(OH)2` растворяется с образованием `[Zn(NH3)4](OH)2`.", "Соли `Al^{3+}` с карбонатами, сульфидами и сульфитами в водном растворе вступают в необратимый совместный гидролиз с образованием `Al(OH)3↓` и газа (`CO2↑`, `H2S↑`, `SO2↑`)."]}]}, {"id": "04", "group": "Химия металлов", "nav": "Fe, Cr, Cu (переходные)", "codes": ["2.2"], "eyebrow": "04 · Код 2.2 · d-элементы", "title": "Переходные металлы: Fe, Cr, Cu и их соединения", "lead": "Почему железо с хлором даёт FeCl3, а с соляной кислотой и иодом — только FeCl2 и FeI2, и почему хромовый раствор меняет цвет с оранжевого на жёлтый от одной капли щёлочи?", "b": [{"key": "У `d`-металлов (`Fe`, `Cr`, `Cu`) несколько устойчивых степеней окисления, и с ростом степени окисления характер оксида и гидроксида меняется от **основного** к **амфотерному** и далее к **кислотному** (`CrO` основный → `Cr2O3` амфотерный → `CrO3` кислотный). Чтобы не ошибаться в продуктах, нужно различать силу окислителя и среду раствора.", "t": "Главная мысль."}, {"h": "1. Железо (Fe): когда получается +2, когда +3, а когда Fe3O4"}, {"p": "Железо стоит в ряду напряжений до водорода, но имеет две главные степени окисления: `+2` и `+3`. Выбор продукта полностью зависит от **силы окислителя**:"}, {"compare": {"t": "Куда окисляется металлическое железо Fe(0)?", "left": {"title": "Слабые/умеренные окислители → Fe(+2)", "items": ["Неокисляющие кислоты: `Fe + 2HCl → FeCl2 + H2↑`; `Fe + H2SO4(разб.) → FeSO4 + H2↑`", "Соли менее активных металлов: `Fe + CuSO4 → FeSO4 + Cu`", "Сера и иод: `Fe + S —t°→ FeS`; `Fe + I2 —t°→ FeI2` (`I2` слишком слабый окислитель, чтобы перевести `Fe` в `+3`!)", "Соли `Fe(III)`: `Fe + 2FeCl3 → 3FeCl2`"]}, "right": {"title": "Сильные окислители → Fe(+3)", "items": ["Хлор и бром: `2Fe + 3Cl2 —t°→ 2FeCl3`; `2Fe + 3Br2 —t°→ 2FeBr3`", "Азотная кислота (разб. при н.у., конц. при нагревании!): `Fe + 6HNO3(конц.) —t°→ Fe(NO3)3 + 3NO2↑ + 3H2O`; `Fe + 4HNO3(разб.) → Fe(NO3)3 + NO↑ + 2H2O`", "Концентрированная серная кислота (при нагревании!): `2Fe + 6H2SO4(конц.) —t°→ Fe2(SO4)3 + 3SO2↑ + 6H2O`"]}}}, {"p": "Особый случай — **железная окалина `Fe3O4`** (смешанный оксид `FeO·Fe2O3`, в котором на один атом `Fe^{+2}` приходится два атома `Fe^{+3}`). Она образуется при сгорании железа в кислороде и при реакции раскалённого железа с водяным паром:"}, {"eq": ["3Fe + 2O2 —t°→ Fe3O4", "3Fe + 4H2O(пар) —t°→ Fe3O4 + 4H2↑"]}, {"warn": "На холоде концентрированные `HNO3(конц.)` и `H2SO4(конц.)` **пассивируют** железо (как `Al` и `Cr`): реакция без нагревания не идёт! А при растворении `Fe3O4` в кислотах всё решает окислительная сила кислоты: с `HCl` получается смесь двух солей (`FeCl2` и `FeCl3`), с `HNO3(конц.)` весь `Fe(+2)` доокисляется до `Fe(+3)`, а с `HI` — наоборот, `Fe(+3)` восстанавливается иодидом до `Fe(+2)`!", "t": "Ловушка ЕГЭ: пассивация Fe и реакции Fe3O4 с кислотами"}, {"eq": ["Fe3O4 + 8HCl → FeCl2 + 2FeCl3 + 4H2O", "Fe3O4 + 10HNO3(конц.) —t°→ 3Fe(NO3)3 + NO2↑ + 5H2O", "Fe3O4 + 8HI → 3FeI2 + I2 + 4H2O"]}, {"h": "2. Гидроксиды железа и ловушка «ОВР вместо совместного гидролиза»"}, {"p": "Свежеосаждённый `Fe(OH)2` (бело-зелёный осадок) — сильный восстановитель: на воздухе в присутствии влаги он быстро буреет, окисляясь до бурого `Fe(OH)3`. В задании № 31 эту реакцию любят описывать фразой «выпал серо-зелёный осадок, который на воздухе быстро побурел»:"}, {"eq": "4Fe(OH)2 + O2 + 2H2O → 4Fe(OH)3"}, {"p": "Гидроксид железа(III) `Fe(OH)3` проявляет очень слабые амфотерные свойства: в рамках ЕГЭ принято, что **в водном растворе щёлочи `Fe(OH)3` не растворяется**, но при **сплавлении** с твёрдыми щелочами и карбонатами образует **ферриты** (`NaFeO2`), а при действии сильных окислителей (`Cl2`, `Br2`, `NaClO`) в концентрированной щёлочи окисляется до фиолетовых **ферратов** (`Na2FeO4`, `Fe^{+6}`):"}, {"eq": ["Fe(OH)3 + NaOH(тв.) —сплавление→ NaFeO2 + 2H2O↑", "Fe2O3 + Na2CO3(тв.) —сплавление→ 2NaFeO2 + CO2↑", "2Fe(OH)3 + 3Cl2 + 10NaOH(конц.) → 2Na2FeO4 + 6NaCl + 8H2O"]}, {"warn": "Антипаттерн № 3 (главная ошибка в № 6, 8, 30, 31): ион `Fe^{3+}` — сильный окислитель! С карбонатами (`Na2CO3`, `NaHCO3`) соли `Fe^{3+}` дают **совместный гидролиз** (`2FeCl3 + 3Na2CO3 + 3H2O → 2Fe(OH)3↓ + 3CO2↑ + 6NaCl`). А вот с сульфидами (`S^{2−}`, `H2S`), сульфитами (`SO3^{2−}`, `SO2`) и иодидами (`I⁻`, `HI`) идёт **ОВР**, а НЕ гидролиз и НЕ обмен!", "t": "Ловушка ЕГЭ: Fe^{3+} с CO3^{2−} vs с S^{2−}, SO3^{2−}, I⁻"}, {"eq": ["2FeCl3 + 2KI → 2FeCl2 + I2 + 2KCl", "2FeCl3 + H2S → 2FeCl2 + S↓ + 2HCl", "2FeCl3 + Na2S(нед.) → 2FeCl2 + S↓ + 2NaCl", "2FeCl3 + 3Na2S(изб.) → 2FeS↓ + S↓ + 6NaCl", "2FeCl3 + Na2SO3 + H2O → 2FeCl2 + Na2SO4 + 2HCl"]}, {"h": "3. Хром (Cr): амфотерный Cr(+3) и цветовые качели Cr(+6)"}, {"p": "Хром — близкий родственник и алюминия, и железа. Как металл он пассивируется концентрированными `HNO3` и `H2SO4` на холоде, с `HCl`/`H2SO4(разб.)` без доступа воздуха даёт голубые соли `Cr(+2)` (`Cr + 2HCl → CrCl2 + H2↑`), а с хлором и кислородом — соединения `Cr(+3)` (`2Cr + 3Cl2 —t°→ 2CrCl3`, `4Cr + 3O2 —t°→ 2Cr2O3`)."}, {"p": "Соединения `Cr(+3)` (`Cr2O3` — тёмно-зелёный, `Cr(OH)3` — серо-зелёный) по поведению почти копируют алюминий: растворяются и в кислотах, и в избытке щёлочи с образованием комплекса `Na[Cr(OH)4]` (допустима также запись `Na3[Cr(OH)6]`), сплавляются с `NaOH`/`Na2CO3` до хромитов `NaCrO2`, вступают в совместный гидролиз с карбонатами, сульфидами и сульфитами (`2CrCl3 + 3Na2S + 6H2O → 2Cr(OH)3↓ + 3H2S↑ + 6NaCl`), и **не растворяются в водном аммиаке `NH3·H2O`**."}, {"p": "Главная фишка хрома, которой нет у алюминия, — высшая степень окисления `+6`: кислотный оксид `CrO3` (тёмно-красный), **хроматы `CrO4^{2−}`** (жёлтые, устойчивы в щелочной среде) и **дихроматы `Cr2O7^{2−}`** (оранжевые, устойчивы в кислой среде):"}, {"svg": "<svg viewBox='0 0 460 205' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='205' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='26' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Переходы хрома: Cr(+3) и качели pH для Cr(+6)<\/text><rect x='14' y='62' width='120' height='58' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)' stroke-width='1.6'/><text x='74' y='86' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='14' font-weight='700'>Cr(+3)<\/text><text x='74' y='106' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>Cr³⁺, [Cr(OH)₄]⁻<\/text><rect x='172' y='62' width='124' height='58' rx='8' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.8'/><text x='234' y='86' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='14' font-weight='700'>CrO₄²⁻ (жёлт.)<\/text><text x='234' y='106' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>щелочная среда<\/text><rect x='332' y='62' width='114' height='58' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='1.8'/><text x='389' y='86' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='14' font-weight='700'>Cr₂O₇²⁻ (оранж.)<\/text><text x='389' y='106' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>кислая среда<\/text><line x1='134' y1='80' x2='168' y2='80' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><polygon points='172,80 164,76 164,84' fill='var(--svg-gold,#e5a93c)'/><text x='153' y='52' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12'>H₂O₂ / Cl₂<\/text><text x='153' y='68' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+ OH⁻ (ОВР)<\/text><line x1='296' y1='78' x2='328' y2='78' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><polygon points='332,78 324,74 324,82' fill='var(--svg-bad,#ef6b6b)'/><text x='314' y='54' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='12'>+ H⁺<\/text><text x='314' y='69' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>не ОВР!<\/text><line x1='332' y1='106' x2='300' y2='106' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><polygon points='296,106 304,102 304,110' fill='var(--svg-gold,#e5a93c)'/><text x='314' y='132' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12'>+ OH⁻<\/text><text x='314' y='147' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>не ОВР!<\/text><path d='M 389 120 L 389 174 L 74 174 L 74 124' fill='none' stroke='var(--svg-acc,#14b8a6)' stroke-width='2'/><polygon points='74,120 70,128 78,128' fill='var(--svg-acc,#14b8a6)'/><text x='232' y='192' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='12'>+ восстановитель (KI, H₂S, Na₂SO₃, FeSO₄) + H⁺ → Cr³⁺ (ОВР)<\/text><\/svg>"}, {"eq": ["2K2CrO4 + H2SO4(разб.) → K2Cr2O7 + K2SO4 + H2O", "K2Cr2O7 + 2KOH → 2K2CrO4 + H2O", "2Na[Cr(OH)4] + 3H2O2 + 2NaOH → 2Na2CrO4 + 8H2O", "Cr2O3 + 3KNO3 + 2K2CO3 —сплавление→ 2K2CrO4 + 3KNO2 + 2CO2↑", "K2Cr2O7 + 14HCl(конц.) —t°→ 2CrCl3 + 3Cl2↑ + 2KCl + 7H2O", "K2Cr2O7 + 6KI + 7H2SO4(разб.) → Cr2(SO4)3 + 3I2↓ + 4K2SO4 + 7H2O", "(NH4)2Cr2O7 —t°→ N2↑ + Cr2O3 + 4H2O"]}, {"h": "4. Марганец (KMnO4, MnO2): главный окислитель ЕГЭ и влияние среды"}, {"p": "Перманганат калия `KMnO4` (тёмно-фиолетовые кристаллы, малиновый раствор) встречается почти в каждом варианте № 7, 8, 29 и 31. Продукт восстановления `Mn^{+7}` жёстко зависит от **среды раствора**: в кислой — бесцветный `Mn^{2+}`, в нейтральной — бурый осадок `MnO2↓`, в щелочной — зелёный манганат `K2MnO4` (`Mn^{+6}`):"}, {"eq": ["2KMnO4 —t°→ K2MnO4 + MnO2 + O2↑", "2KMnO4 + 16HCl(конц.) → 2KCl + 2MnCl2 + 5Cl2↑ + 8H2O", "MnO2 + 4HCl(конц.) —t°→ MnCl2 + Cl2↑ + 2H2O", "2KMnO4 + 3Na2SO3 + H2O → 2MnO2↓ + 3Na2SO4 + 2KOH", "2KMnO4 + Na2SO3 + 2KOH → 2K2MnO4 + Na2SO4 + H2O"]}, {"h": "5. Медь (Cu) и серебро (Ag): металлы после водорода"}, {"p": "Медь стоит в ряду напряжений **правее водорода**. Поэтому она **не реагирует** с водой, щелочами, соляной и разбавленной серной кислотами. Зато медь активно реагирует с кислотами-окислителями (`HNO3` и `H2SO4(конц.)` при нагревании), неметаллами (`O2`, `Cl2`, `S`) и солями более сильных окислителей (`AgNO3`, `FeCl3`):"}, {"eq": ["2Cu + O2 —t°→ 2CuO", "2Cu + S —t°→ Cu2S", "Cu + 2FeCl3 → CuCl2 + 2FeCl2", "Cu + 2AgNO3 → Cu(NO3)2 + 2Ag", "Cu + 4HNO3(конц.) → Cu(NO3)2 + 2NO2↑ + 2H2O", "Cu + 2H2SO4(конц.) —t°→ CuSO4 + SO2↑ + 2H2O"]}, {"p": "Обрати внимание на соединения меди(I) и меди(II), которые постоянно мелькают в № 6, 8 и 31:"}, {"list": ["**Два оксида:** `CuO` — чёрный, `Cu2O` — красный (осадок в органических пробах с `Cu(OH)2`!). С неокисляющими кислотами `Cu2O` диспропорционирует (например, `Cu2O + H2SO4(разб.) → CuSO4 + Cu↓ + H2O`), а с `HNO3` окисляется до `Cu(NO3)2`.", "**Гидроксид `Cu(OH)2`:** голубой осадок, при нагревании легко разлагается на чёрный `CuO` и воду (`Cu(OH)2 —t°→ CuO + H2O`). В избытке водного аммиака растворяется с образованием ярко-синего аммиаката: `Cu(OH)2 + 4NH3·H2O → [Cu(NH3)4](OH)2 + 4H2O`.", "**Сульфид `CuS`:** чёрный осадок с настолько ничтожной растворимостью, что он **не растворяется** в `HCl` и `H2SO4(разб.)`! Растворить `CuS` можно только кислотой-окислителем (`HNO3`): `CuS + 8HNO3(конц.) → CuSO4 + 8NO2↑ + 4H2O` (или с `HNO3(разб.)` до `S` и `NO`).", "**Реакция `Cu^{2+}` с иодидами — всегда ОВР!** В таблице растворимости на пересечении `Cu^{2+}` и `I⁻` стоит прочерк: иодида меди(II) не существует, идёт ОВР с выпадением белого `CuI` и выделением `I2`:"]}, {"eq": ["2CuSO4 + 4KI → 2CuI↓ + I2↓ + 2K2SO4", "2AgNO3 + 2NaOH → Ag2O↓ + 2NaNO3 + H2O"]}, {"hint": "Обрати внимание на второе уравнение: гидроксид серебра `AgOH` в воде неустойчив (в таблице растворимости ФИПИ стоит прочерк «–») и сразу распадается на бурый осадок `Ag2O↓` и воду!", "t": "Ловушка с AgNO3 + щёлочь"}, {"steps": ["**Разбор вслух: проверяем баланс в реакции окисления хромита пероксидом водорода**", "`2Na[Cr(OH)4] + 3H2O2 + 2NaOH → 2Na2CrO4 + 8H2O`", "**Шаг 1 (баланс электронов):** `Cr^{+3} − 3e⁻ → Cr^{+6}` (восстановитель, ×2); `2O^{−1} + 2e⁻ → 2O^{−2}` (окислитель `H2O2`, ×3). Итого перед `Na[Cr(OH)4]` и `Na2CrO4` ставим `2`, перед `H2O2` ставим `3`.", "**Шаг 2 (натрий):** справа `4 Na`, слева уже есть `2 Na` в комплексе, значит перед `NaOH` ставим `2`.", "**Шаг 3 (водород и проверка по кислороду):** слева `H`: `2·4 + 3·2 + 2·1 = 16`, значит справа `8H2O`. Проверяем `O`: слева `2·4 + 3·2 + 2 = 16`, справа `2·4 + 8 = 16`. Сошлось точно!"]}, {"bridge": {"kim": "№ 6, 7, 8, 9, 31 КИМ", "ask": "Переходные металлы — абсолютные рекордсмены по частоте в № 7, № 8 и № 31. Проверяют переходы `Fe ↔ Fe(II) ↔ Fe(III)`, `Cr(III) ↔ CrO4^{2−} ↔ Cr2O7^{2−}`, пассивацию, `Cu + FeCl3`, `Cu^{2+} + I⁻` и нерастворимость `CuS` в `HCl`.", "watch": "Ловят на: 1) `Fe + I2` (даёт `FeI2`, НЕ `FeI3`!); 2) `2Cu + S` (даёт `Cu2S`, НЕ `CuS`!); 3) `FeCl3 + Na2S` (даёт `FeCl2 + S`, НЕ `Fe(OH)3 + H2S`!); 4) попытке растворить `Fe(OH)3` в водном `NaOH` или `Cr(OH)3` в `NH3·H2O`.", "tip": "Увидев `Fe(III)` или `Cu(II)` рядом с `I⁻`, `S^{2−}`, `SO3^{2−}` — немедленно включай режим ОВР. Увидев переход «жёлтый ↔ оранжевый» без изменения степени окисления — это `CrO4^{2−} ↔ Cr2O7^{2−}`."}}], "short": [{"list": ["Железо с `HCl`, `H2SO4(разб.)`, `CuSO4`, `S`, `I2` даёт `Fe(+2)`; с `Cl2`, `Br2`, `HNO3` и `H2SO4(конц.)` при нагревании — `Fe(+3)`; с `O2` и `H2O(пар)` при нагревании — окалину `Fe3O4`.", "Концентрированные `HNO3` и `H2SO4` на холоде пассивируют `Fe`, `Cr` и `Al`; при нагревании идут бурные ОВР.", "`Fe^{3+}` с карбонатами даёт совместный гидролиз (`Fe(OH)3↓ + CO2↑`), а с сульфидами, сульфитами и иодидами — ОВР с восстановлением до `Fe^{2+}`.", "`Cr(OH)3` амфотерен (как `Al(OH)3`, растворяется в `NaOH`, но не в `NH3·H2O`) и окисляется в щёлочи до жёлтого хромата `CrO4^{2−}`; подкисление переводит хромат в оранжевый дихромат `Cr2O7^{2−}` (не ОВР).", "Медь стоит после водорода, не реагирует с `HCl`/`H2SO4(разб.)`, но реагирует с `HNO3`, `H2SO4(конц.)` при `t°`, `FeCl3` и `AgNO3`; пара `Cu^{2+} + I⁻` даёт ОВР (`CuI↓ + I2`)."]}]}, {"id": "05", "group": "Химия неметаллов", "nav": "Галогены (F, Cl, Br, I)", "codes": ["2.3"], "eyebrow": "05 · Код 2.3 · Элементы VIIA группы", "title": "Галогены (F2, Cl2, Br2, I2) и их соединения", "lead": "Почему хлор с холодной щёлочью даёт отбеливатель NaClO, а с горячей — бертолетову соль NaClO3, и почему из NaCl с концентрированной H2SO4 получается HCl, а из KI — фиолетовые пары иода и запах тухлых яиц?", "b": [{"key": "В ряду `F2 → Cl2 → Br2 → I2` окислительная способность простых веществ **падает**, а восстановительная способность их анионов `F⁻ → Cl⁻ → Br⁻ → I⁻` — **растёт**. Фтор настолько силён, что окисляет даже воду, а `Cl2`, `Br2` и `I2` в щелочах вступают в диспропорционирование.", "t": "Главная мысль."}, {"h": "1. Окислительная активность галогенов и особое поведение фтора"}, {"p": "В водных растворах каждый более активный галоген (начиная с хлора!) вытесняет менее активный из растворов его солей и кислот:"}, {"eq": ["Cl2 + 2NaBr → 2NaCl + Br2", "Cl2 + 2KI → 2KCl + I2↓", "Br2 + 2KI → 2KBr + I2↓"]}, {"warn": "Почему фтор `F2` НЕ вытесняет хлор из водного раствора `NaCl`? Потому что фтор — самый сильный окислитель среди простых веществ: он мгновенно и со взрывом окисляет саму **воду** с выделением кислорода! В этой реакции кислород повышает степень окисления с `−2` до `0`:", "t": "Ловушка ЕГЭ: фтор с водой и растворами солей"}, {"eq": "2F2 + 2H2O → 4HF + O2↑"}, {"p": "С металлами галогены реагируют активно, причём сила окислителя снова решает степень окисления железа: `Cl2` и `Br2` окисляют железо до `Fe(+3)` (`2Fe + 3Cl2 —t°→ 2FeCl3`), а более слабый `I2` — только до `Fe(+2)` (`Fe + I2 —t°→ FeI2`). С неметаллами галогены также реагируют (кроме прямых реакций хлора/брома/иода с `O2`, `N2` и `C` — запомни это для № 7!):"}, {"eq": ["H2 + Cl2 —hν→ 2HCl", "2P + 3Cl2(нед.) → 2PCl3", "2P + 5Cl2(изб.) → 2PCl5", "3Cl2 + 8NH3(изб.) → N2↑ + 6NH4Cl"]}, {"h": "2. Реакции Cl2, Br2, I2 с водой и щелочами (диспропорционирование)"}, {"p": "Хлор (и в меньшей степени бром) обратимо реагирует с водой с образованием двух кислот — соляной и хлорноватистой (`Cl⁰ → Cl^{−1} + Cl^{+1}`). На свету `HClO` разлагается на `HCl` и `O2`:"}, {"eq": "Cl2 + H2O ⇄ HCl + HClO"}, {"p": "В щелочной среде это **[[диспропорционирование]]** становится необратимым, а продукты жёстко зависят от температуры! На холоде хлор переходит в `−1` и `+1` (хлорид и гипохлорит), при нагревании — в `−1` и `+5` (хлорид и хлорат):"}, {"compare": {"t": "Хлор (и бром) со щёлочью: холод vs нагревание", "left": {"title": "На холоде (Cl⁰ → Cl^{−1} + Cl^{+1})", "items": ["`Cl2 + 2NaOH(хол.) → NaCl + NaClO + H2O` (жавелева вода)", "`2Cl2 + 2Ca(OH)2(хол.) → CaCl2 + Ca(ClO)2 + 2H2O` (хлорная известь)", "`Br2 + 2KOH(хол.) → KBr + KBrO + H2O`"]}, "right": {"title": "При нагревании (Cl⁰ → Cl^{−1} + Cl^{+5})", "items": ["`3Cl2 + 6KOH(гор.) —t°→ 5KCl + KClO3 + 3H2O` (бертолетова соль)", "`3Br2 + 6NaOH(гор.) —t°→ 5NaBr + NaBrO3 + 3H2O`", "`3I2 + 6KOH → 5KI + KIO3 + 3H2O` (иод даёт иодат уже при н.у.!)"]}}}, {"h": "3. Галогеноводороды, сила кислот и ловушка с концентрированной H2SO4"}, {"p": "Сила галогеноводородных кислот в воде растёт сверху вниз: `HF` — **слабая** кислота (прочная связь `H–F` + водородные связи), а `HCl`, `HBr`, `HI` — **сильные** кислоты. Главная уникальная реакция `HF` (плавиковой кислоты) — растворение оксида кремния(IV) (травление стекла):"}, {"eq": "SiO2 + 4HF → SiF4↑ + 2H2O"}, {"p": "А теперь одна из любимейших ловушек ЕГЭ № 7, 8 и 31: **действие концентрированной серной кислоты `H2SO4(конц.)` на твёрдые галогениды**. Чем ниже галоген в группе, тем сильнее восстановитель его анион (`Cl⁻ < Br⁻ < I⁻`):"}, {"table": [["Реагент (твёрдая соль)", "Уравнение с H2SO4(конц.)", "Тип реакции", "Почему продукт именно такой"], ["`NaCl(тв.)` (или `CaF2`)", "`NaCl(тв.) + H2SO4(конц.) —t°→ NaHSO4 + HCl↑`", "**Обмен (не ОВР!)**", "`Cl⁻` — слабый восстановитель; `H2SO4(конц.)` его не окисляет, а вытесняет летучий `HCl` (получение `HCl` в лаборатории)"], ["`KBr(тв.)`", "`2KBr(тв.) + 2H2SO4(конц.) → Br2 + SO2↑ + K2SO4 + 2H2O`", "**ОВР**", "`Br⁻` сильнее, он восстанавливает `S^{+6}` до `SO2` (`S^{+4}`) и сам окисляется до бурого `Br2`"], ["`KI(тв.)`", "`8KI(тв.) + 5H2SO4(конц.) → 4I2 + H2S↑ + 4K2SO4 + 4H2O`", "**Глубокая ОВР**", "`I⁻` — очень сильный восстановитель, доводит `S^{+6}` до самого низа — `H2S` (`S^{−2}`)"]]}, {"hint": "Именно из-за этой ОВР чистые `HBr` и `HI` нельзя получать действием `H2SO4(конц.)` на бромиды и иодиды! Вместо этого используют нелетучую неокисляющую `H3PO4` (или гидролиз `PBr3`/`PI3`: `PBr3 + 3H2O → H3PO3 + 3HBr↑`).", "t": "Как тогда получают HBr и HI?"}, {"h": "4. Кислородные соединения хлора: разложение хлората калия KClO3"}, {"p": "Хлорат калия `KClO3` (бертолетова соль) — сильный окислитель (`KClO3 + 6HCl(конц.) → KCl + 3Cl2↑ + 3H2O` — один из главных лабораторных способов получения хлора наряду с `KMnO4 + HCl(конц.)`, `MnO2 + HCl(конц.)` и `K2Cr2O7 + HCl(конц.)`, см. модуль 04). При нагревании `KClO3` разлагается по-разному в зависимости от присутствия катализатора `MnO2`:"}, {"eq": ["2KClO3 —t°, кат. MnO2→ 2KCl + 3O2↑", "4KClO3 —t° (без кат.)→ 3KClO4 + KCl"]}, {"steps": ["**Разбор вслух: проверяем баланс в реакции KI(тв.) + H2SO4(конц.)**", "`8KI(тв.) + 5H2SO4(конц.) → 4I2 + H2S↑ + 4K2SO4 + 4H2O`", "**Шаг 1 (электронный баланс):** `2I^{−1} − 2e⁻ → I2⁰` (×4); `S^{+6} + 8e⁻ → S^{−2}` (×1). Значит, в правой части `4I2` и `1H2S`, а слева `8KI`.", "**Шаг 2 (калий и сера):** из `8KI` справа получается `4K2SO4`. Всего атомов серы справа `1` (в `H2S`) + `4` (в `4K2SO4`) = `5`, значит слева `5H2SO4`.", "**Шаг 3 (водород и проверка по кислороду):** слева `5·2 = 10 H`; справа `2` уже в `H2S`, остаётся `8 H` → `4H2O`. Проверяем `O`: слева `5·4 = 20`, справа `4·4 + 4·1 = 20`. Точно!"]}, {"bridge": {"kim": "№ 6, 7, 8, 9, 31 КИМ", "ask": "В № 7 часто дают `Cl2`, `Br2`, `HCl`, `HI`, `NaBr`, `KI`; в № 8 — разницу между холодной и горячей щёлочью, а также `KClO3` с катализатором и без; в № 31 — вытеснение галогенов и окисление `KI`/`KBr`.", "watch": "Ловят на: 1) `Cl2`, `Br2`, `I2` НЕ реагируют напрямую с `O2`, `N2` и `C`! 2) `F2` не вытесняет `Cl2` из водного `NaCl` (реагирует с водой); 3) `NaCl(тв.) + H2SO4(конц.)` — обмен, а не ОВР; 4) с `AgNO3` только `AgF` растворим («Р»), а `AgCl` (белый), `AgBr` (бледно-жёлтый), `AgI` (жёлтый) — осадки.", "tip": "Увидев галоген + щёлочь — мгновенно ищи слово «холодный» (`ClO⁻`) или «горячий/нагревание» (`ClO3⁻`). Увидев `H2SO4(конц.)` + галогенид — смотри, какой это галоген: `Cl⁻` → обмен, `Br⁻` → `SO2`, `I⁻` → `H2S`."}}], "short": [{"list": ["Окислительная сила галогенов падает от `F2` к `I2`; `Cl2` вытесняет `Br2` и `I2`, `Br2` вытесняет `I2`, а `F2` в воде окисляет саму воду (`2F2 + 2H2O → 4HF + O2↑`).", "Хлор и бром не реагируют напрямую с `O2`, `N2` и `C`; с железом `Cl2` и `Br2` дают `FeX3`, а `I2` — только `FeI2`.", "В холодной щёлочи `Cl2` даёт `NaCl + NaClO + H2O`, в горячей — `NaCl + NaClO3 + H2O`.", "`HF` — слабая кислота, способная растворять `SiO2` (`SiO2 + 4HF → SiF4↑ + 2H2O`); `HCl`, `HBr`, `HI` — сильные кислоты.", "С `H2SO4(конц.)` твёрдый `NaCl` вступает в обмен (`HCl↑`), `KBr` даёт ОВР (`Br2 + SO2`), а `KI` — глубокую ОВР (`I2 + H2S`).", "`KClO3` при нагревании с `MnO2` разлагается на `KCl + O2`, а без катализатора диспропорционирует на `KClO4 + KCl`."]}]}, {"id": "06", "group": "Химия неметаллов", "nav": "Сера и H2SO4", "codes": ["2.3"], "eyebrow": "06 · Код 2.3 · Элементы VIA группы", "title": "Сера и её соединения: от сульфидов до концентрированной H2SO4", "lead": "Почему при сжигании серы в избытке кислорода никогда не получается SO3, и почему медь спокойно лежит в разбавленной серной кислоте, но бурно растворяется в горячей концентрированной?", "b": [{"key": "Поведение серы и её соединений легко читать по шкале степеней окисления: `S^{−2}` (`H2S`, сульфиды) — только восстановитель; `S⁰` и `S^{+4}` (`SO2`, сульфиты) — двойственные (и окислитель, и восстановитель); `S^{+6}` (`SO3`, `H2SO4(конц.)`) — только окислитель.", "t": "Главная мысль."}, {"svg": "<svg viewBox='0 0 460 155' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='155' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='25' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Шкала степеней окисления серы<\/text><line x1='30' y1='78' x2='430' y2='78' stroke='var(--svg-line,#2a3f57)' stroke-width='3'/><circle cx='60' cy='78' r='16' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><text x='60' y='83' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='13' font-weight='700'>−2<\/text><text x='60' y='52' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>H₂S, S²⁻<\/text><text x='60' y='112' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>только<\/text><text x='60' y='127' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>восст.<\/text><circle cx='172' cy='78' r='16' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='172' y='83' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='13' font-weight='700'>0<\/text><text x='172' y='52' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>S (тв.)<\/text><text x='172' y='112' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>окисл. и<\/text><text x='
