<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учебник ЕГЭ-100</title>
<style>
:root{
  --bg:#f6f7f9;--sidebar:#ffffff;--paper:#ffffff;--paper2:#f1f4f8;--line:#dde3ec;--text:#18202c;--dim:#546274;
  --a:#0f766e;--a-soft:#e6f4f1;--a-bd:#99d6cd;
  --b:#2563eb;--b-soft:#eff6ff;--gold:#b45309;--gold-soft:#fef7e6;--bad:#be123c;--bad-soft:#fff1f2;--good:#15803d;--good-soft:#eefbf3;
  --radius:16px;--shadow:0 4px 20px rgba(15,23,42,.06);
  --svg-bg:#f8fafc;--svg-surface:#ffffff;--svg-surface2:#eef3f9;--svg-ink:#18202c;--svg-dim:#546274;--svg-line:#cbd5e1;
  --svg-acc:#0f766e;--svg-gold:#b45309;--svg-bad:#dc2626;--svg-good:#15803d;--svg-blue:#2563eb;
}
:root[data-subject="biology"]{--a:#15803d;--a-soft:#ecfdf3;--a-bd:#9ce2b8;--svg-acc:#15803d}
:root[data-subject="russian"]{--a:#7c3aed;--a-soft:#f5f3ff;--a-bd:#c4b5fd;--svg-acc:#7c3aed}

@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0b121c;--sidebar:#0f1824;--paper:#131f2e;--paper2:#182739;--line:#263950;--text:#e6eef7;--dim:#96abc2;
    --a:#2dd4bf;--a-soft:#102f33;--a-bd:#1e5d61;
    --b:#60a5fa;--b-soft:#15253f;--gold:#f5c469;--gold-soft:#2b2316;--bad:#fb7185;--bad-soft:#2e181f;--good:#4ade80;--good-soft:#132b1e;
    --shadow:0 12px 36px rgba(2,6,16,.45);
    --svg-bg:#0d1723;--svg-surface:#162436;--svg-surface2:#1e3047;--svg-ink:#e6eef7;--svg-dim:#96abc2;--svg-line:#2c425c;
    --svg-acc:#2dd4bf;--svg-gold:#f5c469;--svg-bad:#fb7185;--svg-good:#4ade80;--svg-blue:#60a5fa;
  }
  :root[data-subject="biology"]:not([data-theme]){--a:#4ade80;--a-soft:#132d1f;--a-bd:#225c3c;--svg-acc:#4ade80}
  :root[data-subject="russian"]:not([data-theme]){--a:#a78bfa;--a-soft:#21193b;--a-bd:#4a3880;--svg-acc:#a78bfa}
}
:root[data-theme="dark"]{
  --bg:#0b121c;--sidebar:#0f1824;--paper:#131f2e;--paper2:#182739;--line:#263950;--text:#e6eef7;--dim:#96abc2;
  --a:#2dd4bf;--a-soft:#102f33;--a-bd:#1e5d61;
  --b:#60a5fa;--b-soft:#15253f;--gold:#f5c469;--gold-soft:#2b2316;--bad:#fb7185;--bad-soft:#2e181f;--good:#4ade80;--good-soft:#132b1e;
  --shadow:0 12px 36px rgba(2,6,16,.45);
  --svg-bg:#0d1723;--svg-surface:#162436;--svg-surface2:#1e3047;--svg-ink:#e6eef7;--svg-dim:#96abc2;--svg-line:#2c425c;
  --svg-acc:#2dd4bf;--svg-gold:#f5c469;--svg-bad:#fb7185;--svg-good:#4ade80;--svg-blue:#60a5fa;
}
:root[data-theme="dark"][data-subject="biology"]{--a:#4ade80;--a-soft:#132d1f;--a-bd:#225c3c;--svg-acc:#4ade80}
:root[data-theme="dark"][data-subject="russian"]{--a:#a78bfa;--a-soft:#21193b;--a-bd:#4a3880;--svg-acc:#a78bfa}
:root[data-theme="paper"]{
  --bg:#eae1cf;--sidebar:#f1e8d6;--paper:#f6efe1;--paper2:#ece2ce;--line:#d6c8b0;--text:#2a231b;--dim:#625648;
  --a:#0f6b63;--a-soft:#e0ebe4;--a-bd:#9cc2b7;
  --b:#24529a;--b-soft:#e3e9f0;--gold:#9c4a08;--gold-soft:#f3e5cb;--bad:#a82039;--bad-soft:#f3dfdf;--good:#1f6d3d;--good-soft:#e1ece2;
  --shadow:0 4px 18px rgba(58,42,22,.07);
  --svg-bg:#f1e8d7;--svg-surface:#f8f2e6;--svg-surface2:#e9dfc9;--svg-ink:#2a231b;--svg-dim:#625648;--svg-line:#cabaa0;
  --svg-acc:#0f6b63;--svg-gold:#9c4a08;--svg-bad:#a82039;--svg-good:#1f6d3d;--svg-blue:#24529a;
}
:root[data-theme="paper"][data-subject="biology"]{--a:#1f6d3d;--a-soft:#e1ece2;--a-bd:#9ec3a6;--svg-acc:#1f6d3d}
:root[data-theme="paper"][data-subject="russian"]{--a:#6b3fa0;--a-soft:#e9e1ee;--a-bd:#bda6d6;--svg-acc:#6b3fa0}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:32px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
a{color:var(--a)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.layout{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--sidebar);border-right:1px solid var(--line);padding:18px 14px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--line);font-weight:800}
.atom{display:grid;place-items:center;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);width:40px;height:40px;border-radius:12px;font-size:22px;flex:none}
.brand-meta{min-width:0;line-height:1.25}
.brand-meta small{display:block;font-weight:500;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-tools{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);color:var(--text);text-decoration:none;font-size:12.5px;font-weight:600;flex:1 1 auto}
.sbtn:hover{border-color:var(--a);color:var(--a)}
.sbtn.pri{background:var(--a-soft);border-color:var(--a-bd);color:var(--a)}
.navtag{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin:16px 10px 4px;font-weight:700}
.nav{display:block;padding:7px 10px;border-radius:9px;color:var(--dim);text-decoration:none;font-size:13.5px;line-height:1.38}
.nav:hover,.nav.active{color:var(--text);background:var(--a-soft)}
.nav.active{font-weight:700;color:var(--a)}

main{min-width:0;max-width:1060px;width:100%;margin:0 auto;padding:24px clamp(16px,3.6vw,52px) 110px}
.mobileNav{display:none}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,46px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-wm{position:absolute;right:18px;bottom:-22px;font-size:160px;line-height:1;opacity:.05;pointer-events:none;user-select:none}
h1{font-size:clamp(28px,4.2vw,46px);line-height:1.15;letter-spacing:-.03em;margin:.2em 0 .35em;max-width:860px}
h2{font-size:clamp(22px,2.8vw,31px);line-height:1.25;letter-spacing:-.02em;margin:0 0 12px}
h3{font-size:19.5px;line-height:1.32;margin:26px 0 10px}
h4{font-size:16px;margin:18px 0 8px}
p{margin:10px 0 14px}
.sub{color:var(--dim);font-size:clamp(15.5px,1.55vw,18px);max-width:780px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--a)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-block;background:var(--a-soft);color:var(--a);border:1px solid var(--a-bd);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.btn,.ghost{border:1px solid var(--a);border-radius:11px;padding:9px 15px;background:var(--a);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.06)}
.ghost{background:var(--paper2);color:var(--text);border-color:var(--line)}
.ghost:hover{border-color:var(--a);color:var(--a)}

.lesson{margin-top:44px;border-top:1px solid var(--line);padding-top:34px}
.sectionlead{font-size:17px;color:var(--dim);max-width:850px}
.small{font-size:13.5px;color:var(--dim)}
.muted{color:var(--dim)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px 20px;margin:16px 0;min-width:0;box-shadow:var(--shadow)}
.two>.panel,.three>.panel{margin:0}
.panel h3:first-child,.panel h4:first-child{margin-top:0}
.hint{background:var(--a-soft);border-left:4px solid var(--a)}
.warn{background:var(--bad-soft);border-left:4px solid var(--bad)}
.note{background:var(--b-soft);border-left:4px solid var(--b)}
.key{background:var(--gold-soft);border-left:4px solid var(--gold)}
.eq{font-family:Cambria,"Times New Roman",serif;font-size:clamp(18px,2vw,23px);line-height:1.6;background:var(--paper2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 16px;overflow-x:auto;white-space:nowrap;margin:13px 0}
.eq.sm{font-size:18px}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

.step{display:grid;grid-template-columns:34px 1fr;gap:12px;margin:14px 0}
.stepnum{display:grid;place-items:center;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);font-size:13.5px;font-weight:800;border-radius:10px;width:34px;height:34px;align-self:start}
.step p{margin:0 0 6px}
.list{padding-left:22px}.list li{margin:7px 0}

details{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:11px 0}
summary{padding:12px 16px;cursor:pointer;color:var(--a);font-weight:700}
details>div{padding:0 18px 15px}

.mapflow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:16px 0}
.flowbox{flex:1 1 150px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.flowbox strong{display:block;line-height:1.3}
.flowbox small{display:block;color:var(--dim);margin-top:3px}
.arrow{align-self:center;color:var(--a);font-size:18px;font-weight:700}

.tablewrap{width:100%;overflow:auto;border-radius:12px;border:1px solid var(--line);margin:14px 0;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:500px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--paper2);color:var(--text);font-weight:750}
tr:last-child td{border-bottom:0}

.svgwrap{padding:14px;border-radius:16px;background:var(--svg-bg);border:1px solid var(--line);margin:16px 0}
.svgwrap svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}

/* Новые блоки: bridge, compare, tree, essay */
.bridge{background:var(--paper);border:1px solid var(--a-bd);border-radius:var(--radius);padding:16px 20px;margin:18px 0;box-shadow:var(--shadow)}
.bridge-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bridge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.bridge-cell{background:var(--paper2);border-radius:11px;padding:11px 13px;font-size:14.5px}
.bridge-cell b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px}

.cmp-wrap{margin:16px 0}
.cmp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cmp-card h4{margin:0 0 8px;color:var(--a)}

.treebox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow)}
.tree-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tree-step{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.tree-q{font-weight:700;margin-bottom:8px}
.tree-ans{border-left:4px solid var(--good);background:var(--good-soft);border-radius:10px;padding:11px 14px;margin-top:8px}
.tree-static ul{margin:6px 0 6px 18px;padding:0}
.tree-static li{margin:4px 0}

.essaybox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.essay-text{background:var(--paper2);border-left:3px solid var(--a);padding:12px 15px;border-radius:10px;margin:10px 0;font-size:15px}

/* Русская разметка */
.ru-stress{color:var(--bad);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ru-ortho{background:var(--gold-soft);border:1px solid var(--gold);border-radius:5px;padding:0 3px;font-weight:700}
.ru-pos{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--a-soft);border:1px solid var(--a-bd);color:var(--a);font-size:12px;font-weight:800;vertical-align:baseline;margin:0 2px}
.ru-m{padding:0 2px;border-radius:3px}
.ru-p{border-top:2px solid var(--b);border-right:2px solid var(--b);padding-right:3px}
.ru-k{border-top:2px solid var(--a);border-radius:6px 6px 0 0;padding-top:1px}
.ru-s{background:linear-gradient(135deg,transparent 48%,var(--gold) 49%,var(--gold) 51%,transparent 52%) top/100% 6px no-repeat;padding-top:5px}
.ru-o{border:1.5px solid var(--dim);border-radius:4px;padding:0 3px}
.ru-syn{text-decoration:underline;text-underline-offset:4px}
.ru-podl{text-decoration-color:var(--b)}
.ru-skaz{text-decoration-style:double;text-decoration-color:var(--bad)}
.ru-opr{text-decoration-style:wavy;text-decoration-color:var(--a)}
.ru-obst{text-decoration-style:dotted;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.ru-vvod{background:var(--b-soft);border-radius:5px;padding:0 4px}

/* Рисунки и метки */
.figbox{margin:16px 0;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.figbox figcaption{margin-bottom:10px}
.figimg{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.figimg img{max-width:100%;max-height:70vh;width:auto;height:auto;display:block}
.pinwrap{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:25px;height:25px;padding:0 6px;border-radius:13px;background:#0f766e;color:#fff;border:2px solid #fff;font:700 12.5px/21px system-ui,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.figlegend{margin:10px 0 0;padding:0;list-style:none;columns:2 260px;font-size:14px}
.figlegend li{break-inside:avoid;margin:4px 0}
.figlegend b{display:inline-block;min-width:22px;color:var(--a)}
.figempty{padding:18px;border:2px dashed var(--line);border-radius:12px;color:var(--dim);text-align:center}

/* Словарь и поповер */
.glink{background:none;border:0;border-bottom:1.5px dashed var(--a);color:inherit;padding:0;font:inherit;cursor:pointer}
.glink:hover{color:var(--a)}
#gPopover{position:fixed;z-index:80;max-width:min(360px,92vw);background:var(--paper);border:1px solid var(--a-bd);border-radius:14px;padding:13px 15px;box-shadow:0 16px 40px rgba(0,0,0,.22);display:none}
#gPopover h4{margin:0 0 6px;color:var(--a);font-size:16px}
#gPopover p{margin:0 0 6px;font-size:14px}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.term{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.term strong{display:block;color:var(--a);font-size:16.5px}
.term p{margin:4px 0;font-size:14.5px}
.term small{color:var(--dim)}

.statbar{height:8px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.statbar span{height:100%;background:var(--a);display:block;width:0}
.banchor{display:block;height:0;scroll-margin-top:80px}
.bflash{outline:3px solid var(--gold);outline-offset:5px;border-radius:8px;transition:outline-color 1.4s}
.bflash.fade{outline-color:transparent}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.timeline .panel{margin:0;text-align:center}
.timeline strong{font-size:21px;color:var(--gold)}
footer{color:var(--dim);text-align:center;margin:56px 0 0;font-size:13px}

dialog#imgZoom{max-width:95vw;max-height:94vh;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--paper);color:var(--text)}
dialog#imgZoom::backdrop{background:rgba(0,0,0,.68)}
dialog#imgZoom img{max-width:90vw;max-height:82vh;display:block;background:#fff;border-radius:8px}

@media(max-width:1000px){
  .layout{display:block}
  .side{display:none}
  .mobileNav{display:flex;position:sticky;top:0;z-index:30;background:var(--sidebar);border-bottom:1px solid var(--line);padding:8px 12px;align-items:center;gap:8px}
  .mobileNav select{flex:1;min-width:0;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--paper2)}
  .mbtn{border:1px solid var(--line);background:var(--paper2);border-radius:9px;padding:6px 10px;text-decoration:none;font-size:13px;font-weight:700}
  main{padding-top:18px}
}
@media(max-width:670px){
  .two,.three,.gloss,.cmp-cards{grid-template-columns:1fr}
  .timeline{grid-template-columns:repeat(2,1fr)}
  .arrow{display:none}
  .flowbox{flex-basis:100%}
  .figlegend{columns:1}
  table{font-size:13px}
}
@media print{
  body{background:#fff;color:#111}
  .side,.mobileNav,.actions,#gPopover,.tree-interactive{display:none!important}
  .tree-static{display:block!important}
  main{max-width:none;padding:0}
  .panel,.bridge,.figbox,.essaybox,details,.eq{box-shadow:none;background:#fff;border-color:#999}
  details>div{display:block!important}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="application/json" id="topic-data">{"id": "ovr-i-elektroliz", "subject": "Химия", "subjectSlug": "chemistry", "short": "ОВР (№19, 29) + Электролиз (№20)", "version": "25.11.2026", "icon": "⚡", "title": "ОВР, электронный баланс (№19, 29) и электролиз (№20) ЕГЭ-2027 с нуля до 100 баллов", "sub": "Полный курс по кодам 1.12 и 1.13 ФИПИ: от степени окисления и роли реагентов в № 19 до электронного баланса, поведения окислителей в разных средах (№ 29) и электролиза расплавов и растворов (№ 20).", "chips": ["ЕГЭ-2027", "Коды 1.12, 1.13 · № 19, 20, 29 КИМ", "С нуля до 100"], "scope": ["1.12", "1.13"], "status": "Сверено с утверждённым комплектом ФИПИ ЕГЭ-2027 (коды 1.12 и 1.13; задания № 19, № 20, № 29; критерии оценивания 2/1/0 баллов и официальный ряд напряжений металлов), методическими рекомендациями ФИПИ-2026 и актуальными прототипами КИМ.", "mode": "from_scratch", "goals": [["01 · Степень окисления и типы ОВР", "Безошибочно вычислять СО в сложных неорганических и органических частицах, отличать запись СО от заряда иона и классифицировать любую ОВР."], ["02 · Все форматы задания № 19", "Различать свойства элемента и вещества, читать переходы СО и обходить ловушки с водой, пероксидом водорода, аммиаком и органикой."], ["03 · Электронный баланс и критерии № 29", "Составлять баланс с удвоением, двойным окислением и диспропорционированием, оформляя решение на 2/2 балла без штрафов комиссии."], ["04 · Среда (pH), перманганат и хром", "Управлять продуктами KMnO4 и K2Cr2O7 через pH (включая кислые соли KHSO4/NH4HSO4) и решать эталон Демоверсии ЕГЭ-2027."], ["05 · Кислоты-окислители, H2O2 и галогены", "Предсказывать продукты HNO3, H2SO4(конц.), нитритов, пероксида и галогенов в холодной и горячей щёлочи с учётом пассивации и ряда активности."], ["06 · Восстановители и навигатор № 29", "Узнавать ключевые восстановители, расшифровывать качественные признаки условия и за 5 шагов отделять ОВР № 29 от РИО № 30."], ["07 · Электролиз расплавов", "Понимать физику электролиза, полярность катода и анода и записывать электролиз расплавов солей, щелочей, гидридов и Al2O3 в криолите."], ["08 · Электролиз водных растворов", "Определять продукты на инертном катоде по трём зонам ряда напряжений ФИПИ и на аноде по типу аниона (включая F⁻ и синтез Кольбе)."], ["09 · Суммарные уравнения и тонкости на 100", "Собирать полные уравнения электролиза растворов, предсказывать изменение pH у электродов, последовательный электролиз и работу активного анода."], ["10 · Все форматы № 20 и промышленное получение", "Без ошибок решать все типы заданий № 20 КИМ: продукты на электродах и выбор способа получения металлов и неметаллов электролизом."]], "audit": {"title": "Методическая база и границы охвата", "intro": "Учебник создан с нуля под ЕГЭ-2027 по утверждённому комплекту ФИПИ (коды 1.12 и 1.13: задания № 19, № 20 и № 29 КИМ) и охватывает как теоретическую основу окислительно-восстановительных процессов, так и электрохимические процессы при электролизе.", "b": [{"more": "Охват кодов 1.12 и 1.13 и границы темы", "open": true, "b": [{"list": ["**Код 1.12 (№ 19 и № 29 КИМ):** расчёт степеней окисления (неорганика и органика), роли элементов и веществ, классификация ОВР, метод электронного баланса (включая удвоение, двойное окисление и диспропорционирование), влияние pH (в том числе кислые соли `KHSO4`/`NH4HSO4`), химия `KMnO4`, `K2Cr2O7`/`K2CrO4`, `HNO3`, `H2SO4(конц.)`, `H2O2`, галогенов, нитритов и главных восстановителей, качественные признаки и критерии оценивания 2/1/0 баллов.", "**Код 1.13 (№ 20 КИМ):** сущность электролиза, катод и анод, электролиз расплавов солей/щелочей/гидридов/`Al2O3` в криолите, электролиз водных растворов солей/кислот/щелочей на инертных электродах (3 зоны ряда напряжений ФИПИ, `NH4^{+}`, `F⁻`, синтез Кольбе для карбоксилатов), суммарные уравнения, приэлектродное pH, последовательный электролиз и активный анод, промышленные способы получения веществ.", "**Вынесено в соседние темы:** расчётные задачи с электролизом на выход, массовую долю и атомистику (код 5.6–5.7 → задача № 34), реакции ионного обмена без изменения СО (код 1.9 → № 30), жёсткое окисление сложных органических молекул в цепочках (коды 3.6–3.13 → № 32)."]}]}]}, "summary": [{"p": "ОВР и электролиз объединяет единый принцип: переход электронов от восстановителя к окислителю. В заданиях № 19 и № 29 этот переход идёт самопроизвольно — его направление задают степени окисления, активность реагентов и среда раствора (pH), а коэффициенты даёт электронный баланс. В задании № 20 электроны принудительно перекачивает внешний источник постоянного тока: на катоде (–) всегда идёт восстановление, на аноде (+) — окисление, а в водном растворе с ионами соли конкурирует вода."}], "limits": "Учебник полностью раскрывает элементы содержания 1.12 (№ 19, № 29 КИМ) и 1.13 (№ 20 КИМ) кодификатора ФИПИ ЕГЭ-2027. Количественные расчёты электролиза (№ 34), реакции ионного обмена (№ 30) и многостадийные органические окисления (№ 32) рассматриваются в соответствующих темах маршрута.", "modules": [{"id": "01", "group": "Основы ОВР (№ 19)", "nav": "СО и типы ОВР", "codes": ["1.12"], "eyebrow": "01 · Код 1.12 · База для № 19 и № 29", "title": "Степень окисления, окислитель и восстановитель", "lead": "Почему реакция хлора с натрием и ржавление железа — это один и тот же процесс, а растворение мела в соляной кислоте — совершенно другой? Всё решает одно событие: перебежал ли хотя бы один электрон от одного атома к другому.", "b": [{"key": "Окислительно-восстановительная реакция (ОВР) — это реакция, в которой меняется [[Степень окисления|степень окисления]] хотя бы одного элемента. Атом, который принимает электроны и понижает СО, — [[Окислитель|окислитель]]; атом, который отдаёт электроны и повышает СО, — [[Восстановитель|восстановитель]].", "t": "Главная мысль."}, {"more": "Что нужно знать заранее", "open": true, "b": [{"list": ["**Электрон (`e⁻`) заряжен отрицательно (−1).** Поэтому при **отдаче** электрона заряд атома становится более положительным (СО растёт), а при **приёме** электрона — более отрицательным (СО падает).", "**Электроотрицательность (ЭО)** — способность атома притягивать к себе общие электроны связи. Самый электроотрицательный элемент — фтор (`F`), за ним идёт кислород (`O`).", "**Сумма степеней окисления** всех атомов в нейтральной молекуле равна `0`, а в сложном ионе — равна заряду этого иона (например, в `SO4^{2−}` сумма СО равна `−2`)."]}]}, {"h": "1. Как безошибочно считать степень окисления"}, {"p": "Представь, что все химические связи в молекуле мысленно разорвали так, что общие электроны полностью достались более электроотрицательному атому. Полученный условный заряд и есть [[Степень окисления|степень окисления]] (СО). В большинстве соединений достаточно опереться на опорные элементы, а в сложных случаях — учесть строение молекулы."}, {"table": [["Элемент / группа", "Обычная СО", "Исключения, на которых ловят в ЕГЭ", "Почему возникает исключение"], ["Металлы IA, IIA, Al", "`+1`, `+2`, `+3`", "Нет (в соединениях всегда постоянна)", "Низкая ЭО: отдают все валентные электроны"], ["Фтор (`F`)", "`−1`", "Нет (в простом веществе `F2` равна `0`)", "Самый высокий показатель ЭО в ПСХЭ"], ["Кислород (`O`)", "`−2`", "`OF2` (`+2`), `O2F2` (`+1`), пероксиды `H2O2`/`Na2O2`/`BaO2` (`−1`), надпероксид `KO2` (`−1/2`)", "Фтор сильнее притягивает `e⁻`, а в пероксидах есть связь `O–O`, где электроны делятся поровну"], ["Водород (`H`)", "`+1`", "Гидриды металлов (`NaH`, `CaH2`, `AlH3`, `LiAlH4`): `H^{−1}`", "ЭО водорода выше, чем у металлов, поэтому `H` забирает `e⁻` у металла"], ["Простые вещества", "`0`", "`O2`, `O3`, `S8`, `P4`, `Fe`, `Cl2` — всегда `0`", "Связь между одинаковыми атомами неполярна"]]}, {"h": "2. Разбор сложных частиц: пирит, нитрат аммония и органика"}, {"steps": ["**Пероксид водорода (`H2O2`):** водород с неметаллом имеет СО `+1`. Два атома `H` дают `+2`, значит на два атома `O` приходится `−2`, то есть на один атом кислорода `O^{−1}` (из-за связи `H–O–O–H`).", "**Гидрид кальция (`CaH2`):** кальций — металл IIA группы, его СО всегда `+2`. Чтобы сумма была `0`, каждый водород имеет СО `H^{−1}`.", "**Пирит (`FeS2`):** это не сульфид железа(IV)! В кристалле пирита содержится дисульфид-ион `S2^{2−}` со связью `S–S`, поэтому у железа `Fe^{+2}`, а у каждого атома серы `S^{−1}`.", "**Нитрат аммония (`NH4NO3`):** два атома азота входят в разные частицы: в катионе `NH4^{+}` (единицу в заряде однозарядного иона не пишут!) степень окисления азота равна `−3`, а в анионе `NO3^{−}` степень окисления азота равна `+5`.", "**Органические молекулы (`CH3COOH`):** считаем СО для каждого атома углерода отдельно, разрывая мысленно связи `C–H` в пользу углерода (`−1` на каждый `H`), `C–O` в пользу кислорода (`+1` на каждую связь с `O`), а связь `C–C` даёт `0`. В уксусной кислоте: в группе `−CH3` у углерода `C^{−3}`, в группе `−COOH` у углерода `C^{+3}`."]}, {"warn": "В заданиях части 2 (№ 29 и № 30) эксперты ФИПИ строго различают две записи:\n- **Степень окисления** — сначала **знак**, потом цифра: `Mn^{+7}`, `Fe^{+3}`, `S^{−2}`, а в пероксидах `−1`.\n- **Заряд иона** — сначала **цифра**, потом знак: `Mn^{2+}`, `Fe^{3+}`, `SO4^{2−}`, `Cr2O7^{2−}`.\n- **Электрон** обозначается как `e⁻` (или `e^{−}`).\nЗа путаницу этих форматов в электронном балансе или ионном уравнении снимают балл.", "t": "Критичный стандарт записи ФИПИ ЕГЭ-2027"}, {"h": "3. Окислитель, восстановитель и шкала степеней окисления"}, {"p": "В любой ОВР работают две стороны. [[Окислитель]] забирает чужие электроны (он «грабитель»): от притока отрицательных электронов его собственная степень окисления **понижается**, то есть сам он **восстанавливается**. [[Восстановитель]] отдаёт свои электроны (он «донор»): теряя отрицательный заряд, его степень окисления **повышается**, то есть сам он **окисляется**."}, {"svg": "<svg viewBox='0 0 460 195' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='195' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>Шкала степеней окисления (на примере серы)<\/text><line x1='30' y1='102' x2='430' y2='102' stroke='var(--svg-line,#2a3f57)' stroke-width='3'/><circle cx='65' cy='102' r='17' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><text x='65' y='107' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='13' font-weight='700'>−2<\/text><text x='65' y='136' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>H₂S, S²⁻<\/text><text x='65' y='152' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='12'>мин. СО<\/text><circle cx='175' cy='102' r='17' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='175' y='107' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='13' font-weight='700'>0<\/text><text x='175' y='136' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>S<\/text><circle cx='285' cy='102' r='17' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><text x='285' y='107' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='13' font-weight='700'>+4<\/text><text x='285' y='136' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>SO₂, SO₃²⁻<\/text><text x='230' y='154' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12'>промежуточные СО (двойственные)<\/text><circle cx='395' cy='102' r='17' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><text x='395' y='107' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='13' font-weight='700'>+6<\/text><text x='395' y='136' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>H₂SO₄, SO₄²⁻<\/text><text x='395' y='152' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='12'>макс. СО<\/text><path d='M 85 78 Q 230 34 375 78' fill='none' stroke='var(--svg-good,#34c77b)' stroke-width='2.2'/><polygon points='378,79 367,71 364,81' fill='var(--svg-good,#34c77b)'/><text x='230' y='50' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='12' font-weight='700'>отдаёт e⁻ → СО растёт (восстановитель, окисление)<\/text><path d='M 375 166 Q 230 192 85 166' fill='none' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2.2'/><polygon points='82,165 93,163 91,173' fill='var(--svg-bad,#ef6b6b)'/><text x='230' y='184' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='12' font-weight='700'>принимает e⁻ → СО падает (окислитель, восстановление)<\/text><\/svg>", "cap": "Положение атома на шкале СО сразу показывает, куда он может двигаться: с края — только в одну сторону, из середины — в обе."}, {"p": "Из этой шкалы вытекает прогноз свойств **элемента** по его положению в ПСХЭ:"}, {"list": ["**Максимальная СО** (обычно равна номеру группы, кроме `F`, `O`, `Fe` и др.) — атому больше нечего отдавать, значит этот элемент может быть **только окислителем** (`Mn^{+7}` в `KMnO4`, `Cr^{+6}` в `K2Cr2O7`, `S^{+6}` в `H2SO4`, `N^{+5}` в `HNO3`, `Fe^{+3}` в типичных ОВР ЕГЭ — о редком окислении до феррата `Fe^{+6}` смотри модуль 06).", "**Минимальная СО** (для металлов `0`, для неметаллов `N_{группы} − 8`) — атому некуда принимать электроны, значит элемент может быть **только восстановителем** (`Na^{0}`, `Fe^{0}`, `I^{−1}` в `KI`, `S^{−2}` в `H2S`, `N^{−3}` в `NH3`).", "**Промежуточная СО** — атом может и отдавать, и принимать электроны, поэтому проявляет **двойственные свойства** (и окислитель, и восстановитель): `S^{0}`, `S^{+4}` (`SO2`, `Na2SO3`), `N^{+3}` (`KNO2`), `O^{−1}` (`H2O2`), `Fe^{+2}` (`FeSO4`), `Cl2^{0}`."]}, {"h": "4. Четыре типа ОВР по расположению атомов"}, {"table": [["Тип ОВР", "Что происходит", "Пример уравнения", "Кто окислитель и восстановитель"], ["Межмолекулярная", "Окислитель и восстановитель — разные вещества", "`Zn + 2HCl → ZnCl2 + H2↑`", "`HCl` (`H^{+1}`) — окислитель; `Zn^{0}` — восстановитель"], ["Внутримолекулярная", "Разные элементы одного вещества меняют СО (часто разложение)", "`2KClO3 —t°, MnO2→ 2KCl + 3O2↑`", "`Cl^{+5}` — окислитель; `O^{−2}` — восстановитель (оба в `KClO3`)"], ["[[Диспропорционирование]]", "Один элемент в одном веществе одновременно повышает и понижает СО", "`Cl2 + 2KOH(хол.) → KCl + KClO + H2O`", "`Cl2^{0}` одновременно и окислитель (`→ Cl^{−1}`), и восстановитель (`→ Cl^{+1}`)"], ["[[Сопропорционирование]]", "Один элемент из двух разных СО сходится в одну промежуточную", "`2H2S + SO2 → 3S↓ + 2H2O`", "`SO2` (`S^{+4}`) — окислитель; `H2S` (`S^{−2}`) — восстановитель"]]}, {"bridge": {"kim": "№ 19 и № 29 КИМ", "ask": "Определить роль элемента/вещества, переход СО или выбрать пару реагентов для ОВР.", "watch": "Не называй окислителем или восстановителем продукт реакции — только вещество (или элемент в веществе) из **левой** части уравнения!", "tip": "Сначала расставь СО у всех атомов слева и справа, подчеркни изменившиеся и только потом читай вопрос задания."}}], "short": [{"list": ["ОВР — реакция с изменением степени окисления хотя бы одного элемента.", "Запись степени окисления — знак впереди (`Fe^{+3}`, `Mn^{+7}`), запись заряда иона — цифра впереди (`Fe^{3+}`, `Mn^{2+}`), электрон — строго `e⁻`.", "Окислитель принимает `e⁻` (СО падает, процесс — восстановление); восстановитель отдаёт `e⁻` (СО растёт, процесс — окисление).", "В пероксидах `O^{−1}`, в гидридах металлов `H^{−1}`, в пирите `FeS2` — `Fe^{+2}` и `S^{−1}`, в `NH4NO3` — `N^{−3}` и `N^{+5}`.", "Крайняя высшая СО элемента → только окислитель; крайняя низшая → только восстановитель; промежуточная → двойственные свойства.", "Различай 4 типа ОВР: межмолекулярные, внутримолекулярные, диспропорционирование и сопропорционирование."]}]}, {"id": "02", "group": "Основы ОВР (№ 19)", "nav": "Форматы № 19 КИМ", "codes": ["1.12"], "eyebrow": "02 · Код 1.12 · Задание № 19 (1 балл)", "title": "Все форматы и ловушки задания № 19 КИМ", "lead": "Задание № 19 считается одним из самых «лёгких» в первой части, но каждый год на нём теряют балл из-за одного слова в условии: спросили про элемент или про всё вещество? Про окислитель или про процесс окисления?", "b": [{"key": "В задании № 19 проверяют 4 формулировки: роль элемента (или вещества), формулу окислителя/восстановителя, переход СО и число отданных/принятых электронов. Главная защита от ошибки — точно различать **конкретный элемент** и **вещество целиком**.", "t": "Главная мысль."}, {"h": "1. Четыре реальные формулировки задания № 19"}, {"table": [["Формулировка в КИМ № 19", "Что именно ищем", "На чём чаще всего ловят"], ["«Установите соответствие между уравнением и свойством, которое проявляет элемент X»", "1) только окислитель; 2) только восстановитель; 3) и окислитель, и восстановитель; 4) не проявляет ОВ-свойств", "Свойство **элемента** смотрят по конкретной реакции, а не вообще! Например, в `Cu + 4HNO3(конц.) → Cu(NO3)2 + 2NO2↑ + 2H2O` азот — только окислитель (часть не меняет СО, но роль в ОВР — окислитель)."], ["«Установите соответствие между схемой реакции и формулой вещества-восстановителя (или окислителя)»", "Полная формула **исходного реагента**, в котором есть атом-донор (или акцептор) `e⁻`", "Выбор продукта справа или выбор кислоты-среды (`H2SO4(разб.)`), которая СО не меняет."], ["«Установите соответствие между схемой реакции и изменением СО окислителя (или восстановителя)»", "Переход вида `+5 → +2` или `−1 → 0`", "В диспропорционировании (`Cl2 + KOH`) легко перепутать ветвь окислителя (`0 → −1`) с ветвью восстановителя (`0 → +1`)."], ["«Выберите реакции, в которых вещество Y проявляет только окислительные / двойственные свойства»", "Номера реакций, подходящих под роль всего вещества", "Смешение не-ОВР (обмен, разложение карбонатов) с ОВР; ловушки с водой, аммиаком и пероксидом водорода."], ["«Определите число электронов, принятых/отданных в реакции»", "Число `e⁻` на **1 атом** элемента или на **1 моль вещества** (читай точную формулировку!)", "Один атом `Cr^{+6}` принимает `3e⁻`, а 1 моль `K2Cr2O7` содержит два атома хрома и принимает `6e⁻`."]]}, {"h": "2. Элемент vs вещество: 4 главных «хамелеона» № 19"}, {"p": "Когда вопрос звучит про **атом элемента** (например, «какие свойства может проявлять азот в `NH3`»), мы смотрим только на СО этого атома (`N^{−3}` — минимум, только восстановитель). Когда вопрос звучит про **вещество целиком** (например, `NH3`, `H2O`, `H2O2`, `FeS2`), нужно проверить **каждый** элемент в формуле!"}, {"table": [["Вещество", "Как окислитель", "Как восстановитель", "Не-ОВР / среда / диспропорционирование"], ["**Вода (`H2O`)**", "За счёт `H^{+1}` с активными металлами, `Fe`/`C` при `t°`: `2Na + 2H2O → 2NaOH + H2↑`", "За счёт `O^{−2}` со фтором: `2F2 + 2H2O → 4HF + O2↑`", "В `KMnO4 + Na2SO3 + H2O` — просто среда (СО `H` и `O` не меняются)"], ["**Пероксид (`H2O2`)**", "`O^{−1} → O^{−2}` с `KI`, `FeSO4`, `Na2SO3`: `2KI + H2O2 + H2SO4(разб.) → I2↓ + K2SO4 + 2H2O`", "`O^{−1} → O2^{0}` с `KMnO4`, `K2Cr2O7`, `Cl2`: `2KMnO4 + 5H2O2 + 3H2SO4(разб.) → 2MnSO4 + 5O2↑ + K2SO4 + 8H2O`", "Диспропорционирование: `2H2O2 —MnO2→ 2H2O + O2↑` (`O^{−1}` и окислитель, и восстановитель)"], ["**Аммиак (`NH3`)**", "Редко: за счёт `H^{+1}` с щелочными металлами (`2Na + 2NH3 —t°→ 2NaNH2 + H2↑`)", "Почти всегда за счёт `N^{−3}`: `4NH3 + 3O2 → 2N2 + 6H2O`; `2NH3 + 3CuO —t°→ 3Cu + N2↑ + 3H2O`", "С кислотами (`NH3 + HCl → NH4Cl`) — не-ОВР (присоединение без смены СО)"], ["**Хлороводород (`HCl`)**", "За счёт `H^{+1}` с металлами до `H2`: `Fe + 2HCl → FeCl2 + H2↑`", "За счёт `Cl^{−1}` с `KMnO4`, `MnO2`, `K2Cr2O7`: `MnO2 + 4HCl(конц.) —t°→ MnCl2 + Cl2↑ + 2H2O`", "С основаниями/карбонатами (`NaOH + HCl`) — не-ОВР"]]}, {"h": "3. Органические реакции и не-ОВР двойники в № 19"}, {"p": "В последние годы ФИПИ активно добавляет в № 19 простые органические реакции. Правило там то же самое: считай СО конкретных атомов углерода (не среднюю по молекуле, а у тех атомов, чьи связи изменились):"}, {"list": ["**Окисление альдегидов и муравьиной кислоты (`HCOOH`):** `CH3CHO + 2[Ag(NH3)2]OH —t°→ CH3COONH4 + 2Ag↓ + 3NH3↑ + H2O` — карбонильный углерод повышает СО с `+1` до `+3` (восстановитель), серебро `Ag^{+1} → Ag^{0}` (окислитель). Муравьиная кислота `HCOOH` имеет альдегидную группу и окисляется до `CO2` (`C^{+2} → C^{+4}`).", "**Гидрирование алкенов/алкинов/альдегидов:** `CH2=CH2 + H2 —t°, Ni→ CH3–CH3` — углерод понижает СО с `−2` до `−3` (органическое вещество здесь **окислитель**, а `H2` — **восстановитель**!).", "**Реакции НЕ-ОВР (часто прячут в вариантах № 19):** реакции ионного обмена (`BaCl2 + Na2SO4`), гидролиз солей и сложных эфиров, дегидратация спиртов, гидратация алкенов (`C2H4 + H2O`), термическое разложение `CaCO3` или `Cu(OH)2`, а также переходы `2K2CrO4 + H2SO4 → K2Cr2O7 + K2SO4 + H2O` (у хрома и слева, и справа `+6`!)."]}, {"warn": "В реакции `FeS2 + O2` (обжиг пирита) **два** элемента в одном веществе отдают электроны: `Fe^{+2} → Fe^{+3}` и `S^{−1} → S^{+4}`. Значит, и железо, и сера — восстановители, а кислород `O2^{0} → O^{−2}` — единственный окислитель. Не перепутай это с диспропорционированием: здесь окисляются два разных элемента, а восстанавливается третий.", "t": "Ловушка № 19: двойное окисление — не диспропорционирование"}, {"h": "4. Пошаговый разбор прототипа задания № 19"}, {"steps": ["**Условие прототипа:** установите соответствие между уравнением реакции и свойством, которое проявляет **азот** в этой реакции:\nА) `NH4NO3 —t°→ N2O↑ + 2H2O`\nБ) `2NO2 + 2NaOH → NaNO2 + NaNO3 + H2O`\nВ) `NH4Cl + NaOH —t°→ NaCl + NH3↑ + H2O`\nВарианты: 1) только окислитель; 2) только восстановитель; 3) и окислитель, и восстановитель; 4) не проявляет ОВ-свойств.", "**Анализируем А (`NH4NO3 → N2O + 2H2O`):** в `NH4^{+}` азот `N^{−3}`, в `NO3^{−}` азот `N^{+5}`, в продукте `N2O` азот `N^{+1}`. Один атом азота повысил СО (`−3 → +1`), другой понизил (`+5 → +1`). Значит, элемент азот — **и окислитель, и восстановитель (3)** (внутримолекулярное сопропорционирование).", "**Анализируем Б (`2NO2 + 2NaOH → NaNO2 + NaNO3 + H2O`):** в `NO2` азот `N^{+4}`, в `NaNO2` — `N^{+3}` (понизил), в `NaNO3` — `N^{+5}` (повысил). Это классическое диспропорционирование: азот — **и окислитель, и восстановитель (3)**.", "**Анализируем В (`NH4Cl + NaOH → NaCl + NH3 + H2O`):** в `NH4Cl` азот `N^{−3}`, в `NH3` азот по-прежнему `N^{−3}`. Ни один элемент СО не изменил — это реакция ионного обмена: азот **не проявляет ОВ-свойств (4)**.", "**Ответ и проверка:** `334`. Цифры в заданиях на соответствие № 19 **могут повторяться** — не бойся двух троек подряд!"]}, {"bridge": {"kim": "№ 19 КИМ (базовый, 1 балл)", "ask": "Установите соответствие между уравнением реакции и свойством элемента / формулой восстановителя / изменением СО.", "watch": "Если в условии спрашивают про **восстановитель**, а ты нашёл процесс **восстановления** — это противоположные вещи! Восстановитель *окисляется* (СО растёт), окислитель *восстанавливается* (СО падает).", "tip": "Для каждой строки выписывай мини-схему `Э^{было} → Э^{стало}` со стрелкой вверх `↑` (восстановитель) или вниз `↓` (окислитель)."}}], "short": [{"list": ["Различай вопрос про **элемент** (смотрим его СО в данной реакции) и про **вещество целиком** (проверяем все элементы в формуле).", "Вода (`H2O`), `HCl` и `NH3` могут быть окислителями за счёт `H^{+1}` и восстановителями за счёт `O^{−2}`, `Cl^{−1}`, `N^{−3}`.", "`H2O2` (`O^{−1}`), `SO2`/`SO3^{2−}` (`S^{+4}`), `NO2` (`N^{+4}`), `KNO2` (`N^{+3}`) проявляют двойственные свойства.", "В органике гидрирование (`+ H2`) восстанавливает углерод (органика — окислитель), а окисление альдегидов и `HCOOH` повышает СО углерода (органика — восстановитель).", "Переход `CrO4^{2−} ⇄ Cr2O7^{2−}`, гидролиз, обмен и разложение карбонатов — это не-ОВР.", "В задании № 19 цифры в ответе могут повторяться."]}]}, {"id": "03", "group": "Электронный баланс и среда (№ 29)", "nav": "Электронный баланс", "codes": ["1.12"], "eyebrow": "03 · Код 1.12 · Задание № 29 (2 балла)", "title": "Метод электронного баланса и критерии 2/2 в № 29", "lead": "Как уравнять реакцию с семью веществами без перебора и не потерять балл в № 29 на оформлении, когда само уравнение уже написано верно?", "b": [{"key": "Главный закон электронного баланса: **сколько электронов отдал восстановитель, ровно столько же принял окислитель**. Наименьшее общее кратное (НОК) этих чисел сразу даёт коэффициенты перед продуктами и реагентами ОВР.", "t": "Главная мысль."}, {"h": "1. Как работает электронный баланс (алгоритм из 5 шагов)"}, {"svg": "<svg viewBox='0 0 460 175' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='175' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>Электронный баланс: KMnO₄ + HCl(конц.)<\/text><rect x='18' y='44' width='185' height='68' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='1.8'/><text x='110' y='66' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='13' font-weight='700'>Окислитель (KMnO₄)<\/text><text x='110' y='88' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13'>Mn⁺⁷ + 5e⁻ → Mn⁺²<\/text><text x='110' y='105' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>множитель ×2<\/text><rect x='257' y='44' width='185' height='68' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)' stroke-width='1.8'/><text x='350' y='66' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='13' font-weight='700'>Восстановитель (HCl)<\/text><text x='350' y='88' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13'>2Cl⁻¹ − 2e⁻ → Cl₂⁰<\/text><text x='350' y='105' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>множитель ×5<\/text><line x1='254' y1='78' x2='208' y2='78' stroke='var(--svg-gold,#e5a93c)' stroke-width='2.5'/><polygon points='204,78 214,73 214,83' fill='var(--svg-gold,#e5a93c)'/><text x='230' y='68' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12' font-weight='700'>10 e⁻<\/text><rect x='40' y='126' width='380' height='36' rx='8' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)' stroke-width='1.5'/><text x='230' y='149' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13' font-weight='700'>2KMnO₄ + 16HCl(конц.) → 2KCl + 2MnCl₂ + 5Cl₂↑ + 8H₂O<\/text><\/svg>", "cap": "НОК(5, 2) = 10 электронов: перед Mn ставим 2, перед молекулой Cl2 ставим 5, а затем добираем оставшиеся молекулы HCl как среду."}, {"steps": ["**Шаг 1. Расставь СО** и выпиши только те элементы, у которых СО изменилась. В реакции `KMnO4` с `HCl(конц.)` (продукты: `KCl`, `MnCl2`, `Cl2↑`, `H2O`) меняются степени окисления `Mn^{+7} → Mn^{+2}` и `Cl^{−1} → Cl2^{0}`.", "**Шаг 2. Учти индексы двухатомных молекул (правило удвоения).** В продукте `Cl2` два атома хлора. Если записать `2Cl^{−1} − 2e⁻ → Cl2^{0}`, множитель сразу встанет перед `Cl2`, и не придётся возиться с дробями.", "**Шаг 3. Найди НОК и дополнительные множители.** `Mn^{+7} + 5e⁻ → Mn^{+2}` (множитель `2`), `2Cl^{−1} − 2e⁻ → Cl2^{0}` (множитель `5`). Отдано `10e⁻`, принято `10e⁻`.", "**Шаг 4. Перенеси коэффициенты и уравняй среду.** Ставим `2` перед `KMnO4`, `2` перед `MnCl2`, `5` перед `Cl2`. Далее уравниваем металлы (`2KCl`), затем хлор-среду: справа `2 + 4 + 10 = 16` атомов хлора → ставим `16` перед `HCl(конц.)`. Значит, воды `8H2O`.", "**Шаг 5. Обязательная проверка по кислороду.** Слева в `2KMnO4`: `2·4 = 8` атомов `O`. Справа в `8H2O`: `8·1 = 8` атомов `O`. Баланс сошёлся на 100%!"]}, {"eq": "2KMnO4 + 16HCl(конц.) → 2KCl + 2MnCl2 + 5Cl2↑ + 8H2O"}, {"h": "2. Сложные случаи баланса: двойное окисление и диспропорционирование"}, {"p": "В сложных ОВР (обжиг `FeS2`, окисление `Cu2S`, `CrI3`, `As2S3`) электроны отдают **сразу два элемента в одной формульной единице**. Чтобы не ошибиться, их складывают в одну общую полуреакцию, сохраняя стехиометрию исходной формулы."}, {"steps": ["**Пример 1 — двойное окисление (обжиг пирита):** при прокаливании `FeS2` в кислороде `O2` образуются оксид железа(III) `Fe2O3` и сернистый газ `SO2↑`.", "**Складываем отдачи в одной формуле `FeS2`:** `Fe^{+2} − 1e⁻ → Fe^{+3}` и `2S^{−1} − 10e⁻ → 2S^{+4}`. Итого одна формульная единица `FeS2` отдаёт `1 + 10 = 11e⁻`.", "**Записываем окислитель с удвоением:** `O2^{0} + 4e⁻ → 2O^{−2}` (принимает `4e⁻`).", "**Находим множители:** НОК(11, 4) = 44 → перед `FeS2` ставим `4`, перед `O2` ставим `11`. Отсюда `2Fe2O3` и `8SO2`.", "**Проверка по кислороду:** слева `11·2 = 22` атома `O`; справа `2·3 + 8·2 = 6 + 16 = 22` атома `O`. Уравнение сошлось!"]}, {"eq": "4FeS2 + 11O2 —t°→ 2Fe2O3 + 8SO2↑"}, {"p": "При **диспропорционировании** (например, хлор в горячей щёлочи) коэффициенты баланса сначала ставят **в правую часть** (перед продуктами окисления и восстановления), а затем суммируют атомы в левой части:"}, {"eq": "3Cl2 + 6KOH(гор.) —t°→ 5KCl + KClO3 + 3H2O"}, {"p": "Баланс для этой реакции: `Cl^{0} + 1e⁻ → Cl^{−1}` (множитель `5`, восстановление) и `Cl^{0} − 5e⁻ → Cl^{+5}` (множитель `1`, окисление). Ставим `5` перед `KCl` и `1` перед `KClO3`; всего справа `6` атомов хлора → слева `3Cl2`, `6KOH(гор.)` и `3H2O`. Проверка по кислороду: слева `6`, справа `3 + 3 = 6`."}, {"h": "3. Официальные критерии оценивания задания № 29 ФИПИ (2/1/0 баллов)"}, {"table": [["Балл", "За что ставит эксперт предметной комиссии ФИПИ", "Типичная причина потери балла"], ["**2 балла**", "Верно выбраны вещества (строго по признаку условия!), верно составлено и уравнено уравнение ОВР, верно составлен электронный баланс, верно указаны окислитель и восстановитель", "—"], ["**1 балл**", "Верно выбраны вещества и составлено уравнение ОВР (с верными коэффициентами), НО есть ошибка в балансе или в указании окислителя/восстановителя (либо наоборот: баланс и роли верны, но допущена ошибка в коэффициентах уравнения — только при верном выборе веществ!)", "Забыл указать, кто окислитель и кто восстановитель; записал условную СО как заряд (`Mn^{7+}` или `S^{6+}` вместо `Mn^{+7}`, `S^{+6}`; путаница `Fe^{+2}` и `Fe^{2+}` особенно критична в ионных уравнениях № 30); ошибся в числе `e⁻` в балансе"], ["**0 баллов**", "Выбранная реакция **не соответствует условию** (например, выпал осадок, а просили без осадка), либо нет верного уравнения, либо записано несколько разных уравнений на выбор", "Записал «на всякий случай» два уравнения (в условии сказано «только одной»!); перепутал реагент из перечня; допустил ошибку в формуле вещества"]]}, {"warn": "**Как безопасно оформить окислитель и восстановитель в № 29:**\nПиши **формулу исходного вещества целиком** и уточняй элемент в скобках, например:\n`KMnO4` (за счёт `Mn^{+7}`) — окислитель;\n`HCl` (за счёт `Cl^{−1}`) — восстановитель.\nТак ты гарантированно выполнишь требования любого регионального эксперта и не допустишь путаницы между веществом и элементом.", "t": "Золотой стандарт оформления на 2/2 балла"}, {"bridge": {"kim": "№ 29 КИМ (высокий, 2 балла)", "ask": "Запишите уравнение только одной возможной ОВР, составьте электронный баланс, укажите окислитель и восстановитель.", "watch": "Дробные коэффициенты вроде `3/2 O2` в № 29 **не засчитываются**; придерживайся стандарта наименьших целых коэффициентов, чтобы не запутаться при проверке баланса.", "tip": "После расстановки коэффициентов всегда проверяй кислород слева и справа, а затем убедись, что у всех коэффициентов нет общего делителя."}}], "short": [{"list": ["Число отданных восстановителем электронов всегда равно числу электронов, принятых окислителем.", "Для двухатомных простых веществ (`Cl2`, `I2`, `O2`, `N2`) удобно сразу удваивать полуреакцию (`2Cl^{−1} − 2e⁻ → Cl2^{0}`).", "При двойном окислении (`FeS2`, `Cu2S`, `CrI3`) складывай электроны всех окисляющихся атомов в одной формульной единице.", "При диспропорционировании множители баланса сначала переноси в правую часть (к продуктам), а затем суммируй реагент слева.", "Всегда проверяй уравнение по кислороду и сокращай коэффициенты до наименьших целых.", "В № 29 указывай окислитель и восстановитель из **левой** части уравнения в формате «вещество (за счёт элемента с СО)»."]}]}, {"id": "04", "group": "Электронный баланс и среда (№ 29)", "nav": "pH, KMnO4 и хром", "codes": ["1.12"], "eyebrow": "04 · Код 1.12 · Задание № 29", "title": "Среда раствора (pH) и главные окислители: KMnO4 и хром", "lead": "Почему одна и та же марганцовка с сульфитом калия в кислой среде обесцвечивается, в воде даёт бурый осадок, а в щёлочи становится изумрудно-зелёной? Продуктами ОВР дирижирует среда раствора.", "b": [{"key": "Среда раствора (`H^{+}`, `H2O`, `OH^{−}`) определяет, насколько глубоко восстановится окислитель и в какой форме (соль, оксид/гидроксид или анион) окажутся продукты. В кислой среде окислительная способность `KMnO4` и `K2Cr2O7` максимальна.", "t": "Главная мысль."}, {"h": "1. Как выбрать среду из перечня № 29 и не попасть в капкан"}, {"p": "В условии № 29 часто пишут: «в качестве среды можно использовать ещё одно из веществ перечня или воду». Важно, чтобы среда **не вступала в побочную ОВР** с твоей парой:"}, {"list": ["**Идеальная кислая среда:** `H2SO4(разб.)` — сульфат-ион `SO4^{2−}` в разбавленном растворе инертен. Если в перечне нет `H2SO4`, её роль отлично выполняют **кислые соли сильной кислоты**: `KHSO4`, `NaHSO4` или `NH4HSO4` (именно `NH4HSO4` есть в перечне Демоверсии-2027!).", "**Запрещённые «кислые среды»:** `HCl` нельзя брать как инертную среду для `KMnO4` и `K2Cr2O7` — хлорид-ион сам окислится до `Cl2↑`! `HNO3` нельзя брать как инертную среду — она сама сильный окислитель.", "**Щелочная среда:** `KOH`, `NaOH`, `Ba(OH)2`. Если продукт — кислотный оксид (например, `SO2` или `CO2`), в щёлочи он никогда не выделится газом, а сразу превратится в соль (`K2SO3`, `K2CO3`).", "**Нейтральная среда:** `H2O` (можно добавлять всегда, даже если воды нет в перечне — в условии сказано «или воду»)."]}, {"h": "2. Перманганат калия (KMnO4) в трёх средах"}, {"p": "В фиолетовом растворе `KMnO4` марганец находится в высшей СО `+7`. Чем больше вокруг протонов `H^{+}`, тем легче оторвать кислород от перманганата (связывая атомы кислорода в молекулы `H2O`), поэтому глубина восстановления `Mn^{+7}` максимальна именно в кислой среде."}, {"svg": "<svg viewBox='0 0 460 206' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='206' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='22' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>Переходы Mn⁺⁷ (KMnO₄) в зависимости от среды (pH)<\/text><rect x='14' y='74' width='112' height='54' rx='10' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)' stroke-width='2'/><text x='70' y='97' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>KMnO₄<\/text><text x='70' y='117' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>фиолетовый<\/text><line x1='126' y1='86' x2='196' y2='52' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><polygon points='199,50 188,50 192,59' fill='var(--svg-bad,#ef6b6b)'/><text x='158' y='58' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='12' font-weight='700'>H⁺<\/text><line x1='126' y1='101' x2='196' y2='101' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><polygon points='199,101 189,96 189,106' fill='var(--svg-gold,#e5a93c)'/><text x='161' y='94' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12' font-weight='700'>H₂O<\/text><line x1='126' y1='116' x2='196' y2='152' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><polygon points='199,154 192,145 188,154' fill='var(--svg-good,#34c77b)'/><text x='158' y='152' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='12' font-weight='700'>OH⁻<\/text><rect x='202' y='34' width='244' height='42' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='1.5'/><text x='324' y='53' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13' font-weight='700'>Mn²⁺ (MnSO₄) · +5e⁻<\/text><text x='324' y='69' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>обесцвечивание раствора<\/text><rect x='202' y='82' width='244' height='42' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.5'/><text x='324' y='101' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13' font-weight='700'>MnO₂↓ (Mn⁺⁴) · +3e⁻<\/text><text x='324' y='117' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>бурый осадок (+ KOH/H₂O)<\/text><rect x='202' y='130' width='244' height='42' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><text x='324' y='149' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13' font-weight='700'>K₂MnO₄ (Mn⁺⁶) · +1e⁻<\/text><text x='324' y='165' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>изумрудно-зелёный раствор<\/text><text x='230' y='193' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>K₂MnO₄ устойчив в щёлочи; в кислоте диспропорционирует<\/text><\/svg>", "cap": "Одна соль KMnO4 даёт три совершенно разных визуальных признака в зависимости от pH."}, {"eq": ["2KMnO4 + 5Na2SO3 + 3H2SO4(разб.) → 2MnSO4 + 5Na2SO4 + K2SO4 + 3H2O", "2KMnO4 + 5K2SO3 + 6KHSO4 → 2MnSO4 + 9K2SO4 + 3H2O", "2KMnO4 + 3Na2SO3 + H2O → 2MnO2↓ + 3Na2SO4 + 2KOH", "2KMnO4 + Na2SO3 + 2KOH → 2K2MnO4 + Na2SO4 + H2O"], "sm": true}, {"warn": "**Три частые ловушки с марганцем в № 29:**\n1. Если в нейтральной среде восстановитель — **кислота** (например, `SO2`, `H2S`), то щёлочь справа не образуется, а получается кислая/средняя соль или кислота: `2KMnO4 + 5SO2 + 2H2O → 2MnSO4 + K2SO4 + 2H2SO4`.\n2. `MnO2` (бурый осадок) выступает сильным окислителем в кислой среде при нагревании (`MnO2 + 4HCl(конц.) —t°→ MnCl2 + Cl2↑ + 2H2O`), а при сплавлении со щёлочью и окислителем (`KClO3`, `KNO3`) сам окисляется до зелёного манганата: `3MnO2 + KClO3 + 6KOH —сплавление→ 3K2MnO4 + KCl + 3H2O`.\n3. Зелёный манганат `K2MnO4` при подкислении диспропорционирует на `KMnO4` и `MnO2↓`.", "t": "Тонкости на 95–100 баллов: MnO2 и K2MnO4"}, {"h": "3. Соединения хрома (+6 и +3) в трёх средах"}, {"p": "Хром `+6` существует в виде двух анионов, которые переходят друг в друга **без ОВР** при изменении pH: в кислой среде преобладает оранжевый **дихромат** `Cr2O7^{2−}`, а в щелочной — жёлтый **хромат** `CrO4^{2−}`:"}, {"eq": "K2Cr2O7 + 2KOH → 2K2CrO4 + H2O"}, {"p": "Как окислитель `Cr^{+6}` всегда восстанавливается до **`Cr^{+3}`** (меняет цвет с оранжевого/жёлтого на зелёный или серо-зелёный), но **форма** продукта зависит от среды:"}, {"table": [["Среда", "Исходная форма Cr^{+6}", "Продукт Cr^{+3}", "Визуальный признак"], ["Кислая (`H2SO4`, `KHSO4`)", "Оранжевый `K2Cr2O7` (или `K2CrO4`)", "Соль `Cr2(SO4)3` (`Cr^{3+}`)", "Раствор меняет цвет с оранжевого/жёлтого на зелёный (или фиолетово-зелёный)"], ["Нейтральная (`H2O`)", "`K2Cr2O7` / `K2CrO4`", "Осадок `Cr(OH)3↓`", "Выпадение серо-зелёного осадка"], ["Щелочная (`KOH`, `NaOH`)", "Жёлтый `K2CrO4` (или `K2Cr2O7`)", "Гидроксокомплекс `K[Cr(OH)4]` или `K3[Cr(OH)6]`", "Прозрачный изумрудно-зелёный раствор без осадка"]]}, {"p": "Обратный переход — **окисление `Cr^{+3}` до `Cr^{+6}`** — в растворе идёт именно в **щелочной среде** (под действием `H2O2`, `Br2`, `Cl2`, `NaClO`), где из зелёного гидроксохромата образуется жёлтый хромат `K2CrO4`:"}, {"eq": "2K3[Cr(OH)6] + 3H2O2 → 2K2CrO4 + 2KOH + 8H2O"}, {"h": "4. Эталонный разбор задания № 29 из Демоверсии ЕГЭ-2027"}, {"steps": ["**Условие (Демоверсия ФИПИ ЕГЭ-2027, № 29):** перечень веществ — *нитрит калия (`KNO2`), сульфит калия (`K2SO3`), дихромат калия (`K2Cr2O7`), серная кислота (`H2SO4`), иодид калия (`KI`), гидросульфат аммония (`NH4HSO4`)*. Выберите окислитель и восстановитель, реакция между которыми в соответствующей среде протекает **с образованием простого вещества и раствора двух солей**.", "**Отбор пары:** сильный окислитель — `K2Cr2O7` (степень окисления хрома `+6`). Простое вещество из нашего перечня даст именно `KI`: иодид-ион `I^{−}` окисляется до простого вещества `I2↓` (бурый осадок / буро-жёлтый раствор)! (`KNO2` и `K2SO3` дали бы соли `KNO3` и `K2SO4`, а не простое вещество.)", "**Выбор среды:** берём `H2SO4(разб.)` (тогда в продуктах будут соли только калия и хрома: `Cr2(SO4)3` и `K2SO4` — ровно **две соли**!). Если бы взяли `NH4HSO4`, в растворе оказались бы три соли (`Cr2(SO4)3`, `K2SO4`, `(NH4)2SO4`), что нарушает условие «раствора двух солей»!", "**Составление электронного баланса:**\n`2Cr^{+6} + 6e⁻ → 2Cr^{+3}` (множитель `1`, восстановление)\n`2I^{−1} − 2e⁻ → I2^{0}` (множитель `3`, окисление)\n`K2Cr2O7` (за счёт `Cr^{+6}`) — окислитель; `KI` (за счёт `I^{−1}`) — восстановитель.", "**Итоговое уравнение и проверка по кислороду:** ставим `1` перед `K2Cr2O7`, `6` перед `KI`, `3` перед `I2`, `1` перед `Cr2(SO4)3`. Калия слева `2 + 6 = 8` → `4K2SO4`. Сульфат-ионов справа `3 + 4 = 7` → `7H2SO4(разб.)`, воды `7H2O`. Проверка по кислороду: слева `7 + 28 = 35`, справа `12 + 16 + 7 = 35`. Идеально 2/2 балла!"]}, {"eq": "K2Cr2O7 + 6KI + 7H2SO4(разб.) → 3I2↓ + Cr2(SO4)3 + 4K2SO4 + 7H2O"}, {"bridge": {"kim": "№ 29 КИМ (Демоверсия ЕГЭ-2027)", "ask": "Подобрать окислитель, восстановитель и среду строго под число солей и качественный признак.", "watch": "В перечне Демо-2027 намеренно даны **две** кислые среды (`H2SO4` и `NH4HSO4`): с `NH4HSO4` образуется третья соль `(NH4)2SO4`, что даёт 0 баллов по условию «раствор двух солей».", "tip": "Всегда пересчитывай число разных солей в правой части уравнения — это один из любимых фильтров ФИПИ."}}], "short": [{"list": ["Для кислой среды бери `H2SO4(разб.)` или кислые соли `KHSO4`/`NH4HSO4` (учитывая число катионов в продуктах!), но не `HCl` и не `HNO3`.", "`KMnO4` восстанавливается в кислоте до `Mn^{2+}` (бесцветный), в воде до `MnO2↓` (бурый осадок), в щёлочи до `K2MnO4` (зелёный раствор).", "`Cr^{+6}` (`K2Cr2O7`, `K2CrO4`) всегда восстанавливается до `Cr^{+3}`: соль `Cr^{3+}` (кислота), `Cr(OH)3↓` (вода), `[Cr(OH)4]^{−}`/`[Cr(OH)6]^{3−}` (щёлочь).", "Переход `CrO4^{2−} ⇄ Cr2O7^{2−}` при смене pH — это не ОВР.", "Окисление `Cr^{+3}` до жёлтого хромата `CrO4^{2−}` в растворе проводят в щелочной среде."]}]}, {"id": "05", "group": "Химия ОВР (№ 29)", "nav": "Кислоты, H2O2, галогены", "codes": ["1.12"], "eyebrow": "05 · Код 1.12 · Задание № 29", "title": "Кислоты-окислители, нитриты, H2O2 и галогены", "lead": "Почему медь не растворяется в соляной кислоте, но бурно растворяется в азотной с выделением «лисого хвоста» `NO2`, а железо спокойно перевозят в стальных цистернах с концентрированной серной кислотой?", "b": [{"key": "`HNO3` (любой концентрации) и `H2SO4(конц.)` окисляют за счёт атомов `N^{+5}` и `S^{+6}`, а не `H^{+1}`, поэтому **водород с металлами они не выделяют** (в ЕГЭ). Продукт восстановления зависит от концентрации кислоты и активности восстановителя.", "t": "Главная мысль."}, {"h": "1. Азотная и концентрированная серная кислоты с металлами и неметаллами"}, {"table": [["Восстановитель", "HNO3(конц.)", "HNO3(разб.)", "H2SO4(конц.)"], ["Малоактивные металлы (`Cu`, `Ag`, `Hg`)", "`NO2↑` (бурый газ)", "`NO↑` (бесцветный газ, буреет на воздухе)", "`SO2↑` (при нагревании)"], ["Активные металлы (`Mg`, `Zn`, `Ca`)", "`NO2↑` или `N2O↑`", "`NH4NO3` или `N2O↑`/`N2↑` (в очень разб. — `NH4NO3`)", "`H2S↑` (или `S↓`, с `Zn` — `H2S`/`S`/`SO2`)"], ["`Fe`, `Al`, `Cr`", "**Пассивация** на холоде; при `t°` → соль `+3` и `NO2↑`", "Реагируют без `t°` → соль `+3` и `NO↑` (или `N2O`/`NH4NO3`)", "**Пассивация** на холоде; при `t°` → соль `+3` и `SO2↑`"], ["Неметаллы (`C`, `S`, `P`)", "`CO2`, `H2SO4`, `H3PO4` + `NO2↑`", "`H3PO4` + `NO↑` (для `P` при `t°`)", "`CO2` + `SO2↑` (`C`), `SO2↑` (`S`), `H3PO4` + `SO2↑` (`P` при `t°`)"]]}, {"eq": ["Cu + 4HNO3(конц.) → Cu(NO3)2 + 2NO2↑ + 2H2O", "3Cu + 8HNO3(разб.) → 3Cu(NO3)2 + 2NO↑ + 4H2O", "Cu + 2H2SO4(конц.) —t°→ CuSO4 + SO2↑ + 2H2O", "Cu2S + 12HNO3(конц.) → Cu(NO3)2 + CuSO4 + 10NO2↑ + 6H2O"], "sm": true}, {"p": "Сложные сульфиды (`Cu2S`, `FeS`, `FeS2`, `CuS`) растворяются в `HNO3(конц.)` с двойным окислением: металл переходит в высшую устойчивую СО (`Cu^{+1} → Cu^{+2}`, `Fe^{+2} → Fe^{+3}`), а сера окисляется до сульфата `SO4^{2−}` (`CuSO4` или `H2SO4` — оба варианта записи с избытком `HNO3` допустимы в № 29)."}, {"warn": "**Классические ловушки кислот-окислителей:**\n1. `Fe`, `Al`, `Cr` на холоде **пассивируются** `HNO3(конц.)` и `H2SO4(конц.)`, а при нагревании дают соли в СО **`+3`** (`Fe(NO3)3`, `Fe2(SO4)3`), а не `+2`! То же касается `FeO` и `Fe(OH)2` с `HNO3` или `H2SO4(конц.)`: они окисляются до `Fe^{+3}`.\n2. `H2SO4(конц.)` с твёрдыми галогенидами: с `NaCl` идёт **не-ОВР** (`NaCl(тв.) + H2SO4(конц.) —t°→ NaHSO4 + HCl↑`), с `NaBr` идёт ОВР до **`Br2` + `SO2↑`**, а с `NaI` (сильнейший восстановитель!) — до **`I2` + `H2S↑`**.\n3. Нитраты в **щелочной среде** окисляют `Zn` и `Al` до гидроксокомплексов, восстанавливаясь до **аммиака `NH3↑`**:", "t": "Ловушки на 95–100 баллов"}, {"eq": "4Zn + NaNO3 + 7NaOH + 6H2O —t°→ 4Na2[Zn(OH)4] + NH3↑"}, {"h": "2. Нитриты (KNO2) и пероксид водорода (H2O2) — мастера двойственности"}, {"p": "В нитрите калия `KNO2` азот имеет промежуточную СО `+3`, а в пероксиде `H2O2` кислород имеет СО `−1`. Оба вещества в № 29 работают «в обе стороны» — выбирай роль по второму реагенту:"}, {"steps": ["**`KNO2` как восстановитель (`N^{+3} → N^{+5}`):** с сильными окислителями (`KMnO4`, `K2Cr2O7`, `Cl2`, `H2O2`) переходит в нитрат `KNO3`:\n`2KMnO4 + 5KNO2 + 3H2SO4(разб.) → 2MnSO4 + 5KNO3 + K2SO4 + 3H2O` (обесцвечивание раствора без газа и осадка!).", "**`KNO2` как окислитель (`N^{+3} → N^{+2}`, газ `NO↑`):** в кислой среде с сильными восстановителями (`KI`, `H2S`, `FeSO4`) восстанавливается до бесцветного газа `NO↑`:\n`2KNO2 + 2KI + 2H2SO4(разб.) → I2↓ + 2NO↑ + 2K2SO4 + 2H2O`.", "**`H2O2` как окислитель (`O^{−1} → O^{−2}` в `H2O`/`OH^{−}`):** с `KI`, `FeSO4`, `Na2SO3`, `Cr(OH)3`/`K3[Cr(OH)6]` — газ не выделяется!\n`2KI + H2O2 + H2SO4(разб.) → I2↓ + K2SO4 + 2H2O`.", "**`H2O2` как восстановитель (`O^{−1} → O2^{0}↑`):** с `KMnO4`, `K2Cr2O7`, `Cl2`, `Ag2O` — всегда выделяется **газ `O2↑`**!\n`2KMnO4 + 5H2O2 + 3H2SO4(разб.) → 2MnSO4 + 5O2↑ + K2SO4 + 8H2O`."]}, {"h": "3. Галогены, их ряд активности и оксогалогениды"}, {"p": "В VIIA группе сверху вниз радиус атома растёт, поэтому способность **отнимать** электроны (окислительная сила простых веществ) убывает: `F2 > Cl2 > Br2 > I2`. Каждый более активный галоген вытесняет менее активный из растворов его солей (кроме `F2`, который реагирует с водой!):"}, {"eq": ["Cl2 + 2KBr → 2KCl + Br2", "Br2 + 2KI → 2KBr + I2↓"], "sm": true}, {"p": "При растворении `Cl2` и `Br2` в **щёлочи** идёт [[Диспропорционирование|диспропорционирование]], и температура меняет продукт окисления (с `I2` даже при обычной температуре обычно образуется иодат `KIO3`):"}, {"tree": {"t": "Продукты реакции Cl2 / Br2 со щёлочью (KOH, NaOH)", "root": {"q": "Реакция идёт при нагревании (горячая щёлочь)?", "yes": {"a": "Хлорат KClO3 (или KBrO3) + хлорид KCl + H2O", "why": "При нагревании гипохлорит неустойчив и диспропорционирует до хлората (+5): 3Cl2 + 6KOH(гор.) —t°→ 5KCl + KClO3 + 3H2O."}, "no": {"a": "Гипохлорит KClO (или KBrO) + хлорид KCl + H2O", "why": "В холодной щёлочи галоген переходит в ближайшие СО (−1 и +1): Cl2 + 2KOH(хол.) → KCl + KClO + H2O."}}}}, {"p": "Соли хлорноватистой (`NaClO`, `Ca(ClO)2`), хлорноватой (`KClO3`) и иодноватой (`KIO3`) кислот — сильные окислители в № 29. С галогенидами в кислой среде они вступают в **сопропорционирование** с выделением простого вещества (`Cl2↑` или `I2↓`):"}, {"eq": ["KClO3 + 6HCl(конц.) → KCl + 3Cl2↑ + 3H2O", "KClO3 + 6KI + 3H2SO4(разб.) → KCl + 3I2↓ + 3K2SO4 + 3H2O", "KIO3 + 5KI + 3H2SO4(разб.) → 3I2↓ + 3K2SO4 + 3H2O"], "sm": true}, {"bridge": {"kim": "№ 29 и № 19 КИМ", "ask": "Подобрать ОВР с выделением бурого газа (`NO2`), бесцветного газа (`NO`, `SO2`, `O2`, `NH3`) или раствора двух солей без газа.", "watch": "Не пиши выделение `H2` с `HNO3` или `H2SO4(конц.)`, а также не путай `NaCl + H2SO4(конц.)` (обмен, не-ОВР) с `NaI + H2SO4(конц.)` (ОВР до `I2` и `H2S`).", "tip": "Если в условии с `H2O2` просят выделение газа — `H2O2` почти наверняка работает как **восстановитель** (`→ O2↑`)."}}], "short": [{"list": ["`HNO3` (любая) и `H2SO4(конц.)` с металлами водород не выделяют; `Fe`, `Al`, `Cr` пассивируются ими на холоде, а при `t°` окисляются до `+3`.", "`H2SO4(конц.)` с твёрдыми галогенидами: `NaCl` → обмен (`HCl↑`), `NaBr` → `Br2 + SO2↑`, `NaI` → `I2 + H2S↑`.", "Нитраты с `Zn`/`Al` в щёлочи восстанавливаются до `NH3↑` с образованием гидроксокомплексов.", "`KNO2` с окислителями даёт `KNO3` (без газа), а с восстановителями в кислоте — `NO↑`.", "`H2O2` как окислитель переходит в `H2O`/`OH^{−}` (без газа), а как восстановитель — в `O2↑`.", "`Cl2`/`Br2` в холодной щёлочи дают гипогалогенит (`KClO`), в горячей — галогенат (`KClO3`); соли `NaClO`/`KClO3` в ОВР восстанавливаются до `Cl^{−1}`."]}]}, {"id": "06", "group": "Химия ОВР (№ 29)", "nav": "Восстановители и навигатор № 29", "codes": ["1.12"], "eyebrow": "06 · Код 1.12 · Задание № 29", "title": "Восстановители, признаки реакций и алгоритм отбора пары № 29", "lead": "Перед тобой 6 веществ, из которых можно составить три разные ОВР, но засчитают только одну — ту, что подходит под фразу «обесцвечивание раствора без выделения газа и осадка». Как не ошибиться за 2 минуты?", "b": [{"key": "Чтобы взять 2/2 балла в № 29, нужно не просто знать пары «окислитель + восстановитель», а уметь **фильтровать** их по качественному признаку из условия и не спутать ОВР с реакцией ионного обмена из № 30.", "t": "Главная мысль."}, {"h": "1. Главные восстановители ЕГЭ и продукты их окисления"}, {"table": [["Восстановитель", "Продукт окисления", "Визуальный признак / тонкость ЕГЭ"], ["`I^{−1}` (`KI`, `HI`)", "`I2↓` (бурый осадок / буро-жёлтый раствор)", "Сильнейший восстановитель среди галогенидов; окисляется даже `Fe^{3+}` и `Cu^{2+}`!"], ["`Br^{−1}` (`KBr`, `HBr`), `Cl^{−1}` (`HCl(конц.)`)", "`Br2` (бурая жидкость/р-р), `Cl2↑` (жёлто-зелёный газ)", "`Br^{−1}` окисляется `KMnO4`, `K2Cr2O7`, `Cl2`, `H2SO4(конц.)`; `Cl^{−1}` — `KMnO4`, `MnO2`, `K2Cr2O7` в конц. кислоте"], ["`S^{−2}` (`H2S`, `Na2S`, `CuS`)", "`S↓` (жёлтый осадок) или `SO4^{2−}` (с сильными окислителями: `HNO3`, `Cl2`, `Br2`)", "С `KMnO4`/`K2Cr2O7`/`FeCl3` в растворе `H2S` и сульфиды обычно дают `S↓` (по условию может быть и `SO4^{2−}` — смотри признак!)"], ["`S^{+4}` (`SO2`, `Na2SO3`, `KHSO3`)", "`SO4^{2−}` (`Na2SO4`, `H2SO4`)", "Переход без осадка и газа — идеальная пара для признака «обесцвечивание без осадка и газа»"], ["`Fe^{+2}` (`FeSO4`, `FeCl2`, `Fe(OH)2`)", "`Fe^{+3}` (`Fe2(SO4)3`, `FeCl3`, `Fe(OH)3↓`)", "Окисляется `KMnO4`, `K2Cr2O7`, `HNO3`, `H2O2`, `Cl2`, `O2`. В щелочной среде с `Cl2`/`NaClO` `Fe(OH)3` окисляется до фиолетового феррата: `2Fe(OH)3 + 3Cl2 + 10KOH → 2K2FeO4 + 6KCl + 8H2O`."], ["`Cu^{+1}` (`Cu2O`, `Cu2S`)", "`Cu^{+2}` (`Cu(NO3)2`, `CuSO4`)", "В `Cu2S` с `HNO3(конц.)` идёт двойное окисление (`Cu^{+1} → Cu^{+2}` и `S^{−2} → S^{+6}`)"], ["`P^{0}`, `PH3`, `NaH2PO2`", "`H3PO4` / `PO4^{3−}` (`P^{+5}`)", "С `HNO3`, `KMnO4`, `Cl2` фосфор и фосфин окисляются до фосфорной кислоты / фосфатов"], ["`NH3` / `NH4^{+}`", "`N2↑` (чаще всего) или `NO↑` (кат. `Pt`)", "С `CuO`, `Cl2`, `Br2`, `KMnO4` аммиак окисляется до бесцветного газа `N2↑`"], ["`C2O4^{2−}` (оксалаты), `HCOO^{−}` (формиаты)", "`CO2↑` (в кислоте) или `CO3^{2−}` (в щёлочи)", "`2KMnO4 + 5K2C2O4 + 8H2SO4(разб.) → 2MnSO4 + 10CO2↑ + 6K2SO4 + 8H2O`"]]}, {"h": "2. Особые пары ОВР и граница с РИО (№ 30)"}, {"p": "В таблице растворимости ФИПИ на пересечении `Fe^{3+}` с `I^{−}`, `S^{2−}`, `SO3^{2−}` и `Cu^{2+}` с `I^{−}` стоят **прочерки**. Многие ошибочно принимают их за совместный гидролиз (РИО), но на самом деле это **окислительно-восстановительные реакции**:"}, {"eq": ["2FeCl3 + 2KI → 2FeCl2 + I2↓ + 2KCl", "2CuSO4 + 4KI → 2CuI↓ + I2↓ + 2K2SO4", "2FeCl3 + H2S → 2FeCl2 + S↓ + 2HCl", "2FeCl3 + Na2SO3 + H2O → 2FeCl2 + Na2SO4 + 2HCl"], "sm": true}, {"warn": "**Граница между № 29 и № 30 + правило совместимости продуктов:**\n- `Al^{3+}` и `Cr^{3+}` с `CO3^{2−}`, `S^{2−}`, `SO3^{2−}`, а также `Fe^{3+}` с `CO3^{2−}`/`HCO3^{−}` — это **не-ОВР** (совместный гидролиз для № 30). А `Fe^{3+} + I^{−}`/`S^{2−}`/`SO3^{2−}` и `Cu^{2+} + I^{−}` — это **ОВР** (для № 29).\n- **Правило перечня и совместимости:** нельзя добавлять реагенты не из перечня (кроме `H2O`, если она разрешена условием), и нельзя записывать в правой части несовместимые продукты (например, кислоту и щёлочь, `NH3` и `HCl`, карбонат или гидроксид в кислой среде).", "t": "Граница между № 29 и № 30 и правило совместимости"}, {"h": "3. Словарь качественных признаков в условии № 29"}, {"table": [["Формулировка в условии № 29", "Что должно получиться", "Типичный пример пары"], ["«Обесцвечивание раствора, без осадка и газа»", "Фиолетовый `KMnO4` переходит в бесцветный `Mn^{2+}`, восстановитель не даёт ни газа, ни осадка", "`KMnO4 + Na2SO3 + H2SO4(разб.)` или `KMnO4 + KNO2 + H2SO4(разб.)`"], ["«Выделение газа и выпадение осадка»", "Один продукт — газ, второй — нерастворимое вещество", "`2KNO2 + 2KI + 2H2SO4(разб.) → I2↓ + 2NO↑ + 2K2SO4 + 2H2O`"], ["«Образование простого вещества и раствора двух солей»", "`I2↓`, `S↓`, `Br2`, `Cl2↑`, `O2↑`, `N2↑` + ровно 2 соли в растворе", "`K2Cr2O7 + 6KI + 7H2SO4(разб.) → 3I2↓ + Cr2(SO4)3 + 4K2SO4 + 7H2O`"], ["«Выпадение бурого осадка»", "`MnO2↓` (нейтральная среда для `KMnO4`) или `Fe(OH)3↓`", "`2KMnO4 + 3K2SO3 + H2O → 2MnO2↓ + 3K2SO4 + 2KOH`"], ["«Изменение окраски раствора на зелёную (без осадка)»", "`KMnO4` в щёлочи (`→ K2MnO4`) или `K2Cr2O7` в кислоте/щёлочи (`→ Cr^{3+}` / `[Cr(OH)4]^{−}`)", "`2KMnO4 + K2SO3 + 2KOH → 2K2MnO4 + K2SO4 + H2O`"], ["«Без видимых признаков»", "Бесцветные реагенты → бесцветные растворимые продукты без газа и осадка", "`H2O2 + Na2SO3 → Na2SO4 + H2O`"], ["«Образование двух кислот»", "Окисление галогеном (`Cl2`, `Br2`) соединений серы (`SO2`, `H2S`) или фосфора в воде", "`SO2 + Cl2 + 2H2O → H2SO4 + 2HCl`"], ["«Растворение осадка»", "Нерастворимый восстановитель (`CuS`, `Fe(OH)2`, `Cr(OH)3`) или окислитель (`MnO2`) переходит в растворимую соль/комплекс", "`Cu2S + 12HNO3(конц.) → Cu(NO3)2 + CuSO4 + 10NO2↑ + 6H2O`"]]}, {"h": "4. Пятишаговый алгоритм отбора пары № 29 (разбор вслух)"}, {"steps": ["**Условие прототипа:** даны *перманганат калия (`KMnO4`), сульфит натрия (`Na2SO3`), иодид калия (`KI`), серная кислота (`H2SO4`), гидроксид бария (`Ba(OH)2`), сульфат железа(II) (`FeSO4`)*. Выберите вещества, реакция между которыми приводит к **обесцвечиванию раствора без образования осадка и выделения газа**.", "**Шаг 1. Распредели 6 веществ по ролям:** окислитель — `KMnO4`; восстановители — `Na2SO3`, `KI`, `FeSO4`; среды — `H2SO4(разб.)` (кислая), `Ba(OH)2` (щелочная), плюс `H2O`.", "**Шаг 2. Отсей по признаку «обесцвечивание раствора»:** обесцвечивание фиолетового `KMnO4` происходит только в **кислой среде** (`Mn^{+7} → Mn^{+2}`). Значит, берём среду `H2SO4(разб.)`.", "**Шаг 3. Отсей лишние восстановители по запрету осадка и газа:** `KI` даст бурый осадок `I2↓` — отбрасываем! `FeSO4` даст жёлто-бурый раствор `Fe2(SO4)3` (раствор не обесцветится, а станет жёлтым!) — отбрасываем! Остаётся `Na2SO3`: `SO3^{2−} → SO4^{2−}` (бесцветный раствор, без газа и осадка).", "**Шаг 4. Запиши уравнение и баланс:**\n`2KMnO4 + 5Na2SO3 + 3H2SO4(разб.) → 2MnSO4 + 5Na2SO4 + K2SO4 + 3H2O`\n`Mn^{+7} + 5e⁻ → Mn^{+2}` (×2, восстановление)\n`S^{+4} − 2e⁻ → S^{+6}` (×5, окисление)\n`KMnO4` (за счёт `Mn^{+7}`) — окислитель; `Na2SO3` (за счёт `S^{+4}`) — восстановитель.", "**Шаг 5. Проверка по кислороду и признакам:** слева `8 + 15 + 12 = 35` атомов `O`; справа `8 + 20 + 4 + 3 = 35`. Продукты `MnSO4`, `Na2SO4`, `K2SO4` бесцветны и растворимы («Р»), газа нет. Ответ полностью соответствует условию!"]}, {"bridge": {"kim": "№ 29 и № 30 КИМ (общий перечень 6 веществ)", "ask": "Развести ОВР и РИО на одном и том же списке из шести веществ.", "watch": "Вещества из № 29 **можно** повторно использовать в № 30 (ограничений на неповторение нет!), главное — чтобы в № 29 менялись СО, а в № 30 — нет.", "tip": "Сразу выписывай все 6 формул в строчку и ставь над ними метки: `О` (окислитель), `В` (восстановитель), `С` (среда)."}}], "short": [{"list": ["Главные восстановители № 29: `I^{−1} → I2↓`, `Br^{−1} → Br2`, `S^{−2} → S↓/SO4^{2−}`, `SO3^{2−} → SO4^{2−}`, `Fe^{+2} → Fe^{+3}`, `NO2^{−} → NO3^{−}`, `C2O4^{2−} → CO2↑`.", "`Fe^{3+} + I^{−}/S^{2−}/SO3^{2−}` и `Cu^{2+} + I^{−}` — это ОВР (для № 29), а совместный гидролиз `Al^{3+}/Cr^{3+}` с `CO3^{2−}/S^{2−}` — это РИО (для № 30).", "Обесцвечивание `KMnO4` без осадка и газа дают `Na2SO3` или `KNO2` в `H2SO4(разб.)`, но не `FeSO4` (раствор желтеет) и не `KI` (выпадает `I2↓`).", "При отборе пары всегда проверяй каждый ограничительный признак из условия (цвет, осадок, газ, число солей).", "Вещества из перечня можно использовать повторно в заданиях № 29 и № 30."]}]}, {"id": "07", "group": "Электролиз (№ 20)", "nav": "Физика и расплавы", "codes": ["1.13"], "eyebrow": "07 · Код 1.13 · Задание № 20 (1 балл)", "title": "Физика электролиза и электролиз расплавов", "lead": "Натрий и хлор сами по себе бурно соединяются в поваренную соль `NaCl`, но в природе поваренная соль никогда не распадается обратно на натрий и хлор. Как заставить ОВР пойти «против течения»?", "b": [{"key": "[[Электролиз]] — это вынужденная окислительно-восстановительная реакция, которая идёт на электродах при пропускании **постоянного** электрического тока через расплав или раствор электролита. На **катоде (–)** всегда идёт **восстановление**, на **аноде (+)** — **окисление**.", "t": "Главная мысль."}, {"h": "1. Как устроен электролизёр и почему ионы движутся к электродам"}, {"p": "В твёрдой соли `NaCl` ионы `Na^{+}` и `Cl^{−}` жёстко закреплены в кристаллической решётке, поэтому твёрдая соль ток не проводит. Стоит расплавить соль (или растворить в воде) — и ионы становятся подвижными. Это ещё не электролиз, а просто **диссоциация** (распад на ионы, без изменения СО)."}, {"p": "Теперь опустим в расплав два [[Инертный электрод|инертных электрода]] (обычно из графита или платины) и подключим источник **постоянного тока**:"}, {"list": ["**[[Катод]] (–)** — заряжен отрицательно (источник закачивает на него избыток электронов `e⁻`). К нему притягиваются положительные **катионы** (`Na^{+}`), забирают электроны и **восстанавливаются** (`Na^{+} + e⁻ → Na^{0}`).", "**[[Анод]] (+)** — заряжен положительно (источник откачивает с него электроны). К нему притягиваются отрицательные **анионы** (`Cl^{−}`), отдают электроны и **окисляются** (`2Cl^{−} − 2e⁻ → Cl2^{0}↑`)."]}, {"svg": "<svg viewBox='0 0 460 205' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='205' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='22' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>Электролиз расплава NaCl (воды нет!)<\/text><rect x='178' y='34' width='104' height='26' rx='6' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.6'/><text x='230' y='51' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12' font-weight='700'>− Источник +<\/text><polyline points='178,47 104,47 104,76' fill='none' stroke='var(--svg-blue,#60a5fa)' stroke-width='2'/><polyline points='282,47 356,47 356,76' fill='none' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><rect x='46' y='88' width='368' height='104' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)' stroke-width='2'/><rect x='90' y='76' width='28' height='86' rx='4' fill='var(--svg-blue,#60a5fa)' opacity='0.85'/><text x='104' y='118' text-anchor='middle' fill='var(--svg-bg,#0f1824)' font-size='15' font-weight='700'>−<\/text><text x='104' y='182' text-anchor='middle' fill='var(--svg-blue,#60a5fa)' font-size='12' font-weight='700'>Катод: Na⁺ + e⁻ → Na<\/text><rect x='342' y='76' width='28' height='86' rx='4' fill='var(--svg-bad,#ef6b6b)' opacity='0.85'/><text x='356' y='118' text-anchor='middle' fill='var(--svg-bg,#0f1824)' font-size='15' font-weight='700'>+<\/text><text x='356' y='182' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='12' font-weight='700'>Анод: 2Cl⁻ − 2e⁻ → Cl₂↑<\/text><circle cx='215' cy='112' r='16' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='215' y='117' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Na⁺<\/text><line x1='196' y1='112' x2='130' y2='112' stroke='var(--svg-blue,#60a5fa)' stroke-width='2'/><polygon points='125,112 135,107 135,117' fill='var(--svg-blue,#60a5fa)'/><circle cx='245' cy='144' r='16' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='1.5'/><text x='245' y='149' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Cl⁻<\/text><line x1='264' y1='144' x2='330' y2='144' stroke='var(--svg-bad,#ef6b6b)' stroke-width='2'/><polygon points='335,144 325,139 325,149' fill='var(--svg-bad,#ef6b6b)'/><\/svg>", "cap": "Запомнить просто по первым буквам: Катионы → Катод (восстановление); Анионы → Анод (окисление)."}, {"hint": "При электролизе **постоянный ток** обязателен! Если подать переменный ток, электроды будут менять знак 50 раз в секунду, и разделения продуктов не произойдёт. И не путай электролиз с диссоциацией: диссоциация — самопроизвольный распад вещества на ионы при растворении/плавлении, а электролиз — ОВР под действием тока.", "t": "Почему нужен именно постоянный ток?"}, {"h": "2. Электролиз расплавов: когда воды нет, конкуренции нет"}, {"p": "В расплаве присутствуют **только ионы самого вещества** — молекул воды нет, поэтому каждый ион разряжается на своём электроде без всякой конкуренции. Именно электролизом расплавов в промышленности получают все активные металлы (`Li`, `Na`, `K`, `Ca`, `Mg`, `Al`) и самый активный неметалл — **фтор (`F2`)**."}, {"steps": ["**Расплав хлорида натрия (`NaCl`):**\nКатод (–): `Na^{+} + e⁻ → Na` (×2)\nАнод (+): `2Cl^{−} − 2e⁻ → Cl2↑` (×1)\nСуммарно: `2NaCl(расплав) —электролиз→ 2Na + Cl2↑`.", "**Расплав фторида калия (`KF`):** единственный способ получить фтор `F2`!\nКатод (–): `K^{+} + e⁻ →
