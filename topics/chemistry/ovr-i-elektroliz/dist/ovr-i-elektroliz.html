K` (×2)\nАнод (+): `2F^{−} − 2e⁻ → F2↑` (×1)\nСуммарно: `2KF(расплав) —электролиз→ 2K + F2↑`.", "**Расплав щёлочи (`NaOH`):** на катоде металл, на аноде окисляются `OH^{−}` до кислорода и воды:\nКатод (–): `Na^{+} + e⁻ → Na` (×4)\nАнод (+): `4OH^{−} − 4e⁻ → O2↑ + 2H2O↑` (×1)\nСуммарно: `4NaOH(расплав) —электролиз→ 4Na + O2↑ + 2H2O↑`.", "**Расплав гидрида (`NaH`):** здесь водород имеет СО `−1` (`H^{−}`), поэтому идёт к **аноду (+)**!\nКатод (–): `Na^{+} + e⁻ → Na` (×2)\nАнод (+): `2H^{−} − 2e⁻ → H2↑` (×1)\nСуммарно: `2NaH(расплав) —электролиз→ 2Na + H2↑`.", "**Получение алюминия (`Al2O3` в расплаве [[Криолит|криолита]] `Na3AlF6`):**\nКатод (–): `Al^{3+} + 3e⁻ → Al` (×4)\nАнод (+): `2O^{2−} − 4e⁻ → O2↑` (×3)\nСуммарно: `2Al2O3(расплав в Na3AlF6) —электролиз→ 4Al + 3O2↑`."]}, {"eq": ["2NaCl(расплав) —электролиз→ 2Na + Cl2↑", "2KF(расплав) —электролиз→ 2K + F2↑", "4NaOH(расплав) —электролиз→ 4Na + O2↑ + 2H2O↑", "2Al2O3(расплав в Na3AlF6) —электролиз→ 4Al + 3O2↑"], "sm": true}, {"warn": "**Две частые ловушки по расплавам в № 20:**\n1. **Почему алюминий получают из `Al2O3` в криолите, а не из расплава `AlCl3`?** Безводный `AlCl3` имеет ковалентную полярную связь и молекулярную решётку: при нагревании (~180 °C) он возгоняется, а его расплав практически не содержит ионов и **не проводит электрический ток**. А чистый `Al2O3` плавится выше 2050 °C — добавка криолита `Na3AlF6` снижает температуру электролиза примерно до 950 °C.\n2. **Кислородсодержащие соли (`KNO3`, `Na2CO3`, `Na2SO4`)** в расплаве при нагревании часто термически разлагаются ещё до электролиза или дают сложные продукты — в № 20 ЕГЭ для расплавов обычно спрашивают галогениды (`NaCl`, `KCl`, `CaCl2`, `MgCl2`, `KF`), щёлочи (`NaOH`, `KOH`) и `Al2O3` в криолите.", "t": "Ловушка ЕГЭ: AlCl3 vs Al2O3 в криолите"}, {"bridge": {"kim": "№ 20 КИМ (базовый, 1 балл)", "ask": "Установить продукты электролиза расплава соли/щёлочи или выбрать способ получения активного металла (`Na`, `K`, `Ca`, `Mg`, `Al`) либо фтора (`F2`).", "watch": "Всегда ищи в условии слово **«расплав»** или **«водный раствор»** — от одного этого слова ответ меняется на противоположный!", "tip": "Если вещество в расплаве — мысленно вычеркни воду и разряжай прямо катион на катоде и анион на аноде."}}], "short": [{"list": ["Электролиз — вынужденная ОВР под действием постоянного тока: на катоде (–) идёт восстановление, на аноде (+) — окисление.", "В расплаве воды нет, поэтому на катоде всегда выделяется металл (даже `Na`, `K`, `Ca`, `Mg`, `Al`), а на аноде — продукт окисления аниона (даже `F2` из `KF`).", "Расплав щёлочи (`NaOH`) даёт металл на катоде и `O2 + H2O` на аноде; расплав гидрида (`NaH`) даёт металл на катоде и `H2` на аноде.", "Алюминий в промышленности получают электролизом раствора `Al2O3` в расплаве криолита `Na3AlF6`, а не расплава `AlCl3`."]}]}, {"id": "08", "group": "Электролиз (№ 20)", "nav": "Растворы: катод и анод", "codes": ["1.13"], "eyebrow": "08 · Код 1.13 · Задание № 20 (1 балл)", "title": "Электролиз водных растворов: правила катода и анода", "lead": "Почему при электролизе водного раствора поваренной соли `NaCl` на катоде выделяется водород, а не натрий, а из раствора фторида натрия `NaF` на аноде летит кислород, а не фтор?", "b": [{"key": "В водном растворе на обоих электродах с ионами соли конкурируют молекулы воды (`H2O`). Кто легче принимает электроны — тот побеждает на **катоде**; кто легче отдаёт электроны — тот побеждает на **аноде**.", "t": "Главная мысль."}, {"h": "1. Официальный ориентир ЕГЭ: электрохимический ряд напряжений"}, {"p": "На экзамене тебе выдадут официальный справочный лист ФИПИ — в самом низу под таблицей растворимости напечатан **электрохимический ряд напряжений металлов**. Именно по нему (а не по памяти!) нужно делить катионы на три зоны."}, {"fig": "fipi-solubility-series", "file": "fipi-solubility-series.png", "cap": "Официальная таблица растворимости и электрохимический ряд напряжений ФИПИ ЕГЭ-2027. Две опорные границы на катоде — алюминий (Al) и водород (H2)."}, {"h": "2. Правило катода (–): три зоны ряда напряжений"}, {"p": "На катоде идёт **восстановление** (приём электронов). Активные металлы (`Li–Al`) очень легко отдают электроны, но крайне неохотно принимают их обратно, поэтому в воде вместо них восстанавливается вода (`2H2O + 2e⁻ → H2↑ + 2OH^{−}`). Неактивные металлы (`Cu–Au`) наоборот охотно принимают электроны и полностью высаживаются на катоде. У металлов посередине (`Mn–Pb`) силы с водой сравнимы — идут **оба процесса одновременно**!"}, {"svg": "<svg viewBox='0 0 460 228' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='228' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='22' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>Инертные электроды в водном растворе: катод и анод<\/text><text x='18' y='44' fill='var(--svg-blue,#60a5fa)' font-size='13' font-weight='700'>КАТОД (−): восстановление (ряд ФИПИ; H⁺ → H₂↑)<\/text><rect x='14' y='52' width='140' height='58' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)' stroke-width='1.5'/><text x='84' y='71' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Li ... Al и NH₄⁺<\/text><text x='84' y='88' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12' font-weight='700'>только H₂↑<\/text><text x='84' y='103' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>(из воды)<\/text><rect x='160' y='52' width='140' height='58' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.5'/><text x='230' y='71' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Mn ... Pb (Fe, Zn, Cr)<\/text><text x='230' y='88' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12' font-weight='700'>Me и H₂↑<\/text><text x='230' y='103' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>(металл + вода)<\/text><rect x='306' y='52' width='140' height='58' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><text x='376' y='71' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Cu, Hg, Ag, Pt, Au<\/text><text x='376' y='88' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='12' font-weight='700'>только Me<\/text><text x='376' y='103' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>(после H₂)<\/text><text x='18' y='136' fill='var(--svg-bad,#ef6b6b)' font-size='13' font-weight='700'>АНОД (+): окисление (смотрим анион)<\/text><rect x='14' y='144' width='140' height='68' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)' stroke-width='1.5'/><text x='84' y='164' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>Cl⁻, Br⁻, I⁻, S²⁻<\/text><text x='84' y='182' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='12' font-weight='700'>Cl₂, Br₂, I₂, S<\/text><text x='84' y='200' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>кроме F⁻!<\/text><rect x='160' y='144' width='140' height='68' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-bad,#ef6b6b)' stroke-width='1.5'/><text x='230' y='164' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>F⁻, оксоанионы, OH⁻<\/text><text x='230' y='182' text-anchor='middle' fill='var(--svg-bad,#ef6b6b)' font-size='12' font-weight='700'>O₂↑<\/text><text x='230' y='200' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>SO₄²⁻, NO₃⁻, PO₄³⁻…<\/text><rect x='306' y='144' width='140' height='68' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-acc,#14b8a6)' stroke-width='1.5'/><text x='376' y='164' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>RCOO⁻ (Кольбе)<\/text><text x='376' y='182' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='12' font-weight='700'>R–R + CO₂↑<\/text><text x='376' y='200' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>CH₃COO⁻ → C₂H₆+CO₂<\/text><\/svg>", "cap": "Вся схема задания № 20 для водных растворов на инертных электродах в одном взгляде."}, {"table": [["Катион в растворе", "Продукт на инертном катоде (–)", "Уравнение катодного процесса"], ["`Li^{+}` … `Al^{3+}` (до `Al` включительно) и `NH4^{+}`", "**Только водород (`H2`)**", "`2H2O + 2e⁻ → H2↑ + 2OH^{−}`"], ["`Mn^{2+}` … `Pb^{2+}` (`Mn`, `Zn`, `Cr`, `Fe`, `Cd`, `Co`, `Ni`, `Sn`, `Pb`)", "**Металл (`Me`) и водород (`H2`)**", "`Me^{n+} + n e⁻ → Me` и `2H2O + 2e⁻ → H2↑ + 2OH^{−}`"], ["`Cu^{2+}` … `Au^{3+}` (`Cu`, `Hg`, `Ag`, `Pt`, `Au`)", "**Только металл (`Me`)**", "`Me^{n+} + n e⁻ → Me`"], ["`H^{+}` (водные растворы кислот)", "**Водород (`H2`)**", "`2H^{+} + 2e⁻ → H2↑`"]]}, {"h": "3. Правило анода (+): бескислородные, кислородные, F⁻ и синтез Кольбе"}, {"p": "На инертном аноде (графит, платина) идёт **окисление** (отдача электронов):"}, {"list": ["**Бескислородные анионы (`Cl^{−}`, `Br^{−}`, `I^{−}`, `S^{2−}`), КРОМЕ `F^{−}`:** окисляются сами до простого вещества (`2Cl^{−} − 2e⁻ → Cl2↑`, `2Br^{−} − 2e⁻ → Br2`, `2I^{−} − 2e⁻ → I2↓`, `S^{2−} − 2e⁻ → S↓`).", "**Кислородсодержащие анионы (`SO4^{2−}`, `NO3^{−}`, `PO4^{3−}`, `CO3^{2−}`, `SiO3^{2−}`, `ClO4^{−}` и др.) и фторид-ион `F^{−}`:** прочно держат свои электроны (фтор — самый электроотрицательный элемент, а в оксоанионах центральный атом уже в высшей СО). Вместо них окисляется вода с выделением **кислорода `O2↑`**: `2H2O − 4e⁻ → O2↑ + 4H^{+}`.", "**Гидроксид-ионы `OH^{−}` (щёлочи):** окисляются до **кислорода `O2↑`** и воды: `4OH^{−} − 4e⁻ → O2↑ + 2H2O`.", "**Анионы карбоновых кислот (`RCOO^{−}` — ацетаты, пропионаты и др.):** протекает [[Синтез Кольбе|синтез Кольбе]] — отщепляется `CO2↑`, а углеводородные радикалы удваиваются в симметричный алкан `R–R`: `2CH3COO^{−} − 2e⁻ → C2H6↑ + 2CO2↑`."]}, {"warn": "**Четыре главные ловушки водных растворов в № 20:**\n1. **Фториды (`NaF`, `KF`, `CuF2`, `HF`):** на аноде в водном растворе **всегда `O2↑`**, а НЕ фтор! Фтор `F2` получают только из расплава.\n2. **Металлы средней активности (`Fe`, `Zn`, `Cr`, `Ni`, `Sn`, `Pb`):** в № 20 на катоде выбирай вариант **«металл и водород»**, а не «только металл»! (Даже для `FeCl3`: `Fe^{3+}` восстанавливается ступенчато до `Fe^{2+}` и далее параллельно `Fe` и `H2`, в рамках № 20 ответ — металл и водород.)\n3. **Соли аммония (`NH4Cl`, `(NH4)2SO4`):** ион `NH4^{+}` в № 20 ведёт себя как активный металл — главный продукт на катоде **водород (`H2`)**.\n4. **Кислые соли активных металлов и оксокислот (`KHSO4`, `NaHCO3`, `NaH2PO4`):** на катоде выделяется `H2`, на аноде — `O2` (фактически электролиз воды).", "t": "Ловушки на 100 баллов: F⁻, средняя активность и NH4⁺"}, {"h": "4. Пошаговый разбор пяти солей в водном растворе"}, {"steps": ["**`NaF` (водн. р-р):** `Na^{+}` стоит до `Al` → катод **`H2`**. `F^{−}` — исключение среди бескислородных → анод **`O2`**.", "**`CuCl2` (водн. р-р):** `Cu^{2+}` стоит после `H2` → катод **`Cu`**. `Cl^{−}` — бескислородный (не `F^{−}`) → анод **`Cl2`**.", "**`Fe(NO3)2` (водн. р-р):** `Fe^{2+}` стоит между `Al` и `H2` → катод **`Fe` и `H2`**. `NO3^{−}` — кислородсодержащий → анод **`O2`**.", "**`AgNO3` (водн. р-р):** `Ag^{+}` стоит после `H2` → катод **`Ag`**. `NO3^{−}` — кислородсодержащий → анод **`O2`**.", "**`CH3COOK` (водн. р-р):** `K^{+}` стоит до `Al` → катод **`H2`**. `CH3COO^{−}` — карбоксилат (синтез Кольбе) → анод **`C2H6` и `CO2`**."]}, {"bridge": {"kim": "№ 20 КИМ (базовый, 1 балл)", "ask": "Установите соответствие между формулой соли и продуктом электролиза её водного раствора на катоде (или на аноде).", "watch": "Внимательно проверь, про **катод** или про **анод** спрашивают в заголовке таблицы! Перепутать столбцы — самая обидная потеря балла.", "tip": "Для каждой соли расписывай в черновике пару «К: … | А: …» с опорой на ряд напряжений из выданного бланка ФИПИ."}}], "short": [{"list": ["Катод (–) в водном растворе: `Li–Al` и `NH4^{+}` → только `H2`; `Mn–Pb` → металл и `H2`; `Cu–Au` → только металл; `H^{+}` кислот → `H2`.", "Анод (+) в водном растворе: `Cl^{−}`, `Br^{−}`, `I^{−}`, `S^{2−}` → неметалл; `F^{−}`, кислородсодержащие анионы и `OH^{−}` → `O2`.", "Анионы карбоновых кислот (`RCOO^{−}`) на аноде дают симметричный алкан `R–R` и `CO2` (синтез Кольбе).", "Фтор `F2` и активные металлы (`Li–Al`) из водных растворов электролизом получить нельзя."]}]}, {"id": "09", "group": "Электролиз (№ 20)", "nav": "Уравнения, pH и № 34", "codes": ["1.13"], "eyebrow": "09 · Код 1.13 · Тонкости на 100 баллов", "title": "Суммарные уравнения электролиза, среда и тонкости на 100 баллов", "lead": "Почему при электролизе раствора сульфата натрия `Na2SO4` количество самой соли вообще не меняется, а раствор сульфата меди `CuSO4` постепенно становится кислым?", "b": [{"key": "Чтобы составить полное уравнение электролиза раствора, сложи катодную и анодную полуреакции (уравняв электроны) и допиши оставшиеся в растворе «ионы-наблюдатели». У катода при разложении воды образуются `OH^{−}` (щелочная среда), у анода — `H^{+}` (кислая среда).", "t": "Главная мысль."}, {"h": "1. Четыре базовых типа суммарных уравнений электролиза растворов"}, {"p": "Сложим полуреакции из модуля 08 для всех четырёх комбинаций катиона и аниона (инертные электроды):"}, {"table": [["Тип соли", "Катод (–) / Анод (+)", "Что остаётся в растворе", "Суммарное уравнение электролиза"], ["**1. Активный металл + бескислородный анион** (`KCl`, `NaBr`)", "`H2↑` (+ `OH^{−}`) / `Cl2↑`", "Щёлочь `KOH` (pH растёт!)", "`2KCl + 2H2O —электролиз→ H2↑ + Cl2↑ + 2KOH`"], ["**2. Неактивный металл + оксоанион** (`CuSO4`, `AgNO3`)", "`Cu` / `O2↑` (+ `H^{+}`)", "Кислота `H2SO4` (pH падает!)", "`2CuSO4 + 2H2O —электролиз→ 2Cu + O2↑ + 2H2SO4`"], ["**3. Неактивный металл + бескислородный анион** (`CuCl2`)", "`Cu` / `Cl2↑`", "Вода не участвует, соль просто расходуется", "`CuCl2(р-р) —электролиз→ Cu + Cl2↑`"], ["**4. Активный металл + оксоанион или `F^{−}`** (`Na2SO4`, `KNO3`, `NaF`)", "`H2↑` (+ `OH^{−}`) / `O2↑` (+ `H^{+}`)", "`H^{+}` и `OH^{−}` нейтрализуются; **идёт электролиз воды**!", "`2H2O —электролиз→ 2H2↑ + O2↑`"]]}, {"hint": "Тот же четвёртый результат — **фактический электролиз воды** (`2H2O —электролиз→ 2H2↑ + O2↑`) — дают водные растворы **щелочей** (`NaOH`, `KOH`) и **кислородсодержащих кислот** (`H2SO4`, `HNO3`, `H3PO4`) + `HF`. Соль, кислота или щёлочь в этом случае служат только переносчиками тока (электролитом), их масса в растворе не меняется, а массовая доля растёт за счёт убыли воды!", "t": "Почему в растворах Na2SO4, H2SO4 и NaOH разлагается только вода?"}, {"h": "2. Особые уравнения: синтез Кольбе, металлы средней активности и HCl"}, {"steps": ["**Электролиз водного раствора ацетата натрия (`CH3COONa` — синтез Кольбе):**\nКатод (–): `2H2O + 2e⁻ → H2↑ + 2OH^{−}`\nАнод (+): `2CH3COO^{−} − 2e⁻ → C2H6↑ + 2CO2↑`\nВ растворе остаются `Na^{+}` и `OH^{−}` → `2NaOH`:\n`2CH3COONa + 2H2O —электролиз→ C2H6↑ + 2CO2↑ + H2↑ + 2NaOH`.", "**Электролиз водного раствора `HCl` / `HBr` / `HI`:** на катоде `H2↑` (из `H^{+}`), на аноде галоген:\n`2HCl(р-р) —электролиз→ H2↑ + Cl2↑`.", "**Электролиз водного раствора соли металла средней активности (`FeSO4`, `ZnSO4`, `ZnBr2`):** в задании № 20 на катоде всегда выбирай **металл и водород**. Для расчётных уравнений (№ 34) для оксосоли (`FeSO4`) параллельные процессы записывают как `2FeSO4 + 2H2O —электролиз→ 2Fe + O2↑ + 2H2SO4` и `2H2O —электролиз→ 2H2↑ + O2↑`, а для галогенида (`ZnBr2`) на аноде сначала окисляется `Br^{−}` (`ZnBr2(р-р) —электролиз→ Zn + Br2`), и только после расходования `Br^{−}` подключается электролиз воды.", "**Электролиз водного раствора `NH4Cl`:** на катоде выделяется `H2↑` (в № 20 продуктом на катоде считают **только `H2`**!), а образующийся рядом `OH^{−}` вторично связывает `NH4^{+}` в аммиак (`NH3`, аналогично `KOH` в растворе `KCl`); на аноде выделяется `Cl2↑`:\n`2NH4Cl(р-р) —электролиз→ H2↑ + Cl2↑ + 2NH3↑`."]}, {"eq": ["2CH3COONa + 2H2O —электролиз→ C2H6↑ + 2CO2↑ + H2↑ + 2NaOH", "2CuSO4 + 2H2O —электролиз→ 2Cu + O2↑ + 2H2SO4", "2KCl + 2H2O —электролиз→ H2↑ + Cl2↑ + 2KOH"], "sm": true}, {"h": "3. Последовательный электролиз (мост к задаче № 34)"}, {"p": "Что происходит, если электролиз раствора `CuSO4` или `NaCl` не остановить в момент, когда вся соль израсходовалась? Ток продолжает идти — и начинается **второй этап**: электролиз оставшейся воды!"}, {"svg": "<svg viewBox='0 0 460 158' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='158' rx='12' fill='var(--svg-bg,#0f1824)'/><text x='230' y='22' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>Последовательный электролиз раствора CuSO₄<\/text><rect x='16' y='40' width='192' height='100' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-acc,#14b8a6)' stroke-width='1.8'/><text x='112' y='60' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='13' font-weight='700'>Этап 1: пока есть CuSO₄<\/text><text x='112' y='82' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12'>Катод: Cu²⁺ + 2e⁻ → Cu<\/text><text x='112' y='100' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12'>Анод: O₂↑ (+ H₂SO₄)<\/text><text x='112' y='124' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>Раствор синий → бледнеет<\/text><line x1='212' y1='90' x2='246' y2='90' stroke='var(--svg-gold,#e5a93c)' stroke-width='2.5'/><polygon points='250,90 240,85 240,95' fill='var(--svg-gold,#e5a93c)'/><text x='230' y='78' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12' font-weight='700'>соль<\/text><text x='230' y='110' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='12' font-weight='700'>0 моль<\/text><rect x='254' y='40' width='190' height='100' rx='10' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.8'/><text x='349' y='60' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='13' font-weight='700'>Этап 2: электролиз воды<\/text><text x='349' y='82' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12'>Катод: H₂↑ (из H₂O/H⁺)<\/text><text x='349' y='100' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12'>Анод: O₂↑<\/text><text x='349' y='124' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>2H₂O → 2H₂↑ + O₂↑<\/text><\/svg>", "cap": "В задачах № 34 сигнал к началу второго этапа — появление на катоде водорода H2 после осаждения всей меди."}, {"h": "4. Активный (растворимый) анод — граница правила инертных электродов"}, {"p": "Всё, что мы разбирали выше, относится к **инертным** электродам (графит, платина). Но если сделать анод из **активного (растворимого) металла** (например, из меди `Cu`, цинка `Zn`, серебра `Ag`), то атомы самого анода отдают электроны легче, чем вода и большинство анионов. Анод начинает **растворяться**:"}, {"eq": "Cu − 2e⁻ → Cu^{2+}"}, {"note": "Именно на растворимом аноде основано **электролитическое рафинирование меди**: на аноде грязная черновая медь растворяется (`Cu − 2e⁻ → Cu^{2+}`), а на катоде оседает чистейшая медь (`Cu^{2+} + 2e⁻ → Cu`). В задании № 20 по умолчанию всегда имеют в виду **инертные электроды**, если прямо не указано «с медным/цинковым анодом».", "t": "За рамками базового № 20 — для понимания и 100 баллов."}, {"bridge": {"kim": "№ 20 и № 34 КИМ", "ask": "Определить, что накапливается в растворе, как меняется pH у электродов или сколько газа выделилось после полного электролиза соли.", "watch": "При электролизе `KCl` (р-р) в растворе остаётся щёлочь `KOH` (при смешивании с `Cl2` она дала бы `KClO` — в промышленности пространства разделяют диафрагмой!).", "tip": "Если на катоде выделился `H2` из воды → рядом остались `OH^{−}` (щёлочь). Если на аноде выделился `O2` из воды → рядом остались `H^{+}` (кислота)."}}], "short": [{"list": ["Разложение воды на катоде даёт `H2↑` + `OH^{−}` (подщелачивание), на аноде — `O2↑` + `H^{+}` (подкисление).", "`Na2SO4`, `KNO3`, `NaF`, `NaOH`, `H2SO4` в водном растворе сводятся к электролизу воды (`2H2O —электролиз→ 2H2↑ + O2↑`).", "В растворе `KCl` образуется `KOH` (+ `H2↑` + `Cl2↑`), в растворе `CuSO4` — `H2SO4` (+ `Cu` + `O2↑`), в `CH3COONa` — `NaOH` (+ `C2H6↑` + `CO2↑` + `H2↑`).", "После полного расходования соли ток начинает разлагать воду (последовательный электролиз в № 34).", "На растворимом (активном) аноде окисляется сам металл анода (`Cu − 2e⁻ → Cu^{2+}`)."]}]}, {"id": "10", "group": "Электролиз (№ 20)", "nav": "Форматы № 20 и получение", "codes": ["1.13"], "eyebrow": "10 · Код 1.13 · Задание № 20 (1 балл)", "title": "Все форматы задания № 20 КИМ и промышленные способы получения", "lead": "Почему в одном варианте № 20 спрашивают, что выделится на катоде, а в другом просят выбрать способ получения калия, алюминия, фтора или хлора? Обе формулировки решаются одними и теми же правилами, но с разной точкой входа.", "b": [{"key": "В задании № 20 встречаются **три типа таблиц соответствия**: 1) вещество → продукт на катоде (или аноде); 2) вещество → продукты на обоих электродах; 3) вещество (металл/неметалл) → промышленный способ его получения электролизом.", "t": "Главная мысль."}, {"h": "1. Промышленные способы получения веществ электролизом"}, {"p": "В третьем формате № 20 слева даны простые вещества (`Na`, `Al`, `F2`, `Cl2`, `Cu`, `H2`, `O2`), а справа — варианты вроде «электролиз расплава соли», «электролиз водного раствора соли», «электролиз раствора оксида в расплаве криолита». Чтобы выбрать без ошибок, используй дерево решений:"}, {"tree": {"t": "Как получить вещество электролизом (навигатор № 20)", "root": {"q": "Нужно получить активный металл (Li, Na, K, Ca, Mg, Al) или фтор (F2)?", "yes": {"q": "Это алюминий (Al)?", "yes": {"a": "Электролиз раствора Al2O3 в расплаве криолита (Na3AlF6)", "why": "Из водного раствора Al не выделяется (идёт H2), а безводный AlCl3 не проводит ток в расплаве."}, "no": {"a": "Только электролиз РАСПЛАВА соли (или щёлочи для Na/K)", "why": "В водном растворе вместо Li–Mg выделяется H2, а вместо F2 выделяется O2."}}, "no": {"q": "Нужно получить Cl2, Br2, I2, H2, O2, NaOH или неактивный металл (Cu, Ag, Au)?", "yes": {"a": "Электролиз ВОДНОГО РАСТВОРА подходящей соли (или щёлочи/кислоты)", "why": "Водный раствор энергоэкономичнее расплава: Cl2, H2 и NaOH в промышленности получают электролизом раствора NaCl; Cu и Ag — из растворов CuSO4/AgNO3."}, "no": {"a": "Металлы средней активности (Zn, Fe, Ni, Cr): водный раствор даёт Me + H2 (также применяют пирометаллургию)", "why": "При электролизе раствора соли металла между Al и H2 на катоде выделяются и металл, и водород."}}}}}, {"table": [["Что нужно получить", "Правильный способ электролиза в № 20", "Почему не подходит альтернатива"], ["`Na`, `K`, `Li`, `Ca`, `Mg`", "Электролиз **расплава** хлорида (`NaCl`, `KCl`, `CaCl2`, `MgCl2`) или `NaOH(расплав)`", "В водном растворе на катоде выделится `H2`, а не металл"], ["`Al`", "Электролиз **раствора `Al2O3` в расплаве криолита (`Na3AlF6`)**", "Водный раствор даёт `H2`; расплав `AlCl3` не проводит ток"], ["`F2`", "Электролиз **расплава** фторида (`KF`, `NaF` / `KHF2`)", "В водном растворе на аноде выделится `O2`, а не `F2`"], ["`Cl2`, `H2`, `NaOH`/`KOH`", "Электролиз **водного раствора** `NaCl` (или `KCl`)", "Из расплава `NaCl` получатся `Na` и `Cl2` (без `H2` и `NaOH`!)"], ["`Cu`, `Ag`, `Hg`", "Электролиз **водного раствора** соли (`CuSO4`, `CuCl2`, `AgNO3`)", "Стоят после `H2` — полностью восстанавливаются из раствора"], ["`O2`", "Электролиз **водного раствора** `Na2SO4`, `KNO3`, `NaOH`, `H2SO4`, `NaF`", "Анионы не окисляются — на аноде окисляется вода/OH⁻ до `O2`"]]}, {"h": "2. Восемь главных ловушек задания № 20"}, {"list": ["**Ловушка 1 — не замечено слово «расплав»:** для `NaCl(расплав)` на катоде `Na`, для `NaCl(р-р)` на катоде `H2`.", "**Ловушка 2 — фторид в растворе:** `NaF(р-р)`, `CuF2(р-р)`, `AgF(р-р)` на аноде всегда дают **`O2`**, никогда не `F2`.", "**Ловушка 3 — металлы средней активности (`Mn–Pb`):** для `ZnSO4`, `FeCl2`, `FeCl3`, `Cr2(SO4)3`, `Ni(NO3)2`, `SnCl2`, `Pb(NO3)2` на катоде всегда **«металл и водород»**, не «только металл».", "**Ловушка 4 — ртуть (`Hg`) и медь (`Cu`) vs свинец (`Pb`):** `Pb` стоит **до `(H2)`** (даёт `Pb` и `H2`), а `Cu`, `Hg`, `Ag` стоят **после `(H2)`** (дают только металл). Всегда сверяйся с рядом на бланке!", "**Ловушка 5 — соли аммония (`NH4Cl`, `NH4NO3`):** на катоде выделяется **`H2`** (как у активных металлов).", "**Ловушка 6 — органические соли (`CH3COONa`, `C2H5COOK`):** на аноде образуются **алкан (`C2H6`, `C4H10`) и `CO2`**, а не кислород!", "**Ловушка 7 — перепутаны катод и анод:** катод (–) = **катионы** (металл / `H2`), анод (+) = **анионы** (галоген / `S` / `O2` / `R–R + CO2`).", "**Ловушка 8 — `AlCl3` вместо `Al2O3`:** алюминий получают электролизом `Al2O3` в расплаве криолита, а не расплава `AlCl3`."]}, {"h": "3. Пошаговый разбор двух реальных прототипов задания № 20"}, {"steps": ["**Прототип 1 (продукты на инертных электродах):** установите соответствие между формулой соли и продуктами электролиза её **водного раствора** на инертных электродах:\nА) `AgNO3` · Б) `NaF` · В) `ZnCl2`\nВарианты: 1) металл и кислород; 2) водород и кислород; 3) водород и фтор; 4) металл, водород и хлор; 5) металл и хлор.\n- **А (`AgNO3`):** `Ag^{+}` после `H2` → только `Ag`; `NO3^{−}` оксоанион → `O2` → **1 (металл и кислород)**.\n- **Б (`NaF`):** `Na^{+}` до `Al` → `H2`; `F^{−}` в растворе не окисляется → `O2` → **2 (водород и кислород)** (ловушка — вариант 3!).\n- **В (`ZnCl2`):** `Zn^{2+}` между `Al` и `H2` → `Zn` и `H2`; `Cl^{−}` бескислородный → `Cl2` → **4 (металл, водород и хлор)** (ловушка — вариант 5!).\n**Ответ:** `124`.", "**Прототип 2 (промышленное получение веществ):** установите соответствие между веществом и способом его получения электролизом:\nА) калий · Б) алюминий · В) фтор\nВарианты: 1) электролиз водного раствора `KF`; 2) электролиз расплава `KCl`; 3) электролиз расплава `NaF`; 4) электролиз раствора `Al2O3` в расплаве криолита; 5) электролиз водного раствора `Al2(SO4)3`.\n- **А (калий):** активный металл до `Al` → только расплав соли калия (`KCl`) → **2**.\n- **Б (алюминий):** только раствор `Al2O3` в расплаве криолита → **4**.\n- **В (фтор):** только расплав фторида (`NaF`) → **3** (вариант 1 — ловушка, из водного раствора `KF` выделится `O2`!).\n**Ответ:** `243`."]}, {"bridge": {"kim": "№ 20 КИМ (базовый, 1 балл)", "ask": "Записать 3 цифры в таблицу соответствия (А, Б, В) — порядок важен, цифры могут повторяться.", "watch": "В № 20 за одну неверную цифру ставят сразу **0 баллов** (максимум 1 балл), поэтому каждая позиция должна быть проверена по ряду напряжений.", "tip": "Чек-лист перед записью ответа: 1) расплав или раствор? 2) катод, анод или оба? 3) есть ли среди солей `F^{−}`, `NH4^{+}`, `Mn–Pb` или ацетат?"}}], "short": [{"list": ["Три формата № 20: продукт на одном электроде, продукты на обоих электродах и способ получения вещества электролизом.", "Активные металлы (`Li–Mg`) и `F2` получают только электролизом расплавов; `Al` — электролизом `Al2O3` в расплаве криолита.", "`Cl2`, `H2`, `NaOH`, `Cu`, `Ag`, `O2` получают электролизом водных растворов соответствующих солей.", "Всегда проверяй три слова в условии: «расплав / раствор», «катод / анод» и положение металла относительно `Al` и `(H2)` в ряду ФИПИ."]}]}], "gloss": [["Степень окисления", "Условный заряд атома в соединении, вычисленный из предположения, что все связи ионные; записывается со знаком перед цифрой.", "В KMnO4: Mn^{+7}, O^{−2}; в H2O2: O^{−1}."], ["Заряд иона", "Реальный или формальный заряд заряженной частицы в растворе или кристалле; записывается цифрой перед знаком.", "Mn^{2+}, Cr^{3+}, SO4^{2−}, Cr2O7^{2−}."], ["Окислитель", "Реагент (или атом в нём), который принимает электроны и понижает свою степень окисления.", "KMnO4 (за счёт Mn^{+7}), Cl2, HNO3(конц.)."], ["Восстановитель", "Реагент (или атом в нём), который отдаёт электроны и повышает свою степень окисления.", "KI (за счёт I^{−1}), FeSO4 (за счёт Fe^{+2}), металлы."], ["Окисление", "Процесс отдачи электронов восстановителем, сопровождающийся повышением степени окисления.", "2I^{−1} − 2e⁻ → I2^{0}."], ["Восстановление", "Процесс присоединения электронов окислителем, сопровождающийся понижением степени окисления.", "Mn^{+7} + 5e⁻ → Mn^{+2}."], ["Диспропорционирование", "ОВР самоокисления-самовосстановления, в которой атомы одного и того же элемента в одном веществе одновременно повышают и понижают степень окисления.", "Cl2 + 2KOH(хол.) → KCl + KClO + H2O."], ["Сопропорционирование", "ОВР конпропорционирования, в которой атомы одного элемента из разных степеней окисления переходят в одну промежуточную.", "2H2S + SO2 → 3S↓ + 2H2O."], ["Электронный баланс", "Метод подбора коэффициентов в ОВР, основанный на равенстве числа электронов, отданных восстановителем и принятых окислителем.", "В паре Mn^{+7} (+5e⁻) и Fe^{+2} (−1e⁻) множители 1 и 5."], ["Пассивация", "Образование на поверхности металла (Fe, Al, Cr) плотной защитной оксидной плёнки в холодных концентрированных HNO3 и H2SO4, останавливающей реакцию без нагревания.", "Fe + HNO3(конц., хол.) — реакция не идёт; при нагревании — идёт до Fe(NO3)3 + NO2."], ["Электролиз", "Окислительно-восстановительная реакция, протекающая на электродах при пропускании постоянного электрического тока через расплав или раствор электролита.", "2NaCl(расплав) —электролиз→ 2Na + Cl2↑."], ["Катод", "Отрицательно заряженный электрод (–) при электролизе, к которому движутся катионы и на котором всегда протекает процесс восстановления.", "Cu^{2+} + 2e⁻ → Cu (катод)."], ["Анод", "Положительно заряженный электрод (+) при электролизе, к которому движутся анионы и на котором всегда протекает процесс окисления.", "2Cl⁻ − 2e⁻ → Cl2↑ (анод)."], ["Инертный электрод", "Электрод из графита или платины, который проводит ток, но сам не окисляется и не растворяется в ходе электролиза.", "Графитовый анод при электролизе раствора CuSO4."], ["Активный (растворимый) анод", "Анод из металла (например, Cu, Zn, Ag), атомы которого при электролизе сами окисляются и переходят в раствор в виде катионов.", "Cu − 2e⁻ → Cu^{2+} при электрорафинировании меди."], ["Синтез Кольбе", "Анодное окисление карбоксилат-ионов при электролизе водных растворов солей карбоновых кислот с образованием удвоенного алкана и CO2.", "2CH3COO⁻ − 2e⁻ → C2H6↑ + 2CO2↑."], ["Криолит", "Минерал Na3AlF6, расплав которого служит растворителем для Al2O3 при промышленном электролизе алюминия, снижая температуру процесса с ~2050 °C до ~950 °C.", "2Al2O3(расплав в Na3AlF6) —электролиз→ 4Al + 3O2↑."]], "_img": {"fipi-solubility-series": {"data": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACSMAAAZ2CAIAAADVZbb1AAAACXBIWXMAAB7CAAAewgFu0HU+AAPOpUlEQVR4nOzdd5TUVP/H8YVdmvRelSZNBCmiFAFBbA8gYIOHLkUREQFRBMFzxIZiQ0ERxYY8jz6IUlRUVBSkSREsgEgRpEkRfpQFZNn53bP3eM/1Zkomk8xkhvfrD86S3GSS79xkknxmkrQAAAAAAAAAAAAAgOilJXoBAAAAAAAAAAAAgKRE0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAOEHSBgAAAAAAAAAAADhB0gYAAAAAAAAAAAA4QdIGAAAAAAAAAAAAO <script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const THEME_KEY='ege100-theme';
let T=null, S=null, FIGS={}, IMG={}, CHEM=false, RUS=false;

const THEMES=['auto','light','paper','dark'];
const THEME_LABELS={auto:'◐ Авто',light:'☀ Светлая',paper:'▤ Бумага',dark:'☾ Тёмная'};
function applyTheme(){
  const raw=LS.get(THEME_KEY,'auto');
  const t=THEMES.includes(raw)?raw:'auto';
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  $$('[data-theme-btn]').forEach(b=>{
    b.textContent=THEME_LABELS[t];
    b.title='Переключить тему оформления (Авто → Светлая → Бумага → Тёмная)';
  });
}
function toggleTheme(){
  const raw=LS.get(THEME_KEY,'auto');
  const i=THEMES.indexOf(raw);
  LS.set(THEME_KEY,THEMES[(i+1)%THEMES.length]);
  applyTheme();
}

const SUB='₀₁₂₃₄₅₆₇₈₉', SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻'};
function fmt(s, forceChem){
  if(s==null)return '';
  let h=esc(s);
  h=h.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,(m,t,l)=>'<button type="button" class="glink" data-term="'+esc(t)+'">'+(l||t)+'</button>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(«—])\*(?!\s)([^*]+?)\*(?=[\s,.;:!?)»—]|$)/g,'$1<em>$2</em>');
  h=h.replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>');
  h=h.replace(/`([^`\n]+?)`/g,'<code>$1</code>');
  // Русская разметка
  h=h.replace(/\{~([^}]+)\}/g,'<span class="ru-stress">$1\u0301</span>');
  h=h.replace(/\{!:([^}]*)\}/g,'<span class="ru-ortho">$1</span>');
  h=h.replace(/\{\((\d+)\)\}/g,'<span class="ru-pos">$1</span>');
  h=h.replace(/\{п:([^}]+)\}/g,'<span class="ru-m ru-p">$1</span>');
  h=h.replace(/\{к:([^}]+)\}/g,'<span class="ru-m ru-k">$1</span>');
  h=h.replace(/\{с:([^}]+)\}/g,'<span class="ru-m ru-s">$1</span>');
  h=h.replace(/\{о:([^}]+)\}/g,'<span class="ru-m ru-o">$1</span>');
  h=h.replace(/\{подл:([^}]+)\}/g,'<span class="ru-syn ru-podl">$1</span>');
  h=h.replace(/\{сказ:([^}]+)\}/g,'<span class="ru-syn ru-skaz">$1</span>');
  h=h.replace(/\{опр:([^}]+)\}/g,'<span class="ru-syn ru-opr">$1</span>');
  h=h.replace(/\{обст:([^}]+)\}/g,'<span class="ru-syn ru-obst">$1</span>');
  h=h.replace(/\{ввод:([^}]+)\}/g,'<span class="ru-vvod">$1</span>');
  if(CHEM || forceChem){
    h=h.split(/(<[^>]+>)/).map(p=>p[0]==='<'?p:p.replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')).join('');
  }
  return h.replace(/\n/g,'<br>');
}
function plain(s){
  return String(s==null?'':s)
    .replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,(m,t,l)=>l||t)
    .replace(/\*\*/g,'').replace(/\{[пксо!~]:([^}]*)\}/g,'$1').replace(/\{~([^}]+)\}/g,'$1')
    .replace(/\{(?:подл|сказ|опр|обст|ввод):([^}]+)\}/g,'$1').replace(/\{\((\d+)\)\}/g,'($1)')
    .replace(/`([^`\n]+?)`/g,'$1')
    .replace(/\^\{([^}]*)\}/g,(m,x)=>[...x].map(c=>SUP[c]||c).join('')).replace(/_\{([^}]*)\}/g,'$1');
}
const lines=v=>Array.isArray(v)?v:String(v==null?'':v).split('\n');
const body=v=>v==null?'':Array.isArray(v)?blocks(v):'<p>'+fmt(v)+'</p>';
const inl=v=>v==null?'':Array.isArray(v)?blocks(v):fmt(v);

function cleanSvg(src){
  try{
    const d=new DOMParser().parseFromString(String(src),'image/svg+xml');
    const svg=d.documentElement;
    if(!svg||svg.nodeName.toLowerCase()!=='svg')return '';
    svg.querySelectorAll('script,foreignObject').forEach(n=>n.remove());
    svg.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{
      if(/^on/i.test(a.name)||/javascript:/i.test(a.value))n.removeAttribute(a.name);
    }));
    return new XMLSerializer().serializeToString(svg);
  }catch(e){return '';}
}
function card(c){
  if(typeof c==='string')return '<div class="panel">'+body(c)+'</div>';
  return '<div class="panel">'+(c.tag?'<div class="eyebrow">'+fmt(c.tag)+'</div>':'')+(c.t?'<h3>'+fmt(c.t)+'</h3>':'')+(c.x?body(c.x):'')+(c.eq?R.eq(c.eq,{sm:1}):'')+(c.x2?body(c.x2):'')+(c.b?blocks(c.b):'')+(c.chip?'<span class="chip">'+fmt(c.chip)+'</span>':'')+'</div>';
}
const box=k=>(v,b)=>'<div class="panel '+k+'">'+(b.t?'<strong>'+fmt(b.t)+'</strong> ':'')+inl(v)+'</div>';

let TREE_ID=0;
function renderTreeStatic(node){

  return '<div class="tree-step"><div class="tree-q">'+fmt(node.q)+'</div><ul>'
    +(node.yes?'<li><b>Да →</b> '+renderTreeStatic(node.yes)+'</li>':'')

    +'</ul></div>';
}
function renderCompare(c){
  if(c.rows&&c.cols){
    const head=['Признак',...c.cols,'Почему важно'].slice(0,c.rows[0]?.length||4);
    return '<div class="cmp-wrap">'+(c.t?'<h4>'+fmt(c.t)+'</h4>':'')+R.table([head,...c.rows])+'</div>';
  }
  const side=(s)=>s?'<div class="cmp-card"><h4>'+fmt(s.title||'')+'</h4>'+(Array.isArray(s.items)?R.list(s.items):body(s.b||s.text||''))+'</div>':'';
  return '<div class="cmp-wrap">'+(c.t?'<h4>'+fmt(c.t)+'</h4>':'')+'<div class="cmp-cards">'+side(c.left)+side(c.right)+'</div></div>';
}

  table:v=>'<div class="tablewrap"><table><thead><tr>'+v[0].map(c=>'<th>'+fmt(c)+'</th>').join('')+'</tr></thead><tbody>'+v.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>',
  flow:v=>'<div class="mapflow">'+v.map((f,i)=>(i?'<div class="arrow">→</div>':'')+'<div class="flowbox"><strong>'+fmt(Array.isArray(f)?f[0]:f)+'</strong>'+(Array.isArray(f)&&f[1]?'<small>'+fmt(f[1])+'</small>':'')+'</div>').join('')+'</div>',
  more:(v,b)=>'<details'+(b.open?' open':'')+'><summary>'+fmt(v)+'</summary><div>'+body(b.b)+'</div></details>',
  svg:(v,b)=>'<div class="svgwrap" role="img"'+(b.cap?' aria-label="'+esc(plain(b.cap))+'"':'')+'>'+cleanSvg(v)+(b.cap?'<p class="small" style="margin:10px 0 0;text-align:center">'+fmt(b.cap)+'</p>':'')+'</div>',
  fig:(v,b)=>figBlock(v,b),
  bridge:v=>'<div class="bridge"><div class="bridge-head"><span class="eyebrow">Мост к КИМ ЕГЭ</span>'+(v.kim?'<span class="chip">'+fmt(v.kim)+'</span>':'')+'</div><div class="bridge-grid">'
    +(v.ask?'<div class="bridge-cell"><b>Как спрашивают</b>'+fmt(v.ask)+'</div>':'')
    +(v.watch?'<div class="bridge-cell"><b>На чём ловят</b>'+fmt(v.watch)+'</div>':'')
    +(v.tip?'<div class="bridge-cell"><b>Как читать условие</b>'+fmt(v.tip)+'</div>':'')
    +'</div></div>',
  compare:v=>renderCompare(v),
  tree:v=>{const tid='tr_'+(++TREE_ID);return '<div class="treebox" data-tree="'+tid+'"><div class="tree-head"><strong>'+fmt(v.t||'Алгоритм выбора')+'</strong><button type="button" class="ghost" data-tree-all="'+tid+'" style="padding:5px 10px;font-size:12.5px">Показать всю схему</button></div><div class="tree-interactive" id="'+tid+'"></div><div class="tree-static" id="'+tid+'_all" style="display:none">'+renderTreeStatic(v.root)+'</div></div>';},
  essay:v=>'<div class="essaybox"><div class="eyebrow">Разбор сочинения № 27</div>'+(v.t?'<h4>'+fmt(v.t)+'</h4>':'')+(v.prompt?'<p class="small"><strong>Задание/проблема:</strong> '+fmt(v.prompt)+'</p>':'')+(v.text?'<div class="essay-text">'+fmt(v.text)+'</div>':'')+(v.criteria?R.table([['Критерий','Аспект','Балл','Комментарий'],...v.criteria]):'')+'</div>'

function blk(b){if(b==null)return '';if(typeof b==='string')return '<p>'+fmt(b)+'</p>';if(Array.isArray(b))return blocks(b);const t=TYPES.find(k=>k in b);return t?R[t](b[t],b):'';}

function figView(id){

function figBlock(v,b){

function initTrees(){
  const store={};
  const walk=(v)=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(v.tree&&v.tree.root){store[v.tree.t||'']=v.tree;}for(const k in v)if(k!=='svg')walk(v[k]);}};
  (T.modules||[]).forEach(m=>walk(m.b));
  let idx=0;
  $$('.treebox').forEach(boxEl=>{
    idx++;
    const tid=boxEl.dataset.tree;
    const titleEl=$('.tree-head strong',boxEl);
    const titleTxt=titleEl?titleEl.textContent:'';
    let treeObj=null;
    const findTree=(v)=>{if(treeObj)return;if(Array.isArray(v))v.forEach(findTree);else if(v&&typeof v==='object'){if(v.tree&&plain(v.tree.t||'Алгоритм выбора')===titleTxt){treeObj=v.tree;return;}for(const k in v)if(k!=='svg')findTree(v[k]);}};
    (T.modules||[]).forEach(m=>findTree(m.b));
    if(!treeObj)return;
    const host=$('#'+tid,boxEl);
    const hist=[];
    function draw(node){
      if(!node)return;
      if(node.a!=null){
        host.innerHTML='<div class="tree-ans"><strong>Вывод:</strong> '+fmt(node.a)+(node.why?'<div class="small" style="margin-top:5px">'+fmt(node.why)+'</div>':'')+'</div><div class="actions" style="margin:10px 0 0"><button type="button" class="ghost" data-tback style="padding:5px 10px;font-size:12.5px">← Назад</button><button type="button" class="ghost" data-treset style="padding:5px 10px;font-size:12.5px">Сначала</button></div>';
      }else{
        host.innerHTML='<div class="tree-step"><div class="tree-q">'+fmt(node.q)+'</div><div class="actions" style="margin:8px 0 0">'
          +(node.yes?'<button type="button" class="btn" data-tyes style="padding:6px 14px">Да</button>':'')
          +(node.no?'<button type="button" class="ghost" data-tno style="padding:6px 14px">Нет</button>':'')
          +(hist.length?'<button type="button" class="ghost" data-tback style="padding:6px 10px;font-size:12.5px">← Шаг назад</button>':'')
          +'</div></div>';
      }
      const yb=$('[data-tyes]',host), nb=$('[data-tno]',host), bb=$('[data-tback]',host), rb=$('[data-treset]',host);
      if(yb)yb.onclick=()=>{hist.push(node);draw(node.yes);};
      if(nb)nb.onclick=()=>{hist.push(node);draw(node.no);};
      if(bb)bb.onclick=()=>{const prev=hist.pop();if(prev)draw(prev);};
      if(rb)rb.onclick=()=>{hist.length=0;draw(treeObj.root);};
    }
    draw(treeObj.root);
    const allBtn=$('[data-tree-all]',boxEl), allEl=$('#'+tid+'_all',boxEl);
    allBtn.onclick=()=>{
      const shown=allEl.style.display!=='none';
      allEl.style.display=shown?'none':'block';
      host.style.display=shown?'block':'none';
      allBtn.textContent=shown?'Показать всю схему':'Интерактивный режим';
    };
  });
}

  $('#app').innerHTML='<div class="layout"><aside class="side" aria-label="Навигация">'+side+'</aside><div>'+mob+'<main id="main">'+hero+guide+mods+audit+gloss+revision+'<footer>'+esc(plain(T.title))+' · ЕГЭ-100 · Автономный учебник</footer></main></div></div>';

  applyTheme();
  $$('[data-theme-btn]').forEach(b=>b.onclick=toggleTheme);
  initInteractive();
  jumpFromHash();
}

function initInteractive(){
  const M=T.modules||[], G=T.gloss||[];
  const save=()=>{
    LS.set('ege100:kon:'+T.id,S);
    if(window.EGE100Sync&&window.EGE100Sync.isConfigured()){
      window.EGE100Sync.syncGist().catch(()=>{});
    }
  };
  const upd=()=>{
    const n=M.filter(m=>S.completed[m.id]).length;
    if($('#sideProgress'))$('#sideProgress').textContent=n;
    if($('#sideBar'))$('#sideBar').style.width=(M.length?100*n/M.length:0)+'%';
    $$('.complete').forEach(b=>{
      const v=!!S.completed[b.dataset.complete];
      b.textContent=v?'✓ Модуль изучен':'Отметить модуль '+b.dataset.complete+' изученным';
      b.classList.toggle('btn',v);b.classList.toggle('ghost',!v);
    });
  };
  $$('.complete').forEach(b=>b.onclick=()=>{S.completed[b.dataset.complete]=!S.completed[b.dataset.complete];save();upd();});
  upd();

  if($('#mobileJump'))$('#mobileJump').onchange=e=>{const el=document.getElementById(e.target.value.slice(1));if(el)el.scrollIntoView({behavior:'smooth'});};
  if('IntersectionObserver' in window){
    const ob=new IntersectionObserver(en=>{
      const v=en.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
      if(v){
        $$('.nav').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+v.target.id));
        const opt=$('#mobileJump option[value="#'+v.target.id+'"]');
        if(opt)$('#mobileJump').value='#'+v.target.id;
      }
    },{rootMargin:'-12% 0px -70% 0px'});
    $$('main>section[id]').forEach(s=>ob.observe(s));
  }

  if(G.length && $('#glossHost')){
    const drawG=()=>{
      const q=$('#glossSearch').value.trim().toLowerCase();
      const L=G.filter(x=>x.join(' ').toLowerCase().includes(q));
      $('#glossHost').innerHTML=L.map(x=>'<article class="term"><strong>'+fmt(x[0])+'</strong><p>'+fmt(x[1])+'</p>'+(x[2]?'<small>Пример: '+fmt(x[2])+'</small>':'')+'</article>').join('')||'<p class="small">Ничего не найдено.</p>';
    };
    $('#glossSearch').addEventListener('input',drawG);
    drawG();
  }

  // Поповер глоссария
  const pop=$('#gPopover');
  const gMap=new Map(G.map(g=>[String(g[0]).toLowerCase(),g]));
  document.addEventListener('click',e=>{
    const gl=e.target.closest('.glink');
    if(gl){
      e.stopPropagation();
      const termKey=gl.dataset.term.toLowerCase();
      const entry=gMap.get(termKey);
      if(!entry){if($('#glossary'))$('#glossary').scrollIntoView({behavior:'smooth'});return;}
      pop.innerHTML='<h4>'+fmt(entry[0])+'</h4><p>'+fmt(entry[1])+'</p>'+(entry[2]?'<p class="small"><strong>Пример:</strong> '+fmt(entry[2])+'</p>':'')+'<div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px"><button type="button" class="ghost" id="gpAll" style="padding:4px 9px;font-size:12px">К словарю ↓</button><button type="button" class="ghost" id="gpClose" style="padding:4px 9px;font-size:12px">✕</button></div>';
      const rc=gl.getBoundingClientRect();
      pop.style.display='block';
      const pw=pop.offsetWidth||320, ph=pop.offsetHeight||140;
      const left=Math.max(10,Math.min(window.innerWidth-pw-10,rc.left));
      const top=(rc.bottom+ph+12<window.innerHeight)?rc.bottom+8:Math.max(10,rc.top-ph-8);
      pop.style.left=left+'px';pop.style.top=top+'px';
      $('#gpClose',pop).onclick=()=>pop.style.display='none';
      $('#gpAll',pop).onclick=()=>{pop.style.display='none';if($('#glossary'))$('#glossary').scrollIntoView({behavior:'smooth'});};
      return;
    }
    if(pop.style.display==='block'&&!e.target.closest('#gPopover'))pop.style.display='none';
  });

  // Увеличение рисунков
  const dlg=$('#imgZoom');
  $('#imgZoomClose').onclick=()=>dlg.close();
  $$('[data-zoom]').forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.zoom, d=FIGS[id]||{};
    $('#imgZoomTitle').textContent=plain(d.t||id);
    $('#imgZoomBody').innerHTML=figView(id);
    if(dlg.showModal)dlg.showModal();
  });

  initTrees();

  if($('#clearAll'))$('#clearAll').onclick=()=>{
    if(!confirm('Сбросить отметки изученных модулей?'))return;
    S={completed:{}};save();upd();
  };
}

function jumpFromHash(){
  const raw=location.hash.slice(1);if(!raw)return;
  const q=new URLSearchParams(raw);
  if(q.has('b')){
    const m=q.get('b').match(/^(\d+)\.(\d+)$/);
    const el=m?document.getElementById('b-'+m[1]+'-'+m[2]):null;
    if(el){el.scrollIntoView({behavior:'instant',block:'center'});const nxt=el.nextElementSibling;if(nxt){nxt.classList.add('bflash');setTimeout(()=>nxt.classList.add('fade'),2200);}}
    return;
  }
  const el=document.getElementById(decodeURIComponent(raw));
  if(el)el.scrollIntoView({behavior:'instant'});
}

try{
  const raw=$('#topic-data').textContent.trim();
  if(raw&&raw[0]==='{'){
    T=JSON.parse(raw);
    IMG=T._img||{};
    delete T._img;
    render();
  }else{
    applyTheme();
    $('#app').innerHTML='<main style="max-width:760px;padding:48px 20px"><div class="panel"><h2>Шаблон учебника ЕГЭ-100</h2><p>Этот файл — движок оформления. Собери тему через <code>python core/cli.py build &lt;subject&gt; &lt;id&gt;</code>, чтобы получить готовый автономный учебник.</p></div></main>';
  }
}catch(e){
  $('#app').innerHTML='<main style="padding:32px"><div class="panel warn"><strong>Ошибка загрузки данных:</strong> '+esc(e.message)+'</div></main>';
}
})();
</script>
</body>
</html>
