<script type="application/json" id="topic-data">{"id": "zadanie-3-valentnost-so", "subject": "Химия", "subjectSlug": "chemistry", "short": "Задание 3 · Валентность, ЭО и с.о.", "version": "26.11.2026", "icon": "⚡", "title": "Задание 3 · Валентность, ЭО и степень окисления", "sub": "Полный разбор кода 1.3 ФИПИ с нуля до 100 баллов: от смещения электронной пары и расчёта степеней окисления до потолка валентности 2-го периода, d-элементов, оксоанионов ЭOₓ^{n−} и всех 12 формулировок КИМ.", "chips": ["ЕГЭ-2027", "Код 1.3", "№ 3 КИМ", "С нуля до 100"], "scope": ["1.3"], "status": "Сверено с утверждённым комплектом ФИПИ ЕГЭ-2027 (код 1.3, задание № 3 КИМ).", "mode": "from_scratch", "goals": [["01 · Электроотрицательность", "определять направление смещения электронной пары по таблице ФИПИ и рабочему ряду неметаллов (включая OF2, SiH4, NaH, PH3)"], ["02 · Степень окисления", "различать запись с.о. (Fe^{+3}) и заряда иона (Fe^{3+}) и безошибочно считать с.о. в солях, ионах, пероксидах, пирите и Fe3O4"], ["03 · Высшая, низшая и Δ", "находить диапазон [НСО; ВСО] и алгебраическую разность Δ = ВСО − НСО для металлов, неметаллов и всех исключений"], ["04 · Валентность и пределы", "различать обменный и донорно-акцепторный механизмы и объяснять потолок валентности 2-го периода (N = IV, O = III, F = I)"], ["05 · Валентность ≠ с.о.", "узнавать все 4 причины расхождения валентности и |с.о.| в N2, H2O2, FeS2, CO, HNO3, NH4^{+}, H3O^{+} и органическом ряду углерода"], ["06 · d-элементы и исключения", "уверенно работать с Cr, Mn, Fe, Cu, Zn, Ag и не путать списки «ВСО ≠ номеру группы» и «высшая валентность ≠ номеру группы»"], ["07 · Оксоанионы и ЭHₙ", "расшифровывать формулы ЭOₓ^{n−} с проверкой реального существования и отличать летучие водородные соединения от ионных гидридов"], ["08 · Стратегия № 3 КИМ", "видеть слова-переключатели в любой из 12 формулировок задания № 3 ФИПИ и решать его за 60 секунд без потери балла"]], "audit": {"title": "Исходные материалы и границы охвата", "intro": "Учебник создан с нуля по утверждённому комплекту ФИПИ ЕГЭ-2027 (кодификатор 1.3, спецификация, демоверсия ЕГЭ-2027 и методические рекомендации ФИПИ).", "b": [{"more": "Опора на нормативную базу и границы темы", "open": true, "b": [{"list": ["**Нормативная основа:** код **1.3** кодификатора ФИПИ ЕГЭ-2027 — «Валентность. Электроотрицательность. Степень окисления» (базовый уровень, задание № 3 КИМ, 1 балл, порядок цифр в ответе значения не имеет).", "**Опора на предыдущие темы маршрута:** учебник опирается на темы «Задание 1 · Строение атома и электронные конфигурации» (код 1.1) и «Задание 2 · Периодический закон и свойства элементов» (код 1.2); необходимые базовые понятия кратко напомнены в открытой опоре модуля 01.", "**Научная и экзаменационная точность:** все пограничные случаи (`PH3` vs `SiH4`, статус бора `B`, высшая с.о. `Fe (+6)` и `Cu (+2)`, потолок валентности `N (IV)` и `O (III)`, отличие записи `Fe^{+3}` от `Fe^{3+}`) сверены с учебником В. В. Ерёмина «Начала химии» и официальным комплектом ФИПИ ЕГЭ-2027."]}]}]}, "summary": [{"p": "Вся теория задания № 3 держится на чётком разведении трёх понятий: **электроотрицательность** (кто тянет электроны), **степень окисления** (условный заряд со знаком, `Fe^{+3}`) и **валентность** (число ковалентных связей, римские цифры без знака, `IV`)."}, {"p": "Привычка выписывать для всех пяти элементов ряда паспорт `[НСО; ВСО]` и держать в фокусе семь главных исключений (`F, O, N, H, Si, Fe, Cu`) превращает задание № 3 в гарантированный балл и закладывает прочный фундамент для заданий № 4, № 5, № 19 и № 29."}], "limits": "Подробное распределение электронов по орбиталям и конфигурации ионов (код 1.1, № 1 КИМ), закономерности изменения атомного радиуса и свойств соединений по ПСХЭ (код 1.2, № 2 КИМ), а также виды химической связи и кристаллические решётки (код 1.4, № 4 КИМ) вынесены в соседние учебники маршрута.", "modules": [{"id": "01", "group": "Фундамент", "nav": "Электроотрицательность", "codes": ["1.3"], "eyebrow": "01 · Задание 3 · Код 1.3", "title": "Электроотрицательность: кто перетягивает электроны в связи", "lead": "Почему в воде H2O кислород «забирает» электроны у водорода и получает минус, а в соединении OF2 тот же кислород вдруг становится положительным?", "b": [{"key": "[[Электроотрицательность]] (ЭО) — это способность атома в химическом соединении притягивать к себе общие электронные пары. Чем выше ЭО элемента, тем сильнее он смещает электроны к себе и получает отрицательную [[степень окисления]].", "t": "Главная мысль."}, {"more": "Что нужно знать заранее (опора из заданий № 1 и № 2)", "open": true, "b": [{"list": ["**Заряд ядра `Z`** равен порядковому номеру элемента в Периодической системе. Чем больше `Z` при том же числе электронных слоёв, тем сильнее ядро притягивает электроны.", "**Номер периода** показывает число электронных слоёв в атоме. Чем больше слоёв, тем дальше внешние электроны от ядра и тем слабее оно их удерживает.", "**Главные (А) и побочные (Б) подгруппы:** в чёрно-белой таблице ФИПИ элементы одной подгруппы выровнены по одному краю ячейки (например, `Li, Na, K` — слева, это IA; `Cu, Ag, Au` — справа, это IБ).", "**Граница металлов и неметаллов:** диагональ `B — Si — As — Te — At`. На самой диагонали и выше/правее неё в главных подгруппах стоят **неметаллы** (плюс водород `H`), остальные элементы — **металлы** (включая все побочные подгруппы)."]}]}, {"h": "1. Зачем нужна электроотрицательность"}, {"p": "Когда два атома образуют химическую связь, они обобществляют пару электронов. Если атомы одинаковы (например, в молекуле `H2`), они тянут эту пару с равной силой — электронная плотность распределена симметрично, и оба атома остаются нейтральными."}, {"p": "Если же соединяются два разных элемента, их ядра притягивают общую пару по-разному. Атом с **большей [[электроотрицательность|электроотрицательностью]]** перетягивает электронную плотность на себя. На нём возникает избыток отрицательного заряда, а на менее электроотрицательном партнёре — недостаток электронов, то есть положительный заряд."}, {"svg": "<svg viewBox='0 0 460 220' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='220' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Смещение общей электронной пары по ЭО<\/text><rect x='14' y='38' width='432' height='36' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='24' y='61' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>H — H<\/text><circle cx='120' cy='56' r='5' fill='var(--svg-acc,#14b8a6)'/><circle cx='134' cy='56' r='5' fill='var(--svg-acc,#14b8a6)'/><line x1='84' y1='56' x2='110' y2='56' stroke='var(--svg-dim,#94a8c0)' stroke-width='2'/><line x1='144' y1='56' x2='170' y2='56' stroke='var(--svg-dim,#94a8c0)' stroke-width='2'/><text x='184' y='60' fill='var(--svg-dim,#94a8c0)' font-size='13'>ЭО равны → сдвига нет (H⁰)<\/text><rect x='14' y='82' width='432' height='36' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-line,#2a3f57)'/><text x='24' y='105' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>H → Cl<\/text><line x1='84' y1='100' x2='148' y2='100' stroke='var(--svg-blue,#60a5fa)' stroke-width='2'/><circle cx='155' cy='100' r='5' fill='var(--svg-blue,#60a5fa)'/><circle cx='168' cy='100' r='5' fill='var(--svg-blue,#60a5fa)'/><text x='184' y='104' fill='var(--svg-ink,#e6eef7)' font-size='13'>ЭО(Cl) &gt; ЭО(H) → H⁺¹, Cl⁻¹<\/text><rect x='14' y='126' width='432' height='36' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)'/><text x='24' y='149' fill='var(--svg-gold,#e5a93c)' font-size='14' font-weight='700'>O → F<\/text><line x1='84' y1='144' x2='148' y2='144' stroke='var(--svg-gold,#e5a93c)' stroke-width='2'/><circle cx='155' cy='144' r='5' fill='var(--svg-gold,#e5a93c)'/><circle cx='168' cy='144' r='5' fill='var(--svg-gold,#e5a93c)'/><text x='184' y='148' fill='var(--svg-gold,#e5a93c)' font-size='13'>ЭО(F) &gt; ЭО(O) → O⁺², F⁻¹ (OF₂)<\/text><rect x='14' y='170' width='432' height='36' rx='7' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)'/><text x='24' y='193' fill='var(--svg-good,#34c77b)' font-size='14' font-weight='700'>Si → H<\/text><line x1='84' y1='188' x2='148' y2='188' stroke='var(--svg-good,#34c77b)' stroke-width='2'/><circle cx='155' cy='188' r='5' fill='var(--svg-good,#34c77b)'/><circle cx='168' cy='188' r='5' fill='var(--svg-good,#34c77b)'/><text x='184' y='192' fill='var(--svg-good,#34c77b)' font-size='13'>ЭО(H) &gt; ЭО(Si) → Si⁺⁴, H⁻¹ (SiH₄)<\/text><\/svg>", "cap": "Стрелка показывает, к какому атому смещается общая электронная пара. Победитель получает минус, проигравший — плюс."}, {"h": "2. Как меняется ЭО в таблице ФИПИ"}, {"p": "На экзамене у тебя перед глазами только чёрно-белая Периодическая система без чисел электроотрицательности. Чтобы уверенно сравнивать ЭО двух элементов, достаточно двух физических закономерностей:"}, {"list": ["**По периоду слева направо** число электронных слоёв не меняется, а заряд ядра `Z` растёт — ядро притягивает внешние электроны сильнее, поэтому **ЭО растёт**.", "**По главной подгруппе снизу вверх** уменьшается число электронных слоёв и атомный радиус — внешняя оболочка ближе к ядру, поэтому **ЭО растёт**."]}, {"p": "Обе стрелки сходятся в правом верхнем углу таблицы — у **фтора (`F`)**. Фтор — самый электроотрицательный элемент Периодической системы (`ЭО ≈ 3,98` по шкале Полинга). На втором месте стоит **кислород (`O`, `3,44`)**. Ни один элемент не способен отнять электроны у фтора, а у кислорода их отнимает только фтор."}, {"fig": "fipi-pshe", "file": "fipi-pshe.png", "cap": "Официальная Периодическая система ЕГЭ-2027: главный ориентир для ЭО — направление к фтору (F) в правый верхний угол. Инертные газы (He, Ne, Ar) из сравнения ЭО исключаются."}, {"hint": "У благородных газов (`He, Ne, Ar`) внешний энергетический уровень уже полностью завершён (`1s²` у гелия, `ns²np⁶` у остальных). В рамках школьной программы они не образуют химических соединений, поэтому **электроотрицательность для инертных газов не определяют** и в ряды сравнения ЭО их не включают.", "t": "Почему максимум ЭО — у фтора, а не у гелия или неона?"}, {"h": "3. Рабочий ряд ЭО неметаллов для ЕГЭ"}, {"p": "Если два элемента стоят в разных периодах и разных группах (например, `Si` и `H`, `C` и `H`, `O` и `Cl`), одних стрелок таблицы недостаточно. Выручает короткий рабочий ряд неметаллов по шкале Полинга (от самого сильного к самому слабому):"}, {"p": "**Рабочий ряд ЭО:** `F (3,98) > O (3,44) > Cl (3,16) > N (3,04) > Br (2,96) > I (2,66) > S (2,58) > C (2,55) > H (2,20) ≈ P (2,19) > B (2,04) > Si (1,90)` — далее типичные металлы (`Na 0,93; Ca 1,00; Al 1,61`)."}, {"p": "Заметь три ключевые границы в этом ряду — именно на них построены самые частые ловушки задания № 3:"}, {"table": [["Пара элементов", "Кто сильнее тянет e⁻", "Соединение и с.о.", "Почему это важно на ЕГЭ"], ["`O` и `F`", "`F` сильнее всех", "`OF2`: `O^{+2}`, `F^{−1}`", "Главное школьное соединение (наряду с редким `O2F2`), где кислород положителен; это **фторид кислорода**, а не оксид фтора"], ["`Si` и `H`", "`H` сильнее `Si`", "`SiH4`: `Si^{+4}`, `H^{−1}`", "Силан — исключение среди летучих водородных соединений: у кремния `+4`, а не `−4`"], ["`B` и `H`", "`H` сильнее `B`", "`B2H6`: `B^{+3}`, `H^{−1}`", "Бор менее электроотрицателен, чем водород, поэтому в гидридах бор положителен"], ["`Металл` и `H`", "`H` сильнее металлов", "`NaH`: `Na^{+1}`, `H^{−1}`; `CaH2`: `Ca^{+2}`, `H^{−1}`", "В гидридах металлов водород всегда имеет степень окисления `−1`"], ["`C` и `H`", "`C` сильнее `H`", "`CH4`: `C^{−4}`, `H^{+1}`", "В метане и органике углерод перетягивает электроны от водорода"], ["`P` и `H`", "По Полингу почти равны (`2,19` и `2,20`)", "`PH3`: в ЕГЭ принято `P^{−3}`, `H^{+1}`", "Школьная традиция относит фосфин к водородным соединениям с `P^{−3}` (см. предупреждение ниже)"]]}, {"warn": "В справочниках по шкале Полинга `ЭО(H) = 2,20`, а `ЭО(P) = 2,19` — значения практически равны. Тем не менее **в школьной химии и в заданиях ЕГЭ для фосфина `PH3` традиционно принимают `P^{−3}` и `H^{+1}`** (как у аналога аммиака `NH3`). А вот для силана `SiH4` разница ЭО велика (`2,20` против `1,90`), поэтому там строго `Si^{+4}` и `H^{−1}`!", "t": "Тонкость на 100 баллов: фосфин PH3 против силана SiH4"}, {"h": "4. Разбор вслух: определяем знаки в четырёх соединениях"}, {"steps": ["**`OF2`:** сравниваем `O` и `F`. Фтор стоит правее кислорода в 2-м периоде и является самым электроотрицательным элементом таблицы. Значит, обе связи `O—F` смещены к фтору: каждый фтор получает `−1`, а кислород — `+2`.", "**`SiH4`:** сравниваем `Si` (ЭО `1,90`) и `H` (ЭО `2,20`). Водород электроотрицательнее кремния, поэтому все четыре связи смещены к водороду: каждый `H` получает `−1`, а `Si` — `+4`.", "**`NaH`:** натрий — щелочной металл (ЭО `0,93`), водород — неметалл (ЭО `2,20`). Электрон переходит к водороду: `Na^{+1}` и `H^{−1}`.", "**`HCl`:** хлор (ЭО `3,16`) намного электроотрицательнее водорода (`2,20`). Электронная пара смещена к хлору: `H^{+1}` и `Cl^{−1}`."]}, {"bridge": {"kim": "№ 3 КИМ (код 1.3)", "ask": "Задания про выбор элементов, которые «не проявляют положительной степени окисления» или «проявляют отрицательную с.о. в соединении с водородом / кислородом».", "watch": "Ловят на фторе (единственный неметалл без положительных с.о.), на кислороде в `OF2` и на кремнии в `SiH4`.", "tip": "Прежде чем ставить знаки `+` и `−` в бинарном соединении, всегда сверь пару элементов по рабочему ряду ЭО."}}], "short": [{"list": ["Электроотрицательность (ЭО) растёт по таблице ФИПИ снизу вверх и слева направо — к фтору (`F`).", "Благородные газы (`He, Ne, Ar`) имеют завершённую оболочку, поэтому ЭО для них в школьном курсе не рассматривают.", "Фтор (`F`) — самый электроотрицательный элемент: в любых соединениях он имеет только с.о. `−1` и никогда не бывает положительным.", "Кислород (`O`) уступает по ЭО только фтору, поэтому положительную с.о. (`+2`, `+1`) проявляет только во фторидах кислорода (`OF2`, `O2F2`).", "Водород (`H`) электроотрицательнее всех металлов, бора и кремния (`NaH`, `CaH2`, `SiH4` → `H^{−1}`), но слабее `C, N, O, F, S, Cl, Br, I` (в их соединениях `H^{+1}`).", "В ЕГЭ для `SiH4` строго `Si^{+4}, H^{−1}`, а для `PH3` по школьной традиции принимают `P^{−3}, H^{+1}`."]}]}, {"id": "02", "group": "Фундамент", "nav": "Степень окисления", "codes": ["1.3"], "eyebrow": "02 · Задание 3 · Код 1.3", "title": "Степень окисления: смысл, строгая запись и расчёт в любых формулах", "lead": "Почему на ЕГЭ так строго различают степень окисления (+3) и заряд иона (3+), и как без ошибок найти степень окисления серы в пирите FeS2?", "b": [{"key": "[[Степень окисления]] (с.о.) — это условный заряд атома в соединении, вычисленный в предположении, что все полярные связи в нём полностью ионные (то есть общие электронные пары целиком перешли к более электроотрицательному атому).", "t": "Главная мысль."}, {"h": "1. Степень окисления ≠ заряд иона (главный стандарт записи ФИПИ)"}, {"p": "В ионных кристаллах (например, `NaCl`) электрон действительно почти полностью перешёл от натрия к хлору, поэтому реальный заряд иона `Na^{+}` совпадает со степенью окисления `+1`. Но в ковалентных молекулах (например, `H2SO4`) реального заряда `+6` на атоме серы нет — электроны лишь смещены к кислороду. Поэтому **степень окисления — расчётная условность**, а **заряд иона — реальная физическая величина**."}, {"p": "Чтобы не путать эти два понятия, в химии и в критериях оценивания части 2 ЕГЭ (задания № 29–30) действует жёсткий порядок записи знака и цифры:"}, {"svg": "<svg viewBox='0 0 460 190' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='190' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Порядок знака и цифры на ЕГЭ<\/text><rect x='16' y='38' width='208' height='136' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-acc,#14b8a6)' stroke-width='1.5'/><text x='120' y='62' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='14' font-weight='700'>Степень окисления<\/text><text x='120' y='84' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='13'>Сначала ЗНАК, затем цифра<\/text><text x='120' y='118' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='20' font-weight='700'>Fe⁺³   O⁻²   Cr⁺⁶<\/text><text x='120' y='152' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='13'>В электронном балансе (№ 29)<\/text><rect x='236' y='38' width='208' height='136' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)' stroke-width='1.5'/><text x='340' y='62' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='14' font-weight='700'>Заряд иона<\/text><text x='340' y='84' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='13'>Сначала ЦИФРА, затем знак<\/text><text x='340' y='118' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='20' font-weight='700'>Fe³⁺   O²⁻   SO₄²⁻<\/text><text x='340' y='152' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='13'>В ионных уравнениях (№ 30)<\/text><\/svg>", "cap": "Запомни зрительно: степень окисления пишется как число со знаком (+3, −2), а заряд иона — как количество элементарных зарядов (3+, 2−)."}, {"warn": "В заданиях части 2 ЕГЭ требования к формату записи строго разведены:\n- В **задании № 30** (ионные уравнения) пишут **заряды ионов** (`SO4^{2−}`, `Fe^{2+}`). Запись заряда иона со знаком впереди (`SO4^{-2}`, `Fe^{+2}`) считается грубой ошибкой и обнуляет балл за ионное уравнение.\n- В **задании № 29** (электронный баланс) пишут **степени окисления** со знаком впереди (`Cr^{+6}`, `Mn^{+7}`, `Fe^{+2}`) — подменять их записью заряда несуществующих простых ионов (`Cr^{6+}`, `Mn^{7+}`) нельзя.", "t": "Капкан части 2: № 29 (с.о.) против № 30 (заряд иона)"}, {"h": "2. Опорные степени окисления (от чего отталкиваться при расчёте)"}, {"p": "В любой формуле мы находим неизвестную степень окисления через элементы, чьи степени окисления постоянны или почти постоянны:"}, {"table": [["Группа элементов", "Степень окисления в соединениях", "Исключения и пояснения"], ["Любые **простые вещества** (`O2`, `S8`, `Fe`, `N2`)", "`0`", "Исключений нет: атомы одинаковые, сдвига электронов нет"], ["**Фтор** (`F`)", "всегда `−1`", "Исключений нет (максимальная ЭО в таблице)"], ["**Щелочные металлы** (IA: `Li, Na, K, Rb, Cs`)", "всегда `+1`", "Один внешний `s`-электрон легко отдаётся"], ["**Металлы IIA** (`Be, Mg, Ca, Sr, Ba`) и **цинк (`Zn`)**", "всегда `+2`", "Отдают ровно два `s`-электрона"], ["**Алюминий (`Al`)**", "всегда `+3`", "Отдаёт все три валентных электрона (`3s²3p¹`)"], ["**Серебро (`Ag`)**", "в ЕГЭ `+1`", "Единственная школьная с.о. в соединениях (`AgNO3`, `AgCl`, `Ag2O`)"], ["**Водород (`H`)**", "обычно `+1`", "`−1` в гидридах металлов (`NaH`, `CaH2`), бора (`B2H6`) и кремния (`SiH4`)"], ["**Кислород (`O`)**", "обычно `−2`", "`−1` в [[пероксид|пероксидах]] (`H2O2`, `Na2O2`, `BaO2`), `−1/2` в надпероксидах (`KO2`), `+2` в `OF2`, `+1` в `O2F2`"]]}, {"h": "3. Алгебраическое правило электронейтральности"}, {"p": "В **нейтральной молекуле** сумма степеней окисления всех атомов с учётом индексов равна `0`. В **сложном ионе** эта сумма равна заряду иона (с его знаком!)."}, {"steps": ["**Пример 1. Дихромат калия `K2Cr2O7`:** у калия `+1`, у кислорода `−2`, у хрома обозначим `x`. Составляем уравнение: `2·(+1) + 2·x + 7·(−2) = 0` → `2 + 2x − 14 = 0` → `2x = +12` → `x = +6`. Проверка: `2·(+1) + 2·(+6) + 7·(−2) = +2 + 12 − 14 = 0`.", "**Пример 2. Дихромат-ион `Cr2O7^{2−}`:** сумма равна заряду иона `−2`. Уравнение: `2·x + 7·(−2) = −2` → `2x − 14 = −2` → `2x = +12` → `x = +6`. Проверка: `2·(+6) + 7·(−2) = +12 − 14 = −2`.", "**Пример 3. Катион аммония `NH4^{+}`:** сумма равна `+1`. У водорода с азотом `+1`, значит `x + 4·(+1) = +1` → `x = −3`. Проверка: `−3 + 4 = +1`.", "**Пример 4. Пероксид водорода `H2O2` и пероксид натрия `Na2O2`:** здесь первыми фиксируем `H^{+1}` и `Na^{+1}` (у щелочного металла с.о. строго постоянна!). Тогда для кислорода `2·(+1) + 2·x = 0` → `x = −1`. Между двумя атомами кислорода стоит неполярная связь `—O—O—`, поэтому каждый атом забирает только по одному электрону."]}, {"h": "4. Три «хитрых» вещества из ЕГЭ: пирит, железная окалина и тиосульфат"}, {"p": "Иногда формальный расчёт по шаблону «сера `−2`» или «железо целое» даёт странный результат. В таких случаях нужно знать реальное строение вещества:"}, {"grid": [{"t": "Пирит `FeS2`", "tag": "Дисульфид железа(II)", "x": "Если по привычке поставить сере `−2`, у железа выйдет `+4` — такой с.о. в сульфидах не бывает. На деле в пирите стоит ион `Fe^{2+}` и пероксидоподобный анион `S2^{2−}` со связью `—S—S—`. Итог: `Fe^{+2}, S^{−1}` (проверка: `+2 + 2·(−1) = 0`)."}, {"t": "Железная окалина `Fe3O4`", "tag": "Смешанный оксид `FeO · Fe2O3`", "x": "Формальная средняя степень окисления железа дробная (`+8/3`). В реальном кристалле содержатся два вида катионов: один катион `Fe^{2+}` и два катиона `Fe^{3+}`. Баланс степеней окисления: `+2 + 2·(+3) + 4·(−2) = 0`."}, {"t": "Тиосульфат натрия `Na2S2O3`", "tag": "Средняя с.о. серы `+2`", "x": "По формуле `2·(+1) + 2·x + 3·(−2) = 0` получаем среднюю степень окисления серы `+2`. Структурно атомы серы неравноценны (один центральный, второй заменяет кислород), но в расчётах ЕГЭ используют среднюю с.о. `+2`: `2·(+1) + 2·(+2) + 3·(−2) = 0`."}, {"t": "Азид `NaN3`, надпероксид `KO2` и нитрат аммония `NH4NO3`", "tag": "Дробные и неэквивалентные с.о.", "x": "В `KO2` у калия `+1`, значит у кислорода `−1/2` (`K^{+1}O2^{−1/2}`); в `NaN3` у азота `−1/3`. А в **`NH4NO3`** два атома азота находятся в **разных ионах** (`NH4^{+}` и `NO3^{−}`), поэтому их с.о. считают раздельно: **`−3`** и **`+5`** (`(N^{−3}H4^{+1})^{+}(N^{+5}O3^{−2})^{−}`, усреднять в `+1` нельзя!)."}], "cols": 2}, {"bridge": {"kim": "№ 3, № 19 и № 29 КИМ", "ask": "Определить элементы, способные проявлять степень окисления `−1` (или `+2`, `+6`), либо найти степень окисления в заданном анионе/веществе.", "watch": "Забывают, что кислород бывает `−1` в пероксидах, а сера `−1` в пирите `FeS2`; путают сумму в ионе (равна заряду иона) с суммой в молекуле (равна 0).", "tip": "Всегда проверяй расчёт обратным сложением всех атомов в формуле — это занимает 3 секунды и исключает арифметические промахи."}}], "short": [{"list": ["Степень окисления — условный заряд атома, вычисленный при допущении полной ионности всех полярных связей.", "Строгий стандарт ФИПИ: **степень окисления** — сначала знак (`Fe^{+3}`, `O^{−2}`); **заряд иона** — сначала цифра (`Fe^{3+}`, `O^{2−}`, `SO4^{2−}`).", "Постоянные с.о. в соединениях: `F` (`−1`), `Li–Cs` (`+1`), `Be–Ba` и `Zn` (`+2`), `Al` (`+3`), `Ag` (`+1`). В простых веществах всегда `0`.", "Сумма с.о. всех атомов в молекуле равна `0`, а в сложном ионе — равна его заряду.", "В пероксидах (`H2O2`, `Na2O2`, `BaO2`) у кислорода `−1`, в пирите `FeS2` у железа `+2` и у серы `−1`, в `Fe3O4` железо одновременно `+2` и `+3`."]}]}, {"id": "03", "group": "Закономерности", "nav": "Высшая, низшая и Δ", "codes": ["1.3"], "eyebrow": "03 · Задание 3 · Код 1.3", "title": "Высшая, низшая степень окисления и разность Δ", "lead": "Почему у серы, азота, углерода и хлора разность между высшей и низшей степенями окисления всегда равна ровно 8, а у кислорода — 4, у фтора — 1 и у железа — 6?", "b": [{"key": "По номеру группы `N` в таблице ФИПИ сразу видны границы степеней окисления: для большинства элементов **высшая с.о. = `+N`**, для неметаллов **низшая с.о. = `N − 8`**, а для всех металлов (и бора в модели ЕГЭ) **низшая с.о. = `0`**. Разность всегда считается алгебраически: `Δ = ВСО − НСО`.", "t": "Главная мысль."}, {"h": "1. Физический смысл высшей и низшей степени окисления"}, {"p": "**Высшая степень окисления (ВСО)** — это максимум электронов, которые атом способен отдать или сместить к более электроотрицательному партнёру. Для элементов главных подгрупп число валентных электронов равно номеру группы `N`, поэтому в большинстве случаев `ВСО = +N` (например, у `Na` из IА это `+1`, у `S` из VIА — `+6`, у `Cl` из VIIА — `+7`)."}, {"p": "**Низшая степень окисления (НСО)** — это максимум электронов, которые атом способен принять до завершения устойчивого октета (8 электронов на внешнем уровне). Неметаллу из группы `N` не хватает до восьми ровно `8 − N` электронов, поэтому:"}, {"p": "**Формула:** `НСО(неметалла) = N − 8` (например: `C`: `4 − 8 = −4`; `N`: `5 − 8 = −3`; `S`: `6 − 8 = −2`; `Cl`: `7 − 8 = −1`)."}, {"p": "**Металлы** в химических реакциях только отдают электроны (у них мала электроотрицательность), поэтому в соединениях у них бывают только положительные степени окисления. Самая низкая возможная степень окисления любого металла — это **`0`** (в простом веществе, например `Fe⁰`, `Al⁰`, `Cu⁰`)."}, {"hint": "У атома **водорода (`H`)** на первом уровне помещается максимум 2 электрона (дуплет гелия `1s²`), а не 8. Отдав свой единственный электрон, он получает `ВСО = +1` (в `H2O`, `HCl`), а приняв один электрон до `1s²` — получает `НСО = −1` (в гидридах `NaH`, `CaH2`, `SiH4`). Поэтому диапазон водорода `[−1; +1]`, а разность `Δ(H) = +1 − (−1) = 2`.", "t": "Почему водород не подчиняется формуле N − 8?"}, {"h": "2. Разность Δ = ВСО − НСО: наглядная числовая ось"}, {"p": "Разность между высшей и низшей степенями окисления — это **длина отрезка** на числовой прямой от НСО до ВСО. Вычитание отрицательного числа превращается в сложение:"}, {"p": "**Формула:** `Δ = ВСО − НСО = (+N) − (N − 8) = N − N + 8 = 8`."}, {"p": "Вот почему **у всех стандартных неметаллов (`C, Si, N, P, S, Cl, Br, I`) разность `Δ` всегда равна `8`** — номер группы `N` просто сокращается! А вот у всех исключений (`O, F, H, B`) и у всех **металлов** разность `Δ` отличается от `8`."}, {"svg": "<svg viewBox='0 0 460 226' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='226' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Отрезок Δ = ВСО − НСО на числовой прямой<\/text><line x1='76' y1='46' x2='436' y2='46' stroke='var(--svg-line,#2a3f57)' stroke-width='1.5'/><text x='92' y='41' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>−4<\/text><text x='152' y='41' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>−2<\/text><text x='212' y='41' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='12' font-weight='700'>0<\/text><text x='272' y='41' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+2<\/text><text x='332' y='41' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+4<\/text><text x='392' y='41' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>+6<\/text><line x1='212' y1='46' x2='212' y2='212' stroke='var(--svg-line,#2a3f57)' stroke-dasharray='4 3'/><text x='18' y='78' fill='var(--svg-acc,#14b8a6)' font-size='14' font-weight='700'>S<\/text><line x1='152' y1='73' x2='392' y2='73' stroke='var(--svg-acc,#14b8a6)' stroke-width='6' stroke-linecap='round'/><circle cx='152' cy='73' r='5' fill='var(--svg-acc,#14b8a6)'/><circle cx='392' cy='73' r='5' fill='var(--svg-acc,#14b8a6)'/><text x='272' y='65' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='13' font-weight='700'>−2 … +6 → Δ = 8<\/text><text x='18' y='118' fill='var(--svg-gold,#e5a93c)' font-size='14' font-weight='700'>O<\/text><line x1='152' y1='113' x2='272' y2='113' stroke='var(--svg-gold,#e5a93c)' stroke-width='6' stroke-linecap='round'/><circle cx='152' cy='113' r='5' fill='var(--svg-gold,#e5a93c)'/><circle cx='272' cy='113' r='5' fill='var(--svg-gold,#e5a93c)'/><text x='212' y='105' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='13' font-weight='700'>−2 … +2 → Δ = 4<\/text><text x='18' y='158' fill='var(--svg-bad,#ef6b6b)' font-size='14' font-weight='700'>F<\/text><line x1='182' y1='153' x2='212' y2='153' stroke='var(--svg-bad,#ef6b6b)' stroke-width='6' stroke-linecap='round'/><circle cx='182' cy='153' r='5' fill='var(--svg-bad,#ef6b6b)'/><circle cx='212' cy='153' r='5' fill='var(--svg-bad,#ef6b6b)'/><text x='295' y='157' fill='var(--svg-bad,#ef6b6b)' font-size='13' font-weight='700'>−1 … 0 → Δ = 1<\/text><text x='18' y='198' fill='var(--svg-blue,#60a5fa)' font-size='14' font-weight='700'>Fe<\/text><line x1='212' y1='193' x2='392' y2='193' stroke='var(--svg-blue,#60a5fa)' stroke-width='6' stroke-linecap='round'/><circle cx='212' cy='193' r='5' fill='var(--svg-blue,#60a5fa)'/><circle cx='392' cy='193' r='5' fill='var(--svg-blue,#60a5fa)'/><text x='302' y='185' text-anchor='middle' fill='var(--svg-blue,#60a5fa)' font-size='13' font-weight='700'>0 … +6 → Δ = 6<\/text><\/svg>", "cap": "Пунктир — ноль. Для металлов отрезок начинается от 0, поэтому Δ всегда равна их высшей степени окисления."}, {"h": "3. Сводная таблица диапазонов [НСО; ВСО] и разности Δ"}, {"table": [["Элемент / группа", "НСО", "ВСО", "Разность `Δ = ВСО − НСО`", "Главная ловушка ЕГЭ"], ["`C, Si` (IVA)", "`−4`", "`+4`", "`+4 − (−4) = 8`", "У `Si` низшая `−4` проявляется в силицидах (`Mg2Si`), а не в `SiH4`!"], ["`N, P` (VA)", "`−3`", "`+5`", "`+5 − (−3) = 8`", "У `N` высшая с.о. `+5` (равна группе!), хотя валентность лишь IV"], ["`S, Se` (VIA)", "`−2`", "`+6`", "`+6 − (−2) = 8`", "Не путай `Δ` с `6 − 2 = 4`! Минус на минус даёт плюс"], ["`Cl, Br, I` (VIIA)", "`−1`", "`+7`", "`+7 − (−1) = 8`", "У `Br` в школе обычно `+5/+7`, в расчётах `Δ` стандартно `+7 − (−1) = 8`"], ["**Кислород `O`** (VIA)", "`−2`", "`+2` (`OF2`)", "`+2 − (−2) = 4`", "Высшая с.о. НЕ `+6`, а `+2`!"], ["**Фтор `F`** (VIIA)", "`−1`", "`0` (`F2`)", "`0 − (−1) = 1`", "У фтора нет положительных с.о.; ВСО = `0` в простом веществе"], ["**Водород `H`**", "`−1`", "`+1`", "`+1 − (−1) = 2`", "Такая же разность `Δ = 2`, как у `Mg, Ca, Zn, Cu`!"], ["**Бор `B`** (IIIA)", "`0` (в ЕГЭ)", "`+3`", "`+3 − 0 = 3`", "Формула `3 − 8 = −5` к бору в ЕГЭ **не применяется**!"], ["Металлы IA (`Li, Na, K`), `Ag`", "`0`", "`+1`", "`1`", "Такая же `Δ = 1`, как у фтора `F`!"], ["Металлы IIA (`Be, Mg, Ca, Ba`), `Zn`, `Cu`", "`0`", "`+2`", "`2`", "У `Cu` ВСО = `+2` (не `+1`), поэтому `Δ(Cu) = 2`"], ["`Al` (IIIA), `Sc`", "`0`", "`+3`", "`3`", "Такая же `Δ = 3`, как у бора `B`"], ["`Cr` (VIБ), `Fe` (VIIIБ)", "`0`", "`+6`", "`6`", "У `Fe` ВСО = `+6` (не `+8`), поэтому `Δ(Fe) = Δ(Cr) = 6`"], ["`Mn` (VIIБ)", "`0`", "`+7`", "`7`", "Максимальная `Δ` среди школьных металлов"], ["Инертные газы (`He, Ne, Ar`)", "`0`", "`0`", "`0`", "В школьном курсе ЕГЭ соединений не образуют"]]}, {"hint": "Ещё одна частая формулировка задания № 3: **«модуль высшей с.о. равен модулю низшей с.о.» (`|ВСО| = |НСО|`)**. Этому условию в школьном курсе ЕГЭ отвечают ровно **четыре** элемента: **`C` (`+4` и `−4`)**, **`Si` (`+4` и `−4`)**, **`O` (`+2` и `−2`)** и **`H` (`+1` и `−1`)**! Ученики почти всегда вспоминают углерод и кремний, но забывают кислород и водород.", "t": "Четыре элемента с равными по модулю высшей и низшей с.о. (|ВСО| = |НСО|)"}, {"warn": "Две самые частые ошибки при расчёте `Δ`:\n1) **Потеря знака минуса:** считают `6 − 2 = 4` вместо `6 − (−2) = 8` для серы.\n2) **Применение `N − 8` к металлам и бору:** у натрия НЕ бывает `−7`, а у алюминия и бора в ЕГЭ НЕ бывает `−5` — их низшая с.о. равна `0`.", "t": "Антипаттерны расчёта Δ"}, {"h": "4. Разбор вслух: официальное задание № 3 из Демоверсии ЕГЭ-2027"}, {"p": "**Условие (Демоверсия ФИПИ ЕГЭ-2027):** дан ряд элементов `1) O   2) F   3) Al   4) Si   5) Li`. Выберите два элемента, которые **в соединениях** могут принимать **как положительную, так и отрицательную** степень окисления."}, {"steps": ["**Выписываем диапазон `[НСО; ВСО]` для всех пяти элементов** и отдельно отмечаем, какие значения бывают именно *в соединениях* (без нуля простого вещества).", "**`1) O` (кислород):** в соединениях бывает отрицательным (`H2O`, `−2`; `H2O2`, `−1`) и положительным (`OF2`, `+2`). **Подходит!**", "**`2) F` (фтор):** самый электроотрицательный элемент. В соединениях принимает **только `−1`** (ноль — только в простом веществе `F2`, положительных нет). **Не подходит.**", "**`3) Al` (алюминий):** металл. В соединениях принимает **только `+3`**, отрицательных с.о. у металлов нет. **Не подходит.**", "**`4) Si` (кремний):** неметалл IVA группы. В соединениях бывает положительным (`SiO2`, `SiH4`, `+4`) и отрицательным (в силицидах металлов, например `Mg2Si`, `−4`). **Подходит!**", "**`5) Li` (литий):** щелочной металл. В соединениях принимает **только `+1`**. **Не подходит.**", "**Ответ: `14`** (или `41` — порядок цифр в задании № 3 значения не имеет). Обрати внимание на ловушку: многие забывают, что `O` бывает `+2` в `OF2`, или считают `Si` «почти металлом» без отрицательной с.о."]}, {"bridge": {"kim": "№ 3 КИМ (код 1.3)", "ask": "«Одинаковая разность между высшей и низшей с.о.», «разность равна 2 / 4 / 6 / 8», «принимают как положительную, так и отрицательную с.о.», «не проявляют отрицательной с.о.».", "watch": "Слова-переключатели: «в соединениях» исключает ноль простого вещества; пары с одинаковой `Δ` часто маскируют неметалл с металлом (`F` и `Na` обе дают `Δ = 1`; `H` и `Mg` обе дают `Δ = 2`; `B` и `Al` обе дают `Δ = 3`).", "tip": "Для каждого из пяти элементов в условии сразу подпиши сверху пару `[НСО; ВСО]` и число `Δ` — правильная пара станет видна мгновенно."}}], "short": [{"list": ["Для большинства элементов `ВСО = +N` (номер группы); исключения в ЕГЭ: `F (0)`, `O (+2)`, `Fe (+6)`, `Cu (+2)`, инертные газы (`0`).", "Для неметаллов `НСО = N − 8`; для всех металлов и бора (в модели ЕГЭ) `НСО = 0`; для водорода `НСО = −1`, `ВСО = +1`.", "Алгебраическая разность `Δ = ВСО − НСО` равна ровно `8` для всех стандартных неметаллов (`C, Si, N, P, S, Cl, Br, I`).", "Ключевые нестандартные разности: `F → 1`, `H → 2`, `B → 3`, `O → 4`, а для любого металла `Δ` равна его высшей с.о. (`Na → 1`, `Mg/Cu/Zn → 2`, `Al → 3`, `Cr/Fe → 6`, `Mn → 7`).", "В соединениях и положительную, и отрицательную с.о. проявляют неметаллы (включая `O`, `H`, `Si`), **кроме** фтора `F`, бора `B` (в модели ЕГЭ), инертных газов и всех металлов."]}]}, {"id": "04", "group": "Закономерности", "nav": "Валентность и пределы", "codes": ["1.3"], "eyebrow": "04 · Задание 3 · Код 1.3", "title": "Валентность, возбуждение и потолок 2-го периода", "lead": "Почему фосфор легко образует PCl5 с валентностью V, а стоящий прямо над ним в той же VА группе азот никогда не бывает пятивалентным — даже в азотной кислоте HNO3?", "b": [{"key": "[[Валентность]] — это число ковалентных химических связей, которые атом образует с другими атомами. Валентность всегда записывается **римскими цифрами без знака** (`I, II, III, IV…`) и ограничена числом доступных валентных орбиталей атома.", "t": "Главная мысль."}, {"h": "1. Два механизма образования ковалентной связи"}, {"p": "Каждая ковалентная связь (одна чёрточка в структурной формуле) — это одна общая пара электронов. (Для ионных соединений и металлов понятие «валентность» в школьной химии используют условно — по модулю заряда иона.) Создать ковалентную связь можно двумя способами:"}, {"compare": {"t": "Как атом формирует связи и набирает валентность", "left": {"title": "Обменный механизм", "items": ["Каждый из двух атомов даёт по **одному неспаренному электрону**.", "Число связей равно числу неспаренных электронов в основном или [[возбуждённое состояние|возбуждённом состоянии]].", "Пример: у азота `2s²2p³` есть 3 неспаренных электрона → три связи в `NH3` (валентность `III`)."]}, "right": {"title": "Донорно-акцепторный механизм", "items": ["Один атом (**донор**) отдаёт в общее пользование **неподелённую электронную пару**, а второй (**акцептор**) предоставляет **свободную орбиталь**.", "Образовавшаяся связь ничем не отличается от обменной и тоже прибавляет `+1` к валентности!", "Пример: `NH3 + H^{+} → NH4^{+}`: азот отдаёт `2s²`-пару протону `H^{+}` (у него пустая `1s⁰`-орбиталь) → 4 связи, валентность `IV`."]}}}, {"h": "2. Возбуждённое состояние: зачем нужны свободные d-орбитали"}, {"p": "Если у атома на внешнем уровне есть одновременно **спаренные электроны** и **пустые орбитали** на том же энергетическом уровне, при получении энергии электронная пара может распариться — один электрон переходит на свободную орбиталь. Число неспаренных электронов растёт на 2, и валентность увеличивается на `II`."}, {"list": ["**Углерод `C` (`2s²2p²`):** в основном состоянии 2 неспаренных электрона (они дают 2 обменные связи; в `CO` к ним добавляется третья — донорно-акцепторная, давая итоговую валентность `III`), но на `2p`-подуровне есть одна пустая ячейка. Распаривание `2s² → 2s¹2p³` даёт 4 неспаренных электрона → **валентность `IV`** (почти во всех соединениях углерода).", "**Фосфор `P` (`3s²3p³3d⁰`):** на 3-м уровне появляется пустой `3d`-подуровень! В основном состоянии 3 неспаренных электрона (валентность `III` в `PH3`, `PCl3`), при возбуждении `3s²3p³ → 3s¹3p³3d¹` становится 5 неспаренных электронов → **валентность `V`** (`PCl5`, `P2O5`, `H3PO4`).", "**Сера `S` (`3s²3p⁴3d⁰`):** основное состояние — 2 неспаренных электрона (`II` в `H2S`), первое возбуждение `3s²3p³3d¹` — 4 неспаренных (`IV` в `SO2`), второе возбуждение `3s¹3p³3d²` — 6 неспаренных (`VI` в `SO3`, `SF6`, `H2SO4`).", "**Хлор `Cl` (`3s²3p⁵3d⁰`):** последовательное распаривание на `3d` даёт 1, 3, 5 и 7 неспаренных электронов → **валентности `I, III, V, VII`**."]}, {"h": "3. Жёсткий потолок 2-го периода: почему N ≤ IV, O ≤ III, F = I"}, {"p": "На 2-м энергетическом уровне существуют только `2s`- и `2p`-подуровни — **всего 4 орбитали** (`1 + 3 = 4`). Подуровня `2d` в природе не существует! Поэтому атом 2-го периода физически не может образовать больше четырёх ковалентных связей (правило октета)."}, {"svg": "<svg viewBox='0 0 460 236' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='236' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>Почему N ограничен валентностью IV, а P достигает V<\/text><rect x='14' y='38' width='432' height='84' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-bad,#ef6b6b)'/><text x='28' y='60' fill='var(--svg-bad,#ef6b6b)' font-size='14' font-weight='700'>N (2-й период): 2s² 2p³ — нет 2d!<\/text><rect x='28' y='72' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-gold,#e5a93c)'/><text x='45' y='93' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='15' font-weight='700'>↑↓<\/text><text x='45' y='115' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>2s<\/text><rect x='74' y='72' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='91' y='93' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='15' font-weight='700'>↑<\/text><rect x='110' y='72' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='127' y='93' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='15' font-weight='700'>↑<\/text><rect x='146' y='72' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-acc,#14b8a6)'/><text x='163' y='93' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='15' font-weight='700'>↑<\/text><text x='127' y='115' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>2p<\/text><text x='198' y='83' fill='var(--svg-ink,#e6eef7)' font-size='13'>3 обменные + 1 дон.-акц.<\/text><text x='198' y='103' fill='var(--svg-bad,#ef6b6b)' font-size='13' font-weight='700'>Макс. валентность = IV (не V!)<\/text><rect x='14' y='134' width='432' height='88' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)'/><text x='28' y='156' fill='var(--svg-good,#34c77b)' font-size='14' font-weight='700'>P* (3-й период): 3s¹ 3p³ 3d¹ — есть пустой 3d!<\/text><rect x='28' y='168' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='45' y='189' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='15' font-weight='700'>↑<\/text><text x='45' y='212' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>3s<\/text><rect x='74' y='168' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='91' y='189' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='15' font-weight='700'>↑<\/text><rect x='110' y='168' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='127' y='189' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='15' font-weight='700'>↑<\/text><rect x='146' y='168' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-good,#34c77b)'/><text x='163' y='189' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='15' font-weight='700'>↑<\/text><text x='127' y='212' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='12'>3p<\/text><rect x='192' y='168' width='34' height='30' rx='4' fill='var(--svg-surface2,#1d2e42)' stroke='var(--svg-blue,#60a5fa)'/><text x='209' y='189' text-anchor='middle' fill='var(--svg-blue,#60a5fa)' font-size='15' font-weight='700'>↑<\/text><text x='209' y='212' text-anchor='middle' fill='var(--svg-blue,#60a5fa)' font-size='12'>3d<\/text><text x='240' y='181' fill='var(--svg-ink,#e6eef7)' font-size='13'>5 неспаренных e⁻<\/text><text x='240' y='201' fill='var(--svg-good,#34c77b)' font-size='13' font-weight='700'>Макс. валентность = V<\/text><\/svg>", "cap": "У азота все 4 ячейки 2-го уровня заняты — распаривать пару 2s² некуда. У фосфора есть пустые 3d-орбитали, поэтому 5 связей доступны."}, {"p": "Посмотри, к чему это приводит для всех элементов 2-го периода (`N, O, F` вообще **не переходят в возбуждённое состояние**, потому что у них нет пустых орбиталей на 2-м уровне):"}, {"table": [["Элемент (группа)", "Внешний уровень", "По обменному механизму", "Макс. валентность (с дон.-акц.)", "Примеры для ЕГЭ"], ["`B` (IIIA)", "`2s²2p¹ → 2s¹2p²`", "`III`", "`IV` (только в комплексах вроде `[BF4]⁻`)", "`BF3`, `B2O3` (`III`); `[BF4]⁻` (`IV`)"], ["`C` (IVA)", "`2s²2p² → 2s¹2p³`", "`II, IV`", "`IV`", "`CH4, CO2` (IV), `CO` (III)"], ["**`N` (VA)**", "`2s²2p³` (не возбуждается)", "`III`", "**`IV`** (≠ V!)", "`NH3` (III), `NH4^{+}`, `HNO3`, `N2O5` (IV)"], ["**`O` (VIA)**", "`2s²2p⁴` (не возбуждается)", "`II`", "**`III`** (≠ VI!)", "`H2O` (II), `H3O^{+}`, `CO` (III)"], ["**`F` (VIIA)**", "`2s²2p⁵` (не возбуждается)", "`I`", "**`I`** (≠ VII!)", "`HF, OF2` (всегда только I)"]]}, {"warn": "Самая популярная ловушка № 3 КИМ: **«высшая валентность не равна номеру группы»** против **«высшая степень окисления не равна номеру группы»**.\n- У **азота (`N`)** высшая валентность равна **`IV`** (НЕ равна номеру группы V!), а вот высшая степень окисления равна **`+5`** (РАВНА номеру группы!).\n- У **кислорода (`O`)** и **фтора (`F`)** не совпадает с номером группы ни валентность (`III` и `I`), ни степень окисления (`+2` и `0`).", "t": "Не путай два разных вопроса про азот!"}, {"h": "4. Разбор вслух: сравниваем азот и фосфор"}, {"steps": ["**Аммиак `NH3` → катион аммония `NH4^{+}` → азотная кислота `HNO3`:** в `NH3` у азота 3 обменные связи (`III`) и остаётся неподелённая пара `2s²`. В `NH4^{+}` эта пара образует 4-ю связь по донорно-акцепторному механизму (`IV`). В `HNO3` у азота тоже ровно **4 связи** (одна к `—OH`, двойная `=O` и одна донорно-акцепторная к третьему кислороду): валентность `IV`, а степень окисления `+5`.", "**Фосфин `PH3` → пентахлорид `PCl5`:** в `PH3` фосфор использует 3 неспаренных `3p`-электрона (`III`). При реакции с избытком хлора пара `3s²` распаривается на пустую `3d`-орбиталь (`3s¹3p³3d¹`), и фосфор образует 5 обменных связей `P—Cl`: валентность `V`, степень окисления `+5`."]}, {"bridge": {"kim": "№ 3 и № 4 КИМ", "ask": "«Выберите два элемента, высшая валентность которых не равна номеру группы» или «максимальная валентность равна IV / III / I».", "watch": "Азот в списке про **валентность** (подходит под «≠ номеру группы»), но в списке про **степень окисления** (НЕ подходит под «≠ номеру группы», так как ВСО = `+5`).", "tip": "Всегда подчёркивай в условии слово **валентность** или **степень окисления** до того, как начнёшь смотреть на элементы."}}], "short": [{"list": ["Валентность — число ковалентных связей атома; записывается римскими цифрами (`I, II, III, IV…`) и никогда не имеет знака `+` или `−`.", "Связи образуются по обменному (неспаренные электроны) и донорно-акцепторному (пара донора + пустая орбиталь акцептора) механизмам.", "Элементы 2-го периода (`N, O, F`) не имеют `2d`-подуровня и не переходят в возбуждённое состояние: максимум связей ограничен 4 орбиталями.", "Жёсткий потолок валентности: `N` — не выше **`IV`** (`NH4^{+}`, `HNO3`, `N2O5`), `O` — не выше **`III`** (`H3O^{+}`, `CO`; по обменному механизму `II`), `F` — всегда **`I`**.", "У элементов 3-го и следующих периодов (`P, S, Cl`) есть свободные `3d`-орбитали, поэтому их высшая валентность достигает номера группы (`V, VI, VII`)."]}]}, {"id": "05", "group": "Тонкости 95–100", "nav": "Валентность ≠ с.о.", "codes": ["1.3"], "eyebrow": "05 · Задание 3 · Код 1.3", "title": "Когда валентность не равна степени окисления", "lead": "Почему в угарном газе CO у углерода и кислорода валентность равна III, а степени окисления — +2 и −2, а в метаноле CH3OH углерод четырёхвалентен при степени окисления −2?", "b": [{"key": "[[Валентность]] считает **число ковалентных связей** (чёрточек), а [[степень окисления]] считает **итоговый сдвиг электронов** (со знаком). Они совпадают по модулю только тогда, когда все связи атома полярны и смещены в одну и ту же сторону.", "t": "Главная мысль."}, {"h": "1. Четыре системные причины расхождения"}, {"p": "Вместо того чтобы зазубривать десятки разрозненных формул, достаточно понять четыре причины, по которым модуль степени окисления `|с.о.|` расходится с валентностью:"}, {"table": [["Причина расхождения", "Как это работает", "Ключевые примеры для ЕГЭ (валентность / с.о.)"], ["**1. Простые вещества**", "Все связи — между одинаковыми атомами; сдвиг электронов равен `0`, но чёрточки есть", "`H2` (`I` / `0`), `O2` (`II` / `0`), `N2` (`III` / `0`), `Cl2` (`I` / `0`)"], ["**2. Неполярные связи `Э—Э` в сложных веществах**", "Связь между двумя одинаковыми атомами добавляет `+1` к валентности, но даёт `0` к степени окисления", "`H2O2` (`O`: `II` / `−1`), `FeS2` (`S`: `II` / `−1`), `C2H6` (`C`: `IV` / `−3`), `C2H4` (`C`: `IV` / `−2`), `C2H2` (`C`: `IV` / `−1`)"], ["**3. Донорно-акцепторные связи**", "Донор отдаёт *свою* пару электронов в связь: при подсчёте с.о. эта пара либо остаётся у него, либо целиком уходит акцептору", "`CO` (`C`: `III` / `+2`; `O`: `III` / `−2`), `NH4^{+}` (`N`: `IV` / `−3`), `H3O^{+}` (`O`: `III` / `−2`), `HNO3` и `N2O5` (`N`: `IV` / `+5`)"], ["**4. Связи с атомами разной ЭО**", "Один атом тянет электроны *к* центру, другой — *от* центра; сдвиги частично гасят друг друга", "`CH3OH` (`C`: `IV` / `−2`), `HCHO` (`C`: `IV` / `0`), `HCOOH` (`C`: `IV` / `+2`), `CH2Cl2` (`C`: `IV` / `0`)"]]}, {"svg": "<svg viewBox='0 0 460 226' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='460' height='226' rx='10' fill='var(--svg-bg,#0f1824)'/><text x='230' y='24' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='15' font-weight='700'>4 главных случая, когда валентность ≠ |с.о.|<\/text><rect x='14' y='38' width='208' height='82' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-acc,#14b8a6)'/><text x='118' y='58' text-anchor='middle' fill='var(--svg-acc,#14b8a6)' font-size='14' font-weight='700'>HNO₃ (азотная к-та)<\/text><text x='118' y='83' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>H—O—N(=O)→O<\/text><text x='118' y='108' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='13'>N: вал. IV, с.о. +5<\/text><rect x='238' y='38' width='208' height='82' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-gold,#e5a93c)'/><text x='342' y='58' text-anchor='middle' fill='var(--svg-gold,#e5a93c)' font-size='14' font-weight='700'>CO (угарный газ)<\/text><text x='342' y='83' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='13' font-weight='700'>C ≡ O (2 обм. + д.-а. O→C)<\/text><text x='342' y='108' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='13'>C: III / +2 · O: III / −2<\/text><rect x='14' y='132' width='208' height='82' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-blue,#60a5fa)'/><text x='118' y='152' text-anchor='middle' fill='var(--svg-blue,#60a5fa)' font-size='14' font-weight='700'>H₂O₂ (пероксид)<\/text><text x='118' y='177' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>H—O—O—H<\/text><text x='118' y='202' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='13'>O: вал. II, с.о. −1<\/text><rect x='238' y='132' width='208' height='82' rx='8' fill='var(--svg-surface,#162334)' stroke='var(--svg-good,#34c77b)'/><text x='342' y='152' text-anchor='middle' fill='var(--svg-good,#34c77b)' font-size='14' font-weight='700'>CH₃OH (метанол)<\/text><text x='342' y='177' text-anchor='middle' fill='var(--svg-ink,#e6eef7)' font-size='14' font-weight='700'>H₃C—O—H  (−3 + 1 = −2)<\/text><text x='342' y='202' text-anchor='middle' fill='var(--svg-dim,#94a8c0)' font-size='13'>C: вал. IV, с.о. −2<\/text><\/svg>", "cap": "В каждой из четырёх молекул число чёрточек вокруг центрального атома не совпадает с модулем его степени окисления."}, {"h": "2. Подробный разбор главных «звёзд» ЕГЭ"}, {"steps": ["**Угарный газ `CO`:** у углерода два неспаренных `2p`-электрона и одна пустая `2p`-орбиталь; у кислорода два неспаренных `2p`-электрона и неподелённые пары. Две связи образуются по обменному механизму, а третью связь кислород (донор) образует за счёт своей пары на пустую орбиталь углерода (акцептор). Итого **тройная связь**: валентность и углерода, и кислорода равна **`III`**. Но при расчёте с.о. кислород электроотрицательнее углерода, поэтому его собственная донорная пара просто возвращается к нему, а две обменные пары от углерода переходят к кислороду → `C^{+2}` и `O^{−2}`.", "**Азотная кислота `HNO3` и оксид `N2O5`:** у азота 4 связи (валентность `IV` — предел 2-го периода): одна обменная к `—OH`, две обменные к `=O` и одна донорно-акцепторная к третьему кислороду (`N → O`). Кислород электроотрицательнее азота, поэтому он забирает не только 3 обменных электрона азота, но и *оба* электрона его донорной пары `2s²`: `3 + 2 = 5` отданных электронов → степень окисления `N^{+5}` при валентности `IV`!", "**Катион аммония `NH4^{+}`:** у азота 4 связи с водородом (валентность `IV`: 3 обменные + 1 донорно-акцепторная с `H^{+}`). Азот электроотрицательнее водорода, поэтому 3 обменные пары приносят ему три чужих электрона (`−3`), а донорная пара и так принадлежала азоту (при возвращении к азоту заряд не меняется) → степень окисления `N^{−3}` при валентности `IV`.", "**Органический ряд углерода (`CH4 → CH3OH → HCHO → HCOOH → CO2`):** во всех пяти молекулах углерод образует ровно **4 связи** (валентность всегда **`IV`**!). Но в `CH4` все 4 связи с менее электроотрицательным `H` дают `−4`; в `CH3OH` три связи `C—H` (`−3`) и одна `C—O` (`+1`) дают `−2`; в формальдегиде `HCHO` две `C—H` (`−2`) и двойная `C=O` (`+2`) в сумме дают **`0`**; в муравьиной кислоте `HCOOH` одна `C—H` (`−1`) и три связи с кислородом (`+3`) дают `+2`; в `CO2` все 4 связи с кислородом дают `+4`."]}, {"warn": "В задании № 3 (и № 4) часто ловят на «хитрых» формулах, где `|с.о.| ≠ валентности`:\n- В **пероксиде `H2O2`** у кислорода валентность **`II`** (при с.о. `−1`); в **пирите `FeS2`** у серы валентность **`II`** (при с.о. `−1`); в **карбиде кальция `CaC2`** (связь `—C≡C—`) у углерода валентность **`IV`** (при с.о. `−1`).\n- В **фосфорноватистой кислоте `H3PO2`** и **фосфористой кислоте `H3PO3`** фосфор имеет **валентность `V`** (из-за прямых связей `P—H` и `P=O`), но его степень окисления равна соответственно **`+1`** и **`+3`**!\n- В **формальдегиде `HCHO`** и глюкозе `C6H12O6` у углерода валентность **`IV`** при с.о. **`0`**!", "t": "Ловушка на 95–100 баллов: H2O2, FeS2, CaC2, H3PO2/H3PO3 и HCHO"}, {"bridge": {"kim": "№ 3 и № 4 КИМ", "ask": "«Выберите два элемента, которые могут проявлять степень окисления `−1` / `0` в сложных веществах» или «проявляют валентность III в угарном газе / ионе гидроксония».", "watch": "Степень окисления `0` возможна не только в простых веществах, но и у углерода в сложных (`HCHO`, `C6H12O6`, `CH2Cl2`).", "tip": "Если сомневаешься в валентности — нарисуй структурную формулу и сосчитай чёрточки; для с.о. — используй электронейтральность или сдвиг электронов по ЭО."}}], "short": [{"list": ["Валентность (число связей) и модуль степени окисления (`|с.о.|`) расходятся в четырёх случаях: простые вещества, связи `Э—Э`, донорно-акцепторные связи и разнонаправленные полярные связи.", "В `HNO3` и `N2O5`: у азота валентность `IV`, а степень окисления `+5`.", "В `NH4^{+}`: у азота валентность `IV`, а степень окисления `−3`; в `H3O^{+}`: у кислорода валентность `III`, с.о. `−2`.", "В `CO`: у `C` и `O` валентность **`III`** (тройная связь: 2 обменные + 1 донорно-акцепторная), а степени окисления `+2` и `−2`.", "В `H2O2` у `O` валентность `II` (с.о. `−1`), в `FeS2` у `S` валентность `II` (с.о. `−1`), в `HCHO` и `C6H12O6` у `C` валентность `IV` (с.о. `0`)."]}]}, {"id": "06", "group": "Тонкости 95–100", "nav": "d-элементы и исключения", "codes": ["1.3"], "eyebrow": "06 · Задание 3 · Код 1.3", "title": "d-элементы и полный список исключений таблицы ФИПИ", "lead": "Почему хром и марганец честно доходят до номера своей группы (+6 и +7), а стоящие рядом железо (VIIIБ) останавливается на +6, а медь (IБ) «перепрыгивает» свою группу до +2?", "b": [{"key": "У `d`-элементов в образовании связей участвуют не только внешние `4s`-электроны, но и предвнешние `3d`-электроны. Поэтому многие `d`-металлы проявляют широкий набор положительных степеней окисления, а правило «ВСО = номер группы» нарушается у **`Fe` (`+6` вместо `+8`)** и **`Cu` (`+2` вместо `+1`)**.", "t": "Главная мысль."}, {"h": "1. Как работают валентные электроны d-элементов 4-го периода"}, {"p": "Вспомни из задания № 1: у `d`-элементов 4-го периода (от `Sc` до `Zn`) к валентным относятся `4s`- и `3d`-электроны. Сначала атом всегда отдаёт `4s`-электроны (поэтому почти для всех `d`-металлов характерна с.о. `+2`), а затем может подключать неспаренные `3d`-электроны."}, {"p": "От `Sc` (IIIБ) до `Mn` (VIIБ) число неспаренных `3d`-электронов растёт от 1 до 5, поэтому сумма `4s + 3d` точно совпадает с номером группы: `Sc (+3)`, `Ti (+4)`, `V (+5)`, `Cr (+6)`, `Mn (+7)`. После марганца `3d`-электроны начинают **спариваться**, ядро притягивает их всё сильнее, и оторвать все 8 электронов у железа уже невозможно — максимум для `Fe` в ЕГЭ равен **`+6`** (ферраты, например `K2FeO4`)."}, {"p": "У **меди (`Cu`, `3d¹⁰4s¹`)** в IБ группе отрыв одного `4s`-электрона даёт `Cu^{+1}` (`Cu2O`, `CuCl`), но энергии гидратации и кристаллической решётки хватает, чтобы оторвать ещё один электрон с `3d`-подуровня (`3d⁹`), поэтому наиболее устойчивой и **высшей** степенью окисления меди в ЕГЭ является **`+2`** (`CuO`, `CuSO4`, `Cu(OH)2`). А у **цинка (`Zn`, `3d¹⁰4s²`)** завершённый `3d¹⁰`-подуровень прочно прижат к ядру и в связях не участвует — поэтому у цинка в соединениях **постоянная степень окисления `+2`**."}, {"h": "2. Карта d-элементов для ЕГЭ (выучи эту таблицу наизусть)"}, {"table": [["Элемент (группа)", "Конфигурация", "Характерные с.о. в ЕГЭ", "НСО / ВСО", "Δ", "ВСО = номер группы?"], ["`Sc` (IIIБ)", "`3d¹4s²`", "`+3` (постоянная)", "`0` / `+3`", "`3`", "Да (`+3 = III`)"], ["`Ti` (IVБ)", "`3d²4s²`", "`+2, +3, +4`", "`0` / `+4`", "`4`", "Да (`+4 = IV`)"], ["`V` (VБ)", "`3d³4s²`", "`+2, +3, +4, +5`", "`0` / `+5`", "`5`", "Да (`+5 = V`)"], ["**`Cr` (VIБ)**", "`3d⁵4s¹` (провал)", "`+2, +3, +6` (`CrO`, `Cr2O3`, `K2CrO4`)", "`0` / `+6`", "`6`", "Да (`+6 = VI`)"], ["**`Mn` (VIIБ)**", "`3d⁵4s²`", "`+2, +3, +4, +6, +7` (`MnSO4`, `MnO2`, `K2MnO4`, `KMnO4`)", "`0` / `+7`", "`7`", "Да (`+7 = VII`)"], ["**`Fe` (VIIIБ)**", "`3d⁶4s²`", "`+2, +3, +6` (`FeO`, `Fe2O3`, `K2FeO4`)", "`0` / **`+6`**", "`6`", "**НЕТ** (`+6 ≠ VIII`)"], ["**`Cu` (IБ)**", "`3d¹⁰4s¹` (провал)", "`+1, +2` (`Cu2O`, `CuO`, `CuSO4`)", "`0` / **`+2`**", "`2`", "**НЕТ** (`+2 ≠ I`)"], ["**`Zn` (IIБ)**", "`3d¹⁰4s²`", "**`+2` (постоянная!)**", "`0` / `+2`", "`2`", "Да (`+2 = II`)"], ["**`Ag` (IБ)**", "`4d¹⁰5s¹` (провал)", "**`+1` (постоянная в ЕГЭ!)**", "`0` / `+1`", "`1`", "Да (`+1 = I`)"]]}, {"h": "3. Карта характерных (в т.ч. промежуточных) с.о. главных неметаллов"}, {"p": "В заданиях на конкретную промежуточную степень окисления (`+1`, `+2`, `+3`, `+4`) помогает **правило чётности**: у неметаллов чётных групп (IVA, VIA) главные положительные с.о. чётные, а у неметаллов нечётных групп (VA, VIIA) — нечётные (исключение — азот, который проявляет все значения от `+1` до `+5`):"}, {"table": [["Неметалл (группа)", "Характерные с.о. в ЕГЭ", "Ключевые примеры для промежуточных с.о."], ["`C` (IVA)", "`−4 … +4` (вкл. `0`, `+2`, `+4`)", "`CO` (`+2`), `HCHO` (`0`), `CaC2` (`−1`), `Al4C3` (`−4`)"], ["`Si` (IVA)", "`−4, +4` (реже `+2`)", "`Mg2Si` (`−4`), `SiO2`, `SiH4` (`+4`)"], ["`N` (VA)", "`−3, −2, −1, 0, +1, +2, +3, +4, +5`", "`N2H4` (`−2`), `N2O` (`+1`), `NO` (`+2`), `HNO2/N2O3` (`+3`), `NO2` (`+4`)"], ["`P` (VA)", "`−3, 0, +1, +3, +5`", "`Ca3P2/PH3` (`−3`), `H3PO2` (`+1`), `P2O3/H3PO3` (`+3`), `H3PO4` (`+5`)"], ["`S` (VIA)", "`−2, −1, 0, +2, +4, +6`", "`FeS2` (`−1`), `Na2S2O3` (ср. `+2`), `SO2/H2SO3` (`+4`), `H2SO4` (`+6`)"], ["`Cl, Br, I` (VIIA)", "`−1, 0, +1, +3, +5, +7`", "`HClO` (`+1`), `HClO2` (`+3`), `KClO3` (`+5`), `HClO4` (`+7`)"]]}, {"h": "4. Полный реестр исключений задания № 3 (всё в одном месте)"}, {"p": "В задании № 3 ФИПИ постоянно проверяет три «золотых списка» элементов. Сравни их внимательно — особенно судьбу азота `N`, водорода `H` и бора `B`:"}, {"compare": {"t": "Три главных списка исключений в задании № 3", "cols": ["Список", "Какие элементы входят (ЕГЭ)", "Почему именно они"], "rows": [["**Высшая с.о. НЕ равна номеру группы**", "`F (0)`, `O (+2)`, `Fe (+6)`, `Cu (+2)`, инертные газы (`He, Ne, Ar`)", "У `N` высшая с.о. `+5` **РАВНА** номеру группы V — азот в этот список **НЕ** входит!"], ["**Высшая валентность НЕ равна номеру группы**", "`N (IV)`, `O (III)`, `F (I)`, `Fe (VI)`, `Cu (II)`, инертные газы", "Азот **ВХОДИТ** сюда (нет `2d`). Бор `B` по обменному механизму даёт `III` (= группе), а `IV` лишь в комплексах (`[BF4]⁻`), поэтому в этот школьный список его обычно не включают"], ["**Постоянная с.о. в соединениях**", "`F (−1)`, `Li–Cs (+1)`, `Be–Ba (+2)`, `Al (+3)`, `Zn (+2)`, `Ag (+1)`, `Sc (+3)`", "В соединениях у них всегда одно ненулевое значение (`0` — только в простом веществе). У бора `B` в школьных соединениях тоже встречается `+3`, но в парах КИМ на постоянную с.о. ставят элементы из основного списка"]]}}, {"warn": "Не путай два разных вопроса: **«постоянная степень окисления»** и **«постоянная валентность»**!\n- **Постоянная с.о. в соединениях:** `Li–Cs`, `Be–Ba`, `Al`, `Zn`, `Ag`, `Sc`, `F` (медь `Cu`, хром `Cr`, марганец `Mn`, железо `Fe`, кислород `O` и водород `H` имеют **переменную** с.о.!).\n- **Ловушка на водород `H`:** у водорода **постоянная валентность `I`** (всего одна орбиталь `1s`), но **переменная степень окисления** (`+1` в воде и кислотах, `−1` в гидридах `NaH`, `SiH4`)!", "t": "Ловушка «постоянная валентность» vs «постоянная с.о.»"}, {"h": "5. Разбор вслух: проверяем ряд с d-элементами"}, {"p": "**Задача:** дан ряд `1) Cr   2) Fe   3) Cu   4) Zn   5) N`. Найди ответы на два разных вопроса:\n- **Вопрос А:** у каких двух элементов высшая **степень окисления** не равна номеру группы?\n- **Вопрос Б:** у каких двух элементов разность между высшей и низшей степенями окисления `Δ` равна `6`?"}, {"steps": ["**Выписываем паспорт каждого элемента:** `Cr` (VIБ, ВСО `+6`, НСО `0`, `Δ = 6`), `Fe` (VIIIБ, ВСО `+6`, НСО `0`, `Δ = 6`), `Cu` (IБ, ВСО `+2`, НСО `0`, `Δ = 2`), `Zn` (IIБ, ВСО `+2`, НСО `0`, `Δ = 2`), `N` (VA, ВСО `+5`, НСО `−3`, `Δ = 8`, макс. валентность `IV`).", "**Ответ на Вопрос А (ВСО ≠ номеру группы):** проверяем каждого. `Cr` (`+6 = VI` — нет), **`Fe` (`+6 ≠ VIII` — да!)**, **`Cu` (`+2 ≠ I` — да!)**, `Zn` (`+2 = II` — нет), `N` (`+5 = V` — нет!). Ответ: **`23`**.", "**Ответ на Вопрос Б (`Δ = 6`):** у `Cr` `Δ = 6 − 0 = 6`, у `Fe` `Δ = 6 − 0 = 6`. У `Cu` и `Zn` `Δ = 2`, у `N` `Δ = 8`. Ответ: **`12`**."]}, {"note": "В научной неорганической химии известны редкие комплексы `Cu(III)` и `Ag(II)`, а также соединения `XeF2/XeF6`. Однако **в рамках ЕГЭ по химии (код 1.3)** для `Cu` высшая с.о. строго `+2`, для `Ag` — постоянная `+1`, для `Fe` — высшая `+6`, а для `He, Ne, Ar` соединения не рассматриваются.", "t": "За рамками ЕГЭ — для понимания."}, {"bridge": {"kim": "№ 3 КИМ (код 1.3)", "ask": "«Высшая степень окисления не равна номеру группы», «проявляют постоянную степень окисления в соединениях», «могут проявлять степень окисления `+6` / `+2` / `+3`».", "watch": "Ставят `Fe` рядом с `N` и спрашивают про ВСО (азот не подходит!) или ставят `Zn` рядом с `Cu` и спрашивают про переменную с.о. (цинк не подходит!).", "tip": "Увидев в ряду `Fe`, `Cu`, `Zn`, `Cr`, `Mn` или `Ag`, сразу проверь их по «карте d-элементов» — почти всегда именно вокруг них строится ловушка."}}], "short": [{"list": ["У `d`-элементов `Sc (+3)`, `Ti (+4)`, `V (+5)`, `Cr (+6)`, `Mn (+7)`, `Zn (+2)`, `Ag (+1)` высшая с.о. совпадает с номером группы.", "Два главных `d`-исключения: у **`Fe`** (VIIIБ) высшая с.о. равна **`+6`** (ферраты `K2FeO4`), у **`Cu`** (IБ) — **`+2`** (`CuO`, `CuSO4`).", "Постоянную с.о. в соединениях проявляют: `F (−1)`, `Li–Cs (+1)`, `Be–Ba (+2)`, `Zn (+2)`, `Al (+3)`, `Ag (+1)`, `Sc (+3)`.", "ВСО ≠ номеру группы: `F, O, Fe, Cu` (и инертные газы) — азот сюда **не входит** (`+5 = V`).", "Высшая валентность ≠ номеру группы: `N (IV), O (III), F (I), Fe (VI), Cu (II)` — азот сюда **входит**."]}]}, {"id": "07", "group": "Экзамен и КИМ", "nav": "Оксоанионы и ЭHₙ", "codes": ["1.3"], "eyebrow": "07 · Задание 3 · Код 1.3", "title": "Оксоанионы ЭOₓ^{n−}, оксиды и водородные соединения", "lead": "По алгебре и фосфор, и азот имеют степень окисления +5 — но фосфор образует ортофосфат PO4^{3−}, а азот иона NO4^{3−} не образует! Как не попасться в ловушку «несуществующего аниона»?", "b": [{"key": "Задачи на общие формулы `ЭOₓ^{n−}`, `ЭₓOᵧ` и `ЭHₙ` требуют **двухшаговой проверки**: сначала вычисляем степень окисления элемента `Э` из формулы, а затем проверяем, **действительно ли элемент образует такой ион или соединение** в химии ЕГЭ.", "t": "Главная мысль."}, {"h": "1. Оксоанионы общей формулы ЭOₓ^{n−}: двухшаговый фильтр"}, {"p": "В обновлённых вариантах задания № 3 ФИПИ очень любит формулировку: *«Выберите два элемента, которые образуют устойчивые анионы общей формулы `ЭO4^{2−}` (или `ЭO3^{−}`, `ЭO4^{−}`, `ЭO3^{2−}`, `ЭO2^{−}`)»*. Решать её «чистой алгеброй» опасно — элемент может подходить по степени окисления, но не образовывать такой анион."}, {"tree": {"t": "Алгоритм проверки: образует ли элемент Э оксоанион ЭOₓ^{n−}?", "root": {"q": "Шаг 1. Вычисли с.о. элемента Э из уравнения s + x·(−2) = −n. Способен ли элемент Э проявлять такую положительную с.о.?", "no": {"a": "Элемент НЕ подходит", "why": "Например, в `ЭO4^{−}` требуется с.о. `+7`, поэтому `S` (макс. `+6`) и `N` (макс. `+5`) отсеиваются сразу."}, "yes": {"q": "Шаг 2. Является ли этот элемент неметаллом (кроме F) или переходным/амфотерным металлом, дающим кислотный оксид в данной с.о.?", "no": {"a": "Элемент НЕ подходит", "why": "Щелочные и щёлочноземельные металлы (`Na, K, Ca, Mg`) в соединениях образуют только катионы, а не оксоанионы."}, "yes": {"q": "Шаг 3. Существует ли в курсе ЕГЭ реальный анион именно с таким числом атомов кислорода `x`?", "yes": {"a": "Элемент ПОДХОДИТ!", "why": "И степень окисления, и конкретный состав аниона подтверждены реальными кислотами/солями ЕГЭ (например, `SO4^{2−}`, `CrO4^{2−}`, `MnO4^{2−}`)."}, "no": {"a": "ЛОЖНЫЙ КАНДИДАТ — отбросить!", "why": "Углерод имеет `+4`, но даёт `CO3^{2−}`, а не `CO4^{4−}` (в отличие от ортосиликата `SiO4^{4−}`); азот имеет `+5`, но из-за малого радиуса и потолка валентности IV даёт `NO3^{−}`, а не `NO4^{3−}` (в отличие от `PO4^{3−}`)."}}}}}}, {"h": "2. Шпаргалка реальных оксоанионов ЕГЭ (по общей формуле)"}, {"table": [["Общая формула", "Требуемая с.о. `Э`", "Реальные анионы из ЕГЭ", "Частые ложные кандидаты (НЕ брать!)"], ["`ЭO^{−}`", "`+1`", "`ClO^{−}` (гипохлорит), `BrO^{−}`, `IO^{−}`", "`F` (фтор не имеет положительных с.о.)"], ["`ЭO2^{−}`", "`+3`", "`NO2^{−}`, `ClO2^{−}`, `AlO2^{−}` (метаалюминат), `CrO2^{−}`, `FeO2^{−}`, `BO2^{−}`", "`P` (у фосфора `H3PO2` даёт `H2PO2^{−}` с `+1`, а не `PO2^{−}`)"], ["`ЭO3^{−}`", "`+5`", "`NO3^{−}`, `ClO3^{−}`, `BrO3^{−}`, `IO3^{−}`, `PO3^{−}` (метафосфат)", "`S` (макс. `+6`, нет `+5`), `C` (макс. `+4`)"], ["`ЭO4^{−}`", "`+7`", "`MnO4^{−}` (перманганат), `ClO4^{−}` (перхлорат), `BrO4^{−}`, `IO4^{−}`", "`N, S, Cr, Fe` (у них нет с.о. `+7`)"], ["`ЭO2^{2−}`", "`+2`", "`ZnO2^{2−}` (цинкат при сплавлении), `BeO2^{2−}`, `PbO2^{2−}`", "`Mg, Ca` (не амфотерны, анионов не дают)"], ["`ЭO3^{2−}`", "`+4`", "`CO3^{2−}`, `SiO3^{2−}`, `SO3^{2−}`", "`N` (нет аниона `NO3^{2−}`), `Cr` (нет `+4`)"], ["`ЭO4^{2−}`", "`+6`", "`SO4^{2−}`, `CrO4^{2−}`, `MnO4^{2−}` (манганат), `FeO4^{2−}` (феррат), `SeO4^{2−}`", "`C, Si` (макс. `+4`), `P` (`PO4^{3−}` имеет заряд `3−`, а не `2−`!)"], ["`ЭO4^{3−}`", "`+5`", "`PO4^{3−}` (ортофосфат), `AsO4^{3−}`", "`N` (`NO3^{−}`, но не `NO4^{3−}`!), `Cl` (`ClO3^{−}`)"], ["`Э2O7^{2−}`", "`+6`", "`Cr2O7^{2−}` (дихромат), `S2O7^{2−}` (дисульфат)", "`Mn` (`Mn2O7` — нейтральный оксид, а не анион!)"]]}, {"h": "3. Летучие водородные соединения (ЛВС) против ионных гидридов"}, {"p": "Вторая коварная формулировка задания № 3 — про **водородные соединения** (`ЭHₙ` или `HₙЭ`). Здесь критически важно различать два класса веществ:"}, {"list": ["**Летучие водородные соединения (ЛВС)** образуют только **неметаллы IVA–VIIA групп** (газы или летучие жидкости с ковалентными связями): `CH4`, `SiH4` (IVA, `ЭH4`); `NH3`, `PH3` (VA, `ЭH3`); `H2O`, `H2S`, `H2Se` (VIA, `H2Э`); `HF`, `HCl`, `HBr`, `HI` (VIIA, `HЭ`).", "**Солеобразные (ионные) гидриды** образуют активные металлы IA–IIA групп (`NaH`, `KH`, `CaH2`, `BaH2`) — это твёрдые нелетучие вещества, они **не являются летучими водородными соединениями**! Бор (`B2H6`) и алюминий (`AlH3`) также не относятся к классическому ряду ЛВС IVA–VIIA.", "**Ловушка знака в `SiH4`:** хотя силан `SiH4` входит в ряд ЛВС IVA группы (`ЭH4`), электроотрицательность водорода (`2,20`) выше, чем у кремния (`1,90`). Поэтому в `CH4` углерод имеет **`−4`**, а в `SiH4` кремний имеет **`+4`** (и водород `−1`)!", "**Бинарные соединения неметаллов с металлами (в НСО):** низшие с.о. неметаллов реализуются в солях-бинарниках: силицид `Mg2Si` (`Si^{−4}`), карбид алюминия `Al4C3` (`C^{−4}`, а в `CaC2` — `C^{−1}`), нитрид `Mg3N2` (`N^{−3}`), фосфид `Ca3P2` (`P^{−3}`)."]}, {"h": "4. Высшие оксиды ЭₓOᵧ и фтор"}, {"p": "Если задание спрашивает про «общую формулу высшего оксида `ЭO3`» или «высшего оксида `Э2O5`», сначала переведи формулу в степень окисления (`ЭO3` → `+6`, `Э2O5` → `+5`, `ЭO2` → `+4`, `Э2O7` → `+7`), а затем проверь два исключения:"}, {"list": ["**Фтор (`F`) не образует оксидов!** Соединение `OF2` — это фторид кислорода (`O^{+2}, F^{−1}`), а не оксид фтора.", "**Кислород (`O`)** сам с собой даёт простые вещества `O2` и `O3`, а не оксид. **Железо (`Fe`)** в ЕГЭ высший оксид `FeO3` не образует (для железа характерны оксиды `FeO`, `Fe2O3`, `Fe3O4`, а с.о. `+6` реализуется в солях-ферратах `K2FeO4`)."]}, {"h": "5. Разбор вслух: две реальные задачи на ЭOₓ^{n−} и ЭHₙ"}, {"steps": ["**Задача 1:** дан ряд `1) Si   2) Mn   3) N   4) P   5) Cr`. Выберите два элемента, которые образуют оксоанион общей формулы `ЭO4^{2−}`. Вычисляем с.о. элемента: `s + 4·(−2) = −2` → `s = +6`. Проверяем каждого: `Si` (макс. `+4`, даёт `SiO3^{2−}` — нет), **`Mn` (`MnO4^{2−}`, манганат — да!)**, `N` (макс. `+5` — нет), `P` (макс. `+5`, даёт `PO4^{3−}` — нет), **`Cr` (`CrO4^{2−}`, хромат — да!)**. Ответ: **`25`**. Особое внимание к `Mn`: ученики помнят перманганат `MnO4^{−}` (`+7`) и часто забывают зелёный манганат `MnO4^{2−}` (`+6`)!", "**Задача 2:** дан ряд `1) C   2) Si   3) N   4) Na   5) Cl`. Выберите два элемента, которые в **летучем водородном соединении** проявляют **отрицательную** степень окисления, либо имеют общую формулу `ЭH4`. Проверяем формулы: `C → CH4` (`C^{−4}`), `Si → SiH4` (`Si^{+4}`!), `N → NH3` (`N^{−3}`), `Na → NaH` (не летучее, гидрид металла!), `Cl → HCl` (`Cl^{−1}`). Если вопрос «общая формула `ЭH4`» → подходят `C` и `Si` (`12`). Если вопрос «отрицательная с.о. в ЛВС `ЭH4`» → подходит только `C`, а `Si` отсеивается, потому что в `SiH4` кремний `+4`!"]}, {"bridge": {"kim": "№ 3 КИМ (код 1.3)", "ask": "«Образуют анион состава `ЭO4^{2−}` / `ЭO3^{−}` / `ЭO4^{−}`», «образуют летучее водородное соединение `ЭH3` / `H2Э`», «проявляют в водородном соединении с.о. `−2` / `+4`».", "watch": "Забывают манганат `MnO4^{2−}` и феррат `FeO4^{2−}` для `ЭO4^{2−}`; путают `PO4^{3−}` с `ЭO4^{2−}`; забывают, что в `SiH4` кремний положителен (`+4`), а `NaH` — не летучее соединение.", "tip": "Для любого оксоаниона сразу пропиши реальную соль (например, `K2SO4`, `K2CrO4`, `K2MnO4`, `K2FeO4`) — если реальная соль из курса ЕГЭ не вспоминается, проверь кандидата дважды."}}], "short": [{"list": ["Для проверки `ЭOₓ^{n−}` всегда делай два шага: 1) вычисли с.о. элемента `s = 2x − n`; 2) проверь реальное существование аниона в курсе ЕГЭ.", "Главные пары оксоанионов ЕГЭ: `ЭO4^{2−}` (`SO4^{2−}`, `CrO4^{2−}`, `MnO4^{2−}`, `FeO4^{2−}`), `ЭO4^{−}` (`MnO4^{−}`, `ClO4^{−}`), `ЭO3^{−}` (`NO3^{−}`, `ClO3^{−}`, `BrO3^{−}`), `ЭO3^{2−}` (`CO3^{2−}`, `SiO3^{2−}`, `SO3^{2−}`).", "Летучие водородные соединения (ЛВС) образуют только неметаллы IVA–VIIA групп; гидриды металлов (`NaH`, `CaH2`) к ЛВС не относятся.", "В силане `SiH4` у кремния степень окисления **`+4`**, а у водорода **`−1`** (в отличие от `CH4`, где `C^{−4}` и `H^{+1}`).", "Фтор не образует оксидов (`OF2` — фторид кислорода)."]}]}, {"id": "08", "group": "Экзамен и КИМ", "nav": "Стратегия № 3 КИМ", "codes": ["1.3"], "eyebrow": "08 · Задание 3 · Код 1.3", "title": "Стратегия решения № 3 КИМ: все 12 формулировок за 60 секунд", "lead": "Почему даже сильные ученики теряют этот лёгкий 1 балл в самом начале экзамена? Почти всегда причина одна — невнимательно прочитанное слово-переключатель в условии.", "b": [{"key": "Задание № 3 даёт **1 первичный балл**, в ответе всегда ровно **две цифры**, и **порядок цифр значения не имеет** (`14` и `41` оба верны). Безошибочное решение строится на едином 4-шаговом алгоритме и проверке слов-переключателей.", "t": "Главная мысль."}, {"h": "1. Единый 4-шаговый алгоритм решения любого задания № 3"}, {"flow": [["1. Прочти переключатель", "Подчеркни: «валентность» или «с.о.», «высшая/низшая/разность», «в соединениях», «не равна», «оксоанион»"], ["2. Выпиши паспорт 5 элементов", "Над каждым элементом ряда подпиши группу, [НСО; ВСО] и при необходимости Δ или макс. валентность"], ["3. Отбери ровно 2 элемента", "Проверь исключения (F, O, N, H, B, Si, Fe, Cu, Zn) и реальное существование формул"], ["4. Контрольная проверка", "Убедись, что оставшиеся 3 элемента точно НЕ подходят — это гарантирует защиту от неверного прочтения"]]}, {"h": "2. Карта всех 12 формулировок задания № 3 ФИПИ"}, {"table": [["№", "Формулировка в КИМ ЕГЭ", "На что смотреть сразу", "Главная ловушка"], ["1", "Принимают в соединениях **как `+`, так и `−` с.о.** (Демо-2027)", "Неметаллы, включая `O`, `H`, `Si`", "Отбрось `F` (только `−1`), металлы и `B` (в ЕГЭ без `−`)"], ["2", "**Одинаковая высшая с.о.**", "Номер группы + список исключений", "`F (0)`, `O (+2)`, `Fe (+6)`, `Cu (+2)` ≠ номеру группы"], ["3", "**Одинаковая низшая с.о.**", "Металлы + `B` → `0`; неметаллы → `N − 8`", "У `H` и галогенов НСО = `−1`; у `Fe` и `Na` НСО = `0`"], ["4", "**Одинаковая разность `Δ`** (или **`|ВСО| = |НСО|`**)", "`Δ = ВСО − НСО` со знаком! Для `|ВСО| = |НСО|` всего 4 элемента: `C, Si, O, H`", "Все стандартные неметаллы → `8`; `O → 4`; `F/Na → 1`; `H/Mg/Cu/Zn → 2`; `B/Al → 3`; `Cr/Fe → 6`"], ["5", "Высшая **валентность не равна** номеру группы", "`N (IV), O (III), F (I), Fe (VI), Cu (II)`", "Азот **подходит** (`IV ≠ V`)"], ["6", "Высшая **с.о. не равна** номеру группы", "`F (0), O (+2), Fe (+6), Cu (+2)`", "Азот **НЕ подходит** (`+5 = V`)!"], ["7", "**Постоянная с.о.** vs **постоянная валентность** в соединениях", "Пост. с.о.: `Li–Cs, Be–Ba, Al, Zn, Ag, F, Sc`; пост. вал.: те же + **`H (I)`**!", "`H` имеет постоянную валентность `I`, но **переменную** с.о. (`+1`, `−1`); `Cu, Fe, Cr, Mn, O` — переменная с.о."], ["8", "Образуют **оксоанион `ЭOₓ^{n−}`**", "`s = 2x − n` + реальная соль", "Помни `MnO4^{2−}`, `FeO4^{2−}`; отсеивай несуществующие `NO4^{3−}`, `CO4^{4−}`"], ["9", "**Летучее водородное соединение** `ЭHₙ` / `HₙЭ`", "Только неметаллы IVA–VIIA", "В `SiH4` кремний `+4`, `H` `−1`; `NaH` не летучее"], ["10", "**Не проявляют отрицательной** (или положительной) с.о.", "Без `−`: металлы, `B`, инертные газы; без `+`: `F`, инертные газы", "Не спутай «в соединениях» и «вообще»"], ["11", "Проявляют **конкретную промежуточную с.о. / валентность** (напр. `−1`, `+3`, `IV`)", "Не только ВСО/НСО, но и промежуточные", "`O` бывает `−1` (`H2O2`), `S` бывает `−1` (`FeS2`), `C` бывает `0` (`HCHO`), `N` не бывает `V`"], ["12", "Общая формула **высшего оксида `ЭₓOᵧ`** или **валентность ≠ |с.о.|**", "Переведи формулу оксида в ВСО; проверь `HNO3, CO, H2O2, NH4^{+}`", "У фтора нет оксидов (`OF2` — фторид кислорода)"]]}, {"h": "3. Четыре полных разбора сложных заданий № 3"}, {"steps": ["**Разбор 1 (разность `Δ` с металлом и неметаллом).** Ряд: `1) H   2) S   3) O   4) Cu   5) Al`. *Выберите два элемента, у которых разность между высшей и низшей степенями окисления равна `2`.* Выписываем `Δ`: `H`: `+1 − (−1) = 2`; `S`: `+6 − (−2) = 8`; `O`: `+2 − (−2) = 4`; `Cu`: `+2 − 0 = 2` (ВСО меди `+2`, НСО `0`); `Al`: `+3 − 0 = 3`. Остальные три точно не дают `2`. **Ответ: `14`**.", "**Разбор 2 (ловушка на азот и кислород).** Ряд: `1) N   2) P   3) O   4) S   5) Cl`. *Выберите два элемента, высшая валентность которых не равна номеру группы.* Проверяем каждого: `N` (VA, макс. валентность `IV ≠ V` — **да**); `P` (VA, есть `3d`, макс. `V = V` — нет); `O` (VIA, макс. `III ≠ VI` — **да**); `S` (VIA, есть `3d`, макс. `VI = VI` — нет); `Cl` (VIIA, есть `3d`, макс. `VII = VII` — нет). **Ответ: `13`**. (А если бы спросили про высшую *степень окисления*, то `N` бы отпал, так как ВСО азота `+5 = V`!)", "**Разбор 3 (оксоанионы `ЭO4^{2−}`).** Ряд: `1) C   2) P   3) Fe   4) Mn   5) N`. *Выберите два элемента, которые могут образовывать анион общей формулы `ЭO4^{2−}`.* Вычисляем с.о.: `s + 4·(−2) = −2` → `s = +6`. Проверяем: `C` (макс. `+4` — нет), `P` (макс. `+5`, даёт `PO4^{3−}` — нет), `Fe` (феррат `FeO4^{2−}`, `+6` — **да**), `Mn` (манганат `MnO4^{2−}`, `+6` — **да**), `N` (макс. `+5`, даёт `NO3^{−}` — нет). **Ответ: `34`**.", "**Разбор 4 (водородные соединения и постоянная с.о.).** Ряд: `1) Si   2) C   3) Na   4) F   5) Zn`. *Выберите два элемента, которые в соединениях проявляют постоянную степень окисления и НЕ образуют летучих водородных соединений.* Постоянная с.о. в соединениях: `Na (+1)`, `F (−1)`, `Zn (+2)` (`Si` и `C` — переменная). Теперь второй фильтр («не образуют ЛВС»): `F` образует ЛВС `HF` (отпадает!), а `Na` и `Zn` — металлы, ЛВС не образуют. **Ответ: `35`**."]}, {"warn": "Оформление в бланке № 1: записывай ровно **две цифры без пробелов и запятых** (например, `14`). Порядок цифр в задании № 3 значения не имеет, но привычка записывать их по возрастанию (`14`, а не `41`) помогает избежать случайных повторов и описок. Если записать 3 цифры вместо 2 — система автоматически ставит **0 баллов**.", "t": "Техника записи ответа в бланк ЕГЭ-2027"}, {"bridge": {"kim": "№ 3 КИМ (итоговый чек-поинт)", "ask": "Любая из 12 формулировок линии № 3, объединённая общим рядом из 5 элементов с заданиями № 1 и № 2.", "watch": "Смена слова «валентность» ↔ «степень окисления», скрытое условие «в соединениях» и проверка оставшихся 3 элементов.", "tip": "Выполняй задания 1–3 блоком на одном ряду элементов: электронные конфигурации из № 1 и положение в таблице из № 2 сразу дают тебе готовый паспорт для № 3."}}], "short": [{"list": ["Задание № 3 оценивается в **1 балл**, в ответе всегда **2 цифры**, порядок записи цифр значения не имеет.", "Всегда начинай с подчёркивания слова-переключателя: *валентность* vs *степень окисления*, *высшая* vs *низшая* vs *разность Δ*, *в соединениях* vs *вообще*.", "Выписывай паспорт `[НСО; ВСО]` для всех 5 элементов ряда и проверяй, что оставшиеся 3 элемента точно НЕ подходят.", "Семь главных «провокаторов» линии № 3: `F`, `O`, `N`, `H`, `Si`, `Fe`, `Cu` — проверяй их по правилам исключений в первую очередь.", "Уверенное владение кодом 1.3 сразу закрывает фундамент для заданий № 4 (химическая связь), № 5 (классификация), № 19 и № 29 (ОВР)."]}]}], "gloss": [["Электроотрицательность", "Способность атома химического элемента в соединении притягивать к себе общие электронные пары. Растёт по таблице ФИПИ к фтору (F).", "ЭО(F) > ЭО(O) → в OF2 кислород имеет с.о. +2, фтор −1"], ["Степень окисления", "Условный заряд атома в соединении, вычисленный в предположении, что все полярные связи полностью ионные. Записывается со знаком впереди.", "Fe^{+3}, O^{−2}, S^{+6}, N^{−3}"], ["Заряд иона", "Реальный электрический заряд простой или сложной заряженной частицы. Записывается с цифрой впереди, затем знак.", "Fe^{3+}, O^{2−}, SO4^{2−}, NH4^{+}"], ["Валентность", "Число ковалентных химических связей (общих электронных пар), которые атом образует с другими атомами. Записывается римскими цифрами без знака.", "N в HNO3 и NH4^{+} имеет валентность IV; O в CO — III"], ["Возбуждённое состояние", "Энергетически повышенное состояние атома, при котором спаренные электроны распариваются и переходят на свободные орбитали того же энергетического уровня.", "C: 2s²2p² → 2s¹2p³ (валентность IV); P: 3s²3p³ → 3s¹3p³3d¹ (валентность V)"], ["Донорно-акцепторный механизм", "Способ образования ковалентной связи, при котором один атом (донор) предоставляет неподелённую электронную пару, а второй (акцептор) — свободную орбиталь.", "NH3 + H^{+} → NH4^{+}; третья связь в молекуле CO"], ["Высшая степень окисления", "Максимальная степень окисления элемента (обычно равна +N, где N — номер группы; исключения: F = 0, O = +2, Fe = +6, Cu = +2).", "S: +6; Cl: +7; Mn: +7; O: +2"], ["Низшая степень окисления", "Минимальная степень окисления элемента: N − 8 для неметаллов, 0 для всех металлов и бора (в ЕГЭ), −1 для водорода.", "N: −3; S: −2; Cl: −1; Fe: 0; H: −1"], ["Пероксид", "Кислородное соединение, содержащее пероксидный мостик —O—O—, в котором кислород имеет степень окисления −1 при валентности II.", "H2O2, Na2O2, BaO2"], ["Оксоанион", "Сложный отрицательно заряженный ион, состоящий из центрального атома элемента и атомов кислорода общей формулы ЭOₓ^{n−}.", "SO4^{2−}, CrO4^{2−}, MnO4^{2−}, NO3^{−}, ClO4^{−}"], ["Летучее водородное соединение", "Ковалентное соединение неметалла IVA–VIIA групп с водородом (газ или летучая жидкость), в отличие от твёрдых ионных гидридов металлов.", "CH4, SiH4, NH3, PH3, H2O, H2S, HF, HCl"]], "_img": {"fipi-pshe": {"data": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACSMAAAZ2CAIAAADVZbb1AAAACXBIWXMAAB7CAAAewgFu0HU+AAUw3ElEQVR4nOzdefwd46E/8G8iRBKJEtSeqliLthJUf9HW0gp1lWvXWmKp4qJ2Ubyu2lpb0Yi1JCix9qL2llYtQUVuYgvahlpuIpEgsSSS72+a8+q8xnOWnO/M+X7nTM77/Ude35x5ZuaZZ2aeM+f5nJnT1g4AAAAAAAB0XFveFQAAAAAAAIBCkrQBAAAAAABAGpI2AAAAAAAASEPSBgAAAAAAAGlI2gAAAAAAACANSRsAAAAAAACkIWkDAAAAAACANCRtAAAAAAAAkIakDQAAAAAAANKQtAEAAAAAAEAakjYAAAAAAABIQ9IGAAAAAAAAaUjaAAAAAAAAIA1JGwAAAAAAAKQhaQMAAAAAAIA0JG0AAAAAAACQhqQNAAAAAAAA0pC0AQAAAAAAQBqSNgAAAAAAAEhD0gYAAAAAAABpSNoAAAAAAAAgDUkbAAAAAAAApCFpAwAAAAAAgDQkbQAAAAAAAJCGpA0AAAAAAADSkLQBAAAAAA
