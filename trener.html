<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>Тренажёр ЕГЭ-100</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1e23;--mut:#6b6f78;--line:#e4e0d7;--acc:#2f5bd3;--accs:#e7edfb;--ok:#1d8a4b;--oks:#e2f4e9;--bad:#c33a2c;--bads:#fbe6e3;--warn:#a8701a;--warns:#fbf0d9;--red:#d4332a;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
:root[data-theme=dark]{--bg:#0f1621;--card:#172130;--ink:#e7edf5;--mut:#95a4b8;--line:#29394d;--acc:#5ea1ff;--accs:#1c2d47;--ok:#4cc27e;--oks:#163125;--bad:#ff7d6d;--bads:#381f22;--warn:#e6b04e;--warns:#342915;--red:#ff6b61;--sh:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0f1621;--card:#172130;--ink:#e7edf5;--mut:#95a4b8;--line:#29394d;--acc:#5ea1ff;--accs:#1c2d47;--ok:#4cc27e;--oks:#163125;--bad:#ff7d6d;--bads:#381f22;--warn:#e6b04e;--warns:#342915;--red:#ff6b61;--sh:none}}
:root[data-theme=paper]{--bg:#eae1cf;--card:#f6efe1;--ink:#2a231b;--mut:#625648;--line:#d6c8b0;--acc:#24529a;--accs:#e3e9f0;--ok:#1f6d3d;--oks:#e1ece2;--bad:#a82039;--bads:#f3dfdf;--warn:#9c4a08;--warns:#f3e5cb;--red:#b02a2a;--sh:0 2px 10px rgba(58,42,22,.06)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hw{max-width:900px;margin:0 auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;margin-right:auto;white-space:nowrap;display:flex;align-items:center;gap:10px}.brand span{color:var(--acc)}
.portal-lnk{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);padding:4px 10px;border-radius:9px;color:var(--ink)}
.portal-lnk:hover{border-color:var(--acc);color:var(--acc)}
#sel{max-width:min(380px,66vw)}
select,.bs{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
nav{max-width:900px;margin:0 auto;padding:4px 16px 8px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:6px 13px;border-radius:999px;color:var(--mut);white-space:nowrap;font-size:15px}
nav button.on{background:var(--accs);color:var(--acc);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:23px;margin:4px 0 6px;line-height:1.25}h2{font-size:18px;margin:22px 0 10px}h3{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.topic-row{padding:12px 0;border-top:1px solid var(--line)}.topic-name{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px}.btn.bad{border-color:var(--bad);color:var(--bad)}.btn[disabled]{opacity:.45;cursor:default}
.lnk{border:0;background:none;color:var(--acc);padding:0;font-weight:600;font-size:14px}
a{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--accs);border-color:var(--acc);color:var(--acc);font-weight:600}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:22px;line-height:1.2}.tile.red b{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;min-width:60px}.bar i{display:block;height:100%}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--accs);color:var(--acc);font-weight:600;margin-right:4px;white-space:nowrap}
.tag.g{background:var(--oks);color:var(--ok)}.tag.r{background:var(--bads);color:var(--bad)}.tag.y{background:var(--warns);color:var(--warn)}.tag.n{background:var(--line);color:var(--mut)}
.stage{font-size:13px;color:var(--mut);margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q{font-size:17px;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.opt:hover:not([disabled]){border-color:var(--acc)}.opt .nm{min-width:22px;font-weight:700;color:var(--mut)}
.opt.on{border-color:var(--acc);background:var(--accs)}.opt.ok{border-color:var(--ok);background:var(--oks)}.opt.bad{border-color:var(--bad);background:var(--bads)}
.opt[disabled]{cursor:default}
.digits{font-family:ui-monospace,Consolas,monospace;font-size:18px;letter-spacing:3px;border:1px dashed var(--line);border-radius:8px;padding:4px 10px;min-width:90px;display:inline-block}
.answer-entry{width:180px;max-width:100%;background:var(--bg);color:var(--ink)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%;max-width:520px}
textarea.inp{min-height:110px;max-width:none}
.eqline{font-size:18px;line-height:2.3}
.conf{margin-top:14px;padding:12px;border-radius:12px;background:var(--accs)}
.conf .row button{flex:1;min-width:110px}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.fb.ok{background:var(--oks);border-color:var(--ok)}.fb.bad{background:var(--bads);border-color:var(--bad)}.fb.part{background:var(--warns);border-color:var(--warn)}
.fb .hd{font-weight:700;margin-bottom:4px}
.why{margin-top:8px}.wn{margin-top:6px;padding-left:10px;border-left:3px solid var(--bad)}
.kon{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14.5px}
.kon .t{font-weight:700;margin-bottom:4px}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}@media(max-width:560px){.cases{grid-template-columns:1fr}}
.case{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}.case b{display:block;margin-bottom:4px}
.steps{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.step{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);text-align:left;width:100%}
button.step:hover:not([disabled]){border-color:var(--acc)}.step.on{border-color:var(--acc);background:var(--accs)}.step.ok{border-color:var(--ok);background:var(--oks)}.step.bad{border-color:var(--bad);background:var(--bads)}
.bl{display:inline-block;border-bottom:2px solid var(--acc);padding:0 3px;font-weight:600;color:var(--acc)}
.bl.ok{border-color:var(--ok);color:var(--ok)}.bl.bad{border-color:var(--bad);color:var(--bad)}
.step select,.step input{border:1px solid var(--acc);background:var(--card);border-radius:7px;padding:2px 6px;font-size:15px}
.step input{width:9em}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.mt{grid-template-columns:1fr}}
.mrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:4px 0}.mrow .lt{font-weight:700;min-width:22px}
.nb{width:32px;height:32px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-weight:600}
.nb.on{background:var(--acc);border-color:var(--acc);color:#fff}.nb.ok{background:var(--ok);border-color:var(--ok);color:#fff}.nb.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.kb{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.kb button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:3px 9px;font-size:16px;min-width:36px;min-height:34px}.kb .tgl.on{background:var(--acc);border-color:var(--acc);color:#fff}
.prin{border-left:4px solid var(--acc);padding:2px 0 2px 12px;margin:12px 0}.prin .n{font-weight:700}
.figw{position:relative;width:fit-content;max-width:100%;margin:0 auto 10px}.figw img{display:block;max-width:100%;max-height:420px;border-radius:10px;background:#fff}
.hdm{position:absolute;background:#fff;border-radius:3px;pointer-events:none}.mk{position:absolute;transform:translate(-50%,-50%);min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:#d4332a;color:#fff;font:700 13px/24px system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px #fff;pointer-events:none}
.pts label{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.prog{height:4px;background:var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
details summary{cursor:pointer;font-weight:600}
.empty{text-align:center;padding:40px 18px}
sub,sup{font-size:.72em;line-height:0}
.hide{display:none!important}
/* Русский язык: ударение кликом, орфография и пунктуация кликом */
.stress-word{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:24px;font-weight:600;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.vbtn{border:1px solid var(--acc);background:var(--accs);color:var(--acc);border-radius:8px;padding:2px 8px;font-weight:700;font-size:22px;line-height:1.2;margin:0 1px}
.vbtn.on{background:var(--acc);color:#fff}.vbtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.vbtn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.ru-stress{color:var(--bad);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.ru-ortho{background:var(--warns);border:1px solid var(--warn);border-radius:5px;padding:0 3px;font-weight:700}
.ru-pos{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--accs);border:1px solid var(--acc);color:var(--acc);font-size:13px;font-weight:700;margin:0 2px}
.punct-sent{font-size:18px;line-height:2;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.pbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 9px;font-size:14px;font-weight:700;margin:0 3px;vertical-align:middle}
.pbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pbtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.pbtn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.ortho-word{font-size:22px;font-weight:700;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;display:inline-block;margin-bottom:10px}
.ortho-word .gap{color:var(--acc);border-bottom:2px solid var(--acc);padding:0 4px}
</style>
</head>
<body>
<header>
  <div class="hw">
    <div class="brand"><a href="index.html" class="portal-lnk">← Портал</a><div>Тренажёр <span>ЕГЭ-100</span></div></div>
    <select id="sel" aria-label="Учебная тема"></select>
    <button id="sync" class="bs" type="button" title="Синхронизировать прогресс и тренажёры с ПК">🔄</button>
    <button id="theme" class="bs" type="button" title="Тема оформления">◐</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="app"></main>
<script src="sync-client.js"></script>
<script>
(function(){
"use strict";
const TOPICS_DIR='topics/';
const THEME_KEY='ege100-theme';
const $=(s,r=document)=>r.querySelector(s);
function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CHEM=false, RUS=false;
function fmt(s){
  s=esc(s==null?'':s);
  s=s.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1');
  if(CHEM)s=s.replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>');
  s=s.replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>');
  s=s.replace(/\{~([^}]+)\}/g,'<span class="ru-stress">$1\u0301</span>');
  s=s.replace(/\{!:([^}]*)\}/g,'<span class="ru-ortho">$1</span>');
  s=s.replace(/\{\((\d+)\)\}/g,'<span class="ru-pos">$1</span>');
  s=s.replace(/\{(?:п|к|с|о|подл|сказ|опр|обст|ввод):([^}]+)\}/g,'$1');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(«])\*(\S[^*\n]*?)\*/g,'$1<i>$2</i>');
  return s.replace(/\n/g,'<br>');
}
const F=(s,tag='span',cls)=>h(tag,{class:cls,html:fmt(s)});
const SUPC={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻'};
function uni(s){
  s=String(s==null?'':s).replace(/\*\*/g,'').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1');
  s=s.replace(/\{~([^}]+)\}/g,'$1').replace(/\{!:([^}]*)\}/g,'$1').replace(/\{\((\d+)\)\}/g,'($1)').replace(/\{(?:п|к|с|о|подл|сказ|опр|обст|ввод):([^}]+)\}/g,'$1');
  if(CHEM)s=s.replace(/([A-Za-z\)\]])(\d+)/g,(m,a,d)=>a+[...d].map(c=>'₀₁₂₃₄₅₆₇₈₉'[c]).join(''));
  return s.replace(/\^\{([^}]*)\}/g,(m,x)=>[...x].map(c=>SUPC[c]||c).join('')).replace(/_\{([^}]*)\}/g,'$1');
}
const plain=s=>uni(s).replace(/<[^>]+>/g,'');
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const uniq=a=>[...new Set(a)];
const DAY=864e5, now=()=>Date.now();
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},del(k){try{localStorage.removeItem(k);}catch(e){}},keys(){try{return Object.keys(localStorage);}catch(e){return [];}}};
function plur(n,a,b,c){n=Math.abs(Math.round(n));const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c);}
const pct=x=>Math.round(x*100)+'%';
const LET='АБВГДЕЖЗ';
function num(x,dp){if(typeof x!=='number')return String(x);const d=dp==null?(Number.isInteger(x)?0:2):dp;return String(Number(x.toFixed(d))).replace('.',',');}
const inDays=ms=>{const d=Math.round(ms/DAY);return d<=0?'сегодня':d===1?'завтра':'через '+d+' '+plur(d,'день','дня','дней');};

/* ===================== химия ===================== */
const SUBN={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
const SUPM={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','⁹':'⁹','+':'⁺','-':'⁻','−':'⁻',
  A:'ᴬ',B:'ᴮ',D:'ᴰ',E:'ᴱ',G:'ᴳ',H:'ᴴ',I:'ᴵ',J:'ᴶ',K:'ᴷ',L:'ᴸ',M:'ᴹ',N:'ᴺ',O:'ᴼ',P:'ᴾ',R:'ᴿ',T:'ᵀ',U:'ᵁ',W:'ᵂ',
  a:'ᵃ',b:'ᵇ',c:'ᶜ',d:'ᵈ',e:'ᵉ',f:'ᶠ',g:'ᵍ',h:'ʰ',i:'ⁱ',j:'ʲ',k:'ᵏ',l:'ˡ',m:'ᵐ',n:'ⁿ',o:'ᵒ',p:'ᵖ',r:'ʳ',s:'ˢ',t:'ᵗ',u:'ᵘ',v:'ᵛ',w:'ʷ',x:'ˣ',y:'ʸ',z:'ᶻ'};
const SUPN={};for(const k in SUPM)if(k!=='−')SUPN[SUPM[k]]=k;
const SUPRE=new RegExp('['+Object.keys(SUPN).join('')+']+','g');
const toMk=s=>String(s==null?'':s).replace(SUPRE,m=>'^{'+[...m].map(c=>SUPN[c]).join('')+'}').replace(/[₀-₉]/g,c=>SUBN[c]).replace(/->/g,'→').replace(/⟶/g,'→');
function normF(s){s=String(s==null?'':s).replace(/\*\*/g,'');s=toMk(s);s=s.replace(/[−–—]/g,'-').replace(/<sub>(.*?)<\/sub>/g,'$1').replace(/<sup>(.*?)<\/sup>/g,'^{$1}');s=s.replace(/->|⟶|=|⇄|⇌/g,'→').replace(/[↑↓\s]/g,'').replace(/ē/g,'e^{-}').replace(/\^\{1([+-])\}/g,'^{$1}');return s;}
function atoms(f){const st=[{}];let i=0;f=String(f).replace(/\^\{[^}]*\}/g,'');
  while(i<f.length){const c=f[i];if(c==='('||c==='['){st.push({});i++;continue;}
    if(c===')'||c===']'){i++;const m=f.slice(i).match(/^\d+/);const k=m?+m[0]:1;if(m)i+=m[0].length;const g=st.pop();if(!st.length)return null;for(const e in g)st[st.length-1][e]=(st[st.length-1][e]||0)+g[e]*k;continue;}
    if(c==='·'||c==='*'){const m=f.slice(i+1).match(/^\d+/);const k=m?+m[0]:1;i+=1+(m?m[0].length:0);const rest=atoms(f.slice(i));if(!rest)return null;for(const e in rest)st[0][e]=(st[0][e]||0)+rest[e]*k;i=f.length;continue;}
    const m=f.slice(i).match(/^([A-Z][a-z]?)(\d*)/);if(!m)return null;st[st.length-1][m[1]]=(st[st.length-1][m[1]]||0)+(m[2]?+m[2]:1);i+=m[0].length;}
  return st.length===1?st[0]:null;}
function charge(f){const m=String(f).match(/\^\{(\d*)([+\-−])\}$/);if(!m)return 0;return (m[1]?+m[1]:1)*(m[2]==='+'?1:-1);}
const isE=f=>/^(e|ē)(\^\{[−-]\})?$/.test(f);
function sideCount(fs,cs){const A={};let q=0;for(let i=0;i<fs.length;i++){const k=cs[i];if(isE(fs[i])){q-=k;continue;}const a=atoms(fs[i]);if(!a)return null;for(const e in a)A[e]=(A[e]||0)+a[e]*k;q+=charge(fs[i])*k;}return {A,q};}
function balanceDiff(L,Rr,c){const a=sideCount(L,c.slice(0,L.length)),b=sideCount(Rr,c.slice(L.length));if(!a||!b)return null;
  const out=[];uniq(Object.keys(a.A).concat(Object.keys(b.A))).sort().forEach(e=>{if((a.A[e]||0)!==(b.A[e]||0))out.push(e+': слева '+(a.A[e]||0)+', справа '+(b.A[e]||0));});
  if(a.q!==b.q)out.push('заряд: слева '+a.q+', справа '+b.q);return out;}
const gcd=(a,b)=>b?gcd(b,a%b):a;

function fadeParse(it){if(it._bl)return;const bl=[];it._steps=it.steps.map(st=>splitBlanks(st).map(x=>{if(typeof x==='string')return x;const p=x.raw.split('|').map(y=>y.trim());const b={a:p[0],opts:p.length>1?p:null,i:bl.length};bl.push(b);return b;}));
  it._bl=bl;const hideFrom=bl.length-it.hide;bl.forEach((b,i)=>b.hidden=i>=hideFrom);it._hidden=bl.filter(b=>b.hidden);}
function grade(it,ans){const R={ok:false,part:0,fr:[],fw:[],msg:[],right:'',err:0},all=it.facts||[];const add=ok=>(ok?R.fr:R.fw).push(...all);
  const syo=!!(RUS||it.strictYo);
  switch(it.kind){
  case 'one':R.ok=ans===it.a;R.right=it.o[it.a];if(!R.ok)R.msg.push(['Ты выбрал «'+it.o[ans]+'».',(it.d||{})[ans]||'']);add(R.ok);break;
  case 'multi':case 'err':{const A=new Set(it.a),S=new Set(ans),n=it.kind==='err'?it.sent.length:it.o.length;
    for(let i=0;i<n;i++){const good=A.has(i)===S.has(i);const f=it.of&&it.of[i];if(f)(good?R.fr:R.fw).push(f);if(good)continue;R.err++;
      if(it.kind==='multi'){if(S.has(i))R.msg.push(['Лишнее: '+(i+1)+') «'+it.o[i]+'».',(it.d||{})[i]||'']);else R.msg.push(['Пропущено: '+(i+1)+') «'+it.o[i]+'».',(it.dd||{})[i]||'Это верно.']);}
      else{if(S.has(i))R.msg.push(['Предложение '+(i+1)+' верное.','']);else R.msg.push(['Не найдена ошибка в предложении '+(i+1)+'.','Верно: '+it.fix[i]]);}}
    R.ok=!R.err;R.part=Math.max(0,1-R.err/Math.max(2,A.size));R.right=[...A].sort((a,b)=>a-b).map(i=>i+1).join('');
    if(it.kind==='err')R.fixes=[...A].sort((a,b)=>a-b).map(i=>'('+(i+1)+') '+it.fix[i]);break;}
  case 'match':ans.forEach((x,i)=>{const good=x===it.a[i];const f=it.of&&it.of[i];if(f)(good?R.fr:R.fw).push(f);
      if(!good){R.err++;R.msg.push([LET[i]+') '+it.left[i]+': верно '+(it.a[i]+1)+' — «'+it.right[it.a[i]]+'», у тебя '+(x+1)+'.',(it.dl||[])[i]||((it.d||{})[i])||'']);}});
    if(!it.of)add(!R.err);R.ok=!R.err;R.part=1-R.err/it.left.length;R.right=it.a.map(x=>x+1).join('');break;
  case 'seq':{const right=it.items.map((x,j)=>it.perm.indexOf(j));ans.forEach((x,i)=>{if(x!==right[i])R.err++;});R.ok=!R.err;R.part=Math.max(0,1-R.err/right.length);
    R.right=right.map(x=>x+1).join('');add(R.ok);if(!R.ok)R.msg.push(['Верный порядок:',it.items.map((x,i)=>(i+1)+'. '+x).join('\n')]);break;}
  case 'short':R.ok=it.alts.some(a=>sameAns(ans,a,syo));R.right=it.alts[0];add(R.ok);break;
  case 'stress':R.ok=ans===it.a;R.right=it.marked;if(!R.ok)R.msg.push(['Ударная гласная в этом слове другая.',it.why||'Правильно: '+it.marked]);add(R.ok);break;
  case 'ortho':R.ok=sameAns(ans,it.a,true);R.right=it.tpl.replace('_',it.a);if(!R.ok)R.msg.push(['Написано «'+it.tpl.replace('_',ans)+'».',it.why||'Пишется «'+it.a+'».']);add(R.ok);break;
  case 'punct':{const A=new Set(it.a),S=new Set(ans);it.nums.forEach(num=>{const good=A.has(num)===S.has(num);if(!good)R.err++;
      const w=(it.pwhy||{})[String(num)];if(!good)R.msg.push(['Позиция ('+num+'): '+(A.has(num)?'запятая нужна':'запятая НЕ нужна')+'.',w||'']);});
    R.ok=!R.err;R.part=Math.max(0,1-R.err/Math.max(2,it.nums.length));R.right=it.a.join('')||'нет';add(R.ok);break;}
  case 'num':{const x=parseFloat(String(ans).replace(',','.').replace(/\s/g,''));const dp=it.dp!=null?it.dp:2;
    const tol=Math.max(Math.abs(it.a)*(it.tol!=null?it.tol:0.01),0.5*Math.pow(10,-dp));R.ok=isFinite(x)&&Math.abs(x-it.a)<=tol+1e-9;
    R.right=num(it.a,dp)+(it.unit?' '+it.unit:'');add(R.ok);break;}
  case 'eqn':gradeEq(R,ans,it.alts.map(eqParse).filter(Boolean),it.bad);R.right=it.alts[0];add(R.ok);break;
  case 'write':gradeEq(R,ans,[rxMap(it.rx)].concat((it.rx.alt||[]).map(eqParse).filter(Boolean)),it.rx.bad);R.right=eqStr(it.rx.l,it.rx.r,it.rx.c);add(R.ok);break;
  case 'fade':{fadeParse(it);let okc=0;it._hidden.forEach((b,i)=>{if(sameAns(ans[i],b.a,syo))okc++;else R.msg.push(['Пропуск '+(i+1)+': верно «'+uni(b.a)+'», у тебя «'+(uni(ans[i])||'—')+'».','']);});
    R.part=it._hidden.length?okc/it._hidden.length:1;R.ok=okc===it._hidden.length;break;}

  if(R.ok)R.part=1;return R;}
function rightAns(it){switch(it.kind){case 'seq':return it.items.map((x,j)=>it.perm.indexOf(j));case 'short':case 'eqn':return it.alts[0];
  case 'write':return eqStr(it.rx.l,it.rx.r,it.rx.c);case 'fade':fadeParse(it);return it._hidden.map(b=>b.a);case 'bug':return it.bad;default:return it.a;}}

function rec(it,R,conf){const t=now(),d=dkey(t);
  if(conf&&ST.cal[conf]){ST.cal[conf][1]++;if(R.ok)ST.cal[conf][0]++;}
  ST.log.push({t,k:it.key,s:it.sk||'',n:it.n||0,ok:R.ok?1:0,p:Math.round((R.part||0)*100)/100,c:conf||'',f:it.fmt||it.kind,pre:it.pre?1:0});
  if(ST.log.length>3000)ST.log.splice(0,ST.log.length-3000);ST.days[d]=(ST.days[d]||0)+1;
  RUN.n++;if(R.ok)RUN.ok++;
  if(RUN.exam&&it.n&&P._kim[it.n]){const b=P._kim[it.n].b;RUN.max+=b;RUN.pts+=it.kind==='part2'?R.pts:R.ok?b:(b===2&&R.err===1?1:0);}

    R.fr.forEach(f=>factRec(f,true));R.fw.forEach(f=>factRec(f,false));

    else if(!R.ok&&(conf==='sure'||conf==='maybe')&&!['info','recall','part2'].includes(it.kind)){ST.red.push({key:it.key,it:strip(it),c:conf,t,s:0,sk:it.sk});RUN.redIn++;R.redIn=true;}}

  const fs=uniq(P.G.map(g=>g.fmt)).filter(Boolean);c.append(h('h3',{style:'margin-top:14px'},'Формат'),chips(GS.f,fs.map(f=>[f,FMTN[f]||f])));
  c.append(h('h3',{style:'margin-top:14px'},'Сложность'),chips(GS.l,[[1,'База'],[2,'Уровень ЕГЭ'],[3,'Максимум']]));
  c.append(h('div',{class:'row',style:'margin-top:16px'},btnPri('Старт',()=>{const g=sel();if(!g.length)return;startRun('Генератор',[],{gen:()=>fromGens(g,{only:GS.l}),limit:GS.cnt});})),info);upd();
  const kim=Object.keys(P._kim||{}).sort((a,b)=>a-b);
  const variant=max=>{const L=[];kim.forEach(n=>{const g=P.G.filter(x=>String(x.n)===n);if(!g.length)return;const t=g.filter(x=>x.task);
    const it=(max&&fromGens(g,{only:new Set([3])}))||fromGens(t.length&&Math.random()<.6?t:g,{tl:max?3:2});if(it)L.push(it);});
    startRun(max?'Вариант максимальной сложности':'Вариант по теме',L,{exam:true});};
  if(kim.length)w.append(h('div',{class:'card'},h('h3',{},'Вариант по теме'),h('div',{class:'row'},btnPri('Собрать вариант',()=>variant(false)),h('button',{class:'btn',onclick:()=>variant(true)},'Вариант максимальной сложности'))));
  return w;}

let TR_CLI_CMD='';
async function copyText(txt){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);return true;}}catch(e){}
  try{const ta=h('textarea',{style:'position:fixed;opacity:0'});ta.value=txt;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}
}
function resetPackProgress(m){
  if(!confirm('Сбросить весь прогресс тренажёра «'+m.title+'» в этом браузере?'))return;
  LS.del('tr-state-'+m.id);
  if(P&&P.id===m.id)ST=freshState();
  render();
}
function viewTopics(){const w=h('div',{},h('h1',{},'Темы тренажёра'));
  if(TR_CLI_CMD){
    const inp=h('input',{type:'text',readonly:true,class:'inp',style:'max-width:none;font-family:ui-monospace,Consolas,monospace;font-size:13px',value:TR_CLI_CMD,onclick:e=>e.target.select()});
    w.append(h('div',{class:'card'},h('div',{class:'xs mut',style:'margin-bottom:6px'},'Команда для удаления пакета с диска (выполните в корне проекта):'),inp));
  }
  const row=(m,removed)=>h('div',{class:'row topic-row'},h('div',{class:'topic-name'},h('h3',{},m.title),h('div',{class:'xs mut'},[m.subject,m.version].filter(Boolean).join(' · '))),
    h('div',{class:'row'},
      h('button',{class:'btn sm',onclick:()=>removed?restorePack(m.id):removePack(m.id)},removed?'Вернуть':'Скрыть'),
      h('button',{class:'btn sm',onclick:()=>resetPackProgress(m)},'Сбросить прогресс'),
      h('button',{class:'btn sm bad',onclick:async()=>{const slug=m.subjectSlug||(/хим/i.test(m.subject)?'chemistry':/био/i.test(m.subject)?'biology':'russian');TR_CLI_CMD='python core/cli.py remove '+slug+' '+m.id+' --what trainer';await copyText(TR_CLI_CMD);render();}},'Удалить с диска')));
  w.append(h('div',{class:'card'},h('h2',{style:'margin-top:0'},'Доступные · '+LIST.length),LIST.length?LIST.map(m=>row(m,false)):h('p',{class:'sm mut'},'Тем пока нет.')));
  const removed=CATALOG.filter(m=>REMOVED.has(m.id));
  if(removed.length)w.append(h('div',{class:'card'},h('h2',{style:'margin-top:0'},'Скрытые · '+removed.length),removed.map(m=>row(m,true))));
  return w;}
function viewHow(){const w=h('div');w.append(h('h1',{},'Как это работает'));
  const file=h('input',{type:'file',accept:'.json',class:'hide',onchange:e=>importBackup(e.target.files[0])});
  w.append(h('div',{class:'card'},h('h3',{},'Прогресс и резервная копия'),h('div',{class:'row'},
    h('button',{class:'btn sm',onclick:exportBackup},'Сохранить копию прогресса'),
    h('button',{class:'btn sm',onclick:()=>file.click()},'Загрузить копию'),file)));
  return w;}
function exportBackup(){const data={};LS.keys().filter(k=>k.startsWith('tr-state-')).forEach(k=>data[k]=LS.get(k,null));
  const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify({app:'trener-ege100',v:1,date:new Date().toISOString(),data})],{type:'application/json'})),download:'ege100-trener-backup.json'});document.body.append(a);a.click();a.remove();}
function importBackup(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);if(!b.data)throw 0;
  for(const k in b.data)LS.set(k,b.data[k]);if(P)ST=Object.assign(freshState(),LS.get('tr-state-'+P.id,{}));render();}catch(e){alert('Неверный файл.');}};r.readAsText(f);}

const TABS=[['today','Сегодня'],['kod','Код темы'],['gen','Генератор'],['topics','Темы'],['how','Прогресс']];
function tabs(){const n=$('#tabs');n.innerHTML='';TABS.forEach(([v,t])=>n.append(h('button',{class:VIEW===v?'on':'',onclick:()=>{if(VIEW==='run')leaveRun();VIEW=v;render();window.scrollTo(0,0);}},t)));}
function viewEmpty(){
  if(CATALOG.length>0&&REMOVED.size>0){
    return h('div',{class:'card empty'},h('h1',{},'Все пакеты тренажёра скрыты'),h('p',{class:'mut'},'В этом браузере скрыто пакетов: '+REMOVED.size+'. Вы можете вернуть их во вкладке «Темы».'),
      h('button',{class:'btn pri',onclick:()=>{VIEW='topics';render();}},'Открыть скрытые темы'));
  }
  return h('div',{class:'card empty'},h('h1',{},'Тренировочных пакетов пока нет'),h('p',{class:'mut'},'Собери пакет тренажёра командой python core/cli.py trener-build <subject> <id>.'));
}
function viewResult(){const w=h('div'),c=h('div',{class:'card'});w.append(c);c.append(h('h1',{},RUN.title+' — готово'));
  c.append(h('div',{class:'stat'},h('div',{class:'tile'},h('b',{},RUN.ok+' / '+RUN.n),'верных ответов'),RUN.exam&&RUN.max?h('div',{class:'tile'},h('b',{},RUN.pts+' / '+RUN.max),'первичных баллов'):null,
    h('div',{class:'tile red'},h('b',{},'+'+RUN.redIn),'в Красную папку'),h('div',{class:'tile'},h('b',{},String(RUN.redOut)),'ушло из Красной папки')));
  c.append(h('div',{class:'row',style:'margin-top:14px'},btnPri('К плану на сегодня',()=>{RUN=null;VIEW='today';render();}),h('button',{class:'btn',onclick:()=>{RUN=null;VIEW='gen';render();}},'В генератор')));return w;}
function render(){tabs();const a=$('#app');a.innerHTML='';
  if(VIEW==='topics'){a.append(viewTopics());return;}
  if(!P&&VIEW==='how'){a.append(viewHow());return;}
  if(!P){a.append(viewEmpty());return;}
  CHEM=/хим/i.test(P.subject);RUS=/рус/i.test(P.subject);
  try{a.append(VIEW==='run'&&RUN?viewRun():VIEW==='result'&&RUN?viewResult():VIEW==='kod'?viewKod():VIEW==='gen'?viewGen():VIEW==='how'?viewHow():viewToday());}
  catch(e){console.error(e);a.append(h('div',{class:'card'},h('h3',{},'Ошибка отображения'),h('pre',{class:'xs'},String(e.stack||e))));}}
const THEMES=['auto','light','paper','dark'];
const THEME_ICONS={auto:'◐',light:'☀',paper:'▤',dark:'☾'};
const THEME_NAMES={auto:'Авто',light:'Светлая',paper:'Бумага',dark:'Тёмная'};
function applyTheme(){const raw=LS.get(THEME_KEY,'auto');const t=THEMES.includes(raw)?raw:'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);const b=$('#theme');b.textContent=THEME_ICONS[t];b.title='Тема: '+THEME_NAMES[t]+' (Авто → Светлая → Бумага → Тёмная)';const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.setAttribute('content',t==='paper'?'#f6efe1':t==='dark'?'#0f1621':'#0f766e');}
$('#theme').onclick=()=>{const raw=LS.get(THEME_KEY,'auto');const i=THEMES.indexOf(raw);LS.set(THEME_KEY,THEMES[(i+1)%THEMES.length]);applyTheme();};
$('#sync').onclick=()=>syncWithCloud({reload:true,silent:false});
$('#sel').onchange=e=>{leaveRun();openPack(e.target.value);};

async function selfTest(){const out=[];let bad=0,total=0;
  for(const m of LIST){let p;try{p=await loadPack(m.id);}catch(e){out.push('✗ '+m.id+': '+e.message);bad++;continue;}
    const keepP=P,keepS=ST;P=p;ST=freshState();CHEM=/хим/i.test(p.subject);RUS=/рус/i.test(p.subject);RUN={res:{},n:0,ok:0};
    for(const g of p.G){let made=0;for(let k=0;k<25;k++){const it=mk(g);if(!it)continue;made++;if(['part2','recall'].includes(it.kind))break;total++;const R=grade(it,rightAns(it));if(!R.ok){bad++;out.push('✗ '+m.id+' '+g.id+': эталонный ответ не засчитан');break;}
        if(it.kind==='ortho'&&/е/.test(it.a)){if(grade(it,it.a.replace(/е/g,'ё')).ok){bad++;out.push('✗ '+m.id+' '+g.id+': ё не отделена от е');break;}}
        if(it.kind==='write'||it.kind==='eqn'){const typed=uni(rightAns(it)).replace(/ → /,' -> ');if(!grade(it,typed).ok){bad++;out.push('✗ '+m.id+' '+g.id+': запись не прочитана');break;}}}
      if(!made){out.push('• '+m.id+' '+g.id+': пустой генератор');}}
    p.skills.forEach(s=>{const L=learnItems(s.id);L.forEach(it=>{if(['info','recall','part2'].includes(it.kind)||(it.kind==='fade'&&it.hide===0))return;total++;const R=grade(it,rightAns(it));if(!R.ok){bad++;out.push('✗ '+m.id+' цикл '+s.id+' '+it.kind);}});});
    P=keepP;ST=keepS;}
  RUN=null;window.SELFTEST={bad,total,out};console.log('SELFTEST',bad,total,out.join('\n'));
  $('#app').prepend(h('div',{class:'card'},h('h3',{},'Самопроверка движка: '+(bad?'ошибок '+bad:'ошибок нет')+' · проверено заданий '+total),h('pre',{class:'xs',style:'white-space:pre-wrap'},out.join('\n')||'—')));}

(async()=>{applyTheme();tabs();if(GH){GH.registerSW('./sw.js');if(GH.isConfigured())await syncWithCloud({reload:false,silent:true});}await loadList();fillSel();
  const qp=new URLSearchParams(location.search).get('topic');
  if(LIST.length)await openPack(qp||LS.get('tr-pack',null));else render();
  if(/selftest/.test(location.search))selfTest();})();
})();
